l_english:
 GRAND_DOCTRINE_INDUSTRIAL_WARFARE:0 "Industrial Warfare"
 GRAND_DOCTRINE_INDUSTRIAL_WARFARE_DESC:0 "The Franco-Prussian War defined total war and the Russo-Japanese War proved the value of fortification. A great war will put every tactic to the test."
 SUBDOCTRINE_CHEMICAL_WARFARE:0 "Chemical Warfare"
 SUBDOCTRINE_CHEMICAL_WARFARE_DESC:0 "Gas shells, smoke candles and gas masks. Chemical weapons can silence enemy strongpoints, at a price in discipline and protection."
 SUBDOCTRINE_ARMORED_SUPPORT:0 "Armored Support"
 SUBDOCTRINE_ARMORED_SUPPORT_DESC:0 "Armored cars and early tanks accompany the infantry, shielding flesh with steel."
 SUBDOCTRINE_LOGISTICS_SUPPORT:0 "Logistical Support"
 SUBDOCTRINE_LOGISTICS_SUPPORT_DESC:0 "Field hospitals, engineer detachments and supply columns - modern war is won in the rear."
 SUBDOCTRINE_BITE_AND_HOLD:0 "Bite and Hold"
 SUBDOCTRINE_BITE_AND_HOLD_DESC:0 "Rather than grand breakthroughs, take a limited objective and turn it into the next trench line."
 SUBDOCTRINE_DEFENSE_IN_DEPTH:0 "Defense in Depth"
 SUBDOCTRINE_DEFENSE_IN_DEPTH_DESC:0 "Layered trenches, machine-gun nests and elastic defense: let the enemy in, then throw him back with a counter-attack."
 SUBDOCTRINE_METHODICAL_FIRE:0 "Methodical Fire"
 SUBDOCTRINE_METHODICAL_FIRE_DESC:0 "Centralized artillery command, preparatory bombardment and standing barrages make the guns masters of the battlefield."
 SUBDOCTRINE_INTEGRATED_FIREPOWER:0 "Integrated Firepower"
 SUBDOCTRINE_INTEGRATED_FIREPOWER_DESC:0 "Infantry and artillery advance together behind a creeping barrage."
 SUBDOCTRINE_HURRICANE_BOMBARDMENT:0 "Hurricane Bombardment"
 SUBDOCTRINE_HURRICANE_BOMBARDMENT_DESC:0 "Short, violent concentrations of fire destroy the enemy front before he can react."
 SUBDOCTRINE_METHODICAL_BATTLE:0 "Methodical Battle"
 SUBDOCTRINE_METHODICAL_BATTLE_DESC:0 "Command by directive and a scientific conduct of battle turn every attack into a calculation."
 SUBDOCTRINE_ATTACK_IN_POSITION_WARFARE:0 "Attack in Position Warfare"
 SUBDOCTRINE_ATTACK_IN_POSITION_WARFARE_DESC:0 "Mission-type tactics, weak-point analysis and stormtroopers break the trench deadlock."
