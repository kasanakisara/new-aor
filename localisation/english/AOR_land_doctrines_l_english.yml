l_english:
 GRAND_DOCTRINE_INDUSTRIAL_WARFARE: "Industrial Warfare"
 GRAND_DOCTRINE_INDUSTRIAL_WARFARE_DESC: "The Franco-Prussian War defined total war and the Russo-Japanese War proved the value of fortification. A great war will put every tactic to the test."
 SUBDOCTRINE_CHEMICAL_WARFARE: "Chemical Warfare"
 SUBDOCTRINE_CHEMICAL_WARFARE_DESC: "Gas shells, smoke candles and gas masks. Chemical weapons can silence enemy strongpoints, at a price in discipline and protection."
 SUBDOCTRINE_ARMORED_SUPPORT: "Armored Support"
 SUBDOCTRINE_ARMORED_SUPPORT_DESC: "Armored cars and early tanks accompany the infantry, shielding flesh with steel."
 SUBDOCTRINE_LOGISTICS_SUPPORT: "Logistical Support"
 SUBDOCTRINE_LOGISTICS_SUPPORT_DESC: "Field hospitals, engineer detachments and supply columns - modern war is won in the rear."
 SUBDOCTRINE_BITE_AND_HOLD: "Bite and Hold"
 SUBDOCTRINE_BITE_AND_HOLD_DESC: "Rather than grand breakthroughs, take a limited objective and turn it into the next trench line."
 SUBDOCTRINE_DEFENSE_IN_DEPTH: "Defense in Depth"
 SUBDOCTRINE_DEFENSE_IN_DEPTH_DESC: "Layered trenches, machine-gun nests and elastic defense: let the enemy in, then throw him back with a counter-attack."
 SUBDOCTRINE_METHODICAL_FIRE: "Methodical Fire"
 SUBDOCTRINE_METHODICAL_FIRE_DESC: "Centralized artillery command, preparatory bombardment and standing barrages make the guns masters of the battlefield."
 SUBDOCTRINE_INTEGRATED_FIREPOWER: "Integrated Firepower"
 SUBDOCTRINE_INTEGRATED_FIREPOWER_DESC: "Infantry and artillery advance together behind a creeping barrage."
 SUBDOCTRINE_HURRICANE_BOMBARDMENT: "Hurricane Bombardment"
 SUBDOCTRINE_HURRICANE_BOMBARDMENT_DESC: "Short, violent concentrations of fire destroy the enemy front before he can react."
 SUBDOCTRINE_METHODICAL_BATTLE: "Methodical Battle"
 SUBDOCTRINE_METHODICAL_BATTLE_DESC: "Command by directive and a scientific conduct of battle turn every attack into a calculation."
 SUBDOCTRINE_ATTACK_IN_POSITION_WARFARE: "Attack in Position Warfare"
 SUBDOCTRINE_ATTACK_IN_POSITION_WARFARE_DESC: "Mission-type tactics, weak-point analysis and stormtroopers break the trench deadlock."
