 AOR_news_global.5.t:0 "[Get_AOR_news_masthead]Chemical weapons used in [aor_gas_target.GetName]"
 AOR_news_global.5.desc:0 "[aor_gas_attacker.GetName] has carried out a large-scale chemical attack in [aor_gas_target.GetName]. Green gas covers the targeted province and troops have suffered heavy casualties. Contamination is expected to last four weeks. The attack has shaken both societies."
 AOR_news_global.5.a:0 "The world has crossed another line."
