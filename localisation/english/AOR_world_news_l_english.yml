l_english:
 # 【新闻作者与 AI 必读】所有新闻文本统一写在对应语言的 AOR_world_news 本地化文件中。
 # 标题必须保留开头的 [Get_AOR_news_masthead]，它负责显示报头并定位标题；遗漏会导致报头消失、标题移出可见区域。
 # 正确示例：AOR_news_global.6.t:0 "[Get_AOR_news_masthead]粒子加速器的建成"
 # 修改标题时只修改此前缀后面的文字，不要删除此前缀，也不要把它移到正文中。
 # 本地化键必须对应 events/AOR_world_news.txt 中的新闻编号；新增编号先查所用 namespace 的最大编号，再加 1，禁止重复。
 # 保存本文件时使用 UTF-8 BOM。



 AOR_news_global.5.t:0 "[Get_AOR_news_masthead]Chemical weapons used in [aor_gas_target.GetName]"
 AOR_news_global.5.desc:0 "[aor_gas_attacker.GetName] has carried out a large-scale chemical attack in [aor_gas_target.GetName]. Green gas covers the targeted province and troops have suffered heavy casualties. Contamination is expected to last four weeks. The attack has shaken both societies."
 AOR_news_global.5.a:0 "The world has crossed another line."

 AOR_news_europe.60.t:0 "[Get_AOR_news_masthead]Karl Legien Dies"
 AOR_news_europe.60.desc:0 "Karl Legien, former leader of the General Commission of German Trade Unions, has died. His death has brought the question of succession in the German labor movement to the fore.\n\nConservative members of the executive committee, including Theodor Leipart, sought to appoint his successor directly. At the insistence of Richard Müller and Robert Dittmann, however, the committee has agreed to convene a general union congress to elect new leaders and decide its future rules and strategy."
 AOR_news_europe.60.a:0 "The congress will decide what comes next."
