 JAP_carrier_1:0 "Early Converted Carrier Hull"
 JAP_carrier_1_desc:0 "Carrier operations are still experimental. Limited aircraft capacity and difficult deck handling restrict their battlefield value."
 JAP_carrier_2:0 "Early Purpose-Built Carrier Hull"
 JAP_carrier_2_desc:0 "Carrier operations are still experimental. Limited aircraft capacity and difficult deck handling restrict their battlefield value."
 JAP_carrier_3:0 "Carrier III"
 JAP_carrier_3_desc:0 "Improved construction methods and more specialized systems like deck edge elevators allow these carriers to transport more planes more efficiently."
 JAP_carrier_4:0 "Carrier IV"
 JAP_carrier_4_desc:0 "With many naval treaties now increasingly ignored, we can proceed to build carriers capable of transporting more planes than ever to secure air superiority cover."
