 AST_carrier_1:0 "Early Converted Carrier Hull"
 AST_carrier_1_desc:0 "Carrier operations are still experimental. Limited aircraft capacity and difficult deck handling restrict their battlefield value."
 AST_carrier_2:0 "Early Purpose-Built Carrier Hull"
 AST_carrier_2_desc:0 "Carrier operations are still experimental. Limited aircraft capacity and difficult deck handling restrict their battlefield value."
 AST_carrier_3:0 "Carrier III"
 AST_carrier_3_desc:0 "Improved construction methods and more specialized systems like deck edge elevators allow these carriers to transport more planes more efficiently."
 AST_carrier_4:0 "Carrier IV"
 AST_carrier_4_desc:0 "With many naval treaties now increasingly ignored, we can proceed to build carriers capable of transporting more planes than ever to secure air superiority cover."
 AST_destroyer_1:0 "Destroyer I"
 AST_destroyer_1_desc:0 "To ensure the safety of convoys, the destroyers of the Great War must be repurposed and developed. Arming vessels with more torpedoes will allow more opportunities to engage."
 AST_destroyer_2:0 "Destroyer II"
 AST_destroyer_2_desc:0 "Longer torpedo range and faster reload speeds, along with new types of armaments such as anti-air turrets, will allow our destroyers to remain efficient and versatile."
 AST_destroyer_3:0 "Destroyer III"
 AST_destroyer_3_desc:0 "To better face threats from above and below, new destroyers must be outfitted with radar and modern anti-air and anti-submarine weaponry."
 AST_destroyer_4:0 "Destroyer IV"
 AST_destroyer_4_desc:0 "The modern destroyer must be fitted with a variety of different detection technologies, new depth charge deployment systems and be built at a larger scale than their predecessors."
