 VIC_SH_battleship_1:0 "Super-Heavy Battleship I"
 VIC_SH_battleship_1_desc:0 "The current state of the world no longer has any room for abiding by naval treaties. Without these limitations, we can focus entirely on creating the heaviest, most well-armed battleships of all time, able to engage multiple lesser vessels."
 VIC_SH_battleship_2:0 "Super-Heavy Battleship II"
 VIC_SH_battleship_2_desc:0 "An improvement on our earlier super heavy design with stronger weapons and improved fire control systems."
 VIC_battle_cruiser_1:0 "Battlecruiser Hull"
 VIC_battle_cruiser_1_desc:0 "Battlecruisers combine heavy guns with speed. Every design must balance propulsion, armor, and the weight of its batteries."
 VIC_battle_cruiser_2:0 "Improved Battlecruiser Hull"
 VIC_battle_cruiser_2_desc:0 "Battlecruisers combine heavy guns with speed. Every design must balance propulsion, armor, and the weight of its batteries."
 VIC_battleship_1:0 "Early Dreadnought Hull"
 VIC_battleship_1_desc:0 "Battleships remain the center of the battle line. Hull strength, magazine protection, and space for heavy turrets govern their fighting power."
 VIC_battleship_2:0 "Super-Dreadnought Hull"
 VIC_battleship_2_desc:0 "Battleships remain the center of the battle line. Hull strength, magazine protection, and space for heavy turrets govern their fighting power."
 VIC_battleship_3:0 "Improved Battleship Hull"
 VIC_battleship_3_desc:0 "Battleships remain the center of the battle line. Hull strength, magazine protection, and space for heavy turrets govern their fighting power."
 VIC_battleship_4:0 "Ocean-Going Battleship Hull"
 VIC_battleship_4_desc:0 "Battleships remain the center of the battle line. Hull strength, magazine protection, and space for heavy turrets govern their fighting power."
 VIC_carrier_1:0 "Early Converted Carrier Hull"
 VIC_carrier_1_desc:0 "Carrier operations are still experimental. Limited aircraft capacity and difficult deck handling restrict their battlefield value."
 VIC_carrier_2:0 "Early Purpose-Built Carrier Hull"
 VIC_carrier_2_desc:0 "Carrier operations are still experimental. Limited aircraft capacity and difficult deck handling restrict their battlefield value."
 VIC_carrier_3:0 "Carrier III"
 VIC_carrier_3_desc:0 "Improved construction methods and more specialized systems like deck edge elevators allow these carriers to transport more planes more efficiently."
 VIC_carrier_4:0 "Carrier IV"
 VIC_carrier_4_desc:0 "With many naval treaties now increasingly ignored, we can proceed to build carriers capable of transporting more planes than ever to secure air superiority cover."
 VIC_destroyer_1:0 "Destroyer I"
 VIC_destroyer_1_desc:0 "To ensure the safety of convoys, the destroyers of the Great War must be repurposed and developed. Arming vessels with more torpedoes will allow more opportunities to engage."
 VIC_destroyer_2:0 "Destroyer II"
 VIC_destroyer_2_desc:0 "Longer torpedo range and faster reload speeds, along with new types of armaments such as anti-air turrets, will allow our destroyers to remain efficient and versatile."
 VIC_destroyer_3:0 "Destroyer III"
 VIC_destroyer_3_desc:0 "To better face threats from above and below, new destroyers must be outfitted with radar and modern anti-air and anti-submarine weaponry."
 VIC_destroyer_4:0 "Destroyer IV"
 VIC_destroyer_4_desc:0 "The modern destroyer must be fitted with a variety of different detection technologies, new depth charge deployment systems and be built at a larger scale than their predecessors."
