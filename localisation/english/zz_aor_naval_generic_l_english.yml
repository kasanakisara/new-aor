 JAP_SH_battleship_1:0 "Super-Heavy Battleship I"
 JAP_SH_battleship_1_desc:0 "The current state of the world no longer has any room for abiding by naval treaties. Without these limitations, we can focus entirely on creating the heaviest, most well-armed battleships of all time, able to engage multiple lesser vessels."
 JAP_SH_battleship_2:0 "Super-Heavy Battleship II"
 JAP_SH_battleship_2_desc:0 "An improvement on our earlier super heavy design with stronger weapons and improved fire control systems."
 JAP_battle_cruiser_1:0 "Battlecruiser Hull"
 JAP_battle_cruiser_1_desc:0 "Battlecruisers combine heavy guns with speed. Every design must balance propulsion, armor, and the weight of its batteries."
 JAP_battle_cruiser_2:0 "Improved Battlecruiser Hull"
 JAP_battle_cruiser_2_desc:0 "Battlecruisers combine heavy guns with speed. Every design must balance propulsion, armor, and the weight of its batteries."
 JAP_battleship_1:0 "Early Dreadnought Hull"
 JAP_battleship_1_desc:0 "Battleships remain the center of the battle line. Hull strength, magazine protection, and space for heavy turrets govern their fighting power."
 JAP_battleship_2:0 "Super-Dreadnought Hull"
 JAP_battleship_2_desc:0 "Battleships remain the center of the battle line. Hull strength, magazine protection, and space for heavy turrets govern their fighting power."
