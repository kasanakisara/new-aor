 AST_SH_battleship_1:0 "Super-Heavy Battleship I"
 AST_SH_battleship_1_desc:0 "The current state of the world no longer has any room for abiding by naval treaties. Without these limitations, we can focus entirely on creating the heaviest, most well-armed battleships of all time, able to engage multiple lesser vessels."
 AST_SH_battleship_2:0 "Super-Heavy Battleship II"
 AST_SH_battleship_2_desc:0 "An improvement on our earlier super heavy design with stronger weapons and improved fire control systems."
 AST_battle_cruiser_1:0 "Battlecruiser Hull"
 AST_battle_cruiser_1_desc:0 "Battlecruisers combine heavy guns with speed. Every design must balance propulsion, armor, and the weight of its batteries."
