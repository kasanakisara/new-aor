l_simp_chinese:
 AOR_tarot_flight_open_decision:0 "打开塔罗牌界面"
 AOR_tarot_flight_open_decision_desc:0 "四张塔罗牌按两行两列排列。点击「抽牌」，从22张塔罗牌中随机抽取四张不同的牌，在原位翻面。选择并确认后，右侧展示使用的塔罗牌。"
 AOR_tarot_flight_title:0 "§Y塔罗牌§!"
 AOR_tarot_flight_help_tt:0 "§Y塔罗牌§!\n点击「抽牌」随机抽取四张牌，在原位翻面。也可选择右下方始终正面显示的宝剑、权杖、圣杯或星币作为替代。\n八张牌同时只能选中一张，选中牌变为黑白；再次点击该牌取消后，才能选择其他牌。\n点击「确认」后，右上方展示启用牌及其名称，本轮卡牌与确认按钮锁定。关闭重开也不会解锁；再次抽牌后才能重新选择和确认。\n悬浮卡牌可查看说明。按住左侧主面板空白处可拖动整体。"
 AOR_tarot_flight_draw:0 "抽牌"
 AOR_tarot_flight_draw_tt:0 "§Y抽牌§!\n点击随机抽取四张不同的牌并原位翻面，再次点击重新抽取。"
 AOR_tarot_flight_confirm:0 "确认"
 AOR_tarot_flight_confirm_tt:0 "抽牌后，可选中一张随机牌或右下方的固定牌并确认。\n确认后保留所有牌面，选中牌保持黑白，右上方展示本次启用的牌。\n每次抽牌只能确认一次；再次抽牌后才能更换。"
