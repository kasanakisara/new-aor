 GER_SPD_right_tooltip_full:0 "社会民主党-§Q右派§!\n党内支持度：§Y[?GER_SPD_right_support|0]%§!\n\n对于党内的§Q右派§!而言，四月革命简直是一场灾难，苏维埃为新生共和国的民主事业染上了污点，布尔什维克的恐怖统治险些就要在德国上演。幸亏民主的捍卫者们竭尽全力，与所有愿意为民主共和国努力的党派、负责任的帝国官员以及忠于德意志国家的军队一起，暂时遏制住了极左分子，并随后挫败了他们引来的反革命政变，防止他们搞砸一切。该派系成员总体上忠于当前的民主共和国体制，强调进一步巩固民主国家，并通过民主程序推动社会主义议程，对用社会运动来推进社会主义嗤之以鼻。对待工厂委员会等经济民主机关，他们更倾向于通过工会与资方进行平等的协作来达到经济民主；对于社会化，他们愿意为了国家稳定作出让步。\n\n目前在右派当中，由§Y艾伯特§!领导的§Y稳健派§!代表着保守、避免冲突的党内官僚，任何大规模运动或冲突都会使他们感到恐惧。同时，有越来越多的人在质疑，这些浸泡在行政事务里的党内官僚是否真的忠于社会主义。而§Y谢德曼§!代表的§Y共和派§!则看起来更富激情、更加愿意采取积极的行动来维护民主，维护社会民主党在共和国中的地位。\n\n令右派感到担忧的是，他们为稳定国家与维护民主事业所做的努力似乎正越来越不被人理解，他们在党内机构中的重要地位正在不断受到挑战。\n\n\n\n\n\n\n\n£GFX_GER_SPD_portrait_Philipp_Scheidemann  £GFX_GER_SPD_portrait_Friedrich_Ebert \n\n\n\n\n\n\n\n菲利普·谢德曼 §Y-共和派§!\n弗里德里希·艾伯特 §Y-稳健派§!"
