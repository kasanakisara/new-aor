 GER_SPD_test_reset_desc:0 "将三派党内影响力恢复为左派 §Y17%§!、中派 §Y43%§!、右派 §Y40%§!。\n\n$GER_SPD_test_current_support$"
 GER_SPD_test_reset_tt:0 "党内影响力恢复为：左派 §Y17%§!、中派 §Y43%§!、右派 §Y40%§!。"
 GER_SPD_left_tooltip:0 "社会民主党-§R左派§!\n党内支持度：§Y[?GER_SPD_left_support|0]%§!\n\n§R左派§!是党内人数最少、力量最弱，却在革命中扮演重要角色的派别，主要由斯巴达克派、革命工长组织及各类激进工人团体组成。\n\n卢森堡与李卜克内西领导的§Y斯巴达克派§!主张一切权力归苏维埃，以激烈的革命宣传闻名。但该集团却长期缺乏严密组织，相信群众自发性的传统也使他们在组织问题上不甚上心。\n\n而与”有将无兵“的斯巴达克派不同，米勒和多伊米希领导的§Y革命工长组织§!深深扎根于工人群众，拥有强大的动员网络。可他们却于行动上过于谨慎，更赞同积蓄力量——只在群众明确表示赞同的时候发起行动，一锤定音。倘若双方能够克服分歧，将革命理论与群众组织力量结合起来，左派或许将成为一股不可忽视的政治力量。\n\n\n\n\n\n\n\n£GFX_GER_SPD_portrait_Rosa_Luxemburg  £GFX_GER_SPD_portrait_Richard_Mueller \n\n\n\n\n\n\n\n罗莎·卢森堡 §Y-斯巴达克派§!\n里夏德·米勒 §Y-革命工长组织§!"
 GER_SPD_center_tooltip:0 "社会民主党-§Y中派§!\n党内支持度：§Y[?GER_SPD_center_support|0]%§!\n\n若说党的其余两派尚有较为清晰的轮廓，那§Y中派§!的界定就显得十分困难了。其成员来源各异，组织松散，在诸多政治问题上分歧严重，甚至难以确定其实际力量。\n\n该派系的历史渊源可以追溯到帝国时期以考茨基为代表的、反对党内修正主义的“正统马克思主义”派。在世界大战期间，追随哈泽、雷德布尔等人与党内右派发生激烈冲突的成员，也逐渐成为中派的重要组成部分。四月革命胜利后，大批活跃于地方和基层的政治活动家，以及从左右两派转变立场的成员，也陆续加入了这一派系。\n\n该派系成员总体上主张捍卫党的革命传统，在“左派苏维埃专政路线”与“右派议会民主路线”之间跳着一支“踌躇华尔兹”——他们大体赞成立宪会议，却又希望推迟其召开，以巩固革命成果；而在苏维埃与议会的关系问题上，内部更是争论不休。总而言之，中派大体可以分为较为温和的§Y哈泽势力圈§!与较为激进的§Y雷德布尔集团§!。随着革命形势日益严峻，中派内部的分裂倾向也愈发明显。\n\n\n\n\n\n\n\n£GFX_GER_SPD_portrait_Georg_Ledebour  £GFX_GER_SPD_portrait_Hugo_Haase \n\n\n\n\n\n\n\n格奥尔格·雷德布尔 §Y-雷德布尔集团§!\n胡戈·哈泽 §Y-哈泽势力圈§!"
 GER_SPD_right_tooltip:0 "社会民主党-§Q右派§!\n党内支持度：§Y[?GER_SPD_right_support|0]%§!\n\n§Q右派§!，是党内人数最多、掌握物质与组织资源最丰富的派别。他们坚信社会主义能够通过和平、民主的途径实现，强烈反对苏维埃专政，主张由全民选举产生的立宪会议决定一切重大政治与社会改革。\n\n然而，这种对议会民主的执着和信仰，也使他们在革命中表现得过于谨慎——从这个角度上来说，他们和狂热的乌托邦激进分子有着十分惊人的共同点。该派系成员反对激进的社会化措施，消极地对待苏维埃以及一系列直接加强工人阶级权力、保卫革命果实的决议与行动。\n\n不过，右派并非铁板一块。尽管其中不乏愿意与旧势力妥协、客观上助长了反革命力量的§Y稳健派§!，但随着反革命威胁日益加剧、革命成果不断遭到侵蚀，部分§Y共和派§!的立场也开始动摇。\n\n\n\n\n\n\n\n£GFX_GER_SPD_portrait_Philipp_Scheidemann  £GFX_GER_SPD_portrait_Friedrich_Ebert \n\n\n\n\n\n\n\n菲利普·谢德曼 §Y-共和派§!\n弗里德里希·艾伯特 §Y-稳健派§!"
 GER_SPD_headline_default_tooltip:0 "§Y“总罢工！”§!"
 GER_SPD_headline_left_tooltip:0 "§Y“为了革命！”§!\n §g社会民主党左派支持度大于：60%§!"
