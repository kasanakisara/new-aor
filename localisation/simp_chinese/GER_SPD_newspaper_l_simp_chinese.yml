 GER_SPD_history_window_title:0 "§Y党的过往焦点§!"
 GER_SPD_history_1875_title:0 "§Y1875年-哥达纲领§!"
 GER_SPD_history_1875_quote:0 "§g“…由此可见，要想同伦敦的这两位老人（马克思，恩格斯）取得谅解并不是件容易的事。”—— 奥古斯特·倍倍尔§!"
 GER_SPD_history_1875_body:0 "于1875年通过的哥达纲领标志着§Y爱森纳赫派§!与§Y拉萨尔派§!的合并，德国社会主义工人党由此成立。党纲由§Y威廉·李卜克内西§!等人参与起草，在两派之间取得了§Y最大妥协§!，推动德国社会主义运动实现组织统一。该纲领确立了工人阶级政党的基本政治目标，为后来SPD的发展奠定了组织与纲领基础。"
 GER_SPD_history_1891_title:0 "§Y1891年-爱尔福特纲领§!"
 GER_SPD_history_1891_quote:0 "§g“把工人阶级的这一斗争塑造成为一种有觉悟的和统一的斗争，向他们指明他们天然必须实现的目标──这就是社会民主党的任务。” ——《爱尔福特纲领》§!"
 GER_SPD_history_1891_body:0 "继《哥达纲领》之后德国社会主义运动的重要党纲。它以马克思主义为理论基础，分析§Y资本主义的阶级矛盾§!，削弱了《哥达纲领》中的拉萨尔主义论述。并在实践部分中要求实现普选、民主自由、改善劳动条件等现实改革，确立了19世纪末SPD的§Y基本理论与运动路线§!。"
 GER_SPD_history_1906_title:0 "§Y1906年-曼海姆协定§!"
 GER_SPD_history_1906_quote:0 "§g“这里所涉及的问题，是正在斗争的无产阶级的生死攸关的问题。” —— 卡尔·考茨基§!"
 GER_SPD_history_1906_body:0 "本协定重新确立了德国社会主义运动中§Y政党与工会§!之间的组织关系。党与自由工会成为两个§Y平等且独立§!的组织支柱，在重大政治行动上进行协商合作。协定同时§Y限制了§!SPD单方面发动§Y政治总罢工§!的权力，使其成为一种具有最后手段性质的防御性斗争手段。"
 GER_SPD_history_1912_title:0 "§Y1912年-开姆尼茨党体制改革§!"
 GER_SPD_history_1912_quote:0 "§g“选举斗争的降温再次表明，有必要改革党的领导机构，使其能够更有效地开展政治行动…” —— 格奥尔格·雷德布尔§!"
 GER_SPD_history_1912_body:0 "因党执行委员会的过度官僚化，SPD的领导权集中于少数中央干部手中，与其以百万计的党员规模极不相称。§Y雷德布尔集团§!于开姆尼茨党代会上推动SPD完成党体制改革，扩大地方党组织和基层代表在党的政治决策中的作用，加强由§Y中派主导§!的党的监察委员会，并限制中央执行委员会的§Y权力§!。"
 GER_SPD_history_1917_title:0 "§Y1917年-维尔茨堡战时路线§!"
 GER_SPD_history_1917_quote:0 "§g“我如今是，也将永远是现存社会的死敌。”——奥古斯特·倍倍尔§!"
 GER_SPD_history_1917_body:0 "“工人皇帝”奥古斯特·倍倍尔从瑞士疗养归来。随后的§Y维尔茨堡党代会§!重新确立了SPD的战时路线，同时遏制党内右翼和左翼势力的扩张：§Y既不支持战争，也不主张直接发动革命。对罢工和群众运动实行有限控制与组织§!，维持§Y党纪§!。这种反战立场导致多名SPD领导人被捕。此后，罢工的主要诉求集中于反对无限制潜艇战、要求释放政治犯。"
