 GER_SPD_lifelong_tribune_category:0 "终身护民党"
 GER_SPD_lifelong_tribune_category_desc:0 "$GER_SPD_lifelong_tribune_category_short_desc$"
 #GER_SPD_lifelong_tribune_category_long_desc:0 "§Y德国社会民主党§!是全球社会主义政党中首屈一指的大党，其在国际社会主义运动中的领先地位无可争辩。该党从它诞生之初起便坚定不渝地主张革命，在国际中为反对修正主义进行积极战斗。然而，当世界大战爆发时，德国社民党决定支持本国政府进行战争——“给了第二国际所有政党当头一棒”。\n万幸的是，得益于§Y开姆尼茨党内体制改革§!的成效，以及§Y奥古斯特·倍倍尔§!的复出，社会民主党在战争中期由支持战争转向消极抵抗，并最终于战争后期开始组织有序的罢工行动。这一转变勉强维持住了党的表面团结，避免了党组织的正式分裂。然而，面对空前的革命形势与革命成果：那些自战前酝酿，经战争催化的分歧，终于于战后彻底引爆。\n如今，社会民主党内部已清晰地分化为§Y三个派系§!。社会民主党人必须决定党将走向何方，并由此决定共和国的命运。"
 GER_SPD_lifelong_tribune_category_short_desc:0 "新的生命开始在我心中生长，\n我的双眼怀着惊喜，望向更远的地方，\n于今日之中，已望见繁花盛开的明朝。\n §Y——恩斯特·普雷灿，《是什么使我成为社会主义者？》§!"
