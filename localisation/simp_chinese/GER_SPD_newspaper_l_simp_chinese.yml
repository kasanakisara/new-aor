 GER_SPD_unity_tooltip:0 "§Y社会民主党-党内团结度§!\n党内状态：§Y[GER_SPD_unity_status_text]（[?GER_SPD_unity|0]%）§!\n\n[GER_SPD_unity_effect_text]\n----\n§L党纪是德意志社会民主党的骄傲，党团多数的决定必须受到尊重。保持团结，是德国社会民主党永恒的话题。如今，各派系对革命与共和国的未来各执一词，纷争不断；§!§Y党内团结度§!§L反映了各派在党务与革命事务中相互妥协、调和分歧并共同行动的程度。§!§R过低的团结度§!§L意味着党纪的破产，将对社会民主党开展的各项事业产生不利影响。§!"
