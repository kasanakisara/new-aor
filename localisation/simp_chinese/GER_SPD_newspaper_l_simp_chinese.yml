 GER_SPD_unity_modifier:0 "社会民主党-党内团结度"
 GER_SPD_unity_tooltip:0 "§Y社会民主党-党内团结度§!\n党内状态：§Y[GER_SPD_unity_status_text]（[?GER_SPD_unity|0]%）§!\n\n[GER_SPD_unity_effect_text]\n----\n§Y党内团结度§!§g反映了社会民主党各派在党务及革命事务中的合作程度，其取值范围为0%—100%，以50%为基准。\n党内团结度每高于或低于基准值十个百分点，将相应增减每日政治点数0.20，每日指挥点数0.10，每周稳定度0.10%。\n此外，党、工会及其他社会团体的相关决议及其效果也将受到党内团结度的影响。§！"
