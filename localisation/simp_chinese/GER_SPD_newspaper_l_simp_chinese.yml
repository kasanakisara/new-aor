 GER_SPD_history_window_title:0 "§Y党的过往焦点§!"
 GER_SPD_history_1875_title:0 "§R1875年-哥达纲领§!"
 GER_SPD_history_1875_quote:0 "§g“…由此可见，要想同伦敦的这两位老人（马克思，恩格斯）取得谅解并不是件容易的事。”\n—— 奥古斯特·倍倍尔§!"
 GER_SPD_history_1875_body:0 "于1875年通过的哥达纲领标志着§Y爱森纳赫派§!与§Y拉萨尔派§!的合并，德国社会主义工人党由此成立。党纲由§Y威廉·李卜克内西§!等人参与起草，在两派中取得了§Y最大妥协§!，推动德国社会主义运动实现了组织统一。该纲领确立了工人阶级政党的基本政治目标，为后来SPD的发展奠定了组织与纲领基础。"
 GER_SPD_history_1891_title:0 "§R1891年-爱尔福特纲领§!"
 GER_SPD_history_1891_quote:0 "§g“把工人阶级的这一斗争塑造成为一种有觉悟的和统一的斗争，向他们指明他们天然必须实现的目标──这就是社会民主党的任务。”\n——《爱尔福特纲领》§!"
 GER_SPD_history_1891_body:0 "继《哥达纲领》之后德国社会主义运动的重要党纲。它以马克思主义为理论基础，分析§Y资本主义的阶级矛盾§!，削弱了《哥达纲领》中的拉萨尔主义论述。并在实践部分中要求实现普选、民主自由、改善劳动条件等现实改革，确立了19世纪末SPD的§Y基本理论与运动路线§!。"
 GER_SPD_history_1906_title:0 "§R1906年-曼海姆协定§!"
 GER_SPD_history_1906_quote:0 "§g“这里所涉及的问题，是正在斗争的无产阶级的生死攸关的问题。”\n—— 卡尔·考茨基§!"
 GER_SPD_history_1906_body:0 "本协定重新确立了德国社会主义运动中§Y政党与工会§!之间的组织关系。党与自由工会成为两个§Y平等且独立§!的组织支柱，在重大政治行动中进行协商与合作。协定同时§Y限制了§!SPD单方面发动§Y政治总罢工§!的权力，规定此类行动必须事先征得工会同意，并将其定位为仅在必要时采取的最后防御手段。"
 GER_SPD_history_1912_title:0 "§R1912年-开姆尼茨党体制改革§!"
 GER_SPD_history_1912_quote:0 "§g“选举斗争的降温再次表明，有必要改革党的领导机构，使其能够更有效地开展政治行动…”\n—— 格奥尔格·雷德布尔§!"
 GER_SPD_history_1912_body:0 "因党执行委员会的过度官僚化，SPD的领导权集中于少数中央干部手中，与其以百万计的党员规模极不相称。§Y雷德布尔集团§!于开姆尼茨党代会上推动SPD完成党体制改革，扩大地方党组织和基层代表在党的政治决策中的作用，加强由§Y中派主导§!的党的监察委员会，并限制中央执行委员会的§Y权力§!。"
 GER_SPD_history_1915_title:0 "§R1915年-齐美尔瓦尔德会议§!"
 GER_SPD_history_1915_quote:0 "§g“（德国社民党）百分之二十是激进派，百分之三十是机会主义者，剩下的人都跟着倍倍尔走。”\n—— 格奥尔格·雷德布尔§!"
 GER_SPD_history_1915_body:0 "随着党内右派愈发依赖§Y帝国政府与军方§!的支持来压制中派，后者逐渐落入下风——党内分裂已迫在眉睫。在第二国际的§Y齐美尔瓦尔德会议§!上，德国中派与左派共同请求§Y奥古斯特·倍倍尔§!出面调停。他严厉抨击了右派对帝国当局的妥协与依附，同时批评了左派的冒进倾向。倍倍尔基本肯定了中派坚持反战、审慎行动的政治路线，却坚决反对以分裂作为解决党内争端的手段。在他的斡旋下，各派暂时达成妥协，濒临破裂的党内§Y团结得以维系§!。\n会议否决了§Y列宁§!等人§Y将帝国主义战争转变为国内革命战争§!的主张，通过了反对帝国主义战争的§Y《告欧洲无产者书》§!，并就谴责社会沙文主义达成一致。然而，对于支持战争的社会主义者究竟应承担何种责任，各派仍存在严重分歧。"
 GER_SPD_history_1917_title:0 "§R1917年-维尔茨堡战时路线§!"
 GER_SPD_history_1917_quote:0 "§g“我如今是，也将永远是现存社会的死敌。”\n——奥古斯特·倍倍尔§!"
 GER_SPD_history_1917_body:0 "“工人皇帝”奥古斯特·倍倍尔从瑞士疗养归来。随后的§Y维尔茨堡党代会§!重新确立了“消极抵抗”的战时路线，同时遏制了党内左右两翼势力的扩张：既不支持战争，也不主张立即发动革命，而是对罢工与群众运动进行有组织的引导和有限度的动员，以维持党纪与组织统一。这一反战立场使多名SPD领导人遭到逮捕，党的地方组织与基层活动网络也受到不同程度的打击。\n初期，党所领导的罢工主要围绕改善工人生活条件、反对物资短缺与物价上涨等经济诉求展开，并逐渐加入反对无限制潜艇战、要求释放政治犯等政治主张。随着§Y十月革命§!的爆发及1918年§Y《布列斯特-立陶夫斯克条约》§!的签订，党内反战情绪与群众激进化倾向进一步高涨，罢工诉求逐步转向立即实现和平、实行普选权及推动国家民主化。至战争最后数月，社民党开始放宽对群众运动的限制，将原先谨慎的防御性斗争转变为有组织的政治攻势，并公开提出§Y废除君主制、建立共和国§!的要求。"
 GER_SPD_left_tooltip_full:0 "社会民主党-§R左派§!\n党内支持度：§Y[?GER_SPD_left_support|0]%§!\n\n§R左派§!并不是一个年轻的派别，但与中派和右派相比，左派的影响力稍显薄弱。苏维埃专政、激进社会化、建立革命军队、号召世界革命……每一个都是能掀起巨大党内党外争论的话题，左派们一直都需要面对谈论它们带来的巨大压力，但他们仍然在革命的浪潮中站稳了脚跟，成为了一股无法忽视的力量。\n\n以§Y罗莎·卢森堡§!、§Y卡尔·李卜克内西§!为首的§Y斯巴达克派§!经历了一次不小的策略转向，在吸取了1919年5月底前柏林冲突中无法有效领导自发行动起来的无产阶级的教训后，他们不再寻求革命的迅速胜利，而是试图在党内扩大自己的组织规模与影响力，在坚持发动自觉的无产阶级从下往上夺取一切权力阵地的同时，提高激进派对于群众的领导能力。用卢森堡的话来说：“如果革命事业要前进，如果要使无产阶级的胜利、使社会主义不再是一个梦想，那么革命的工人阶级必须建立一个跟得上时代、懂得引导和运用群众的战斗能力的领导机关。”\n\n除了这些战前已经知名的激进派外，在革命运动中涌现的工人组织、地方激进党部也是左派的重要力量，他们支持一种以苏维埃/委员会为运动核心的革命动员理念，并以纯粹委员会制度作为未来理想的政治、经济制度。其中，§Y里夏德·米勒§!、§Y多伊米希§!领导的§Y柏林革命工长组织§!在柏林拥有着强大的动员能力，前者为强大的金属工会的领导人，后者则是纯粹委员会运动最重要的领导者以及理论家。而地方激进党部则以§Y威廉·科嫩§!领导的§Y哈勒——梅泽堡党部§!为典型，在6月、7月中德地区的争取社会化斗争中成功团结起了中德地区不同立场的工人。\n\n如果党内老激进派们与激进的基层党部、工人代表们达成一致，最终完成左派力量的整合，他们就能摆脱处于中派阴影下的处境，乘着革命的洪流，向权力的更中心进发。\n\n\n\n\n\n\n\n£GFX_GER_SPD_portrait_Rosa_Luxemburg  £GFX_GER_SPD_portrait_Richard_Mueller \n\n\n\n\n\n\n\n罗莎·卢森堡 §Y-斯巴达克派§!\n里夏德·米勒 §Y-革命工长组织§!"
 GER_SPD_left_tooltip_compact:0 "社会民主党-§R左派§!\n党内支持度：§Y[?GER_SPD_left_support|0]%§!\n\n\n\n\n\n\n\n£GFX_GER_SPD_portrait_Rosa_Luxemburg  £GFX_GER_SPD_portrait_Richard_Mueller \n\n\n\n\n\n\n\n罗莎·卢森堡 §Y-斯巴达克派§!\n里夏德·米勒 §Y-革命工长组织§!"
 GER_SPD_center_tooltip_full:0 "社会民主党-§Y中派§!\n党内支持度：§Y[?GER_SPD_center_support|0]%§!\n\n对于一个普通党员而言，如果他不认为自己是一个左派，也不是一个右派，那么他也就只能自称为一个§Y中派§!了。中派代表着社会民主党中的“传统”部分，从他们的行动方式、政治主张中都能看得出来。总的来说，他们坚守着传统的社会主义原则，主张无产阶级应该掌握国家政权，反对对资产阶级、旧军队过多妥协，同时支持对各行业进行社会化。他们中的许多人对苏维埃、工厂委员会在社会主义目标中扮演的角色，以及是否支持起义等问题摇摆不定。不过令人庆幸的是，中派暂时还能继续维持住对与党内左派联盟的领导，维持住党内主导派系的地位。\n\n在中派之间，围绕着另一位党主席§Y胡戈·哈泽§!的§Y势力圈§!成为了党内官方路线的积极维护者，支持在左派苏维埃专政路线与右派议会民主路线之间跳着“踌躇华尔兹”，希望将二者结合起来。在§Y倍倍尔§!的暗中授意下与§Y考茨基§!的倾力协助下，他们同时对左右派进行施压，维护当前路线的持续。战前1912年党改革运动的功臣§Y格奥尔格·雷德布尔§!一般也被视为中派的领袖，然而与哈泽相比，雷德布尔显得不那么中间。与许多中派党员类似，他本人的政治立场正不断左移。其对苏维埃专政的积极态度也促使着左派与之亲近，而他本人也越来越支持一种“激进派间的团结”，以对抗党内右派。也许不久后，他在左派中间出现的频率会超过中派。\n\n\n\n\n\n\n\n£GFX_GER_SPD_portrait_Georg_Ledebour  £GFX_GER_SPD_portrait_Hugo_Haase \n\n\n\n\n\n\n\n格奥尔格·雷德布尔 §Y-雷德布尔集团§!\n胡戈·哈泽 §Y-哈泽势力圈§!"
