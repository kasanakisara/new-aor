l_simp_chinese:
 DOCTRINE_TRACK_BOMBER_AIRCRAFT: "轰炸机"
 DOCTRINE_TRACK_BLIMP: "软式飞艇"
 DOCTRINE_TRACK_RIGID_AIRSHIP: "硬式飞艇"
 SUBDOCTRINE_BLIMP_SCOUTING: "飞艇侦察"
 SUBDOCTRINE_BLIMP_SCOUTING_DESC: "用软式飞艇在前线上空观测，把敌军调动尽收眼底。"
 SUBDOCTRINE_BLIMP_MARITIME_PATROL: "飞艇海上巡逻"
 SUBDOCTRINE_BLIMP_MARITIME_PATROL_DESC: "软式飞艇航程长、滞空久，是近海巡逻与护航观察的好帮手。"
 SUBDOCTRINE_BLIMP_ANTI_SUBMARINE: "飞艇反潜"
 SUBDOCTRINE_BLIMP_ANTI_SUBMARINE_DESC: "搭载炸弹与观察员的飞艇，可以从空中搜寻并攻击上浮的潜艇。"
 SUBDOCTRINE_BLIMP_BOMBING: "飞艇轰炸"
 SUBDOCTRINE_BLIMP_BOMBING_DESC: "夜间低空袭扰，用有限的载弹量制造最大的恐慌。"
 SUBDOCTRINE_RIGID_LONG_RANGE_RECON: "硬式飞艇远程侦察"
 SUBDOCTRINE_RIGID_LONG_RANGE_RECON_DESC: "齐柏林式硬式飞艇可以横跨海洋执行战略侦察。"
 SUBDOCTRINE_RIGID_STRATEGIC_BOMBING: "硬式飞艇战略轰炸"
 SUBDOCTRINE_RIGID_STRATEGIC_BOMBING_DESC: "把炸弹带到敌人头顶——城市、工厂与港口都在航程之内。"
 SUBDOCTRINE_RIGID_FLEET_ESCORT: "硬式飞艇护航"
 SUBDOCTRINE_RIGID_FLEET_ESCORT_DESC: "为舰队提供空中掩护与远程搜索。"
 SUBDOCTRINE_RIGID_SUPPLY: "硬式飞艇补给"
 SUBDOCTRINE_RIGID_SUPPLY_DESC: "用飞艇向偏远据点输送补给与人员。"
