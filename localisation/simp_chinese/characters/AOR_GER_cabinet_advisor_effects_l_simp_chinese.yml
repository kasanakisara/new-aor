 # 条件加成容器
 GER_adv_haase_center:0 "中派内阁共识"
 GER_adv_haase_center_desc:0 "胡戈·哈泽在内阁中只留社民党中派时，把各派的分歧压到最低。"
 GER_adv_scheidemann_high_stab:0 "八面玲珑的护国者"
 GER_adv_scheidemann_high_stab_desc:0 "秩序尚稳时，谢德曼的周旋能够腾出民用产能并拓展对外贸易，但也在暗中拖慢社会化的步伐。"
 GER_adv_david_bernstein:0 "改良派呼应"
 GER_adv_david_bernstein_desc:0 "伯恩施坦入阁后，大卫的温和路线获得了理论背书，议会协调更加顺畅。"
 GER_adv_ballod_banking:0 "银行社会化红利"
 GER_adv_ballod_banking_desc:0 "银行业社会化落地后，巴洛德的计划才真正开始压住消费品挤占。"
 GER_adv_schacht_halfright:0 "右派内阁的信贷协调"
 GER_adv_schacht_halfright_desc:0 "内阁里社民党右派占到一半，沙赫特的货币与信贷安排才推得动。"
 GER_adv_ledebour_pure:0 "中左联合内阁"
 GER_adv_ledebour_pure_desc:0 "内阁只剩社民党中派与左派时，雷德布尔能把这套班底拧成一台机器。"
 GER_adv_braun_ready:0 "建设纲领推进"
 GER_adv_braun_ready_desc:0 "稳定度过关且社会化已有成果，布劳恩的建设纲领才进入执行阶段。"
 GER_adv_braun_severing:0 "普鲁士双璧"
 GER_adv_braun_severing_desc:0 "布劳恩与赛弗林同阁共事，行政与治安体系紧密衔接，共和堡垒更加稳固。"
 GER_adv_ebert_allright:0 "清一色右派内阁"
 GER_adv_ebert_allright_desc:0 "内阁全是社民党右派，艾伯特的党务机器高效运转，但也持续压制着基层工人的组织化。"
 GER_adv_severing_high_stab:0 "共和堡垒的将军"
 GER_adv_severing_high_stab_desc:0 "秩序稳固之时，赛弗林掌控的治安与行政网络让柏林政府更有余力推进政令。"
 GER_adv_bernstein_cost:0 "修正主义妥协"
 GER_adv_bernstein_cost_desc:0 "左派与中派都不在阁内，伯恩施坦的调和路线无人掣肘，顾问任命更省力。"
 GER_adv_stresemann_watch:0 "监视极右组织"
 GER_adv_stresemann_watch_desc:0 "“监视极右组织”落地后，施特雷泽曼把警察与情报渠道接进了内阁。"
 GER_adv_mehring_pp:0 "梅林的红色史学"
 GER_adv_mehring_pp_desc:0 "梅林在阁满100天，红色史官的笔替内阁挣来了政治资本。"
 GER_adv_dittmann_balance:0 "工会居中调停"
 GER_adv_dittmann_balance_desc:0 "党内左右两翼势均力敌之时，迪特曼的居中斡旋维系住了车间与党务的平衡。"
 GER_adv_leipart_industry:0 "劳资协调运转"
 GER_adv_leipart_industry_desc:0 "莱帕特同内阁中的实业家达成默契，以克制激进动员换取工厂与生产线的顺畅运转。"
 GER_adv_duisberg_pre:0 "拜耳化工协作"
 GER_adv_duisberg_pre_desc:0 "在化学工业完成社会化之前，拜耳的供应网络暂时缓解了消费品的压力。"
 GER_adv_koettgen_synergy:0 "计划与工业合理化"
 GER_adv_koettgen_synergy_desc:0 "克特根的标准化经验与经济规划者相互配合，进一步抬高了工厂的效率上限。"
 GER_adv_reusch_ruhr:0 "威斯特法伦重工运转"
 GER_adv_reusch_ruhr_desc:0 "只要反革命激进度尚未失控且威斯特法伦未被左派彻底接管，罗伊施仍能调动重工业的军工与船坞产能。"
 GER_adv_hmueller_coalition:0 "稳固议会多数"
 GER_adv_hmueller_coalition_desc:0 "执政联盟凝聚力稳固之时，赫尔曼·米勒的党务网络让政令推行更加顺畅。"
 GER_adv_wirth_erzberger:0 "中央党左翼呼应"
 GER_adv_wirth_erzberger_desc:0 "维尔特与埃茨贝格尔并肩在阁，使中央党左翼坚定站在共和国与执政联盟一边。"
 GER_adv_koch_preuss:0 "宪政与行政协同"
 GER_adv_koch_preuss_desc:0 "科赫-韦泽与普罗伊斯共同推动现代行政与法治建设，夯实了共和国的制度根基。"
