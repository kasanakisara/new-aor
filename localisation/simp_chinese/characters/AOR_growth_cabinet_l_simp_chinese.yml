 AOR_growth_cabinet_info_tt:0 "§Y成长型内阁机制介绍§!\n有些成员资历尚浅，尚未得到系统性的培养。成长型内阁为他们提供逐步历练、积累经验的机会。经过培养，他们最终有望成为能够独当一面的政治家、军事家或理论家。"
