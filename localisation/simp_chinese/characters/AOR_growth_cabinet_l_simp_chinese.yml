 GER_Richard_Mueller_regular_cabinet:0 "里夏德·米勒"
 GER_Richard_Mueller_corpse:0 "死尸"
 AOR_GER_mueller_growth.2.t:0 "走出柏林"
 AOR_GER_mueller_growth.2.desc:0 "革命已经过去数月，德国工人运动却仍未找到新的平衡。\n\n在旧政权的重压下，里夏德·米勒曾依托柏林工厂中的革命工长网络组织罢工与起义。即便面对镇压，他也始终站在街头和车间之间。革命为他赢得了无可争议的声望，也教会了他如何发动工人；但发动一座城市，并不等于领导一个国家的工人运动。\n\n共和国建立后，运动进入了另一个阶段。罢工、代表会议和街头动员所积累的力量，必须变成稳定的组织、跨行业的协调，以及能够日复一日运转的工人委员会。在他坐上（？成长型内阁在现实中的实际表述）后，所接触到的全国性数据、资料令他越来越意识到工人运动不能永远停留在革命时期的紧急状态。要守住胜利，就得让制度在日常生活中发挥作用。\n\n凭借在德国金属工人联合会中的影响，以及在工人委员会和革命工长组织中的经历，他正成为党内左翼与基层工会会员之间的桥梁。越来越多的人劝他承担全国工会运动的领导工作。\n\n米勒并不热衷于追逐权力。但若这一步能够帮助工人守住所赢得的一切，他愿意把更多精力投向全国性的工会事务。他要走出柏林。"
 AOR_GER_mueller_growth.2.a:0 "看来“死尸”还没凉透"
 AOR_GER_mueller_growth.2.effect_tt:0 "里夏德·米勒将可以从内阁中招募"
