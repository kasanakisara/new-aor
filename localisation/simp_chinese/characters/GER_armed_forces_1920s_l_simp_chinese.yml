l_simp_chinese:
 # 国防政府与西南共和将领：新特质
 GER_AF_veteran_of_many_wars:0 "久战之将"
 GER_AF_veteran_of_many_wars_desc:0 "这名军官曾经参与了多次战争与冲突，数十年如一日的军旅生涯让他积累了丰厚的经验。"
 GER_AF_army_authority:0 "军中权威"
 GER_AF_army_authority_desc:0 "这名军官无论在军界还是政界都有一席之地，这使得他的作战安排更容易得到上级的认可。"
 GER_AF_shield_of_the_empire:0 "帝国之盾"
 GER_AF_shield_of_the_empire_desc:0 "这名军官极度痛恨任何左翼分子，这使得他在面对敌人时更喜欢做出报复行为。"
 GER_AF_foreign_experience:0 "赴外经验"
 GER_AF_foreign_experience_desc:0 "这名军官曾经在异国他乡与敌人作战，严峻的自然环境锻炼了他的意志力与适应力。"
 GER_AF_prussian_militarism:0 "普鲁士军国色彩"
 GER_AF_prussian_militarism_desc:0 "这名将领终其一生都有着浓厚的军国色彩，祖国在他的心中比任何主义都重要。"
 GER_AF_police_background:0 "警察背景"
 GER_AF_police_background_desc:0 "这名将领曾经是一名警察，他对一些城市作战与巷战技巧娴熟于心。"
 GER_AF_poor_commander:0 "指挥无力"
 GER_AF_poor_commander_desc:0 "这名将领的军事指挥能力令人难以入目，对于他的部下来说，成为这名将领的士兵无异于向死神招手。"
 GER_AF_artillery_commander:0 "炮兵将领"
 GER_AF_artillery_commander_desc:0 "这名将领长期在炮兵部队中服役，深知如何把火炮的威力用到极致。"
 GER_AF_artillery_expert:0 "炮兵专家"
 GER_AF_artillery_expert_desc:0 "这名将领对炮兵战术有专门研究，善于以炮火为步兵开路。"
 GER_AF_fierce_attacker:0 "凌厉的攻击者"
 GER_AF_fierce_attacker_desc:0 "这名将领从不满足于僵持，他总能在防线上撕开缺口。"
 GER_AF_logistics_genius:0 "后勤奇才"
 GER_AF_logistics_genius_desc:0 "这名将领精于计算补给与运力，总能让部队在关键时刻吃上饭、打上弹。"

