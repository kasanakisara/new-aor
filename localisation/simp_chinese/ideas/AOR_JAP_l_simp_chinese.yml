JAP_wartime_mobilization_evil_desc:0 "世界大战的狂热影响了每一个人，即便是日本帝国也不例外，加藤高明内阁的一厢情愿，将帝国拖入了战争的泥潭，而到了1919年，战争的苦果已然显现，帝国陆海军动员了超过90万人，国内的人力几近枯竭，物价已然翻了三倍，若再不停止战争，帝国将走向毁灭。"
JAP_constitutional_revival_desc:0 "作为加藤友三郎内阁垮台后的第一届民党内阁，武富时敏内阁被人们视为宪政常道复活的奇迹。但是，武富内阁要承担与应付的东西太多太多。阁内，犬养-尾崎派与加藤-滨口派的矛盾已然激化到难以弥合的程度；阁外，政友革新党、军部、宫中，几乎每个势力都对内阁保有反对情绪。\n\n§R武富时敏和他的阁僚，如今不过是在走钢丝，宪政最终的结局，还在等待历史的审判。§!"
JAP_satsuma_military_desc:0 "自日俄战争结束后，在大山岩、川上操六、山本权兵卫等陆海军巨头的派阀政斗下，帝国陆海军已然落到了萨摩阀的手上，但萨摩的制霸，并不意味着陆海军政斗的结束，以田中义一、大岛健一为首的长洲新生派正等待着契机，终结萨摩制霸的局面。"
JAP_russo_japanese_war_continuation_desc:0 "俄国内战爆发后，日本帝国依旧延续了对俄国的作战方针，出兵西伯利亚，但西伯利亚终究不是满洲，泥泞的土地、落后的后勤和严寒的天气严重拖垮了我军的进度。"
JAP_mobilization_lock_tt:0 "部队训练与整编陷入停滞：新兵训练时间大幅延长，兵员补充困难。"
JAP_emperor_taisho_desc:0 "“大日本帝国，由万世一系天皇统治之。”\n——《大日本帝国宪法》\n\n生于：1879年8月31日，于东京赤坂御所。\n\n嘉仁天皇，大日本帝国第123代天皇，御名嘉仁，明治天皇睦仁独存皇子，生母为柳原爱子。幼时罹患脑膜炎，留下终身神经疾患，自幼体弱。1888年被册立为皇太子，1900年迎娶九条节子（贞明皇后），此后皇室确立一夫一妻制。\n\n1912年明治天皇驾崩，嘉仁践祚，改元大正。在位期间恰逢一战，日本国力扩张。但他身体却逐年恶化，难以持续亲理政务。\n\n§R作为大日本帝国的最高统治者，嘉仁天皇的身体状况令宫中侧近及重臣们担忧，一旦嘉仁突发恶疾，帝国必须寻找合适的人摄政。§!"
JAP_Extension_of_Imperial_desc:0 "在世界大战中，帝国陆军在满洲和外阿穆尔与俄军血战，并最终取得光荣的胜利。如今，俄罗斯帝国已然崩塌，战争已基本结束，远征满洲和外阿穆尔的陆军围绕城镇和铁路形成了临时驻地，等待着来自东京的命令。当然，如果帝国需要，他们愿意为了帝国的意志奋战到最后一刻。"

 #领导人
JAP_Taketomi_Tokitoshi:0 "武富时敏"
JAP_Taketomi_Tokitoshi_desc:0 "生于：1856年1月16日，佐贺藩（今佐贺县）\n武富时敏，藩士武富良橘长子。明治时期立宪派政治家，出身佐贺藩士门第，属三溝武富一族。早年参与佐贺之乱，事败后赴东京求学，受副岛种臣影响投身政党政治，创办《肥筑日报》，组建九州改进党。\n1883年当选佐贺县议员、后任县议会议长；1890年当选众议院议员，除189年落选外，连续十二回当选，是大隈重信核心亲信之一。历任农商务省工务局局长、大藏省参事官。\n1907年大隈总裁从进步党隐退后，为避免进步党的分裂，在降旗元太郎和大石正巳的操作下，武富成为了进步党的新任总裁。在日俄战争日益焦灼以至于加藤友三郎内阁垮台后，宫中和军部决定将政权重新还给民党，而率领进步党的武富也成功接下了组阁大命的奉答，这位奋斗数十载的武士，能否真正处理乱局，恐怕不应高估。"
