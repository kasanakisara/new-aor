l_simp_chinese:
 GER_lifelong_SPD:0 "终身护民党"
 GER_lifelong_SPD_desc:0 "石竹花乃是多年生草本，茎叶纤细而成丛生长。一季花谢，根株仍在，来年又能开出满丛的红。\n德国社会民主党是共和国的缔造者、德国工人阶级无可争议的代表。它为工人构建了一个自给自足、近乎与外界平行的社会，包办了他们从摇篮到坟墓的全部生活。这个庞大的官僚机器将无产阶级凝聚成一个统一而团结的整体，以一个没有剥削、平等而民主的社会主义未来的许诺，抚慰着他们在现实中的痛苦。它历经摧折，却仍顶天立地，枝繁叶茂。"
 GER_when_economy_dies:0 "当经济死去"
 GER_when_economy_dies_desc:0 "社会民主党暂时赢得了国内政治斗争的胜利，但这并不能改变德国是战败国的事实。战争曾持续数年，协约国的海上封锁使德国物资严重匮乏。粮食危机、疾病蔓延、失业、流落街头的伤残者……数不尽的问题等待着新生的共和国解决。尽管这些困境是贪婪的旧帝国统治者造成的，但如果共和国的掌权者无法解决这些问题，就将失去民众的信任。"
 GER_state_within_a_state:0 "国中之国"
 GER_state_within_a_state_desc:0 "从外界看来，新生的共和国似乎已牢牢控制了协约国占领区以外的所有德国领土。然而，德国内部实则存在数个在经济基础、政府构成、地方权力结构与政治生态上差别巨大的“国中之国”。这些拥有强大本地动员能力的“国中之国”将成为共和国未来政治中的不稳定因素。人民军、工人武装、自由军团、国防军与市民卫队等在组织上相互独立的武装力量，又进一步加剧了局势的复杂性。社会民主党现在尚能把持住大局——但此后的局势，又有谁能预料？"
 GER_age_of_fracture:0 "破裂年代"
 GER_age_of_fracture_desc:0 "一切远没有想象中那般美好。在社会民主党内，各派对共和国的未来抱有截然不同的设想。过去因战争、帝国权威与共同敌人的存在而暂时受到压制的矛盾，如今纷纷浮出水面。党内左、中、右派貌合神离，表面上的团结日益难以维系。在议会中，社会民主党与中央党的联盟也远非坚不可摧，民主党、人民党与民族人民党的异议声也愈发强烈。"
 GER_stab_in_the_back:0 "背后捅刀"
 GER_stab_in_the_back_desc:0 "“刀刺在背传说”，是一种对大战战争罪责的民族主义解释及其阴谋论延伸。该传言认为：德国战败之首要原因，在于德军征战前线之际，国内却爆发了罢工与革命；而德国战败之罪魁祸首，则是那“死有余辜”的犹太人与社会主义者群体。他们操控舆情，兜售革命，使政府不得不向敌国投降。要不是有人告诉我这是共和，我会以为这是一把赤裸的剑。"
 GER_stab_in_the_back_division_lock_tt:0 "£trigger_no 无法训练、解散部队或编辑师模板"
