 GER_Versailles_shackles:0 "凡尔赛的枷锁"
 GER_Versailles_shackles_desc:0 "《凡尔赛条约》不只是一份和约，它是加在共和国身上的整套枷锁：战争罪责、领土交割、海外殖民地的丧失、十万人的军队上限、莱茵兰的占领，以及那张看不到尽头的赔款账单。\n\n它压低的不是某一位政治家的声望，而是整个国家的呼吸——稳定度、战争支持、政治效率与经济产出，无一不在它的重量之下。在它被挣脱之前，德意志的任何一项事业，都只能从这份条约允许的缝隙里生长。"
 GER_reichstag_emergency_session:0 "国民议会紧急会议"
 GER_reichstag_emergency_session_desc:0 "议程被全部取消，其余的一切都推到一边——国民议会只为一件事情开会：在二十四小时之内，对协约国的最后通牒作出答复。\n\n走廊里挤满了议员、记者与等候消息的部长；讲台上有人宣读条约条款，有人拍着桌子要求抵抗，也有人在角落里计算票数。没有人讨论别的议题，因为已经没有人相信明天还照常到来。"
