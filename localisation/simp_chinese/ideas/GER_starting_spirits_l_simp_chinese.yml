 GER_1919_economic_stimulus:0 "提振经济"
 GER_1919_transport_repair:0 "交通修缮"
 GER_1919_social_stabilization:0 "社会稳定工作"
 GER_1919_social_stabilization_desc:0 "§Y社会稳定工作§!被移除时：\n政治点数：§R-50§!。"
 GER_Versailles_shackles:0 "凡尔赛的枷锁"
 GER_Versailles_shackles_desc:0 "《凡尔赛条约》不只是一份和约，它是加在共和国身上的整套枷锁：战争罪责、领土交割、海外殖民地的丧失、十万人的军队上限、莱茵兰的占领，以及那张看不到尽头的赔款账单。\n\n它压低的不是某一位政治家的声望，而是整个国家的呼吸——稳定度、战争支持、政治效率与经济产出，无一不在它的重量之下。在它被挣脱之前，德意志的任何一项事业，都只能从这份条约允许的缝隙里生长。"
 GER_reichstag_emergency_session:0 "国民议会紧急会议"
 GER_reichstag_emergency_session_desc:0 "议程被全部取消，其余的一切都推到一边——国民议会只为一件事情开会：在二十四小时之内，对协约国的最后通牒作出答复。\n\n走廊里挤满了议员、记者与等候消息的部长；讲台上有人宣读条约条款，有人拍着桌子要求抵抗，也有人在角落里计算票数。没有人讨论别的议题，因为已经没有人相信明天还照常到来。"
 GER_lifelong_SPD_system_enabled_tt:0 "£trigger_yes 启用§Y「终身护民党」§!机制。"
 GER_state_within_a_state_mechanic_enabled_tt:0 "£trigger_yes 启用§Y「国中之国」§!机制。"

 # --- 1920 经济线 ---
 GER_economy_recovery:0 "经济重建成效"
 GER_economy_recovery_desc:0 "凡尔赛的账单仍在，但共和国的手正在一点点收回经济的主导权。每一项落实下来的改革都会在这里留下痕迹——消费品、产出、科研、建造，积少成多。"
 GER_1920_ambitious_plan:0 "雄心勃勃的经济计划"
 GER_1920_ambitious_plan_desc:0 "埃尔茨贝格的财政改革以空前的规模推进：中央集权的财税体制、新的税种、对高收入阶层的重税。计划进行期间：政治点数获取§Y+15%§!，生活消费品工厂系数§Y-10%§!，生产效率上限§Y+5%§!，生产效率增长§Y+5%§!。计划结束后，一部分改革成果将沉淀为长期制度——「经济刚性」。"
 GER_1920_reshape_german_economy:0 "重塑德国经济"
 GER_1920_reshape_german_economy_desc:0 "整理经济工作是一场大刀阔斧的重组，短期阵痛难以避免（稳定度§R-10%§!），但生活消费品工厂系数§Y-15%§!、工厂产出§Y+15%§!、科研速度§Y+10%§!、建造速度§Y+10%§!。这一精神失效后，「经济重建成效」将追加生活消费品工厂系数§Y-15%§!。"
 GER_1920_economic_rigidity:0 "经济刚性"
 GER_1920_economic_rigidity_desc:0 "雄心勃勃的计划最终沉淀为一套刚性的制度：生活消费品工厂系数§Y-10%§!。"
 GER_1920_economic_rigidity_plus:0 "经济刚性"
 GER_1920_economic_rigidity_plus_desc:0 "雄心勃勃的计划最终沉淀为一套刚性的制度：生活消费品工厂系数§Y-10%§!。「税收征管权上收」使其追加工厂产出§Y+5%§!。"
 GER_1920_tax_unification:0 "税收统一化"
 GER_1920_tax_unification_desc:0 "全国统一税制：直接税、间接税与财产税统一由帝国征收，累进税率与预扣所得税一并落地。行政成本随之上升：每日政治点数§R-0.06§!；统一的税则也减少了市场的摩擦：生活消费品工厂系数§Y-5%§!、用于生产生活消费品的期望工厂数量§Y-5%§!。"
 GER_1920_tax_unification_plus:0 "税收统一化"
 GER_1920_tax_unification_plus_desc:0 "全国统一税制：直接税、间接税与财产税统一由帝国征收，累进税率与预扣所得税一并落地。行政成本随之上升：每日政治点数§R-0.06§!；统一的税则也减少了市场的摩擦：生活消费品工厂系数§Y-5%§!、用于生产生活消费品的期望工厂数量§Y-5%§!。税收征管权上收后，追加生产效率保持§Y+5%§!。"
 GER_1920_soc_commission_work_idea:0 "减缓阵痛的努力"
 GER_1920_soc_commission_work_idea_desc:0 "考茨基的委员会正以温和、渐进的方式推进社会化，尽量不损害经济运转。任务期间：稳定度§Y+5%§!、建设速度§Y+5%§!，并为协调工作占用§Y10§! 座民用工厂。"
 GER_1920_econ_dept_standardization_idea:0 "筛选工作"
 GER_1920_econ_dept_standardization_idea_desc:0 "议会让经济管理部门按照统一标准重新整编，筛选出可用的流程与人员。期间行政与转型的成本由社会承担：生活消费品工厂系数§R+10%§!。"
 GER_1920_emergency_tax_policy:0 "紧急收税策略"
 GER_1920_emergency_tax_policy_desc:0 "针对大资产阶级、土地所有者与资本家的一次性重税。资金涌入国库，但社会为之震动：稳定度§R-10%§!、战争支持度§R-15%§!、生活消费品工厂系数§R-20%§!；每月人口§Y+70%§!、动员速度§Y+65%§!、工厂产出§Y+5%§!。"
