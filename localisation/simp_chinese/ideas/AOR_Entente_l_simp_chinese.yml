l_simp_chinese:
 AOR_Entente_no_war_tt:0 "£trigger_no 可以加入战争\n£trigger_no 可以召唤盟友"
 AOR_Entente_no_war:0 "分裂的赢家们"
 AOR_Enchante_cannot_call_ally:0 "你不能召唤盟友或加入盟友的战争，因为民族精神§Y分裂的赢家们§!。"
 AOR_Entente_no_war_desc:0 "从1918年9月20日协约国各国以赢家的姿态参加巴黎和会和伦敦会议瓜分败家起，协约国各国之间脆弱的信任便被利益分配问题摧毁殆尽。如今这个星球上最大的军事集团虽然依旧存在着，但在以英国法国为首的内部分裂趋向的炙烤下，令人生畏的协约国集团早已名存实亡。无论是否拿到自己的蛋糕，给别国自讨的战争出兵？别傻了，没有赢家会这么干。"

 # ===== 凡尔赛赔款：协约国分得的德国赔款（德国国策「脊梁断裂」给予）=====
 AOR_GER_versailles_reparations_entente:0 "大战赔款"
 AOR_GER_versailles_reparations_entente_desc:0 "来自德国的赔款正帮助我们从世界大战的阴影中恢复过来。柏林的赔款、船队与工业品源源不断地送进协约国的仓库——生活消费品供应宽松了，建设与科研的机器重新转了起来。"
 AOR_GER_versailles_reparations_usa:0 "大战赔款"
 AOR_GER_versailles_reparations_usa_desc:0 "来自德国的赔款正帮助我们从世界大战的阴影中恢复过来。我们没在欧洲流血，却照样分到了那张写满数字的账单里最厚的一叠——资本、船队与市场，都是我们应得的那份。"
 AOR_GER_versailles_reparations_civilian:0 "赔款份额：民用工厂"
 AOR_GER_versailles_reparations_civilian_desc:0 "按和约，德国以实物偿付赔款：机车、船舶、煤炭，以及一整批民用工厂的产能。它们正在我们的土地上重新开动，民用工厂的建设与扩张也随之加快。"
 AOR_GER_versailles_reparations_military:0 "赔款份额：军用工厂"
 AOR_GER_versailles_reparations_military_desc:0 "按和约，德国交出的不只是钱：机床、图纸与军工产能被拆解运走，其中一份落进了我们的军械库，军用工厂的扩建因此快人一步。"