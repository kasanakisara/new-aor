l_simp_chinese:
 NAN.100.t:0 "南京政府接管满洲"
 NAN.100.d:0 "南京政府已控制满洲的主要地区，宣布接管当地行政并推进整合。"
 NAN.100.a:0 "巩固新的秩序。"
 YUG.100.t:0 "大南斯拉夫的成立"
 YUG.100.d:0 "克罗地亚地区已被纳入统一的国家体系，贝尔格莱德宣布成立大南斯拉夫。"
 YUG.100.a:0 "共同国家的新篇章。"
 CGT.6.t:0 "农民组织失去主要据点"
 CGT.6.d:0 "主要据点失守后，农民组织的残余力量将由胜利一方接收。"
 CGT.6.a:0 "结束这一阶段的纷争。"
 MNU.9.t:0 "农民军击败临时政府"
 MNU.9.d:0 "临时政府失去了主要城市的控制，农民武装开始重组墨西哥的政治秩序。"
 MNU.9.a:0 "召开会议决定下一步。"
