l_simp_chinese:
 AOR_GER_union_competition.5.t:0 "剑拔弩张"
 AOR_GER_union_competition.5.desc:0 ""
 AOR_GER_union_competition.5.a:0 "宣布选举结果。"
 AOR_GER_union_competition.6.t:0 "按部就班"
 AOR_GER_union_competition.6.desc:0 "尽管受到了来自左边的挑战，但前任工会领导人的得力助手、受到工会执行委员会鼎力支持的西奥多·莱帕特仍然成功取得了工会最高领导人的位置。工会的职业干部们松了一口气，而党内的中派、左派对此极其失望，右派则乐于见到这位“实事求是”地支持“脚踏实地”的改良路线的盟友掌握工会。看起来，工会在接下来的革命运动中的角色将不会有什么变化了……"
 AOR_GER_union_competition.6.a:0 "还是安稳点好。"
 AOR_GER_union_competition.6.result_tt:0 "最终，§Y右派路线§!取得了在工会的胜利，这或许会在接下来的党内冲突中为右派带来巨大优势。"
 AOR_GER_union_competition.7.t:0 "激进转向"
 AOR_GER_union_competition.7.desc:0 "在社会各界的密切关注下，法兰克福代表大会落下了帷幕。最终，代表中派的资深工会工作者，同时也是西南党部重要领导人的罗伯特·迪斯曼获得了胜利。他宣布，工会将采取更加激进的立场，并努力将工厂委员会纳入工会体系之中，以更好地扩展工会的职能范围，加强工会在革命运动中的独立作用。社会民主党党内对他的胜利表示意料之中，尽管党内左派和右派对其立场有不同角度的批评，然而有着工会与党双重根基的迪斯曼仍然得到了社会主义阵营的广泛支持。据传，各个企业家组织正在召开会议，商讨这一工会激进转向的对策。"
 AOR_GER_union_competition.7.a:0 "也行吧。"
 AOR_GER_union_competition.7.result_tt:0 "最终，§Y中派路线§!取得了在工会的胜利，这或许会在接下来的党内冲突中为中派、左派带来一定优势。"
 AOR_GER_union_competition.8.t:0 "革命工长"
 AOR_GER_union_competition.8.desc:0 "令人震惊的消息从法兰克福代表大会上传来：著名的工会激进派领导人、大柏林工人士兵苏维埃执行委员会主席、柏林革命工长组织领袖、金属工会主席里夏德·米勒当选为工会新一届的领导人。这堪称一枚投向社会主义阵营乃至全国的重磅炸弹。尽管里夏德·米勒的行事风格低调踏实，也并不倾向于高调的作秀，但其就职演说上的激进言辞引发了广泛争议。党内右派痛骂这是政治自杀式的疯言疯语，党内左派则为“自己的人”取得胜利而欢呼。而德国的企业家们已经开始做政治动员，宣称要正面迎战这位激进疯子。"
 AOR_GER_union_competition.8.a:0 "看看资产阶级发抖的样子！"
 AOR_GER_union_competition.8.result_tt:0 "最终，§Y左派路线§!取得了在工会的胜利，这或许会在接下来的党内冲突中为左派带来巨大优势。"
 GER_SPD_ADGB_modifier:0 "德国工会总联合会"
 GER_SPD_ADGB_modifier_desc:0 "法兰克福代表大会确立了德国工会总联合会的领导层与路线。大会通过的各项改革将共同决定工会在革命运动中的作用。"
