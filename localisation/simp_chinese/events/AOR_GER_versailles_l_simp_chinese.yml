 AOR_GER_versailles.2.t:0 "新年快乐"
 AOR_GER_versailles.2.d:0 ""
 AOR_GER_versailles.2.a:0 ""
 AOR_GER_versailles.2.tt:0 "§g我们将对条约提出异议，尝试修改有关战争责任、领土割让、赔款义务与军事限制的条款。§!"

 #-------------------------------------------------- 事件3：拒绝与命运的二十四小时
 AOR_GER_versailles.3.t:0 "拒绝与命运的二十四小时"
 AOR_GER_versailles.3.d:0 ""
