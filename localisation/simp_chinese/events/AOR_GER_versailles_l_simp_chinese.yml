 #-------------------------------------------------- 新闻：德国签署凡尔赛条约
 AOR_GER_versailles.5.t:0 "德国签署凡尔赛条约"
 AOR_GER_versailles.5.d:0 "一九二〇年一月十八日，凡尔赛宫镜厅。\n\n四十九年前的同一天、同一个大厅里，威廉一世加冕为德意志皇帝；今天，德意志共和国的代表在同一面镜子下签下了《凡尔赛条约》。\n\n条约全文逾四百条：德国承担全部战争罪责，交出阿尔萨斯-洛林与全部海外殖民地，军队被限制在十万人以内，禁止拥有空军与潜艇，莱茵兰被划为非军事区并由协约国占领，此外还有一张数额惊人的赔款账单——没有任何一位德国政治家能说清它需要几代人来偿还。\n\n签字大厅里没有掌声。走出宫门时，一位德国记者只写下了这样一句：帝国在这里加冕，共和国在这里受审。"
 AOR_GER_versailles.5.a:0 "历史的判决。"

 #-------------------------------------------------- 事件6：条约开始执行 · 石勒苏益格移交国联托管 *1920.2.10
 AOR_GER_versailles.6.t:0 "条约开始执行"
 AOR_GER_versailles.6.d:0 "一九二〇年二月十日。国际联盟的首次会议刚刚落幕，第一份针对德意志的裁决书就送到了威廉街：石勒苏益格——北区与中区，一并划为国际联盟特别托管区。\n\n按照《凡尔赛条约》第107至114款，这片自一八六四年普丹战争后并入普鲁士的土地，其归属将由当地居民分区投票决定。在此之前，它既不属于德意志，也不属于丹麦：它将悬挂国际联盟的旗帜，由协约国任命的专员管理，英法两国共同保证其安全。\n\n柏林的报纸在头版印出了一张地图：日德兰半岛的根部被一条虚线切开，虚线的南侧写着“托管区”三个字。外交部里有人说，这总比直接割让要好——至少还留下了投票的机会；也有人说，这恰恰是最坏的地方：我们连抗议的对象都找不到，因为托管区不是一个国家，它只是一张办公桌。\n\n同一天，弗伦斯堡的市政厅摘下了普鲁士的黑鹰，换上了一面谁也说不上来历的白旗。分区公投将在半年之后举行——在那之前，这两块土地上发生的事情，柏林说了不算。"
 AOR_GER_versailles.6.a:0 "接受托管安排，等待公投。"
 AOR_GER_versailles.6.b:0 "向国际联盟提出正式抗议。"
