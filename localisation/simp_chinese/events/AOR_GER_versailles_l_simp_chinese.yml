l_simp_chinese:
 ####################################################################
 # 德国 · 凡尔赛条约事件链（1919.12.10 - 1920.1.18）
 # 世界观口径：1919.8—1922.7 的德意志共和国（社民党＋中央党，倍倍尔/哈泽）
 ####################################################################

 #-------------------------------------------------- 事件1：巴黎来电
 AOR_GER_versailles.1.t:0 "巴黎来电"
 AOR_GER_versailles.1.d:0 "一九一九年十二月十日，柏林，凌晨。\n\n电报机响了三次。第一封来自巴黎：和会已准备好接待德意志代表团——但接待的前提是，德国人前来接受一份已经拟好的和约，而不是来谈判的。第二封来自外交部：兰曹伯爵将率团前往。第三封来自兰曹本人，他请求带上全部法律顾问、统计学家与语言专家，理由是——“我们即将面对的不是一张谈判桌，而是一份判决书。”\n\n国会里没有人为此鼓掌。有人提醒总统，把代表团送进凡尔赛宫，等于把共和国送上一次公开的审判；也有人提醒他，不去，就等着莱茵河对岸的炮声。\n\n倍倍尔在文件上签下名字，只说了一句话：“让他们去。剩下的交给历史。”"
 AOR_GER_versailles.1.a:0 "让兰曹去说话。"
 AOR_GER_versailles.1.tt:0 "德意志代表团启程前往凡尔赛：政治点数 §R-10§!，事件链「凡尔赛条约」开始。"

 #-------------------------------------------------- 事件2：新年快乐
 AOR_GER_versailles.2.t:0 "新年快乐"
 AOR_GER_versailles.2.d:0 "一九一九年最后一天，凡尔赛宫。\n\n协约国竭力对德方保密条约内容，可铺天盖地的记者早已把草案泄露得七七八八：莱茵兰将被占领，阿尔萨斯-洛林与萨尔交割，全部海外殖民地放弃，军队压缩到十万人，还要在“战争罪责”的名义下签下一张看不到尽头的赔款单。每一个字都在羞辱这个刚刚从战败里爬起来的共和国。\n\n会议开始，米勒兰致开幕词后，秘书把厚厚一叠条约草案交到兰曹手中。他没有打开——而是直接开始了演讲。\n\n兰曹理应站起来讲话。但他死死坐在座位上。据同行的人说，这个可怜人激动得身体无法站起；他想站起来，膝头抖得厉害，终究没能做到。真正的原因或许只是怯场——他紧张，坐着可以壮胆。\n\n可无论如何，这一天成了德意志的民族英雄诞生的日子：因为他坐着，和法国人说话。"
 AOR_GER_versailles.2.a:0 "把这份草案称作“和平”，是对语言的侮辱。"

 #-------------------------------------------------- 事件3：拒绝与命运的二十四小时
 AOR_GER_versailles.3.t:0 "拒绝与命运的二十四小时"
 AOR_GER_versailles.3.d:0 "一九二〇年一月二日。\n\n法国方面立即以最后通牒式的措辞答复：讨论的时间已经过去，协约国不会接受任何形式的修改，德国必须明确答复——接受，或者拒绝。期限不到二十四小时，这是不容误解的。若拒绝，协约国军队将跨过莱茵河，战争继续。\n\n国会紧急召集。既有的议程被全部取消，一次为期一天的投票被推到所有人面前。社会民主党与中央党的多数议员投下赞成票，民主党至少部分赞成，其余党派一概反对；两个执政党中亦有人弃权。票数够了。\n\n群情激愤，人怨不可遏——然而，然而。"
 AOR_GER_versailles.3.a:0 "投票。"
 AOR_GER_versailles.3.b:0 "否决它，号召全国抵抗。"
 AOR_GER_versailles.3.tt:0 "国民议会以绝对多数接受了协约国的最后通牒：稳定度 §R-3%§!，政治点数 §R-25§!。"

 #-------------------------------------------------- 事件4：屈辱条约
 AOR_GER_versailles.4.t:0 "屈辱条约"
 AOR_GER_versailles.4.d:0 "一九二〇年一月三日。\n\n消息传开的当天，德国境内就烧了起来。军国主义者开始砸毁本应交给协约国的战舰，左翼则当街焚烧法国的三色旗；军方公开表态：如果共和国签署这份条约，国防军将不再保卫它。政府内部，兰曹、谢德曼与诺斯克相继辞职。\n\n国民议会的会议上，群情激昂，各方都以最强烈的措辞谴责协约国的要求。但每个人都清楚，这不会改变命运。\n\n雨果·哈泽做了最后的演讲。他对中左派说：不签署，等待德国的一定是毁灭，对共和国而言，和平是必不可少的；随后他转向左派，又说：世界革命正在进行，它终将使这份条约变成一张废纸。\n\n在期限到期前八十分钟，国民议会以绝对多数通过了条约。共和国向米勒兰递交了那封电报——上面写着德国无条件屈服。"
 AOR_GER_versailles.4.a:0 "签字。"

 #-------------------------------------------------- 新闻：德国签署凡尔赛条约
 AOR_GER_versailles.5.t:0 "德国签署凡尔赛条约"
 AOR_GER_versailles.5.d:0 "一九二〇年一月十八日，凡尔赛宫镜厅。\n\n四十九年前的同一天、同一个大厅里，威廉一世加冕为德意志皇帝；今天，德意志共和国的代表在同一面镜子下签下了《凡尔赛条约》。\n\n条约全文逾四百条：德国承担全部战争罪责，交出阿尔萨斯-洛林与全部海外殖民地，军队被限制在十万人以内，禁止拥有空军与潜艇，莱茵兰被划为非军事区并由协约国占领，此外还有一张数额惊人的赔款账单——没有任何一位德国政治家能说清它需要几代人来偿还。\n\n签字大厅里没有掌声。走出宫门时，一位德国记者只写下了这样一句：帝国在这里加冕，共和国在这里受审。"
 AOR_GER_versailles.5.a:0 "历史的判决。"
