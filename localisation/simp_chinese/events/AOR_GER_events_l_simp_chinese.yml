 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●
 # 魏玛代表大会
 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●● 
 
 AOR_GER_weimar_congress.1.t:0 "魏玛代表大会开幕"
 AOR_GER_weimar_congress.1.d:0 "会议记录\n第一日会议\n下午四时\n\n埃米尔·普罗茨：尊敬的女同志们、男同志们！在进入会场之前，首先迎接诸位的是那一对青铜铸成的文坛双璧：一位是《浮士德》的创造者，带着世界主义的开明气度，神情从容；另一位是《威廉·退尔》的诗人，面容棱角分明，目光投向未来。这些魏玛的伟人、这些古典作家的独特精神气质，人们称之为“魏玛精神......但是，作为一个工人，我不能加入那些资产阶级政治家和文人的赞歌。他们认为，只要德国民族彻底浸润在这种魏玛精神之中，我们便会获得拯救。不！在我看来，这种纯粹的魏玛观念缺乏对伟大阶级斗争的清楚认识......因此，我们必须对这种魏玛精神作出必要的补充——只能是另一种思想潮流：我们的卡尔·马克思......这是魏玛同志们对诸位工作的期望。最后，请允许我再次向诸位表示衷心的欢迎！（掌声。）\n\n奥古斯特·倍倍尔：同志们！（掌声。）我受党执行委员会委托，向代表大会致意。今天，我们要打破一次传统——不会有歌会了！（赞同。）我们没有时间了。这符合时代的精神：时代向我们提出的要求，只有工作......上一次我们在维尔茨堡相聚时，大家都知道，我们正在走向一个无法预料的未来。可当时没有人料到，我们在德国实现了共和国。（“完全正确！”）我们实现了千百万人几十年来渴望的目标。我们争取到了所有公民的平等权利......当时，二十二个王朝在三天之内消失了，仿佛它们不过是一些灰泥塑像，仿佛它们并不曾在几个世纪里一直成为德国广大人民群众的祸害。如果今天有一位歌德或席勒的继承者，想要写出那些日子的戏剧，那么他恐怕很难在君主们中间找到英雄。（大笑。）尽管那些自由派历史歪曲者竭力否认，我们仍然要说：1919年4月的那个星期，将在德国人民的历史上占据光荣的位置......最近几周，各种对立重新显露出来。那些阴影中的家伙们，如果他们如今又渐渐探出头来，我们就必须告诉他们：一个时代已经过去了！\n\n（插话：“诺斯克！”笑声。）\n\n我正要谈到诺斯克......"
 AOR_GER_weimar_congress.1.a:0 "让我们开始吧。"

 AOR_GER_weimar_congress.2.t:0 "魏玛代表大会（二）：左派的反击"
 AOR_GER_weimar_congress.2.d:0 "（待写文案）左派全面反击，党改革动议被提出。\n要点：李卜克内西痛斥右派 → 卢森堡清算拖延武装、拖延社会化、轻视苏维埃，主张对策略／组织／理论作改革 → 雷德布尔把方向之争推迟到 1920 年波鸿代表大会 → 会议结束。"
 AOR_GER_weimar_congress.2.a:0 "党真的变了。"

 AOR_GER_weimar_congress.3.t:0 "领袖的背影"
 AOR_GER_weimar_congress.3.d:0 "（待写文案）大会结束后倍倍尔独自回到居所。\n要点：无力感与陌生感 → “现在还没到认输的时刻” → 出门去找考茨基。"
 AOR_GER_weimar_congress.3.a:0 "而工人的皇帝则走出了门外。"

