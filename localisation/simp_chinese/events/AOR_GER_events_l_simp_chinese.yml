 #-------------------------------------------------- 事件1：巴黎来电
 AOR_GER_versailles.1.t:0 "葡萄酒与香烟"
 AOR_GER_versailles.1.d:0 "“先生，你的工作一定很忙。伯爵最近总是吸个不停。”\n“是的，呃……抱歉！他又把我拿出来了。好，伯爵，吸一口。是的，我是有点忙，忙到把你刚刚说的话都忘得一干二净了！刚才那句话，你可以再说一遍。等等……抱歉！”\n“我只是想问问，伯爵是不是准备出门了。他从昨天起就没怎么碰过我。”\n“去法国，亲爱的。他们要他去法国……抱歉！你应当听听他刚才的口气，仿佛有人请他去坐牢。呃……抱歉！他又开始吸了，你知道的。”\n“这不打紧，先生。伯爵要在那里待多久？”\n“他们没有说，至少我没有听见。他昨天才说不去，可现在看来定是要去了。你若还想同他说点什么，最好趁现在，等到了法国，他身边可就未必有你的地方了。”\n葡萄酒正欲开口，乌尔里希·兰曹伯爵忽然放下手中的烟，将她一饮而尽。"
 AOR_GER_versailles.1.a:0 "拜托了，酒壮怂人胆。"

