 AOR_GER_bernstein.1.t:0 "社会主义的第三条道路？"
 AOR_GER_bernstein.1.desc:0 "天才伯恩斯坦，叛徒伯恩斯坦，伯恩斯坦，他究竟何许人也？\n\n他是柏林犹太家庭出身的银行职员，是德国社会民主党人，是恩格斯的得力助手，也是修正主义之父。反社会党人非常法持续期间，他流亡苏黎世，执掌《社会民主党人报》，宣传马克思主义；在被瑞士驱逐后，他又转赴伦敦，在费边社圈子里重新审视资本主义与民主。\n\n恩格斯逝世后，他随即在《新时代》提出资本主义仍有生命力的论断，并借“回到康德去”都口号强调伦理道德。而在斯图加特党大会上，他抛出的“运动就是一切，最终目的是微不足道的”定论引爆了大会。\n\n随着伯恩施坦接二连三提出堪称离经叛道的学说，党内争论随之而起。考茨基、卢森堡等人接连撰文，对他展开严厉批判。但倍倍尔为维护党内团结，只是略加弹压，使他的影响局限于自己的小圈子。可伯恩施坦依旧我行我素，追求着他设想中的新社会。\n\n总而言之，他绝非可耻的犹大，但也绝非无害的先知，他是伯恩斯坦，是目前社会民主党内部最具争议的转向者。\n\n回顾过往，德国似乎正按照着他的预言前进：魏玛的议会里，社会民主党手握过半数的支持，改良不再是为了妥协，而成了执政的日常；资本主义没有崩溃，中产没有消失...\n\n而在这样的时刻，让这位修正主义之父重新发声——"
 AOR_GER_bernstein.1.a:0 "倍倍尔是何用心？"
 AOR_GER_bernstein.1.tt_tarot:0 "［命运之轮］可以被抽取了———他代表着改变、周期与机遇"
 AOR_GER_bernstein.1.tt_warn:0 "§R命运本身无法被预测，倍倍尔并不知道此举会带来怎样的后果§!"

