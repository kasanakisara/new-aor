l_simp_chinese:
 AOR_GER_flavor.1.t:0 "真是酷毙了"
 AOR_GER_flavor.1.desc:0 "那年春天，我在柏林一家咖啡馆里第一次听见“knorke”（酷毙了）这个词。年轻人很喜欢把它挂在嘴边：火车晚点可以说，姑娘戴了一顶新帽子可以说，甚至有人失手摔碎了啤酒杯，低头看看满地玻璃，也会说一声。我把这事告诉一位年轻议员，他笑得差点把香肠掉进芥末里，随后告诉我，他们正打算教倍倍尔这个词。\n\n这听起来未免有些奇怪。奥古斯特·倍倍尔当时已经是共和国总统。老先生一向声称自己对年轻人的生活颇有兴趣，只可惜兴趣与理解之间，着实隔着相当长的距离。据说倍倍尔听完解释后，煞有介事地点了点头，拿起桌上的铅笔，在纸上认真记下了这个词。\n\n第二天，他便在内阁会议上试了一次。当时艾伯特正在作关于铁路预算的报告。倍倍尔听完，沉默了片刻，然后十分郑重地说：\n“真是酷毙了。”"
 AOR_GER_flavor.1.a:0 "——会议室里一片寂静，随即哄堂大笑。"
 AOR_GER_focus_1919.1.t:0 "埃森警察局报告节录"
 AOR_GER_focus_1919.1.desc:0 "据本局所属阿尔滕埃森、博尔贝克及弗罗恩豪森分局报告，当地学校及工人住宅区儿童中广泛传唱一首有关贵族财产处置的歌谣。该歌谣最初出现地点无法确定。各区所录歌词略有差异，但旋律及主要词句基本一致。目前未发现印刷品，亦无证据表明存在统一组织或专人教授。学校教师报告称，部分儿童已能完整背唱，且近来在埃森其他城区亦有发现。\n\n现将各分局记录中最常见之版本附录如下：\n\n一、二、三，（Eins, zwei, drei,）\n宫殿空出来。（das Schloß ist frei.）\n四、五、六，（Vier, fünf, sechs,）\n王子什么也没有。（der Prinz kriegt nix.）\n七、八，（Sieben, acht,）\n木柴送回家。（Holz wird heimgebracht.）\n九、十，（Neun und zehn,）\n我们要进宫殿去！（wir woll’n ins Schlosse geh’n!）\n一个芬尼也不给诸侯，（wir dürfen in den Garten gehn.）\n一个芬尼也不给，不给！（Keinen Pfennig den Fürsten, nein!）\n宫殿、树林还有草地，（Schloß und Wald und Wiesen,）\n都该归我们！ （sollen unser sein!）\n\n据补充报告，该歌谣已在盖尔森基兴、波鸿等地发现相近版本。有关部门认为，无继续追查其来源之必要。"
 AOR_GER_focus_1919.1.a:0 "一个芬尼也不给诸侯！"
 AOR_GER_focus_1919.2.t:0 "诊疗报告"
 AOR_GER_focus_1919.2.desc:0 "日期：[GetDate]\n患者：弗里茨·米勒，男，28岁\n诊断医师：汉斯·韦伯博士\n\n背景：\n患者于索姆河战役中失去左腿，1917年因“炮弹休克”退役。现独居地下室，靠伤残救济金维生。福利局记录其已连续三月未上工，自称“无法忍受工厂噪音”。本次系应福利局要求进行状况复核。\n\n以下为谈话纪要：\n问：您的具体症状？\n答：任何突然的响声都会让我趴下，夜里总梦见战壕。\n问：这些症状是持续性的吗？\n答：是的。\n问：您喝酒吗？\n答：喝一点，不然睡不着。\n问：一点是多少？您是否有酗酒的习惯？\n答：就一两口，帮我麻痹下自己。\n（一段时间的沉默）\n问：那没有工作，您生活资金从哪来？\n答：救济金，有时典当。\n问：那应该是您酗酒的问题。您是否只是害怕工作，而不是噪音？\n答：您不用怀疑我在撒谎。\n问：您是否存在故意夸大症状的行为？要知道，诈骗救济金可是重罪。\n答：我没有！您不信？\n问：您有自杀念头吗？\n答：有过，但没做。\n问：为什么不去？\n（长时间沉默）\n问：我为你感到失望，米勒先生。您知道救济金是给真正无法工作的人吗？\n答：你以为我在骗你吗？该死，我就应该死在战场上。现在，你给我滚出去！\n\n医生建议：\n患者情绪激动，拒绝继续检查，且疑似存在酗酒行为。其自述症状与本次观察不完全一致，工作能力评估依据不足。综合判断，建议停发救济金，转介劳动救济所接受工作评估。"
 AOR_GER_focus_1919.2.a:0 "汉斯·韦伯博士"
 AOR_GER_focus_1919.3.t:0 "生于1907"
 AOR_GER_focus_1919.3.desc:0 "“这个八月会很难熬。”那天，卡廷卡把饭端上桌时，母亲叹了口气。共和国的食物救济刚发下来，饭菜却仍只有几片没有肥肉的香肠、切得细细的萝卜——靠一点稀薄的酱汁勉强拌在一起——以及每人三个土豆。面包倒很适合捏小人，质地就像黏土。\n\n我们坐在饭菜前等待着，几乎像在祈祷。也许我们心里盼着，奇迹能把它变成我们想吃的东西。我麻木地、无精打采地展开餐巾：几个月来，我们几乎天天吃一样的饭。母亲把手放在我的后颈上，近乎怯生生地抚摸我的头发，轻声说：“我也没有办法……也许明天能弄到几个鸡蛋和一点肉……”她哭了。\n\n“可是，妈妈，”我对她撒谎，“我觉得这很好吃。当然，要是能有那些东西会就更好了。”说着，我抓起勺子，舀起那颜色寡淡的萝卜。我大声而倔强地祈祷：“亲爱的主耶稣，请与我们同席，赐福于你赐给我们的食物。”\n\n随后，我们静静地低下头，开始吃饭。卡廷卡把她的土豆让给我，母亲给了我两小片香肠。吃完后，我得躺下来，好让这些食物在身体里发挥点作用。\n\n战争结束了，饥饿却越过前线，侵入民众的生活。它破坏了人与人之间的团结；一家孩子们甚至会偷彼此的口粮。奥古斯特的母亲每天去教堂两次，一边祈祷，一边日渐消瘦；她把自己应得的食物分给奥古斯特和他的兄弟姐妹，只给自己留下最低限度的一点。没过多久，妇女们排成长长的灰色队伍，等在救济站门前。她们谈论孩子挨饿，比谈论丈夫阵亡还要多。\n\n一条新的战线出现了，守在这条战线上的是妇女。她们对抗的是共和国官员和那些不能离开岗位的检查员组成的“协约国”。每弄到一磅黄油，每趁夜色成功带回一袋土豆，家里人都会像从前庆祝军队获胜那样欢欣鼓舞。粮食仓库的管理员、发放面包配给券的市政文书，以及拥有健壮牲畜和良田的农民，都成了有权有势的人物。人们接近他们时，就像过去接近位高权重的富亲戚一样。走进一户农家的厨房，看见大桶里的鲜奶，或看见一块火腿悬在烟囱里熏制，我们便会生出一种敬畏。这和多年前奥古斯特及他的工人阶级伙伴第一次看见中产阶级的客厅或钢琴时的感受一样。"
 AOR_GER_focus_1919.3.a:0 "给我们食物！" 
 AOR_GER_focus_1919.4.t:0 "哑钟"
 AOR_GER_focus_1919.4.desc:0 "果然下雨了，他也回来了。他两鬓灰白，整个人莫名缩小了一圈，身上带着碘酒、肥皂、红十字会和铁路的气味。\n\n一次炮弹爆炸曾把他活埋。可多亏上帝保佑，如今他又回到了故乡，也许再不必离开。身处这个依然完整的城市之中，他反倒茫然不知所措；回到自己的住处，竟叫他麻木。在村子里他像个外人，在平常的一切中显得突兀。他的目光四下探寻，又悄悄溜开，重新回到远方——一个遥远的远方，人们几乎猜不出它的轮廓，更永远看不清它真实的样子。\n\n“大声点。”他解释自己耳朵不大听得见了。他们提高嗓门放声喊，他还是听不懂，简直聋得像根木桩。两天后，他带着一只黑色助听筒出现了，那东西从军服上衣的口袋里伸出长脖子和宽大的喇叭口，古怪得令人吃惊。要是没了这东西，他看起来像变了个人；可倘若把它按到耳边，就更不像原来的他了。亲戚们来看他，兴致勃勃地大喊大叫，拿他的误听当乐子，冲他窃笑。\n\n他每天拄着手杖，一瘸一拐地走去医院，回来时满身药味。街道上到处是回乡的士兵。他们穿着褪色的军服，寻找工作，寻找住处，寻找那些早已搬走或死去的人。他偶尔能认出其中一张面孔，却记不起对方的名字。\n\n夜里，他躺在少年时代的床上。\n\n被子真软。\n\n像我们这样从狭窄的房屋里走出来，在挂着哑钟的军营里度过青春的人，终其一生都将胆怯而卑微。"
 AOR_GER_focus_1919.4.a:0 "我独自一个人了，一个人了，一个人了…"
 AOR_GER_focus_1919.5.t:0 "蛛网"
 AOR_GER_focus_1919.5.desc:0 "特奥多尔在父亲的宅子里长大。他的父亲曾是中士，所以他顺理成章地去穿上了预备役少尉的制服。老爷子在大战的第四个年头去世，临终时颇感欣慰，因为给他送葬的将是特奥多尔·洛泽少尉。\n\n但因为四月革命，一年后特奥多尔就不再是少尉了。他退役，成了法学专业的旁听生。母亲和姐妹开始对他漠不关心，偶尔问起他也带着轻蔑。他们不能原谅特奥多尔没有尽自己的义务。他本该战死沙场。假如已然亡故，他就能得到尊敬;因为尚在人世，他就会被人轻视。\n\n假如沉默的敌意没有像墙壁一样阻隔他和家人，或许还能让人好受些。他原本可以对姐妹说:他的不幸不是自己造成的;他诅咒革命;他越来越憎恨社会主义者和犹太人;他觉得每天都像是折磨人的重担，压在弯曲的脊梁上;他觉得生活周而复始，如同陷入了暗无天日的地牢。看不到出路，也无法抱怨。\n\n他一直紧张地做着准备，却又反复发现准备地不够充分。通过十倍的努力，他成了学校里排名第二的优等生，而第一名是犹太人格拉塞尔。平民的生活与军人不同，残酷阴险、心机幽深。想努力也没有方向，只能为了渺茫的目标费劲，就像不停地建造空中楼阁，一阵神秘的风就能把它吹垮。努力没有结果，勤奋没有回报。他看不出长官的心情，猜不透长官的愿望。所有人都是他的长官，街上的所有行人，教室里的同学，连母亲和姐妹都是他的长官。只有在军队里他才感到幸福。别人说什么他都必须相信。别人也必须相信他说的话。特奥多尔情愿一辈子当兵。\n\n在法学讨论课上，犹太人总是举手发言，引出让特奥多尔不知所措的新话题，逼得他要痛苦而卖力地不断学习。犹太人摧毁了军队，把持了国家，发明了社会主义，搞出了叛国投敌思想。这些都写在《锡安长老会纪要》里，所有周五去领豆子的预备役军官联合会成员都拿到了这本书，它说犹太人要统治世界。他们控制警察，监视爱国主义组织，大家必须教导自己的孩子低三下四地仰仗犹太人生活。\n\n噢，大家都觉得他无足轻重、没法构成威胁?等着瞧吧。让所有人等着瞧吧！他很快就会走出不起眼的角落，成为赢家，不再过周而复始的日子，甩开生活的重负。"
 AOR_GER_focus_1919.5.a:0 "地平线某
 处响起了嘹亮的军号声。"
 AOR_GER_focus_1919.6.t:0 "无汽之笛"
 AOR_GER_focus_1919.6.desc:0 "火车依旧摇晃着行驶在老旧的铁道上，掠过周围或好或坏的风景。对它来说，铁道永无尽头，哪怕是到站时的停留，也不过是暂时的。路程是无限长的，并会不断延伸。它去过莱茵兰，见识过工厂与煤烟构成的世界，也去过洛林根，行驶在焦黑的土地上；它载过满车厢的人，也拉过满货仓的枪械。但去过的地方、承载的人和物，乃至于车厢，对它而言并不重要。它的使命是永恒地行驶在不会终结的路途上，仅此而已。\n\n于是，它永不疲惫的身躯驶过了一个个时代，从俾斯麦到威廉二世，从帝国到共和国。它所残留的，只有行驶时的轰鸣与到站时的汽笛声，世代不息，从来如此。于是它又到了站，车轮的转速逐渐放慢，汽笛发出了同千百次一样的声响。\n\n车站是堪称破败的，共和国的标语歪歪扭扭，依稀可见对铁路工人的承诺，而旧帝国的标记却并未消失。几张泛黄的海报顺着风有一搭没一搭地拍着墙，显露出动员的画面。火车并不在乎这些。它不是狂热的中产阶级，信任征兵的诳语；也不是富有激情的无产者，为时刻进行的斗争献身。只要停站时间过去，它仍会继续向前。\n\n但这次似乎不一样，火车驶进了一个从来没有到过的地方。司机在离开之前多回头看了两眼，然后又突然像认命一样咒骂起来。在以后的岁月里，汽笛再也没有响起，那永不完结的使命，也在此画上了句号。\n\n“我们需要最基础的交通运输，弗兰茨。”\n\n“我知道，但是我们燃料不够，这就是现实。”"
 AOR_GER_focus_1919.6.a:0 "一切归于沉寂。"
 AOR_GER_focus_1919.7.t:0 "瞧！终生护民"
 AOR_GER_focus_1919.7.desc:0 "“就在我们的肩膀上，朋友们…共和国的担子正压在我们身上！”一名瘦弱的学生在汹涌的人潮簇拥下站在由旧汽油桶和旧轮胎堆起的高台上，手中的眼镜因为挥动而不断颤抖。“这是政府的寄生虫！这就是我们贫穷的原因！失业！就是这样，他们将我们扔在街上自生自灭，而好让自己享受皇帝的水晶杯！”人群爆发出山呼海啸的震荡，几乎要将贫穷和饥饿所带来的痛苦通过音浪排出。\n\n在人潮的另一头，他们拿着砖头，扳手和碎石向路口的盾墙掷去。汉斯是失业大军中的一员。在战前，他曾是模范工人和一位党员，但如今，他已经无法再回到自己的工厂，除非他愿意和废墟共事。他在战争中失去了一切，却不能在战后获得每天的少量食物救济哪怕一点点食物。他无数次低声下气去寻求当地政府实践层承诺的行动和补贴，得到的却是一次次敷衍的“无能为力”，而最终，汉斯眼睁睁看着自己的家人们一个个因为这样的“无能为力”而双眼发直地倒在床上。\n\n“把我的一切还回来！”汉斯看着碎砖块在一名年轻警察的头上开了瓢，心中突然感到一阵莫名的畅快。也许是因为警察即将领到的工资，也许是因为他胸前闪亮的党徽，总之，汉斯对他一直看不顺眼。而这一感觉直到他看到警察向队友嘴里喂了一颗糖果后达到顶峰。他大步往前冲去，挤过人群，不顾一切的开始冲砸。\n\n“凭什么你们这些政府的走狗连糖都有！糖！你知道如果当年哪怕有一颗糖果，我的女儿都不会死吗？你知道吗？”他开始声嘶力竭地大吼，将手上的砖块用力拍在盾牌上，发出渗人的刮擦声。几个警察推着盾，将他推倒在地。\n\n汉斯想要站起来接着质问。他想要找回自己的工作，家人，找回战前的时候。但长期的饥饿和激烈运动让他此时已经没有力气再站起来。他听见周围的人不断挤压盾墙，“寄生虫”“背叛者”的叫骂声不绝于耳。他张嘴，却只有嘶哑的喊声和嗓子里猩甜的味道。身边街灯上挂着的倍倍尔画像不知道被谁一脚踹飞，倍倍尔铁框的画像顺着街道砸到了他的手边。汉斯盯着这个他曾经信任的样貌，大笑出声，随后是更加疯狂的狂笑。\n\n随后，他轻轻拾起这位共产主义领导者的画像，用尽全力对准盾墙后面露出的可恶脑袋扔出。随着又一抹鲜血喷溅，汉斯倒在地上嘶哑地呐喊——"
 AOR_GER_focus_1919.7.a:0 "“赤匪们，尝尝你们要的共产主义铁拳！”"