 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●
 # 第二国际事件链
 # 原文件：AOR_GER_Second_International_l_simp_chinese.yml
 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●

 AOR_GER_Second_International.1.t:0 "柏林会议"
 AOR_GER_Second_International.1.desc:0 "虽然是一场不流血的革命，但是柏林依旧没有从中恢复过来。\n\n普鲁士众议院内的帝国徽记还都在拆除过程中，刚打扫出来的会议室也来不及做更多装饰了。来自世界各国的代表团正在陆续抵达莱比锡大街，人们在众议院门前，争论声几乎没有停过。\n\n卡尔·考茨基还一路都在说话。\n\n“问题首先还是战争责任。”他慢慢向前走着，语气认真得近乎固执，“法国人不会轻易接受德国社会民主党的解释，奥地利人更不会给我们好脸色看。谁都不愿意先承认自己的错误。”\n\n倍倍尔没有看他。“他们总得坐下来谈。”\n\n“谈是一回事，重新建立国际是另一回事。”考茨基忍不住举起双手，在空中胡乱比划着，“一九一四年之后，所有人都开始怀疑，社会主义政党究竟还能不能超越民族国家：无论欧洲的哪个社会主义政党在当年都或多或少支持了战争。还有俄国的问题，布尔什维克认为议会制度已经过时，认为工人政党只需要暴力革命，依靠苏维埃就能统治国家——但这无非就是布朗基主义的那些东西。”\n\n“嗯，你最好别当着他们的人这么说。”倍倍尔随口道。\n\n“我已经写过了。”\n\n“所以他们才讨厌你。”\n\n考茨基像是没听见一样。\n\n今天来到柏林的社会主义者，大致分成三个派别。\n\n最多是那些社会沙文主义者，支持在战争时期与本国政府合作。他们认为社会主义政党首先必须维护国家秩序，阶级斗争不能危及民族共同体。这些人大多来自旧第二国际右派，也包括不少工会官员和议会领袖。\n\n另一部分人则继承了齐美瓦尔德左派的立场。他们认为世界大战已经证明旧社会民主主义彻底失败，议会道路只是对资产阶级的妥协。在他们看来，俄国革命至少真正进行了革命。\n\n至于中间派……这里就有俩。\n\n倍倍尔停下脚步，看了考茨基一眼。“你最好别在开幕式上讲太久。”\n\n考茨基皱了皱眉。“有些事情总得说清楚，不然国际根本无法重建。”\n\n“以后再说。”\n\n两人一同走上台阶，推开了那扇门。"
 AOR_GER_Second_International.1.a:0 "但愿一切顺利。"
 AOR_GER_Second_International.1.tt:0 "§g在柏林会议上，战争责任、布尔什维克政权、米勒兰事件等问题都将被摆上桌面。请注意平衡§C社会沙文主义者§g与§R齐美尔瓦尔德左派§g的声势，否则重组第二国际的计划只能泡汤。当然，即便成功，恐怕也只能惨淡收场：代表们已经吵上天了。§!\n\n§Y德国§!将建立§R社会主义国际§!势力范围。"

 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●
 # 《我的一生》相关事件
 # 原文件：AOR_GER_MyLife_l_simp_chinese.yml
 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●

 AOR_GER_MyLife.1.t:0 "《我的一生》第四卷正式出版"
 AOR_GER_MyLife.1.d:0 "序言\n\n去年，倍倍尔寄给我一封信，信里首先对我当时进行的笔战表示很感兴趣，随后接着说：\n\n“我立了个遗嘱，希望你能同意，即如果我在《我的一生》第四卷完成前竟然去世，那末你可以就已准备好付印的稿子出版。我还要做的不多了，这一卷写到一九一四年就完了。往后可以快些进行了……”\n\n这封信的整个精神表示出，他还希望由他自己来完成他的回忆录，这是他非常关心的事，而他指定我为出版人，只是个预防措施。他虽然抱怨他的“无力工作”，但把这情形描写为“意欲进攻却在斗争面前被吓回来的怪现象”。他因无力战斗而悲悯，他把无力战斗同无力工作同等看待。战斗和工作在他有同样意义。\n\n“你所写的关于《柏林自由报》上的声明和攻击的事，我不知道，或者同许多其他事件一样，我全忘记了。我忘记了多少东西，我研究第四卷的有关文件时每天都体会到了。”\n\n这是倍倍尔关于他的回忆录第四卷最后告诉我的话。两个星期后，他就逝世了，离开了每个工作、每个斗争。他死在了保卫社会主义宪法的道路上——这是永别的无限悲痛中的唯一安慰，这种悲痛使我们每个人感到抑郁，即使是没有幸运同倍倍尔本人作朋友的人；只要是关心我们伟大事业因倍倍尔的死亡而失去了它最有力的和最忠诚的先锋战士的人，都有这种感觉。\n\n倍倍尔遗留下来的写作材料一到我的手里，我立即开始执行我的亡友的遗嘱。\n\n我的工作，如倍倍尔所已指出，是不大的。但是它所给我的享受却大得多，单就它允许我重温一道意味着我们党的英雄时代的那些时期来说，这享受就已经很大了。凡是能够参与那时期党的工作的人，在记忆它时，没有不感到自豪的。而年轻的一代可以从那些胜利的艰苦的考验的回忆中为他们面前的伟大斗争吸取勇气和力量。因为最艰苦的事情还在我们面前：夺取政权。\n\n倍倍尔想在这个斗争中作我们的前导这个最热烈的希望不能实现了。但是我们伟大的先驱者的不朽的东西，继续生存在我们中间并将引导我们走向胜利和凯旋！"
 AOR_GER_MyLife.1.a:0 "£KK_signature"
 AOR_GER_MyLife.1.a.tt:0 "§g卡尔·考茨基§!"

 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●
 # 塔罗牌
