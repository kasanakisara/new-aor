 event_GER.1.t:0"邦联行将就木"
 event_GER.1.d:0"艾伯特总统坐在办公桌前，手中紧握着钢笔，一次次地在纸上签着自己的名字，不断地向各德意志地方发送照会请求，请求他们取消自治。总统府外的警察正在驱赶拉起标语的德意志民族主义者，在邦联中央工作的工作人员在前一天已经收到了被辞退的通知。就在刚刚，秘书向艾伯特告知：“先生，最后一个地方宣布自治”，艾伯特形容沮丧，像被惊吓似的萎靡不振，他眼中无神，缓慢的从嘴里吐出三个字：“知道了”……"
 event_GER.1.a:0"邦联命数已尽"



 news_GER.2.t:0"法军越过莱茵兰"
 news_GER.2.d:0"1923年4月，法国军队越过了莱茵河，在震惊德国人的目光中占领了德国的非军事区莱茵兰。时政家们猜测，法国这个“强盗”多半是因为分赃不均而出此下策——不惜军事占领以掠夺的形式迫使德国人把它们最后一滴血汗榨取出来。此举遭到德国政府强烈反对，德国仅剩的外交官们跑遍了整个世界，但迫于英法的霸权，没有国家敢真正出手相助，仅仅是英国阵营的一些寡民小国们在舆论上谴责法国政府。\n4月4日，德国工人们长久以来积攒的怨气似乎是彻底爆发了，他们走上街头抗议法国人的武装入侵，许多人扬言要么将德国人全部赶走换法国人自己来挖煤种地，要么就滚出莱茵兰。当天下午，激烈的抗议只换来了法国人的暴力镇压，在比特堡市的一次聚集性事件里，法国军队一次性射杀了超过200多人才迫使德国工人停止抗议。\n4月5日，法国人的暴力镇压似乎并没有生效，莱茵兰地区数年来背负凡尔赛条约负担的德国工人们开始以罢工的形式反抗法国人的入侵。甚至发生了暴力冲突，几名法国士兵在巡逻中被不知名的社会团体所击毙，此举只换来了法国军队更加严厉的报复。他们似乎认为，只要撑过了最初的几天，德国人就会屈服于他们庞大的军队，一切都会好起来的。毕竟德国人的经济就是发展得再好，也不过是个残缺的国家。"
 news_GER.2.a:0"要变天了"
 news_GER.3.t:0"物价飞涨、通货膨胀"
 news_GER.3.d:0"4月6日，极为广泛的罢工活动在莱茵兰地区展开，科隆的市井街道一下子看不到人影，仅在售卖生活必需品的商店外挤满了人。而此时的柏林政府正在努力与莱茵兰地区的政府机构展开联系，但由于法国军队的干涉，导致政府人员无法进入莱茵地区。当天下午，总统艾伯特授意德国总理亲自前往莱茵兰，与法国关键人物协商。但法国人坚持要求德国人立即交出赔款并且致歉，意味着希望法国主动让步的想法彻底破灭。\n 4月7日，总统艾伯特走上宣讲台发表演讲，向莱茵兰地区的德意志全体国民承诺会保证他们的粮食需求等生活必需品的供应。然而法国政府本就不是为了细水长流的地区税收而进军莱茵，德国政府此番表态意味着他们态度消极，任由局势进一步恶化。\n 4月8日，由于法国军队进军时并未给占领区的德国人带来面包与牛奶，仅靠自由经济的商品流通难以维持如此广泛的工人罢工，尤其是德国政府消极应对形势下的大罢工。仅在法国人占领莱茵兰一星期后，莱茵地区就爆发了超大规模的罢工、暴乱和抗议活动。许多人胆战心惊地看着商店里售卖的面包从每片数马克上涨至数十马克甚至成百上千马克，直至精明的商人们不再售卖任何货品以对抗惊人的通货膨胀。当天下午，运达的粮食和补给品进入莱茵地区，局势得到缓解，莱茵地区的物价得到暂时压制。柏林政府消极应对法国但是愿意支持莱茵兰地区人民的抗争的举措为其争取到了不少的支持。"
 news_GER.3.a:0"还能买得起面包吗？"
 news_GER.4.t:0"德意志地区的导火索"
 news_GER.4.d:0"次日，柏林向莱茵兰输送小麦和半成品的补给桥梁、铁路被不知名人士炸毁，铁轨被炸得四分五裂，列车直接从断桥处坠入威悉河，想要修复至少需要半个月的时间……就连公路上的临时增加的补给车队也被不明人士袭击，柏林政府统计后发现此次事故一次性就造成了勃兰登堡州半个季度的税收和农产损失。\n “前线”发动罢工的德国工人并未等到后续政府的支持，于是进一步滋生了暴乱。此举无疑激怒了德国政府，当天中午德国总理带着全体内阁宣布辞职，总统艾伯特认为是法兰克福邦国出手阻挠，一份不亚于外交辞令的文书拍在了法兰克福人身上，要求他们交出凶手与从魏玛到科隆的部分铁路的控制权，以保证前线战斗的“德国英雄”不再忍受饥饿与混乱，否则法兰克福就自己承担莱茵地区的财政支出。\n至此，德国政府将外交矛盾和法国的冲突转嫁到法兰克福身上，法兰克福要么交出铁路(土地）、赔偿并道歉，要么与柏林开战。此举会造成一场浩浩荡荡的德意志内战。借此机会，失去了威信的柏林政府将暂时摆脱法国政府的阴影，带着支持自己的邦国抓住这跟“德意志命运垂下的绳索”暴力破局；而法兰克福也有了借口正式挑战柏林的权威，夺取德意志桂冠上的明珠；其他邦国也将被迫在德意志内战中站队或决定“自立为王”。"
 news_GER.4.a:0"德意志命运垂下的绳索降临"

