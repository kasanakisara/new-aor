 AOR_second_international_faction:0 "社会主义国际"

 AOR_GER_union_competition.1.t:0 "列金去世"
 AOR_GER_union_competition.1.desc:0 "原德国工会总委员会领袖卡尔·列金去世。列金去世后，莱帕特等工会执委会的保守派高层试图直接决定继任人选，但未能成功。\n\n在里夏德·米勒和迪斯曼德的强烈要求下，执委会同意按程序召开工会全体大会，选举新任工会领导人，并制定党的章程和策略。"
 AOR_GER_union_competition.1.a:0 "工会也要不安宁了..."
 AOR_GER_union_competition.1.effect_tt:0 "£aor_spd §Y终生护民党§!§L迎来了新情况：§!£aor_union_reform §Y工会改革运动§!§L已经开始。§!"
 AOR_GER_union_competition.2.t:0 "工会中的革命堡垒"
 AOR_GER_union_competition.2.desc:0 "金属工会的基层组织和革命工长们率先推动改革。他们把工厂内部的民主诉求与更广泛的工会运动联系起来，带头发起激进化议程，并争取工会参与革命。"
 AOR_GER_union_competition.2.a:0 "先锋已经行动。"
 AOR_GER_union_competition.3.t:0 "产业工会的争论"
 AOR_GER_union_competition.3.desc:0 "围绕工会的组织形式，代表们展开了激烈辩论。职业工会的支持者强调，各行业的劳动条件与利益诉求各有不同，工会必须保留对这些差异的了解。最终，以职业工会取代产业工会的决议获得了通过。"
 AOR_GER_union_competition.3.a:0 "改革开始了。"
 AOR_GER_union_competition.4.t:0 "革命潮流推进战斗工会改革"
 AOR_GER_union_competition.4.desc:0 "基层工会工人要求采取更加激进的行动。尽管领导层担心卷入过于激烈的革命，来自基层的压力仍促使大会通过战斗工会改革。"
 AOR_GER_union_competition.4.a:0 "工会将采取行动。"

# ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●
# 法兰克福代表大会与工会选举
# ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●
 AOR_GER_union_competition.5.t:0 "魔笛手"
 AOR_GER_union_competition.5.desc:0 "桌椅碰撞的噪音和激烈的辩论组成的声浪让书记员库尔特感到头疼。围坐在圆桌边上的数百位代表已经分裂成三个相互攻讦的派别。他用汗涔涔的手理了理笔记本，略带忧虑地望向讲台。\n\n“…虽然有人会指责此举过于软弱，但我们深知，只有让劳资双方心甘情愿地接受，互惠双赢的新秩序才能降临德意志。卡尔·列金的愿景将会塑造工会总联合会的未来——一个温和，务实，既回首过去，又展望未来的工会。”西奥多·莱帕特始终无法媲美列金的演讲，无论是后者冲击性的肢体语言还是不屈不挠的斗志。尽管如此，莱帕特的演说还是得到了工会执行委员会的一致支持——以及来自中左派代表们象征性的掌声。\n\n“…我们的力量正在凝聚，我们必须要展现出改造旧体制的决心，我们将在共同的斗争中更有效地维护各行各业的利益。但请诸位谨记：真正的阶级斗争需要纪律，而纪律来自工会的专业组织…”罗伯特·迪斯曼极具感染力的说辞同时在左右两派代表中引发了阵阵议论的涟漪，库尔特盯着他标志性的大胡子——此时他正同一名右派代表激烈地争论——这位好斗的领袖会将工会领向何方？\n\n“…答案毋庸置疑：只有破除所谓的资产阶级法权，由工人彻底掌握车间里的权力，团结起来把斗争进行到底，才是工会真正的历史使命。一旦革命的火焰燃起，我们就将毁灭身上的枷锁！”老实说，里夏德·米勒并不擅长演讲，但他表述的内核无疑引燃了左派代表们的热情。库尔特的担忧成为了现实：不同派别的代表陷入了无休止的争吵中，试图将工会引向他们支持的方向。他几乎无法听清他们究竟在辩论什么，一分钟就像一个小时那般漫长。\n\n时间悄悄流逝，库尔特猛然发现一个声音似乎正变得格外清晰，某种力量逐渐掌控了全局，他抬起头，看到…"
 AOR_GER_union_competition.5.a:0 "莱帕特站在讲台上，面带微笑。"
 AOR_GER_union_competition.5.b:0 "迪斯曼站起身，迎接欢呼与掌声。"
 AOR_GER_union_competition.5.c:0 "米勒在簇拥下走上讲台。"
 AOR_GER_union_competition.6.t:0 "一如既往"
 AOR_GER_union_competition.6.desc:0 "法兰克福代表大会开始后，会议本质上就一直处于混乱状态，所有与会者都争吵到面红耳赤的情况更是常见。但当西奥多·莱帕特再次站上讲台，环视大厅时，他欣喜地发现这次情况似乎有所不同。代表们回到了他们的位置，准备聆听他的发言。\n\n“…大部分基层干部对捍卫工人利益抱有朴素的阶级热情，但采取粗暴，主观且缺乏法律依据的方法是不可容忍的；这种粗暴手段在政治上造成的破坏，已经无异于真正的阶级敌人所期望达到的效果。”\n\n在他发表演讲时，莱帕特可以看到右派代表们都微笑着点头表示赞同。“这将是一条忠于我们工会，我们国家和我们光荣历史的道路。我们将以正确的态度，用正确的方法进行我们的工作……我们将捍卫德国工会一以贯之的务实传统，采取实事求是，脚踏实地的优良作风，并将延续到永远！”绝大多数人都在鼓掌，连一些中派代表也谨慎地表达支持。如果卡尔在这里，想必他也会露出微笑，莱帕特暗自神伤的想到。\n\n就在那一瞬间，一个念头在他心底稍纵即逝：如果卡尔走得更远，或许他还会和他们在一起。他是否能满足于简单地模仿他的挚友兼导师的那些旧政策呢？莱帕特自嘲地皱起眉头，试图把这不请自来且不值一提的想法从脑海中赶出去。"
 AOR_GER_union_competition.6.a:0 "换汤不换药。"
 AOR_GER_union_competition.6.result_tt:0 "§L最终，§!§Y右派路线§!§L取得了在工会的胜利，这或许会在接下来的党内冲突中为右派带来巨大优势。§!"
 AOR_GER_union_competition.7.t:0 "燃起柴薪"
 AOR_GER_union_competition.7.desc:0 "每个人都有他最自在的舞台，对于罗伯特·迪斯曼而言，那无疑就是听众们和摄影机的镜头前。无论是以言辞激发热情，或是用话语唤起狂热，那种澎湃的力量让他看上去精神抖擞，冷峻的面庞显得更加坚定。\n\n“同志们，同仁们，我在此与君言，并非作为你们的领袖，而是作为一位深爱着工人同胞们的阶级兄弟。数十载间，工人阶级无不被证明是驱动历史前进，国家发展的齿轮，正是德国工人造就了德意志的荣光。崭新的德国工会将真正地为工人发声。我们将以统一的战线，在未来争取我们应有的地位，彻底扫除面前的一切阻碍。当我们的历史被人铭记时，人们会称今日为新纪元的第一缕曙光。因为今天，在工会指导下的工人革命开始了！”\n\n迪斯曼的声音穿透了整个会场，通过德国的每一处角落，透过每一处广播传遍大街小巷。中左派代表们高声欢呼，极尽热忱地鼓掌，探讨着一场新的，近在咫尺的革命。而那些右派代表们则被此等景象深深震撼，不敢移开双眼。\n\n迪斯曼胜选的消息在社会上引起了更加复杂的反应。工人们私下里议论，迪斯曼领导下的工会将会带来哪些变革——即便这位精力充沛的领袖显得有点热情过剩。企业家们则战战兢兢地担忧着“革命”一词其中的含义。而无论他们对此有何看法，有一点是肯定的——"
 AOR_GER_union_competition.7.a:0 "全德国都将感受到迪斯曼的决心。"
 AOR_GER_union_competition.7.result_tt:0 "§L最终，§!§Y中派路线§!§L取得了在工会的胜利，这或许会在接下来的党内冲突中为中派、左派带来一定优势。§!"
 AOR_GER_union_competition.8.t:0 "革命工长"
 AOR_GER_union_competition.8.desc:0 "令人震惊的消息从法兰克福代表大会上传来：著名的工会激进派领导人、大柏林工人士兵苏维埃执行委员会主席、柏林革命工长组织领袖、金属工会主席里夏德·米勒当选为工会新一届的领导人。这堪称一枚投向社会主义阵营乃至全国的重磅炸弹。尽管里夏德·米勒的行事风格低调踏实，也并不倾向于高调的作秀，但其就职演说上的激进言辞引发了广泛争议。党内右派痛骂这是政治自杀式的疯言疯语，党内左派则为“自己的人”取得胜利而欢呼。而德国的企业家们已经开始做政治动员，宣称要正面迎战这位激进疯子。"
 AOR_GER_union_competition.8.a:0 "看看资产阶级发抖的样子！"
 AOR_GER_union_competition.8.result_tt:0 "§L最终，§!§Y左派路线§!§L取得了在工会的胜利，这或许会在接下来的党内冲突中为左派带来巨大优势。§!"


 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●
 # 巴伐利亚危机
 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●

 #-------------------------------------------------- 1920.1.12
 AOR_GER_bavaria_crisis.1.t:0 "在巴伐利亚的失败"
 AOR_GER_bavaria_crisis.1.desc:0 "巴伐利亚州议会选举于今日公布最终计票结果。社会民主党得票率仅为18%，较上届大幅下滑。而中央党以37%的得票率成为第一大党。\n\n现任州长霍夫曼已宣布将与中央党组成联合政府，以维持州内阁的执政能力。霍夫曼在声明中表示，尽管社民党得票未达预期，但联合政府的稳定运行对巴伐利亚乃至整个共和国的秩序均具有重大意义。\n\n观察人士指出，此次选举结果反映了巴伐利亚选民对柏林中央政府政策的疑虑加深。中央党巴伐利亚派系在组阁谈判中预计将提出强化邦权、限制中央干预等要求，这或为该派系未来调整与柏林关系埋下伏笔。柏林方面暂未就此发表评论。"
 AOR_GER_bavaria_crisis.1.a:0 "还好保留了一丝体面"
 AOR_GER_bavaria_crisis.1.tt:0 "£aor_region_game §Y国中之国§!§L迎来了新情况，§!£aor_bavaria §Y巴伐利亚§!§L正在酝酿......§!"

 #-------------------------------------------------- 1920.1.19
 AOR_GER_bavaria_crisis.2.t:0 "巴伐利亚人民党脱离中央党"
 AOR_GER_bavaria_crisis.2.desc:0 "中央党全国代表大会于今日在柏林闭幕。会议期间，巴伐利亚邦派代表正式宣布脱离中央党，另立“巴伐利亚人民党”。分裂的直接导火索为中央党多数派坚持魏玛宪政框架下的中央集权路线，而巴伐利亚派系主张强化邦权、维护天主教保守传统，并反对柏林方面在文化政策上向世俗化倾斜的立法倾向。\n\n巴伐利亚人民党主席海姆在慕尼黑发表声明，新党将致力于捍卫巴伐利亚邦自治权，明确反对中央政府过度干涉地方事务。此次分裂使中央党失去南部重要票仓，国会席位结构将重新调整，德国政党格局由此更趋复杂。"
 AOR_GER_bavaria_crisis.2.a:0 "旧的不去，新的不来"

 #-------------------------------------------------- 1920.2.14
 AOR_GER_bavaria_crisis.3.t:0 "古斯塔夫·冯·卡尔"
 AOR_GER_bavaria_crisis.3.desc:0 "巴伐利亚州议会今日就“没收皇室财产”法案展开激烈辩论。该法案由社会民主党主导推动，旨在将前巴伐利亚王室及诸侯家族财产收归州有，以缓解州财政压力。然而法案遭到中央党及右翼政党强烈反对，指责此举“侵犯私有产权”，并对魏玛宪政秩序下的邦国传统构成威胁。\n\n辩论中，中央党代表明确表示，若法案通过，将撤回对霍夫曼联合政府的支持。州议会随后以微弱多数通过对霍夫曼内阁的不信任动议，宣告社会民主党与中央党组成的联合政府倒台。\n\n霍夫曼承认组阁失败。经巴伐利亚州议会各党团自行协商，中央党与巴伐利亚人民党达成联合执政协议，推举巴伐利亚资深政治家古斯塔夫·冯·卡尔出任州总理。新政府以维护邦权与财政稳健为首要任务，社会民主党在州内政治影响力进一步削弱。"
 AOR_GER_bavaria_crisis.3.a:0 "事情正在偏离轨道"

 #-------------------------------------------------- 1920.2.21
 AOR_GER_bavaria_crisis.4.t:0 "霍夫曼遇刺"
 AOR_GER_bavaria_crisis.4.desc:0 "急报！\n\n今日午后，前州长霍夫曼在慕尼黑市中心遭两名身份不明者枪击，身中数弹，送医后不治身亡。警方已展开调查，目前尚未有组织宣布负责。\n\n霍夫曼遇刺后数小时，其支持者宣布将实施报复行动。今日晚间某位州议员遭受了一名霍夫曼支持者的刺杀行动，并当场被射杀。一名国防部少校在试图掩护他时亦遭射杀。州议会对此表示震惊，城市多个街区已爆发零星冲突。\n\n居民防卫队于晚间重新集结，在主要街道设卡巡逻。州内政部宣布增派警力，但承认局势可能进一步恶化。中央党与巴伐利亚人民党联合政府呼吁各方克制。柏林方面正密切关注事态发展，巴伐利亚全境笼罩在政治暴力的阴影之下。"
 AOR_GER_bavaria_crisis.4.a:0 "巴伐利亚成为了火药桶…"

 #-------------------------------------------------- 1920.2.23（标题、正文、按钮待定）
 AOR_GER_bavaria_crisis.5.t:0 "（待定标题）巴伐利亚加强管制"
 AOR_GER_bavaria_crisis.5.desc:0 "（待写文案）冯卡尔宣布加强管制，开始公开庇护准军事组织，对抗柏林的中央政府和《凡尔赛条约》的裁军要求。巴伐利亚成为右派控制区。"
 AOR_GER_bavaria_crisis.5.a:0 "（待定）"
 AOR_GER_bavaria_crisis.5.tt:0 "£aor_region_game §Y国中之国§!§L迎来了新情况，§!£aor_bavaria §Y巴伐利亚§!§L转换为§!§Y右派控制区§!§L......§!"

 #-------------------------------------------------- 1920.4.5
 AOR_GER_bavaria_crisis.6.t:0 "“艾舍里希组织”成立"
 AOR_GER_bavaria_crisis.6.desc:0 "在州总理冯卡尔的公开支持下，前国防军军官格奥尔格·艾舍里希今日宣布，将巴伐利亚各地民兵及自由军团整合为全国性准军事联盟——“艾舍里希组织”(Orgesch)。该组织宣称旨在“维护秩序与国家安全”，成员据估计已达数万人，装备来自州政府库存。\n\n柏林方面，总理哈泽对此表示严重关切，认为此举是对联邦法律与《凡尔赛条约》的公然挑战。联邦内政部正评估是否将该组织定性为非法。协约国军事委员会亦注意到此事，但尚未作出正式回应。"
 AOR_GER_bavaria_crisis.6.a:0 "联邦的分裂已在地平线上"
 AOR_GER_bavaria_crisis.6.tt:0 "£aor_region_game §Y国中之国§!§L迎来了新情况，§!£aor_bavaria §Y巴伐利亚危机§!§L从此刻开始。§!"
 AOR_GER_bavaria_crisis.6.unlock_tt:0 "解锁决议：§Y调停SPD内部冲突§!\n解锁决议：§Y对巴伐利亚施压§!"

 #-------------------------------------------------- 决议「对巴伐利亚施压」
 AOR_GER_bavaria_crisis.7.t:0 "柏林威严何在？"
 AOR_GER_bavaria_crisis.7.desc:0 "今日，联邦政府就巴伐利亚裁军违约问题发布正式行政令，要求艾舍里希组织于十四日内解散，各民兵组织须向联邦裁军委员会登记备案并移交重型装备。总理胡戈哈泽强调，“联邦法律适用于全境，任何邦国不得例外”。\n\n慕尼黑方面迅即回应。州总理冯卡尔宣布拒绝接受行政令全部条款，称此为“柏林对巴伐利亚邦权的逾越”，只进行了象征性的让步。\n\n此后数日，联邦内阁就是否采取强制措施展开激烈辩论。鉴于国防军不愿介入内部冲突、协约国态度模糊，内阁最终表态“不寻求与巴伐利亚发生对抗”，将优先通过宪法法院裁决解决争端。哈泽总理随后确认，短期内不会采取强制手段。巴伐利亚方面对此不置可否，行政令事实上已被搁置。联邦政府威信在此次危机中遭受严重损害。"
 AOR_GER_bavaria_crisis.7.a:0 "静待时机"

 #-------------------------------------------------- 1920.5.13
 AOR_GER_bavaria_crisis.8.t:0 "协约国发表警告"
 AOR_GER_bavaria_crisis.8.desc:0 "协约国联合军事委员会今日通过外交渠道向德国政府递交正式照会，对巴伐利亚地区准军事组织持续壮大表示关心，指出该状态明确违反《凡尔赛条约》第五部分关于解除武装的相关条款。照会要求柏林方面采取行动，确保联邦全境一致履行裁军义务。这是协约国自2月危机爆发以来首次就巴伐利亚问题作出正式表态。\n\n外交部表示将认真研究照会内容。但政府内部清楚，若对巴伐利亚采取强制措施恐将激化南北对立，但若放任不管则将招致协约国进一步施压。"
 AOR_GER_bavaria_crisis.8.a:0 "进退维谷"
 AOR_GER_bavaria_crisis.8.unlock_tt:0 "解锁决议：§Y向协约国提交巴伐利亚报告§!\n解锁决议：§Y采取保守态势§!"

 #-------------------------------------------------- 1920.6.2
 AOR_GER_bavaria_crisis.9.t:0 "又一起凶杀案"
 AOR_GER_bavaria_crisis.9.desc:0 "昨晚，巴伐利亚工会联合会代表、社民党成员卡尔·舒尔茨在慕尼黑家中遭两名身份不明者枪击，身中数弹后当场死亡。目击者称凶手作案后乘车迅速逃离。警方在现场发现刻有“领事组织”字样的徽章。该组织系由前埃尔哈特海军旅成员组建，在巴伐利亚当地右翼势力的默许下秘密活动。\n\n舒尔茨生前多次公开批评准军事组织暴力行径，主张严格执行裁军条款，并参与组建反对艾舍里希组织的工人自卫委员会。州内政部已将此案定性为政治谋杀，承诺全力侦查。但柏林方面对巴伐利亚当局的侦办诚意表示怀疑——慕尼黑至今仍在庇护“领事组织”等右翼恐怖组织。社民党议会党团已要求联邦政府就此向巴伐利亚州政府提出正式质询。这是近期巴伐利亚发生的又一起针对工会人士的暴力事件，共和国的法治根基正面临考验。"
 AOR_GER_bavaria_crisis.9.a:0 "恐怖正在降临"
 AOR_GER_bavaria_crisis.9.unlock_tt:0 "解锁决议：§Y宣布抵制恐怖袭击§!\n解锁决议：§Y撤出SPD优秀分子§!"

 #-------------------------------------------------- 1920.6.8（20%）
 AOR_GER_bavaria_crisis.11.t:0 "巴伐利亚-巴黎通信"
 AOR_GER_bavaria_crisis.11.desc:0 "自危机以来，情报部门成功截获并破译数份巴伐利亚州政府与法国领事馆之间的加密通讯。内容显示，慕尼黑方面自4月以来多次试探法方，探讨在巴伐利亚与柏林关系彻底破裂时法国对巴伐利亚邦国特殊地位给予有限外交承认的可能性。法方在回复中言辞闪烁，并未做出任何表示。经由内阁协商决定，将此方面证据秘密交往法国。\n\n法国方面接到文件后迅速回应，承诺停止与巴伐利亚的非官方接触。"
 AOR_GER_bavaria_crisis.11.a:0 "反将一军"

 #-------------------------------------------------- 1920.6.8（50%）
 AOR_GER_bavaria_crisis.12.t:0 "奥地利的阴影"
 AOR_GER_bavaria_crisis.12.desc:0 "政治警察署于今日完成对德奥边境近期异常活动的调查。证据显示，巴伐利亚艾曾与奥地利蒂罗尔、萨尔茨堡等地右翼团体之间存在系统性物资与人员往来，包括截获的通讯记录、边境口岸运输单据，以及提及“南部日耳曼共同防御框架”的会议纪要。经由内阁协商决定，将此方面证据公开。\n\n奥地利外交部今日发表声明，承认民兵武装存在越境活动，但强调奥地利政府亦不知情，并承诺将对此展开调查并加强边境管控。\n\n协约国未做过多评价。"
 AOR_GER_bavaria_crisis.12.a:0 "反将一军"

 #-------------------------------------------------- 1920.6.10
 AOR_GER_bavaria_crisis.13.t:0 "协约国再度警告"
 AOR_GER_bavaria_crisis.13.desc:0 "协约国联合军事委员会今日再次递交正式照会，就巴伐利亚地区准军事组织持续违反裁军条款一事表示抗议。照会措辞较上月更为严厉，指出德国政府对巴伐利亚局势未采取有效行动，要求柏林在三十天内提交明确的履约时间表。若届时仍未改善，协约国将保留在赔偿谈判中采取相应措施的权利。\n\n这一表态被普遍视为协约国对柏林容忍巴伐利亚态度的不耐烦。哈泽总理在国会表示，协约国的抗议“使联邦政府的谈判处境更为艰难”。\n\n政府正考虑向巴伐利亚进一步施压。"
 AOR_GER_bavaria_crisis.13.a:0 "我们需要更加激进"
 AOR_GER_bavaria_crisis.13.unlock_tt:0 "解锁决议：§Y向巴伐利亚发动最后通牒§!\n解锁决议：§Y依靠协约国施压§!"

 #-------------------------------------------------- 决议「向巴伐利亚发动最后通牒」三天后
 AOR_GER_bavaria_crisis.14.t:0 "“巴伐利亚散播妥协信号”"
 AOR_GER_bavaria_crisis.14.desc:0 "距联邦政府发出最后通牒仅三日，巴伐利亚州总理冯卡尔今日在州议会发表声明，宣布接受裁军行政令主要条款。具体承诺为：各民兵队伍向联邦裁军委员会登记造册并接受监督；部分重型装备移交联邦政府指定仓库。\n\n但冯卡尔同时强调重申州政府保留在《凡尔赛条约》允许范围内维持“必需的地方防御力量”的权利，并称妥协并不意味着巴伐利亚放弃邦国权益。\n\n柏林方面对此表示审慎欢迎。倍倍尔总统发表声明，此为解决裁军争端做出了重大的贡献。总理胡戈哈泽承认，巴伐利亚的让步虽不彻底，但已避免事态恶化。但此事能否真正平息危机，还要看慕尼黑方面是否切实履行承诺，以及联邦政府后续能否采取正确行动巩固这一成果。"
 AOR_GER_bavaria_crisis.14.a:0 "拨云见日"

 #-------------------------------------------------- 1920.6.25（80%，直接最坏结局）
 AOR_GER_bavaria_crisis.16.t:0 "革命的敲门声"
 AOR_GER_bavaria_crisis.16.desc:0 "数名在奥格斯堡、雷根斯堡等地挨家敲门征集粮食并宣告革命来临的激进学生今日被警方逮捕，州政府称其“扰乱公共秩序”。然而此时逮捕已无济于事——恐慌已在民间全面蔓延。\n\n自前几日起，各地居民自发组织武装巡逻，村庄封闭入口，道路设卡盘查。防卫团下属民兵在未接到任何指令的情况下自行进入最高戒备，多座城镇的火车站、邮局和市政厅出现武装人员值守。截至今日傍晚，巴伐利亚大部分乡村地区实际上已进入警戒状态。\n\n冯卡尔州政府对此未予制止，也未加鼓励，仅表示“理解民众对治安的担忧”。柏林方面对此束手无策。傍晚的紧急内阁会议上，内阁一致承认，联邦政府已无法通过常规手段恢复巴伐利亚的秩序。最坏的结局正在成为现实。"
 AOR_GER_bavaria_crisis.16.a:0 "再无挽回余地"
 AOR_GER_bavaria_crisis.16.a.tt:0 "§e“我看过日光之下所发生的一切事，不料，一切都是虚空，都是捕风。”\n——《传道书》1:14§!"

 #-------------------------------------------------- 1920.7.3 结局 A
 AOR_GER_bavaria_crisis.18.t:0 "社会民主党的再一次胜利"
 AOR_GER_bavaria_crisis.18.desc:0 "我们通过果断而审慎的外交手段化解了巴伐利亚裁军危机。倍倍尔总统与哈泽总理利用秘密外交渠道，在英法之间成功制衡了法国对巴伐利亚分裂势力的暧昧态度，并依靠协约国的联合施压使慕尼黑重返谈判桌。\n\n最终，冯卡尔接受了裁军行政令的主要条款，绝大多数民兵组织宣告解散。同时，我们以最小代价保住了宪政框架，巴伐利亚虽心有不甘，但国家统一得以维持。"
 AOR_GER_bavaria_crisis.18.a:0 "从胜利走向胜利"
 AOR_GER_bavaria_crisis.18.tt:0 "£aor_region_game §Y国中之国§!中，£aor_bavaria §Y巴伐利亚§!转换为§Y右派核心区§!\n£aor_parliament §Y议会协商惯性§!：§G+20%§!\n£aor_spd §Y党内团结度§!：§G+20%§!"

 #-------------------------------------------------- 1920.7.3 结局 B
 AOR_GER_bavaria_crisis.19.t:0 "冲突和平落幕"
 AOR_GER_bavaria_crisis.19.desc:0 "我们在外交与内政的双重压力下艰难维持住了巴伐利亚的表面服从。依靠协约国施压与最后通牒的威慑，我们成功迫使慕尼黑作出有限让步——绝大多数民兵组织被强制解散，部分重装备移交联邦指定仓库。\n\n但冯卡尔在妥协中成功保留了地方武装的骨干分子，而巴伐利亚及周边地区民族主义情绪也在此期间明显抬头。我们虽保住了法律层面的胜利，但未能阻止南方日渐右翼化的势头，社民党的协调能力在长期角力中已显疲态。"
 AOR_GER_bavaria_crisis.19.a:0 "不求有功，但求无过"
 AOR_GER_bavaria_crisis.19.tt:0 "£aor_region_game §Y国中之国§!中，£aor_bavaria §Y巴伐利亚§!转换为§Y右派核心区§!\n£aor_region_game §Y国中之国§!中，£aor_bavaria §Y巴伐利亚§!周边地区（§Y图林根-萨克森§!、§Y巴登-符腾堡§!、§Y黑森§!）：\n  §Y支持度§!：§R-10%§!\n  §Y控制度§!：§R-10%§!"

 #-------------------------------------------------- 1920.7.3 结局 C
 AOR_GER_bavaria_crisis.20.t:0 "苦涩的和平"
 AOR_GER_bavaria_crisis.20.desc:0 "我们在巴伐利亚问题上进退失据，最终在摇摆中丧失了对局势的主导权。慕尼黑利用我们的妥协成功确保了自己的特殊性，巴伐利亚及周边地区的右翼势力影响范围已蔓延至南部各邦。\n\n在内部，我们也同样饱受党内分裂的困扰，激进派指责我们对分裂势力过于软弱，温和派则谴责我们过于强硬的态度导致巴伐利亚走向失控。中央党对于我们的信任也日渐消逝，联合政府的执政基础也出现了裂痕。\n\n我们不仅失去了解决问题的窗口期，也失去了南方民众对中央的信任。"
 AOR_GER_bavaria_crisis.20.a:0 "木已成舟…"
 AOR_GER_bavaria_crisis.20.tt:0 "£aor_region_game §Y国中之国§!中，£aor_bavaria §Y巴伐利亚§!转换为§Y右派核心区§!\n£aor_region_game §Y国中之国§!中，£aor_bavaria §Y巴伐利亚§!周边地区（§Y图林根-萨克森§!、§Y巴登-符腾堡§!、§Y黑森§!）：\n  §Y支持度§!：§R-50%§!\n  §Y控制度§!：§R-50%§!\n£aor_spd §Y党内团结度§!：§R-10%§!\n£aor_parliament §Y议会协商惯性§!：§R-10%§!"

 #-------------------------------------------------- 1920.7.3 结局 D
 AOR_GER_bavaria_crisis.21.t:0 "在巴伐利亚的全面溃败"
 AOR_GER_bavaria_crisis.21.desc:0 "我们在巴伐利亚危机中全面溃败。\n\n我们发出的最后通牒形同虚设，而依靠协约国施压的策略也未能阻止慕尼黑堕入右翼的怀抱，冯卡尔已在南部建立起事实上的地方军事独裁。\n\n巴伐利亚及周边地区已沦为右翼势力的实际控制区，社民党在当地的组织网络几近瓦解，我们不仅失去了对巴伐利亚的管辖权，更在协约国面前丧失了作为统一国家的威信。"
 AOR_GER_bavaria_crisis.21.a:0 "统一之国已然出现裂痕"
 AOR_GER_bavaria_crisis.21.tt:0 "£aor_region_game §Y国中之国§!中，£aor_bavaria §Y巴伐利亚§!转换为§Y右派核心区§!\n£aor_region_game §Y国中之国§!中，§Y黑森§!转换为§Y右派控制区§!\n£aor_parliament §Y议会协商惯性§!：§R-30%§!\n£aor_spd §Y党内团结度§!：§R-30%§!"
 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●
 # 西里西亚危机
 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●

 #-------------------------------------------------- 1919.8.18
 AOR_GER_silesia_crisis.2.t:0 "波兰武装力量入侵西里西亚！"
 AOR_GER_silesia_crisis.2.desc:0 "今晨四时许，波兰武装分子攻占普鲁士煤矿公司总部和奥德河铁路桥，多处警察局被包围。当地部队在地方长官的号召下于七时开始集结，在城南与波兰武装交火。截止傍晚，协约国军事委员会派员连同维和部队已经抵达现场，强令双方停火并划定临时分界线，但波兰方面未做回应。"
 AOR_GER_silesia_crisis.2.a:0 "做好准备！"
 AOR_GER_silesia_crisis.2.tt:0 "£aor_region_game §Y国中之国§!§L迎来了新情况，§!£aor_silesia §Y西里西亚§!§L陷入了战火......§!"
 AOR_GER_silesia_crisis.2.unlock_tt:0 "解锁决议：§Y派遣正规军§!\n解锁决议：§Y向协约国控诉§!\n解锁决议：§Y加强对激进派的控制§!"

 #-------------------------------------------------- 1919.8.20
 AOR_GER_silesia_crisis.4.t:0 "当地自发组建民兵队伍"
 AOR_GER_silesia_crisis.4.desc:0 "起义爆发后两日，上西里西亚多处乡村和城镇的居民开始自发组建民兵队伍。参与者多为当地德裔男性，他们手持猎枪和旧式步枪，在居住区周围巡逻。但他们更多的时间用来举办聚会，并给每一位前来聚会的成年人供应啤酒。"
 AOR_GER_silesia_crisis.4.a:0 "酒是老英雄，越喝越奋勇"

 #-------------------------------------------------- 1919.9.10
 AOR_GER_silesia_crisis.5.t:0 "上西里西亚自治组织游行"
 AOR_GER_silesia_crisis.5.desc:0 "今日上午，上西里西亚人联盟（BDO）在奥佩恩和格莱维茨等城市组织大规模游行示威，数千名德裔居民举着标语走上街头，要求“上西里西亚自治”——既反对波兰军事占领，也质疑柏林中央政府能否有效保护当地利益。示威队伍秩序大体平稳，但部分城镇出现与波兰裔居民的零星口角。\n\n基于此，内阁内部就是否援助BDO存在分歧：援助意味着支持自治路线，可能激化与波兰的矛盾；不援助则担心BDO转向激进派，使柏林失去对当地德裔的控制力。\n\n目前，协约国观察团已到场监督，尚未采取干预措施。"
 AOR_GER_silesia_crisis.5.a:0 "支持他们，展现我们的立场"
 AOR_GER_silesia_crisis.5.a.tt:0 "£aor_region_game §Y国中之国§!中，£aor_silesia §Y西里西亚§!：\n  §Y支持度§!：§G+5§!\n  §Y控制度§!：§R-5§!\n开始§Y上西里西亚自治§!进程（加强右翼，促进自治）。"
 AOR_GER_silesia_crisis.5.b:0 "局势混乱，还是小心为上"

 #-------------------------------------------------- 1919.10.2
 AOR_GER_silesia_crisis.6.t:0 "英国对我们的主张表示支持"
 AOR_GER_silesia_crisis.6.desc:0 "9月下旬，我方正式向协约国联合委员会提交控诉，详细列举波兰违反停火协议、德裔平民受侵害等证据。\n\n今日，英国政府公开声明，强调公投程序必须按《凡尔赛条约》规定如期执行，任何武装团体的占领都不得被视为既成事实。尽管声明措辞温和，未直接谴责波兰，但这是英国首次在外交层面与法国的亲波兰立场拉开了距离。"
 AOR_GER_silesia_crisis.6.a:0 "总会有人主持正义"

 #-------------------------------------------------- 1919.10.5
 AOR_GER_silesia_crisis.8.t:0 "社会民主党的嫌疑？"
 AOR_GER_silesia_crisis.8.desc:0 "今日国会会议上，德意志人民党就上西里西亚起义期间武器来源问题向政府提出紧急质询。据该党提交的证据显示，部分经萨克森方向输入上西里西亚波兰控制区的物资，中转记录中多次出现与社会民主党有关联的运输工人姓名。反对党据此指控：社会民主党暗中协助波兰武装，背叛了德意志民族利益。\n\n国会全场哗然。右翼报纸次日头版标题为“柏林是否知情？”，要求内阁作出全面交代。而在联盟内部，中央党和自由党员也要求我们就此事发布正式调查结论。我们陷入了被动局势。"
 AOR_GER_silesia_crisis.8.a:0 "这群该死的激进派！"
 AOR_GER_silesia_crisis.8.tt:0 "£aor_parliament §Y议会协商惯性§!：§R-20§!\n我们§Y极大地加强了右翼反对§!，两党都将在国会里与我们为难。"

 #-------------------------------------------------- 1919.10.8
 AOR_GER_silesia_crisis.10.t:0 "协约国调停，公投继续"
 AOR_GER_silesia_crisis.10.desc:0 "协约国调停方案于10月2日获柏林正式接受，华沙方面亦于次日确认。联合委员会今日宣布停火协议即刻生效，双方武装部队须于48小时内撤回各自控制线。公投筹备工作依照原定日程继续推进，协约国观察员将全程参与选民登记及地方行政监督。\n\n我方对此表示认可。目前，上西里西亚自治进程在调停框架下获协约国原则性支持，当地德裔社团已开始组织公投宣传委员会。\n\n波兰方面并未对此发表任何意见。"
 AOR_GER_silesia_crisis.10.a:0 "SPD的又一次胜利"
 AOR_GER_silesia_crisis.10.tt:0 "£aor_region_game §Y国中之国§!中，£aor_silesia §Y西里西亚§!：\n  §Y控制度§!：§R-5§!\n\n§Y上西里西亚自治§!进程获得协约国原则性支持。"
 AOR_GER_silesia_crisis.11.t:0 "无能的政府？"
 AOR_GER_silesia_crisis.11.desc:0 "今日，协约国联合委员会就上西里西亚局势提出调停方案，要求双方以实际占领区域为界线立即停火、释放俘虏，并增派观察员监督地方行政。方案已递交柏林与华沙。\n\n这意味着波兰武装通过军事行动获得的领土，在国际层面被事实上承认。上西里西亚东部及东南部数个矿区划入波方控制范围，当地德裔居民被迫面临撤离或接受波兰管辖的选择。\n\n国会辩论激烈，多名议员指责政府“外交失败”，未能通过谈判逆转战场损失。右翼政党甚至扬言将对政府提出不信任动议，质疑大联合政府维护东部边界的能力。"
 AOR_GER_silesia_crisis.11.a:0 "丢人现眼"
 AOR_GER_silesia_crisis.11.tt:0 "£aor_region_game §Y国中之国§!中，£aor_silesia §Y西里西亚§!转换为§Y右派控制区§!"

 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●
 # 国防法危机
 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●

 #AOR_GER_defense_law.crisis_t:0 "国防法危机"
 #AOR_GER_defense_law.crisis_desc:0 "1920年夏季以来，国防军与社民党政府之间的裂痕已从暗流演变为公开对抗。\n\n军官团担忧我们正借助裁军争议推行布尔什维克式的革命，而大柏林法案引发的南北对立更加深了军方的不信任感。7月国防军骚乱爆发后，局势持续恶化，而9月屈斯特林政变未遂与退伍士兵游行使矛盾进一步激化。与此同时，巴伐利亚危机留下的政治创伤尚未愈合，波美拉尼亚已落入右翼实际控制，共和国东北部的政治版图正在变色，我们不得不做出行动了。\n\n这场冲突不仅关乎军政关系的重构，更将决定魏玛共和国能否存活。"

 #-------------------------------------------------- 1
 AOR_GER_defense_law.1.t:0 "国防军骚动事件"
 AOR_GER_defense_law.1.desc:0 "随着大柏林法案进入二读，柏林周边城镇及勃兰登堡部分地区并入首都行政区。此举引发了北部军官们的一致不满，他们声称社会民主党正借助裁军争议与大柏林法案推行激进的社会革命议程，逐步瓦解德意志的传统秩序。原先的巴伐利亚危机的先例更强化了这一判断，军官们逐渐开始质疑政府是否仍忠于国家利益。由此，波茨坦驻军率先集会，士兵们拒绝返回营房并公开质疑政府权威，骚乱随后蔓延至什切青、布雷斯劳及柯尼斯堡等地。\n\n此背景下，哈泽总理谴责“少数军人的违法行径”，并承诺加速推动国防法立法以解决法律争议。\n\n截至目前，德意志东北部的局势仍在蔓延。"
 AOR_GER_defense_law.1.a:0 "风雨不断"
 AOR_GER_defense_law.1.tt:0 "£aor_region_game §Y国中之国§!§L迎来了新情况，§!£aor_silesia §Y国防法§!§L已提上日程§!"

 #-------------------------------------------------- 2
 AOR_GER_defense_law.2.t:0 "谈判取得成功，骚乱暂定"
 AOR_GER_defense_law.2.desc:0 "得益于巴伐利亚危机中积累的政治信誉与调停经验，哈泽总理主持召开军政协调会议，国防军代表与政府就国防法修正方向达成初步共识。军方同意停止集会和抗议，将诉求纳入法律讨论渠道。波茨坦驻军于三日内陆续返回营房，骚乱基本平息。政府威信在此次调停中进一步巩固，共和国的军政关系迎来短暂缓和。"
 AOR_GER_defense_law.2.a:0 "逃过一劫"

 #-------------------------------------------------- 3
 AOR_GER_defense_law.3.t:0 "中央迅速动员，骚乱暂定"
 AOR_GER_defense_law.3.desc:0 "联邦政府下令动员驻守中部地区的数个忠诚营队，部署至骚乱蔓延的北部城市周边，以防范局势进一步恶化。动员令强调此举为“预防性措施”，旨在保障公共安全。国防军内部分歧未因此消除，但公开骚乱已得到控制。政府在秩序与合法性之间的平衡虽显脆弱，但短期内危机得以遏制，政治权力在此过程中略有增强。"
 AOR_GER_defense_law.3.a:0 "逃过一劫"

 #-------------------------------------------------- 4
 AOR_GER_defense_law.4.t:0 "中央无力干预，骚乱仍在"
 AOR_GER_defense_law.4.desc:0 "联邦内阁承认，在持续数月的巴伐利亚危机之后，政府已缺乏足够的政治资源与强制手段应对国防军骚乱。波茨坦的不满情绪已蔓延至什切青、柯尼斯堡等多座城市，士兵集会持续进行，部分城镇的居民自发声援抗议部队。哈泽总理在国会闭门答辩中坦言“不掌握有效的干预手段”。政府威信在此次危机中再受重创。"
 AOR_GER_defense_law.4.a:0 "我们只能忍受苦果"

 #-------------------------------------------------- 5
 AOR_GER_defense_law.5.t:0 "中央武力干预，局势日渐极端化"
 AOR_GER_defense_law.5.desc:0 "联邦政府今日下令动员柏林及周边地区的工人自卫队，前往屈斯特林及波茨坦等地维持秩序，以应对持续蔓延的国防军骚乱。这是政府首次尝试以工人武装替代正规军执行内部维稳任务。\n\n然而，当首批工人自卫队员抵达波茨坦驻军外围时，遭遇骚乱部队的武装阻截。据军方报告，双方在营区入口处发生交火，工人武装被击退，至少十二人受伤，三人死亡。\n\n此次事件造成的国防军指挥体系的松动，最终导致柏林失去了对军事力量的基本掌控，德意志共和国的命运悬于一线。"
 AOR_GER_defense_law.5.a:0 "我们只能忍受苦果"

 #-------------------------------------------------- 6
 AOR_GER_defense_law.6.t:0 "墓园般的死寂"
 AOR_GER_defense_law.6.desc:0 "自国防军骚乱以来，波美拉尼亚地区的政治气氛日益凝重：当地多家社民党报社被迫停刊，工会办事处大门紧锁，工人代表遭公开威胁后已离开。据当地居民反映，近两周内，右翼团体在各村镇张贴标语，号召抵制柏林的红色专政，公开集会的社民党支持者屡遭驱逐。地方警察对此视而不见，甚至默许右翼民兵在交通要道设卡盘查。\n\n据我们观察，波美拉尼亚已事实上成为德意志民族人民党的控制区。社民党地方组织基本瘫痪，党员纷纷退党或转入地下，公开的政治生活陷入沉寂。正如当地社会民主党议员所言：“这里没有争吵，没有集会，没有口号——只有墓园般的死寂。”\n\n东普鲁士早在危机前便已是右翼势力的稳固后方，如今波美拉尼亚步其后尘，德国东北部的政治版图正在迅速变色。柏林方面对此暂无实质性回应。"
 AOR_GER_defense_law.6.a:0 "只剩沉默"

 #-------------------------------------------------- 7
 AOR_GER_defense_law.7.t:0 "未遂的政变"
 AOR_GER_defense_law.7.desc:0 "近日，驻柏林附近屈斯特林兵营的布赫鲁克少校被军事法庭判处十年监禁，罪名是策划武装政变。据调查，布赫鲁克利用“黑色国防军”网络，企图纠集右翼军官在柏林发动突袭，夺取重要政府建筑并建立军事独裁政权。行动原定于本月下旬实施，但因内部告密而败露。\n\n所谓黑色国防军，系指《凡尔赛条约》裁军条款下被解散却秘密保留的非法军事组织，名义上登记为“边境防卫队”，实则接受前军官指挥。布赫鲁克案使其组织架构首次被公之于众。\n\n审判期间，被告辩称其行动系防止布尔什维克革命。法庭认定其行为构成叛国，判处十年监禁。国防部表示将彻查“黑色国防军”的全部网络，但拒绝透露具体范围。德意志东北地区由此成为全国关注的焦点，多处驻军重新展开忠诚审查。"
 AOR_GER_defense_law.7.a:0 "共和国绝不能被撼动！"
 AOR_GER_defense_law.7.tt:0 "£aor_region_game §Y国中之国§!§L迎来了新情况，§!£aor_defense_law §Y国防法危机§!§L开始了......§!"

 #-------------------------------------------------- 8
 AOR_GER_defense_law.8.t:0 "退伍士兵游行抗议判决"
 AOR_GER_defense_law.8.desc:0 "今日，约两千名退伍士兵在柏林市中心举行抗议游行，游行者中多人身穿军服佩戴勋章，并对法庭判处布赫鲁克少校十年监禁表示强烈不满。示威者打出“保卫德意志”、“防止布尔什维克渗透”等标语，部分人群试图接近国会大厦，被警察拦阻后双方对峙数小时。\n\n与此同时，德意志东北地区的右翼媒体将布赫鲁克塑造为“抵抗布尔什维克的烈士”，号召民众参加后续集会。部分驻军指挥官拒绝谴责示威行为。倍倍尔总统对此强硬谴责，认为国防军此举是主动挑起危机，危害了共和国秩序，但国防军方面置若罔闻。\n\n共和国的权威正在受到侵蚀。"
 AOR_GER_defense_law.8.a:0 "熟悉的感觉......"

 #-------------------------------------------------- 9
 AOR_GER_defense_law.9.t:0 "国防法正式提上日程"
 AOR_GER_defense_law.9.desc:0 "布赫鲁克政变未遂与退伍士兵游行之后，《国防法》修订今日正式列入国会议程。哈泽总理在开幕发言中指出，当前骚乱暴露了军队指挥权归属的法律灰色地带，“国会必须通过立法明确文官政府对国防军的指挥权限”。\n\n然而，法案尚未进入一读便遭遇重重阻力。国防军军官团通过非正式渠道向多位议员表明立场：反对任何削弱军队自治地位的立法修改，强调“军队必须保持政治中立，不受党派政府挟持”。\n\n右翼政党德意志民族人民党与巴伐利亚人民党已宣布将联合抵制该法案，认为其将成为社民党控制军队的工具。党内左翼则批评草案保守色彩过重，未能体现工人对军队民主化的诉求。\n\n国会辩论预计将持续至十月。政府虽拥有微弱多数，但国防法争议已跨越党派界限，成为一场关于共和国命运的全面政治较量。哈泽总理承认，法案的最终命运“远未确定”。"
 AOR_GER_defense_law.9.a:0 "道阻且难"
 AOR_GER_defense_law.9.tt:0 "§Y左侧「国防法危机」栏解锁决议：§!\n 制定国防法草案（§Y5§! 政治点数）\n 压制国防军骚乱（§Y5§! 政治点数）\n\n§L决议就写在国中之国窗口最左边那一栏，互不冲突，可以先做草案再压制骚乱。§!"

 #-------------------------------------------------- 10
 AOR_GER_defense_law.10.t:0 "党内调解失败，激进派独走"
 AOR_GER_defense_law.10.desc:0 "今日，我们推动温和社会化方案的行动，被党内极左派公开谴责为“资本家走狗的混蛋行为”。他们同时指责此法案“背叛工人阶级的利益，妄图将工人们彻底变为资本家的奴隶”。倍倍尔总统协同斯巴达克派尝试调停争端，但极左派代表拒绝谈判，在谴责斯巴达克派已经沦为“资产阶级的新宠物”后，极左翼宣布退出社会民主党，成立德国共产主义工人党（Kommunistische Arbeiter-Partei Deutschlands）。与此同时，其授权其下辖组织在柏林、汉堡及莱比锡等地强行占领多处工厂，宣称“以直接行动实现真正的社会化”。\n\n此举迅速引发北部右翼骚动。什切青、柯尼斯堡等地右翼团体借机煽动，称“布尔什维克革命已登陆德国”，多地出现反共集会与袭击工会办事处的暴力事件。与此同时，部分国防军军官将极左派夺厂行为视为“布尔什维克革命的铁证”，进一步强化了对抗政府的决心，军方内部抵触情绪持续升温。\n\n哈泽总理在谴责极左派分裂和独走行为后尝试做出行动，但政府已在多重危机中疲于奔命，难以快速应对。"
 AOR_GER_defense_law.10.a:0 "坏事一桩接着一桩"

 #-------------------------------------------------- 11
 AOR_GER_defense_law.11.t:0 "军队高层介入局势"
 AOR_GER_defense_law.11.desc:0 "面对愈演愈烈的国防法修订问题，国防军高层汉斯·冯·赛克特今日在军官团内部会议上公开呼吁军队“保持政治中立”，强调国防军不应介入党派纷争，而应作为“国家的纯粹工具”存在。\n\n然而，这一表态未能掩盖军方内部的实际倾向。近期调查显示，国防军内部右翼势力已广泛渗透，多次对左翼官兵进行“偏差审判”，以维护所谓“军队的纯洁性”。赛克特的呼吁在目前军方普遍右倾的现实面前缺乏说服力。哈泽总理随即宣布，政府不会接受军方的中立主张，坚持要求国防军明确表态支持宪政秩序。\n\n赛克特呼吁遭拒后，前最高指挥部成员借机联合发表声明，宣布公开反对社民党政府，指责其试图以党派利益绑架军队，毁灭德意志国家。军方与政府之间的对立由此公开化，国防法冲突进入全新阶段。"
 AOR_GER_defense_law.11.a:0 "同志们，行动起来"
 AOR_GER_defense_law.11.tt:0 "§Y左侧「国防法危机」栏解锁决议：§!\n 修正国防法条例：工人军官团占比（§Y5§! 政治点数）\n\n§L需要先完成「制定国防法草案」。无此一步，§Y11.27§! 拿不到最好的结局。§!"

 #-------------------------------------------------- 13
 AOR_GER_defense_law.13.t:0 "柏林械斗落幕，社民党调停促成停火"
 AOR_GER_defense_law.13.desc:0 "持续数日的柏林街头冲突今日在社民党的紧急调停下暂告平息。哈泽总理亲自与双方代表进行谈判，最终达成临时停火协议：双方武装人员须于次日午夜前撤离街头，由警方接管主要区域秩序。\n\n调停过程中，社民党多次往返于左右阵营之间，以承诺推动国防法修正案回应右翼关切，同时以加速社会化立法安抚左翼诉求。虽然双方均未完全满意，但暂时接受了停火安排。\n\n冲突共造成五人死亡、至少上百人受伤。柏林警方已开始清除路障并恢复交通。哈泽总理在晚间声明中表示“停火是第一步，和解仍需时日”。但分析人士指出，双方的深层矛盾并未消解，社民党的中间路线在左右夹击中愈发吃力。\n\n柏林的脆弱平静能否维持，仍是未知数。"
 AOR_GER_defense_law.13.a:0 "我们已经做出了最大的努力"

 #-------------------------------------------------- 14
 AOR_GER_defense_law.14.t:0 "柏林械斗落幕，右翼退伍军人胜利"
 AOR_GER_defense_law.14.desc:0 "持续数日的柏林街头冲突今日以右翼退伍军人组织占据上风告终。在波茨坦广场和威廉大街等核心区域，退伍军人组织凭借组织性和武器优势将野猫工人武装逐出市中心。警方统计，冲突共造成十七人死亡、近百人受伤。右翼团体随后集会，宣布将“保卫柏林免受布尔什维克侵袭”。国防军驻柏林部队未介入，但多名军官被目击出现在集会现场。\n\n在确认右翼民兵实际占领柏林后，市警察局长艾希霍恩要求其停止危害公共秩序，在警察监护下撤离柏林。右翼起初拒绝，警方在波茨坦广场至勃兰登堡门一线部署警戒线，部分警察与国防军巡逻队发生口头对峙。艾希霍恩曾要求缴械，但驻军司令部拒绝配合。同时，协约国驻柏林代表也递交口头照会，警告局势失控将影响赔款谈判和莱茵兰安排。\n\n因担心危机扩大为警务系统与军队系统直接冲突，并招致协约国更大不满，各方最终妥协：右翼不在市中心继续驻留，警方只承担路线监护，不强行收缴轻武器。\n\n最终，右翼民兵在警察监护下近乎凯旋地离开柏林：队伍高举旧帝国旗帜和军旗，奏乐列队穿过市中心，并绕经工人聚居区，高唱民族主义歌曲、撕毁红旗、辱骂工人纠察队，迫使工人退入街巷。"
 AOR_GER_defense_law.14.a:0 "我们只能接受"

 #-------------------------------------------------- 15
 AOR_GER_defense_law.15.t:0 "柏林械斗落幕，野猫工人武装取得胜利"
 AOR_GER_defense_law.15.desc:0 "持续数日的柏林街头冲突今日以野猫工人武装的胜利告终。在克罗伊茨贝格和腓特烈斯海因等工人聚居区，民兵凭借熟悉地形和民众支持，成功击退退伍军人数次进攻，并在部分区域将其逐出。\n\n据双方报告，冲突共造成二十余人死亡、上百人受伤。工人武装在胜利后宣布将继续“保卫工人权益不受右翼侵犯”，并呼吁工运内部团结。尽管本次械斗结果扩大了极左派在柏林的影响力，但大部分工人在右翼威胁消退后失去了支持野猫工人武装的兴趣。\n\n随后，柏林工人苏维埃、艾希霍恩的柏林警察部队施压极左派，最终迫使大部分野猫工人武装放弃了全面占厂，其大部分要么解散，要么选择接受我们掌握的准军事组织人民防卫队指挥。\n\n少部分失去群众支持的表示“坚决拒绝服从一切工人叛徒命令”的武装遭到取缔。尽管成功将右翼民兵驱逐出首都，但极左派影响力的扩大还是令人担忧左翼阵营内部的稳定。"
 AOR_GER_defense_law.15.a:0 "我们只能庆幸赢得胜利的不是右翼......"

 #-------------------------------------------------- 16
 AOR_GER_defense_law.16.t:0 "协约国再度抗议，要求立刻裁军"
 AOR_GER_defense_law.16.desc:0 "协约国联合军事委员会今日向德国政府递交第三次正式抗议照会，就国防军骚乱、黑色国防军存在及巴伐利亚裁军履约不力等问题表示“最严重关切”。照会措辞较此前两次更为严厉，明确指出德国“在裁军义务上持续违约”，要求柏林方面“立即采取有效措施，确保军事条款得到全面执行”。\n\n协约国警告，若德国政府在三十天内未能提交可接受的履约方案，将考虑“在赔偿谈判及领土监管问题上采取相应措施”。这一表态被普遍解读为对柏林容忍军方抗拒裁军的不耐烦。\n\n哈泽总理在国会回应称，政府“充分认识到裁军义务的严肃性”，正全力推动国防法立法以解决军队指挥权争议，同时向协约国保证将加快裁军进程。但国防部内部报告承认，在国防军骚乱持续的现状下，全面履行裁军义务“几乎不可能”。总理同时暗示，希望协约国理解德国当前的政治困境，给予更多时间。"
 AOR_GER_defense_law.16.a:0 "时间不等人"
 AOR_GER_defense_law.16.tt:0 "§Y左侧「国防法危机」栏解锁决议：§!\n 修订国防法（§Y5§! 政治点数）\n 宣布军队中立（§Y25§! 政治点数）\n\n§L两者都要先有草案。宣布中立会掐掉改革条款，结局随之改变。§!"

 #-------------------------------------------------- 17
 AOR_GER_defense_law.17.t:0 "埃舍里希组织遭受强制取缔"
 AOR_GER_defense_law.17.desc:0 "协约国持续施压下，联邦政府今日正式下令解散艾舍里希组织。该组织自1920年4月成立以来，已发展成为实际意义上的全国性准军事联盟，成员一度达数十万人。根据命令，埃舍里希组织所有分支机构须于三周内完成解散，装备移交联邦裁军委员会监管。\n\n然而，在巴伐利亚州政府的强烈要求下，联邦政府与协约国达成妥协：巴伐利亚地方性的居民防卫队得以保留，但须缩减规模、登记造册，并承诺仅限于地方治安用途。冯卡尔州总理对此表示勉强接受，称保留防卫队是对巴伐利亚邦国权益的认可。\n\n哈泽总理在国会解释称，“艾舍里希组织的全国性结构对联邦构成威胁，而居民防卫队作为地方自卫力量，在可接受的范围内”。总理的回答在国会未遭受质疑，只是事后党内激进派开始批评政府对南部妥协太多。\n\n协约国对此安排表示默许，暂未进一步追究。"
 AOR_GER_defense_law.17.a:0 "有惊无险"

 #-------------------------------------------------- 19
 AOR_GER_defense_law.19.t:0 "《国防法》修订，军队使命将重新定义"
 AOR_GER_defense_law.19.desc:0 "《国防法》今日在国会以微弱多数正式通过。\n\n新法核心内容为：明确国防军的首要使命是“保卫共和国宪法秩序”，军队不得用于镇压工人运动，亦不得参与党派政治。此外值得庆幸的是，我们得以将一部分原属人民军的部队汇编进入新国防军中，虽然他们在整个国防军中所占的比例很小，但却能有效防止军队的迅速右翼化。\n\n伴随着《国防法》的颁布，舍伊希也成功在我们的支持下出任国防部长，我们得以在军队重组中拥有一定的影响力。而赛克特将军进入军队决策层后，莱茵哈特将军因建军理念与其产生严重分歧，二人在军内展开激烈权力博弈。眼下双方僵持对峙的紧张局面，恰好为我们介入军方事务创造了可乘之机。\n\n协约国暂未回应。"
 AOR_GER_defense_law.19.a:0 "德国军队的面貌，自今日将不再相同。"

 #-------------------------------------------------- 20
 AOR_GER_defense_law.20.t:0 "《国防法》修正案通过"
 AOR_GER_defense_law.20.desc:0 "《国防法》修正案今日在国会以微弱多数通过。新法在形式上明确了国防军的国家属性，要求军队“超越党派、忠于宪法”。我们的执政盟友将此视为巩固共和的重要一步。\n\n然而，法案的实质内容与我们最初的设想相去甚远。军方在长达数月的博弈中成功削弱了法案中的改革条款，保留了军官团对人事与训练事务的实质控制权。莱茵哈特将军在此过程中遭遇军方保守派持续抵制，最终于法案通过后次日引咎辞职。赛克特将军随即主导国防部事务，军队在名义上接受了“政治中立”原则，实则进一步巩固了军官团的主导地位。\n\n《国防法》实际加深了国防军与政府之间的隔阂。右翼势力在军内的影响力并未因此削弱，反而继续加强渗透，但我们已经无法阻止了。"
 AOR_GER_defense_law.20.a:0 "我们尽力了"

 #-------------------------------------------------- 21
 AOR_GER_defense_law.21.t:0 "《国防法》通过，引发普遍不满"
 AOR_GER_defense_law.21.desc:0 "《国防法》通过后，右翼迅速在全国范围内掀起抵制浪潮。右翼报刊、退伍军人团体及各地民族主义组织纷纷发声，指责该法“将国防军变为党派工具”，多地举行抗议集会。部分驻军士兵加入示威行列，在营区内外公开表达不满。\n\n同时，我们的执政联盟内部出现裂痕。中央党对政府推动法案的方式表示不满，自由党代表更威胁撤回支持。即使两党并未直接以退出联盟相威胁，但联盟的脆弱性已暴露无遗。\n\n国防部内部同时发生人事地震。莱茵哈特将军在军方保守势力持续抵制下引咎辞职，赛克特将军接掌国防部主导权。然而赛克特上任后处境微妙——右翼成功在军队内部取得了较大的影响力，军队迅速右翼化。\n\n军队政治中立的改革难以推行，赛克特处处碰壁，国防部决策陷入僵局。"
 AOR_GER_defense_law.21.a:0 "一招不慎，满盘皆输"

 #-------------------------------------------------- 22
 AOR_GER_defense_law.22.t:0 "柏林孤岛"
 AOR_GER_defense_law.22.desc:0 "《国防法》通过已逾一月。但在柏林周边，法案的效力已荡然无存。当地驻军指挥官公开表示“等待进一步指示”，对国防部的新规采取漠视态度。退役军人组织与右翼民兵事实上接管了多处乡镇的治安职能，在交通要道设卡巡逻，柏林方面对此无权过问。\n\n柏林成为一座孤岛。政府法令在首都范围内勉强生效，但只要出了城市界限，便无人理会。国防部不敢向周边派遣忠诚部队以执行法律，因为骚乱的国防军随时可能发生冲突。哈泽私下承认，联邦政府在首都之外已不再具备实际控制力。\n\n右翼势力早已在柏林周边扎下了根，而政府既无决心也无能力将其拔除。\n\n柏林正成为我们在普鲁士的最后一块孤地。\n\n我们遭受了巨大的失败。"
 AOR_GER_defense_law.22.a:0 "再见了，普鲁士"

 AOR_GER_defense_law.22.tt:0 "§e“你从祖先那里继承的一切，必须靠努力去赢得，才能真正拥有。”§!"
