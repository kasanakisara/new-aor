 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●
 # 国际事务事件
 # 原文件：AOR_GER_International_l_simp_chinese.yml
 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●

 AOR_GER_International.1.t:0 "一九一九柏林国际"
 AOR_GER_International.1.desc:0 "虽然是一场不流血的革命，但是柏林依旧没有从中恢复过来。\n\n普鲁士众议院内的帝国徽记还都在拆除过程中，刚打扫出来的会议室也来不及做更多装饰了。来自世界各国的代表团正在陆续抵达莱比锡大街，人们在众议院门前，争论声几乎没有停过。\n\n卡尔·考茨基还一路都在说话。\n\n“问题首先还是战争责任。”他慢慢向前走着，语气认真得近乎固执，“法国人不会轻易接受德国社会民主党的解释，奥地利人更不会给我们好脸色看。谁都不愿意先承认自己的错误。”\n\n倍倍尔没有看他。“他们总得坐下来谈。”\n\n“谈是一回事，重新建立国际是另一回事。”考茨基忍不住举起双手，在空中胡乱比划着，“一九一四年之后，所有人都开始怀疑，社会主义政党究竟还能不能超越民族国家：无论欧洲的哪个社会主义政党在当年都或多或少支持了战争。还有俄国的问题，布尔什维克认为议会制度已经过时，认为工人政党只需要暴力革命，依靠苏维埃就能统治国家——但这无非就是布朗基主义的那些东西。”\n\n“嗯，你最好别当着他们的人这么说。”倍倍尔随口道。\n\n“我已经写过了。”\n\n“所以他们才讨厌你。”\n\n考茨基像是没听见一样。\n\n今天来到柏林的社会主义者，大致分成三个派别。\n\n最多是那些社会沙文主义者，支持在战争时期与本国政府合作。他们认为社会主义政党首先必须维护国家秩序，阶级斗争不能危及民族共同体。这些人大多来自旧第二国际右派，也包括不少工会官员和议会领袖。\n\n另一部分人则继承了齐美瓦尔德左派的立场。他们认为世界大战已经证明旧社会民主主义彻底失败，议会道路只是对资产阶级的妥协。在他们看来，俄国革命至少真正进行了革命。\n\n至于中间派……这里就有俩。\n\n倍倍尔停下脚步，看了考茨基一眼。“你最好别在开幕式上讲太久。”\n\n考茨基皱了皱眉。“有些事情总得说清楚，不然国际根本无法重建。”\n\n“以后再说。”\n\n两人一同走上台阶，推开了那扇门。"
 AOR_GER_International.1.a:0 "但愿一切顺利。"
 AOR_GER_International.1.tt:0 "§g在柏林会议上，战争责任、布尔什维克政权、米勒兰事件等问题都将被摆上桌面。请注意平衡§C社会沙文主义者§g与§R齐美尔瓦尔德左派§g的声势，否则重组第二国际的计划只能泡汤。当然，即便成功，恐怕也只能惨淡收场：代表们已经吵上天了。§!\n\n§Y德国§!将建立§R社会主义工人国际（柏林国际）§!势力范围。"

 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●
 # 《我的一生》相关事件
 # 原文件：AOR_GER_MyLife_l_simp_chinese.yml
 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●

 AOR_GER_MyLife.1.t:0 "《我的一生》第四卷正式出版"
 AOR_GER_MyLife.1.d:0 "序言\n\n去年，倍倍尔寄给我一封信，信里首先对我当时进行的笔战表示很感兴趣，随后接着说：\n\n“我立了个遗嘱，希望你能同意，即如果我在《我的一生》第四卷完成前竟然去世，那末你可以就已准备好付印的稿子出版。我还要做的不多了，这一卷写到一九一四年就完了。往后可以快些进行了……”\n\n这封信的整个精神表示出，他还希望由他自己来完成他的回忆录，这是他非常关心的事，而他指定我为出版人，只是个预防措施。他虽然抱怨他的“无力工作”，但把这情形描写为“意欲进攻却在斗争面前被吓回来的怪现象”。他因无力战斗而悲悯，他把无力战斗同无力工作同等看待。战斗和工作在他有同样意义。\n\n“你所写的关于《柏林自由报》上的声明和攻击的事，我不知道，或者同许多其他事件一样，我全忘记了。我忘记了多少东西，我研究第四卷的有关文件时每天都体会到了。”\n\n这是倍倍尔关于他的回忆录第四卷最后告诉我的话。两个星期后，他就逝世了，离开了每个工作、每个斗争。他死在了保卫社会主义宪法的道路上——这是永别的无限悲痛中的唯一安慰，这种悲痛使我们每个人感到抑郁，即使是没有幸运同倍倍尔本人作朋友的人；只要是关心我们伟大事业因倍倍尔的死亡而失去了它最有力的和最忠诚的先锋战士的人，都有这种感觉。\n\n倍倍尔遗留下来的写作材料一到我的手里，我立即开始执行我的亡友的遗嘱。\n\n我的工作，如倍倍尔所已指出，是不大的。但是它所给我的享受却大得多，单就它允许我重温一道意味着我们党的英雄时代的那些时期来说，这享受就已经很大了。凡是能够参与那时期党的工作的人，在记忆它时，没有不感到自豪的。而年轻的一代可以从那些胜利的艰苦的考验的回忆中为他们面前的伟大斗争吸取勇气和力量。因为最艰苦的事情还在我们面前：夺取政权。\n\n倍倍尔想在这个斗争中作我们的前导这个最热烈的希望不能实现了。但是我们伟大的先驱者的不朽的东西，继续生存在我们中间并将引导我们走向胜利和凯旋！"
 AOR_GER_MyLife.1.a:0 "£KK_signature"
 AOR_GER_MyLife.1.a.tt:0 "§g卡尔·考茨基§!"

 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●
 # 德国时间轴事件
 # 原文件：AOR_GER_Timeaxis_event_l_simp_chinese.yml
 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●

 ####################事件-时间轴####################
 GER.1.tt:0"在命运的抉择之下，唯有威权，可获长久。"

 
 AOR_GER_timeaxis.2.t:0 "会议就绪"
 AOR_GER_timeaxis.2.desc:0 "£GFX_AOR_GER_blank £GFX_AOR_GER_blank 除去法兰克福，符腾堡和南石荷等几个邦，其余各邦国的代表已经抵达柏林，在这个松散邦联里面大部分成员都不是真心实意地希望能为中央政府付出什么，往往是希望得到些什么。利用这种现实主义心理，我们可以顺其道而行之，讨论一些可行的决议，一步步地加深中央与地方的关系。"
 AOR_GER_timeaxis.2.a:0 "先讨论邦联的通货膨胀问题"
 AOR_GER_timeaxis.2.tt1:0 "£GFX_AOR_GER_blank £GFX_AOR_GER_blank 世界大战造成了世界范围内的经济动荡，而德国在经历内乱后无疑是通货膨胀最为严重的地区之一。但我们还没有完全失去对经济的控制——通过立法和默契般的配合，我们得以将持续走升的国家物价控制住。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 这是一项§Y有利于全体邦国的提案§!，因为这涉及到每一个德意志人民的切身利益。国家物价的每一次轻微波动，都能让每个底层百姓都有着深刻的“体会”，只有让通货膨胀处于良性通货膨胀或物价平稳的状态，经济才能得以有效发展。"
 AOR_GER_timeaxis.2.b:0 "先讨论邦国贸易税率问题"
 AOR_GER_timeaxis.2.tt2:0 "£GFX_AOR_GER_blank £GFX_AOR_GER_blank 德意志国的邦国之间就像一个个正常的主权国家那样相互收取税费，这在绝大多数德国人眼里是难以想象的。很多人在去年还是邻居，曾几何时却成为了购物都需要“跨国”的异乡人。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 尽管在政治上乃至意识形态上我们与各邦国之间存在着难以和解的天堑，但至少我们可以取消互相堆叠的贸易壁垒。尽管政府的财政收入变少了，但实际上政府的开销却能在经济走势平稳的趋势下§Y节省更多资源§!，以免进一步加深经济创，，让英法等国占了便宜。"
 AOR_GER_timeaxis.2.c:0 "先商讨合成氨技术军转民问题"
 AOR_GER_timeaxis.2.tt3:0 "£GFX_AOR_GER_blank £GFX_AOR_GER_blank 合成氨技术曾经是德意志帝国的掌上明珠，他在本世纪初给了帝国自给自足发动战争的可能性，只不过过去我们都是利用这项技术§Y制造弹药§!。如今大战已经结束，我们散落在各地的合成氨工厂在没有柏林政府指导和全国各地资源支持的情况下是难以为继的。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 在各地合成氨工厂能够自主生产铵盐之前，我们需要一段较长的整合时间——这§Y需要各邦国的配合§!。而回报无疑是明显的，英法不会在意我们将合成氨技术用以§Y制造化肥§!，但我们能在下次战争来临时将其转化为§Y军工厂§!。"
 
 AOR_GER_timeaxis.3.t:0 "关于国家委员会的运作模式"
 AOR_GER_timeaxis.3.desc:0 "£GFX_AOR_GER_blank £GFX_AOR_GER_blank 包括柏林中央政府在内，每一个德意志地区的政治实体都拥有属于自己的一票。受限于邦联制度，如果中央政府的提议得到了§Y超过半数邦国的赞成§!，那么会议作出的决议就能生效。各邦国都能依靠付出§O政治点数§!以§Y获取利益§!，每一个同意的邦国都将提高中央政府的收益，反对的邦国将不会给柏林任何回报。\n\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 值得一提的是，由于邦国的独立性，哪怕决定§g表面上支持§!柏林行使国家委员会的权力，各邦国也有§G最后决定权§!——决定是否在自己的地盘上执行方案。"
 AOR_GER_timeaxis.3.a:0 "好的"
 
 AOR_GER_timeaxis.5.t:0 "[FROM.GetName]要求我们述职述廉"
 AOR_GER_timeaxis.5.desc:0 "£GFX_AOR_GER_blank £GFX_AOR_GER_blank 柏林政府在经过一段时间的调整后，自觉已经有能力转变对自治区的态度。他们派来了重要官员与我们商讨加强联合邦国一体化的问题。这意味着我们需要向柏林政府负责并承担一定的“任务”，反过来，柏林政府也必须支持二者逐步实现一体化。尤其是在以后发生战争时，与北方政府的密切关系将成为我们站队的重要依据"
 AOR_GER_timeaxis.5.a:0 "今后，我们将同柏林政府站在一起"
 AOR_GER_timeaxis.5.tt1:0 "£GFX_AOR_GER_blank £GFX_AOR_GER_blank 这意味着我们将在政局发生巨大变化时站在柏林政府的一方。如果双方爆发战争，另一方都有责任和义务加入抗争。"
 AOR_GER_timeaxis.5.b:0 "还是请回吧，我们另谋他路"
 AOR_GER_timeaxis.5.tt1:0 "£GFX_AOR_GER_blank £GFX_AOR_GER_blank 这意味着我们彻底拒绝柏林政府抛出的橄榄枝。如果我们没有准备好选择自己的道路，我们将在政局发生巨大变化时成为北方政府的敌人。"
 AOR_GER_timeaxis.6.t:0 "[FROM.GetName]同意"
 AOR_GER_timeaxis.6.desc:0 "£GFX_AOR_GER_blank £GFX_AOR_GER_blank 在经过一番商讨后[FROM.GetName]同意了签署这份联合邦国一体化的条约，这意味着二者之间将不再存在隔阂。而我们必须小心维持这份来之不易的“内政和外交的胜利”。"
 AOR_GER_timeaxis.6.a:0 "很好"
 AOR_GER_timeaxis.7.t:0 "[FROM.GetName]拒绝"
 AOR_GER_timeaxis.7.desc:0 "£GFX_AOR_GER_blank £GFX_AOR_GER_blank [FROM.GetName]完全没有搭理我们的公务人员，甚至将他们轰了出去。"
 AOR_GER_timeaxis.7.a:0 "他们最好已经做出了觉悟"
 
 AOR_GER_timeaxis.8.t:0 "[FROM.GetName]希望和解"
 AOR_GER_timeaxis.8.desc:0 "£GFX_AOR_GER_blank £GFX_AOR_GER_blank [FROM.GetName]的总统艾伯特亲自来到西里西亚，表示自己愿意将菲利普·谢德曼请回柏林担任国家总理。二人倾诉许久，如果我们愿意向柏林让步，同意他们建立集权制政府，或许我们能更早地在德意志实现自由和民主，否则单单以西里西亚的力量，恐怕无法完成历史重任。同样的，艾伯特也同意在宪法修正和政府权力分配的时候能够向议会让步。"
 AOR_GER_timeaxis.8.a:0 "他还是忘不了往日的朋友"
 AOR_GER_timeaxis.8.b:0 "伤害是难以抚平的"
 
 AOR_GER_timeaxis.9.t:0 "[FROM.GetName]要求撤销自治区"
 AOR_GER_timeaxis.9.desc:0 "£GFX_AOR_GER_blank £GFX_AOR_GER_blank [FROM.GetName]的总统艾伯特日前签署了要求菲利普·谢德曼立即前往柏林述职的命令，这意味着如果我们同意艾伯特的要求，我们将加入到北方政府之中，将权力交接给他们"
 AOR_GER_timeaxis.9.a:0 "只能如此"
 AOR_GER_timeaxis.9.b:0 "我们将捍卫我们的自由"
 

 

 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●
 # 伯恩施坦相关事件
 # 原文件：AOR_GER_bernstein_l_simp_chinese.yml
 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●

 AOR_GER_bernstein.1.t:0 "社会主义的第三条道路？"
 AOR_GER_bernstein.1.desc:0 "天才伯恩斯坦，叛徒伯恩斯坦，伯恩斯坦，他究竟何许人也？\n\n他是柏林犹太家庭出身的银行职员，是德国社会民主党人，是恩格斯的得力助手，也是修正主义之父。反社会党人非常法持续期间，他流亡苏黎世，执掌《社会民主党人报》，宣传马克思主义；在被瑞士驱逐后，他又转赴伦敦，在费边社圈子里重新审视资本主义与民主。\n\n恩格斯逝世后，他随即在《新时代》提出资本主义仍有生命力的论断，并借“回到康德去”都口号强调伦理道德。而在斯图加特党大会上，他抛出的“运动就是一切，最终目的是微不足道的”定论引爆了大会。\n\n随着伯恩施坦接二连三提出堪称离经叛道的学说，党内争论随之而起。考茨基、卢森堡等人接连撰文，对他展开严厉批判。但倍倍尔为维护党内团结，只是略加弹压，使他的影响局限于自己的小圈子。可伯恩施坦依旧我行我素，追求着他设想中的新社会。\n\n总而言之，他绝非可耻的犹大，但也绝非无害的先知，他是伯恩斯坦，是目前社会民主党内部最具争议的转向者。\n\n回顾过往，德国似乎正按照着他的预言前进：魏玛的议会里，社会民主党手握过半数的支持，改良不再是为了妥协，而成了执政的日常；资本主义没有崩溃，中产没有消失...\n\n而在这样的时刻，让这位修正主义之父重新发声——"
 AOR_GER_bernstein.1.a:0 "倍倍尔是何用心？"
 AOR_GER_bernstein.1.tt_tarot:0 "［命运之轮］可以被抽取了———他代表着改变、周期与机遇"
 AOR_GER_bernstein.1.tt_warn:0 "§R命运本身无法被预测，倍倍尔并不知道此举会带来怎样的后果§!"

 # ●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●
