 AOR_GER_flavor.1.t:0 "真是酷毙了"
 AOR_GER_flavor.1.desc:0 "那年春天，我在柏林一家咖啡馆里第一次听见“knorke”（酷毙了）这个词。年轻人很喜欢把它挂在嘴边：火车晚点可以说，姑娘戴了一顶新帽子可以说，甚至有人失手摔碎了啤酒杯，低头看看满地玻璃，也会说一声。我把这事告诉一位年轻议员，他笑得差点把香肠掉进芥末里，随后告诉我，他们正打算教倍倍尔这个词。\n\n这听起来未免有些奇怪。奥古斯特·倍倍尔当时已经是共和国总统。老先生一向声称自己对年轻人的生活颇有兴趣，只可惜兴趣与理解之间，着实隔着相当长的距离。据说倍倍尔听完解释后，煞有介事地点了点头，拿起桌上的铅笔，在纸上认真记下了这个词。\n\n第二天，他便在内阁会议上试了一次。当时艾伯特正在作关于铁路预算的报告。倍倍尔听完，沉默了片刻，然后十分郑重地说：\n“真是酷毙了。”"
 AOR_GER_flavor.1.a:0 "——会议室里一片寂静，随即哄堂大笑。"
 AOR_GER_focus_1919.1.t:0 "埃森警察局报告节录"
 AOR_GER_focus_1919.1.desc:0 "据本局所属阿尔滕埃森、博尔贝克及弗罗恩豪森分局报告，当地学校及工人住宅区儿童中广泛传唱一首有关贵族财产处置的歌谣。该歌谣最初出现地点无法确定。各区所录歌词略有差异，但旋律及主要词句基本一致。目前未发现印刷品，亦无证据表明存在统一组织或专人教授。学校教师报告称，部分儿童已能完整背唱，且近来在埃森其他城区亦有发现。\n\n现将各分局记录中最常见之版本附录如下：\n\n一、二、三，（Eins, zwei, drei,）\n宫殿空出来。（das Schloß ist frei.）\n四、五、六，（Vier, fünf, sechs,）\n王子什么也没有。（der Prinz kriegt nix.）\n七、八，（Sieben, acht,）\n木柴送回家。（Holz wird heimgebracht.）\n九、十，（Neun und zehn,）\n我们要进宫殿去！（wir woll’n ins Schlosse geh’n!）\n一个芬尼也不给诸侯，（wir dürfen in den Garten gehn.）\n一个芬尼也不给，不给！（Keinen Pfennig den Fürsten, nein!）\n宫殿、树林还有草地，（Schloß und Wald und Wiesen,）\n都该归我们！ （sollen unser sein!）\n\n据补充报告，该歌谣已在盖尔森基兴、波鸿等地发现相近版本。有关部门认为，无继续追查其来源之必要。"
 AOR_GER_focus_1919.1.a:0 "一个芬尼也不给诸侯！"
