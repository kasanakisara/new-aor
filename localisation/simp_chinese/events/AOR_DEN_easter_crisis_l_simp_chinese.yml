l_simp_chinese:
 ####################################################################
 # 丹麦 · 复活节危机事件链
 # 世界观口径：1919.8—1922.7 的德意志共和国（社民党＋中央党，倍倍尔/哈泽）
 ####################################################################

 den_easter_crisis.1.t:0 "复活节危机"
 den_easter_crisis.1.d:0 "一九二〇年三月，两轮公投的结果摆在国王的书桌上：北石勒苏益格几乎全票要求回归丹麦，而中石勒苏益格与弗伦斯堡则以压倒性的多数选择留在德意志。\n\n按理，接下来的事应当由外交大臣与国联观察团去谈。但克里斯蒂安十世把文件合上，问了一个不在议程上的问题：“为什么我们只为一半的日德兰投票？”\n\n这句话在四十八小时内变成了三份文书：一份要求内阁在“南疆问题”上不得自行表态，一份要求由国王亲自主持对德交涉，一份是解散议会、提前大选的诏令草稿。扎赫勒当天下午入宫，出来时只说了一句：“陛下正在做一件宪法没有写、但宪法也没有明确禁止的事。”\n\n哥本哈根的报纸当晚分裂成两半：一半用头版印国王的画像，一半用头版印宪法条文。而在南边，刚刚在巴伐利亚危机里折了一阵、又被《国防法》风波困在柏林城里的德意志共和国，只发来一封措辞客气的照会——希望丹麦王国尊重公投的结果。没有舰队，没有最后通牒。"
 den_easter_crisis.1.a:0 "让宪法来回答。"

 den_easter_crisis.2.t:0 "国王的最后通牒"
 den_easter_crisis.2.d:0 "僵持的第十四天，国王把内阁全体召进克里斯蒂安堡宫。\n\n没有寒暄。国王宣读了三项要求：内阁立即撤回关于石勒苏益格的一切公开表态；对德交涉改由王室直接经手；议会于秋季之前解散重选。他说这不是命令，而是“对国家统一的最低要求”。\n\n扎赫勒的回答同样简短：内阁可以辞职，但不会交出议会授予的权力。走出宫门时，他对外面等候的记者说：“国王陛下有权要求，我们有权拒绝。这就是宪法。”\n\n当夜，社会民主党在工人区组织了数千人的集会，保守党则把王旗挂满了港口区的商铺。军营里没有动静——军官团的电报只写了一句：“等候陛下的进一步指示。”"
 den_easter_crisis.2.a:0 "王冠先于议会。"
 den_easter_crisis.2.b:0 "先例比国王更长久。"

 den_easter_crisis.3.t:0 "王冠与议会"
 den_easter_crisis.3.d:0 "妥协是在一张长桌上完成的，而不是在战场上。\n\n国王保留任免、解散与统帅的形式权力，把组阁权交还议会多数；议会在文本上承认石勒苏益格问题属于“王冠的议程”，并同意不追究那一纸最后通牒的越权。双方各让一步，各留一句可以写进回忆录的话。\n\n签字之后，克里斯蒂安十世做的第一件事，是召见那位以冷峻务实闻名的法学家奥托·利贝，委托他重组内阁：既让议会看到王室的诚意，也让保守派看到王冠还在。利贝在进宫的路上对随行秘书说了一句话：“我这一生做过很多案子，只有这一件，原告和被告都是同一个国家。”"
 den_easter_crisis.3.a:0 "把权力交给多数，把体面留给王冠。"

 den_easter_crisis.4.t:0 "议会至上"
 den_easter_crisis.4.d:0 "表决在一个阴天的下午举行。\n\n议会以近乎全体起立的结果通过了对王室特权的清算案：组阁权、解散权与军队统帅权的行使方式被逐条写进成文法，国王须在内阁附署之下行使一切实质权力。原先那份最后通牒被记录在案，但注明“不予追究”。\n\n投完票，扎赫勒走出大厅，在台阶上停了一会儿。他没有演讲，只是对身边的议员说：“从今天起，丹麦的王冠是一件衣服，而不是一根权杖。”\n\n哥本哈根所有的报纸第二天用了同一个标题：丹麦选择了投票箱。"
 den_easter_crisis.4.a:0 "丹麦选择了投票箱。"

 den_easter_crisis.5.t:0 "军营中的低语"
 den_easter_crisis.5.d:0 "最先动起来的不是议会，也不是街头，而是那些在军费削减名单上等了七年的军官。\n\n国王的副官、保守党的地方支部与边境的退伍军人协会在同一个月里完成了同一件事：把话说给国王听的人，从内阁换成了参谋部。哥本哈根没有人宣布政变——只是某个清晨起，街角的警察换成了佩枪的军官，社会民主党的集会申请被一份措辞严谨的公文驳回，两家激进报纸收到了“暂时休刊”的通知。\n\n克里斯蒂安十世仍然是国王。区别在于，从今往后他的命令不再需要任何人附署。而在工人区，人们开始把传单藏在面粉袋里；在南石勒苏益格的边境线上，德意志人的村庄与丹麦人的岗哨之间的距离，第一次用望远镜就能看清。"
 den_easter_crisis.5.a:0 "让秩序先于争论。"

 den_easter_crisis.6.t:0 "石勒苏益格的阴影"
 den_easter_crisis.6.d:0 "公投的结果送达哥本哈根那天，议会开了整整一夜的会。\n\n文件里每一个数字都合规矩：投票率超过九成，观察团签字齐全，程序无可指摘。但议会里没有人真的在看数字——他们在看那张地图。北石勒苏益格已经插上了丹麦的旗，而中石勒苏益格与弗伦斯堡，被一条用铅笔画出的线留在了德意志的版图里。\n\n南边的德意志共和国此时顾不上北方：它的巴伐利亚刚刚闹过准军事联盟，《国防法》把国防军撕成两半，柏林的命令出了城界就没人理会。也就是说，如果丹麦要把那条铅笔线改成别的样子，眼下没有人会来阻止——除了国际联盟、自己的良心，以及那些已经在南石勒苏益格组织起自卫团的德意志居民。"
 den_easter_crisis.6.a:0 "接受选票写下的边界。"
 den_easter_crisis.6.b:0 "把问题交给国际联盟。"
 den_easter_crisis.6.c:0 "边界不该由别国的选票决定。"
