l_simp_chinese:

 # ===== 魏玛代表大会事件链（events/AOR_GER_weimar_congress.txt）=====
 # 标题＝事件名；正文暂为“（待写文案）+ 要点”，方便对着要点补文。

 AOR_GER_weimar_congress.1.t:0 "魏玛代表大会（一）：开幕"
 AOR_GER_weimar_congress.1.d:0 "（待写文案）战后第一届全国代表大会开幕。\n要点：倍倍尔致辞（团结、民主共和国、与 DZP 的联盟）→ 哈泽附和并批评左派过激、批评右派对反革命警惕不足 → 谢德曼为旧军队辩护 → 诺斯克上台遭嘘。"
 AOR_GER_weimar_congress.1.a:0 "下一个发言的是……"

 AOR_GER_weimar_congress.2.t:0 "魏玛代表大会（二）：左派的反击"
 AOR_GER_weimar_congress.2.d:0 "（待写文案）左派全面反击，党改革动议被提出。\n要点：李卜克内西痛斥右派 → 卢森堡清算拖延武装、拖延社会化、轻视苏维埃，主张对策略／组织／理论作改革 → 雷德布尔把方向之争推迟到 1920 年波鸿代表大会 → 会议结束。"
 AOR_GER_weimar_congress.2.a:0 "党真的变了。"

 AOR_GER_weimar_congress.3.t:0 "领袖的背影"
 AOR_GER_weimar_congress.3.d:0 "（待写文案）大会结束后倍倍尔独自回到居所。\n要点：无力感与陌生感 → “现在还没到认输的时刻” → 出门去找考茨基。"
 AOR_GER_weimar_congress.3.a:0 "而工人的皇帝则走出了门外。"

 AOR_GER_weimar_congress.4.t:0 "左右派打嘴仗"
 AOR_GER_weimar_congress.4.d:0 "（待写文案）左派抨击右派背叛革命、想换掉右派领袖；右派抨击左派要搞政变专制。\n要点：勉强维持团结，一切留待波鸿代表大会；雷德布尔的党改革动议被推迟。"
 AOR_GER_weimar_congress.4.a:0 "至少，党还没有分裂。"
 AOR_GER_weimar_congress.4.tt:0 "党内团结度 §R-5§!\n党改革动议推迟到波鸿代表大会。"

 AOR_GER_weimar_congress.5.t:0 "列金去世"
 AOR_GER_weimar_congress.5.d:0 "（待写文案）原德国工会总委员会领袖列金去世，工会领导权出现空缺。"
 AOR_GER_weimar_congress.5.a:0 "工会也要不安宁了……"

 AOR_GER_weimar_congress.6.t:0 "抢先行动"
 AOR_GER_weimar_congress.6.d:0 "（待写文案）保守派想直接指定继任者失败；米勒与迪斯曼要求按程序召开工会全体大会，并提交三大焦点。"
 AOR_GER_weimar_congress.6.a:0 "工会全体大会将召开。"

 AOR_GER_weimar_congress.7.t:0 "法兰克福代表大会"
 AOR_GER_weimar_congress.7.d:0 "（待写文案）工会法兰克福代表大会开幕，总委员会改组为 ADGB，选举领导人并确定路线。\n要点：焦点① 产业工会／职业工会　② 战斗的革命工会／维持不变　③ 工厂代表会与工会的关系。"
 AOR_GER_weimar_congress.7.a:0 "剑拔弩张。"

 AOR_GER_weimar_congress.8.t:0 "剑拔弩张"
 AOR_GER_weimar_congress.8.d:0 "（待写文案）米勒、迪斯曼、莱帕特三方交锋，最后由投票决定工会归属。"
 AOR_GER_weimar_congress.8.a:0 "静待结果……"
 AOR_GER_weimar_congress.8.tt:0 "按拿下的焦点数结算：§Y3 个 → 左派§!；§Y1–2 个 → 中派§!；§Y0 个 → 右派§!。"

 AOR_GER_weimar_congress.9.t:0 "革命工长"
 AOR_GER_weimar_congress.9.d:0 "（待写文案）里夏德·米勒当选工会领导人，右派痛骂、左派欢呼，企业家开始政治动员。"
 AOR_GER_weimar_congress.9.a:0 "看看资产阶级发抖的样子！"

 AOR_GER_weimar_congress.10.t:0 "激进转向"
 AOR_GER_weimar_congress.10.d:0 "（待写文案）罗伯特·迪斯曼当选工会领导人，宣布工会转向更激进的立场，把工厂委员会纳入工会体系。"
 AOR_GER_weimar_congress.10.a:0 "也行吧。"

 AOR_GER_weimar_congress.11.t:0 "按部就班"
 AOR_GER_weimar_congress.11.d:0 "（待写文案）西奥多·莱帕特当选工会领导人，工会角色看来不会有什么变化。"
 AOR_GER_weimar_congress.11.a:0 "还是安稳点好。"

 AOR_GER_weimar_congress.12.t:0 "抓紧时间"
 AOR_GER_weimar_congress.12.d:0 "（待写文案）卢森堡在斯巴达克派内部会议上为半年后的代表大会作报告，党的改革运动开始。"
 AOR_GER_weimar_congress.12.a:0 "社会民主党的改革运动，就此开始。"

 AOR_GER_weimar_congress.13.t:0 "波鸿代表大会"
 AOR_GER_weimar_congress.13.d:0 "（待写文案）党改革运动在波鸿收束：确立新纲领、策略与组织原则，并逐项表决。（结算见下一张链）"
 AOR_GER_weimar_congress.13.a:0 "这一次，党要给自己换一副骨架。"
