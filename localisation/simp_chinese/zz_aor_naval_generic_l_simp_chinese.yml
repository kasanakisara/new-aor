 ENG_submarine_1_desc:0 "早期潜艇适合在近海伏击和封锁航道，其有限的水下续航要求艇长谨慎选择攻击时机。"
 ENG_submarine_2:0 "远洋潜艇艇体"
 ENG_submarine_2_desc:0 "扩大的燃料与补给空间使潜艇能够远离基地袭击商船，艇体强度也改善了其在恶劣海况下的生存能力。"
 ENG_submarine_3:0 "改进型潜艇艇体"
 ENG_submarine_3_desc:0 "更合理的舱室和蓄电池布局使潜艇具备更长的巡航时间，并为更有效的鱼雷攻击创造条件。"
 ENG_submarine_4:0 "先进潜艇艇体"
 ENG_submarine_4_desc:0 "先进潜艇艇体重视远洋航程、潜深与水下操纵，在通商航线上能够保持更持久的威胁。"
