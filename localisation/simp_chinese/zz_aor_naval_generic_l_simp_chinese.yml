 FRA_sub_ship_nuclear_engine_1_short:0 "潜艇反应堆"
 FRA_submarine_1:0 "早期潜艇艇体"
 FRA_submarine_1_desc:0 "早期潜艇适合在近海伏击和封锁航道，其有限的水下续航要求艇长谨慎选择攻击时机。"
 FRA_submarine_2:0 "远洋潜艇艇体"
 FRA_submarine_2_desc:0 "扩大的燃料与补给空间使潜艇能够远离基地袭击商船，艇体强度也改善了其在恶劣海况下的生存能力。"
 FRA_submarine_3:0 "改进型潜艇艇体"
 FRA_submarine_3_desc:0 "更合理的舱室和蓄电池布局使潜艇具备更长的巡航时间，并为更有效的鱼雷攻击创造条件。"
 FRA_submarine_4:0 "先进潜艇艇体"
 FRA_submarine_4_desc:0 "先进潜艇艇体重视远洋航程、潜深与水下操纵，在通商航线上能够保持更持久的威胁。"
 GER_SH_battleship_1:0 "超重战列舰 I型"
 GER_SH_battleship_1_desc:0 "在当前的世界形势下遵守海军条约已经变得完全没有必要了。挣脱了种种限制之后，我们现在可以全心全意地建造能同时对付数艘较小敌舰的、有史以来最重并且装备最优良的战列舰。"
 GER_SH_battleship_2:0 "超重战列舰 II型"
 GER_SH_battleship_2_desc:0 "我们在之前的超重战列舰上装上了更强大的武器以及改装过的火控系统。"
 GER_battle_cruiser_1:0 "战列巡洋舰体"
 GER_battle_cruiser_1_desc:0 "战列巡洋舰以主力舰火炮和较高航速进行远洋侦察与追击，代价是不能长期承受同级战列舰炮火。"
 GER_battle_cruiser_2:0 "改进型战列巡洋舰体"
 GER_battle_cruiser_2_desc:0 "改进动力与船体结构后，战列巡洋舰可以保留速度优势，同时加强对关键舱室的保护。"
 GER_battleship_1:0 "早期无畏舰体"
 GER_battleship_1_desc:0 "无畏舰以统一口径的主炮组成战列线，厚重装甲保障其在远距离炮战中继续作战。"
 GER_battleship_2:0 "超无畏舰体"
 GER_battleship_2_desc:0 "超无畏舰增大主炮口径并改善炮塔布局，力求在保持战列线防护的同时提高远距离打击能力。"
 GER_battleship_3:0 "改进型战列舰体"
 GER_battleship_3_desc:0 "改进舰体强度与内部布局后，战列舰可以承载更重的炮塔、装甲和燃料，并保持稳定的射击平台。"
 GER_battleship_4:0 "远洋战列舰体"
 GER_battleship_4_desc:0 "远洋战列舰强调续航、适航与主炮齐射重量。更大的舰体也让指挥和防空设备获得安装空间。"
 GER_carrier_1:0 "早期改装航空母舰体"
 GER_carrier_1_desc:0 "由现有舰船改装的航空母舰可供舰载机进行侦察与训练。狭小机库和有限的飞行甲板使其难以承担舰队主力任务。"
 GER_carrier_2:0 "早期专用航空母舰体"
 GER_carrier_2_desc:0 "专门设计的飞行甲板改善了飞机起降与储放条件，但这一时期的舰载机仍受航程、载弹量和天气限制。"
 GER_carrier_3:0 "航空母舰 III型"
 GER_carrier_3_desc:0 "改进的建造方式以及诸如甲板边升降机这类的更加专业的系统使这些航空母舰可以更高效的携带更多飞机。"
 GER_carrier_4:0 "航空母舰 IV型"
 GER_carrier_4_desc:0 "随着海军条约被越来越多的国家所无视，我们现在可以建造能携带前所未有的数量的飞机来确保制空权的航空母舰了。"
 GER_carrier_ship_engine_1:0 "50000马力引擎"
 GER_carrier_ship_engine_2:0 "120000马力引擎"
 GER_carrier_ship_engine_3:0 "150000马力引擎"
 GER_carrier_ship_engine_4:0 "210000马力引擎"
 GER_cruiser_ship_engine_1:0 "60000马力引擎"
 GER_cruiser_ship_engine_2:0 "70000马力引擎"
 GER_cruiser_ship_engine_3:0 "80000马力引擎"
 GER_cruiser_ship_engine_4:0 "90000马力引擎"
 GER_destroyer_1:0 "驱逐舰 I型"
 GER_destroyer_1_desc:0 "为了确保运输船的安全，第一次世界大战的驱逐舰需要更改它们的定位并改变它们的设计。新的设计将拥有更多的鱼雷来增加与敌人交火的机会。"
 GER_destroyer_2:0 "驱逐舰 II型"
 GER_destroyer_2_desc:0 "更长的鱼雷射程和更快的装填时间，外加诸如高角炮塔的新设计将使我们的驱逐舰变成更高效的多面手。"
 GER_destroyer_3:0 "驱逐舰 III型"
 GER_destroyer_3_desc:0 "为了应对来自空中以及水下的威胁，新型驱逐舰必须装备有雷达和更加先进的防空与反潜武器。"
 GER_destroyer_4:0 "驱逐舰 IV型"
 GER_destroyer_4_desc:0 "现代驱逐舰必须拥有多种不同的索敌装备，新型的深弹投放系统以及与以前的驱逐舰相比更大的吨位。"
