l_simp_chinese:
 basic_light_cruiser:0 "早期巡洋舰体"
 basic_light_cruiser_desc:0 "以旧式巡洋舰为基础的舰体仍可担任侦察和海外巡航任务，但其防护与布局难以适应更重的武备。"
 ship_hull_light_1:0 "早期驱逐舰体"
 ship_hull_light_1_desc:0 "以大战时期的鱼雷艇和驱逐舰为基础，这种轻型舰体能够承担近海警戒、舰队屏卫和鱼雷攻击。有限的航程使其更适合在本国港口附近作战。"
 ship_hull_light_2:0 "大战型驱逐舰体"
 ship_hull_light_2_desc:0 "战争证明，驱逐舰必须同时保护主力舰并威胁敌方战列线。更坚固的船体和充足的燃料储备使它能够伴随舰队远航。"
 ship_hull_light_3:0 "改进型驱逐舰体"
 ship_hull_light_3_desc:0 "更宽的甲板为防空炮、鱼雷发射管和反潜设备留下了位置。新型驱逐舰可以承担比旧式鱼雷艇更广泛的任务。"
 ship_hull_light_4:0 "先进驱逐舰体"
 ship_hull_light_4_desc:0 "大型驱逐舰将航程、适航性和武备集中在一副舰体上，足以在远洋舰队中独立执行警戒与突击任务。"
 light_cruiser_1:0 "早期巡洋舰体"
 light_cruiser_1_desc:0 "以旧式巡洋舰为基础的舰体仍可担任侦察和海外巡航任务，但其防护与布局难以适应更重的武备。"
 light_cruiser_2:0 "侦察巡洋舰体"
 light_cruiser_2_desc:0 "大战的经验强调航速、航程与舰队通信的重要性。新的巡洋舰体适合在主力舰前方搜索并掩护屏卫舰。"
 light_cruiser_3:0 "远洋巡洋舰体"
 light_cruiser_3_desc:0 "扩大燃料储备和改善船体强度，使巡洋舰能在远洋长期活动，并为更重的火炮与装甲预留空间。"
 light_cruiser_4:0 "先进巡洋舰体"
 light_cruiser_4_desc:0 "更大型的巡洋舰体提供了充足的模块位置，使指挥、侦察与舰炮火力能够集中在同一艘舰上。"
 heavy_cruiser_1:0 "早期巡洋舰体"
 heavy_cruiser_1_desc:0 "以旧式巡洋舰为基础的舰体仍可担任侦察和海外巡航任务，但其防护与布局难以适应更重的武备。"
 heavy_cruiser_2:0 "侦察巡洋舰体"
 heavy_cruiser_2_desc:0 "大战的经验强调航速、航程与舰队通信的重要性。新的巡洋舰体适合在主力舰前方搜索并掩护屏卫舰。"
 heavy_cruiser_3:0 "远洋巡洋舰体"
 heavy_cruiser_3_desc:0 "扩大燃料储备和改善船体强度，使巡洋舰能在远洋长期活动，并为更重的火炮与装甲预留空间。"
 battleship_1:0 "早期无畏舰体"
 battleship_1_desc:0 "无畏舰以统一口径的主炮组成战列线，厚重装甲保障其在远距离炮战中继续作战。"
 battleship_2:0 "超无畏舰体"
 battleship_2_desc:0 "超无畏舰增大主炮口径并改善炮塔布局，力求在保持战列线防护的同时提高远距离打击能力。"
 battleship_3:0 "改进型战列舰体"
 battleship_3_desc:0 "改进舰体强度与内部布局后，战列舰可以承载更重的炮塔、装甲和燃料，并保持稳定的射击平台。"
 battleship_4:0 "远洋战列舰体"
 battleship_4_desc:0 "远洋战列舰强调续航、适航与主炮齐射重量。更大的舰体也让指挥和防空设备获得安装空间。"
 battle_cruiser_1:0 "战列巡洋舰体"
 battle_cruiser_1_desc:0 "战列巡洋舰以主力舰火炮和较高航速进行远洋侦察与追击，代价是不能长期承受同级战列舰炮火。"
 battle_cruiser_2:0 "改进型战列巡洋舰体"
 battle_cruiser_2_desc:0 "改进动力与船体结构后，战列巡洋舰可以保留速度优势，同时加强对关键舱室的保护。"
 submarine_1:0 "早期潜艇艇体"
 submarine_1_desc:0 "早期潜艇适合在近海伏击和封锁航道，其有限的水下续航要求艇长谨慎选择攻击时机。"
 submarine_2:0 "远洋潜艇艇体"
 submarine_2_desc:0 "扩大的燃料与补给空间使潜艇能够远离基地袭击商船，艇体强度也改善了其在恶劣海况下的生存能力。"
 submarine_3:0 "改进型潜艇艇体"
 submarine_3_desc:0 "更合理的舱室和蓄电池布局使潜艇具备更长的巡航时间，并为更有效的鱼雷攻击创造条件。"
 submarine_4:0 "先进潜艇艇体"
 submarine_4_desc:0 "先进潜艇艇体重视远洋航程、潜深与水下操纵，在通商航线上能够保持更持久的威胁。"
 carrier_1:0 "早期改装航空母舰体"
 carrier_1_desc:0 "由现有舰船改装的航空母舰可供舰载机进行侦察与训练。狭小机库和有限的飞行甲板使其难以承担舰队主力任务。"
 carrier_2:0 "早期专用航空母舰体"
 carrier_2_desc:0 "专门设计的飞行甲板改善了飞机起降与储放条件，但这一时期的舰载机仍受航程、载弹量和天气限制。"
 ARG_battleship_1:0 "早期无畏舰体"
 ARG_battleship_1_desc:0 "无畏舰以统一口径的主炮组成战列线，厚重装甲保障其在远距离炮战中继续作战。"
