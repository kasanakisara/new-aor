 RAJ_light_cruiser_3_desc:0 "扩大燃料储备和改善船体强度，使巡洋舰能在远洋长期活动，并为更重的火炮与装甲预留空间。"
 RAJ_light_cruiser_4:0 "先进巡洋舰体"
 RAJ_light_cruiser_4_desc:0 "更大型的巡洋舰体提供了充足的模块位置，使指挥、侦察与舰炮火力能够集中在同一艘舰上。"
