 AST_battleship_4:0 "远洋战列舰体"
 AST_battleship_4_desc:0 "远洋战列舰强调续航、适航与主炮齐射重量。更大的舰体也让指挥和防空设备获得安装空间。"
 AST_carrier_1:0 "早期改装航空母舰体"
 AST_carrier_1_desc:0 "由现有舰船改装的航空母舰可供舰载机进行侦察与训练。狭小机库和有限的飞行甲板使其难以承担舰队主力任务。"
 AST_carrier_2:0 "早期专用航空母舰体"
