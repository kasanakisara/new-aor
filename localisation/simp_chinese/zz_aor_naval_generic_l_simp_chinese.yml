 USA_destroyer_1:0 "驱逐舰 I型"
 USA_destroyer_1_desc:0 "为了确保运输船的安全，第一次世界大战的驱逐舰需要更改它们的定位并改变它们的设计。新的设计将拥有更多的鱼雷来增加与敌人交火的机会。"
 USA_destroyer_2:0 "驱逐舰 II型"
 USA_destroyer_2_desc:0 "更长的鱼雷射程和更快的装填时间，外加诸如高角炮塔的新设计将使我们的驱逐舰变成更高效的多面手。"
 USA_destroyer_3:0 "驱逐舰 III型"
 USA_destroyer_3_desc:0 "为了应对来自空中以及水下的威胁，新型驱逐舰必须装备有雷达和更加先进的防空与反潜武器。"
 USA_destroyer_4:0 "驱逐舰 IV型"
 USA_destroyer_4_desc:0 "现代驱逐舰必须拥有多种不同的索敌装备，新型的深弹投放系统以及与以前的驱逐舰相比更大的吨位。"
