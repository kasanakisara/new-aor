 SAF_heavy_cruiser_3_desc:0 "扩大燃料储备和改善船体强度，使巡洋舰能在远洋长期活动，并为更重的火炮与装甲预留空间。"
 SAF_heavy_cruiser_4:0 "重巡洋舰 IV型"
 SAF_heavy_cruiser_4_desc:0 "这些重巡洋舰的最终型号往往更长、更大也更重，它们还装备有高射速的速射武器。"
 SAF_light_cruiser_1:0 "早期巡洋舰体"
 SAF_light_cruiser_1_desc:0 "以旧式巡洋舰为基础的舰体仍可担任侦察和海外巡航任务，但其防护与布局难以适应更重的武备。"
 SAF_light_cruiser_2:0 "侦察巡洋舰体"
 SAF_light_cruiser_2_desc:0 "大战的经验强调航速、航程与舰队通信的重要性。新的巡洋舰体适合在主力舰前方搜索并掩护屏卫舰。"
 SAF_light_cruiser_3:0 "远洋巡洋舰体"
 SAF_light_cruiser_3_desc:0 "扩大燃料储备和改善船体强度，使巡洋舰能在远洋长期活动，并为更重的火炮与装甲预留空间。"
 SAF_light_cruiser_4:0 "先进巡洋舰体"
 SAF_light_cruiser_4_desc:0 "更大型的巡洋舰体提供了充足的模块位置，使指挥、侦察与舰炮火力能够集中在同一艘舰上。"
 SAF_submarine_1:0 "早期潜艇艇体"
 SAF_submarine_1_desc:0 "早期潜艇适合在近海伏击和封锁航道，其有限的水下续航要求艇长谨慎选择攻击时机。"
 SAF_submarine_2:0 "远洋潜艇艇体"
 SAF_submarine_2_desc:0 "扩大的燃料与补给空间使潜艇能够远离基地袭击商船，艇体强度也改善了其在恶劣海况下的生存能力。"
 SAF_submarine_3:0 "改进型潜艇艇体"
 SAF_submarine_3_desc:0 "更合理的舱室和蓄电池布局使潜艇具备更长的巡航时间，并为更有效的鱼雷攻击创造条件。"
 SAF_submarine_4:0 "先进潜艇艇体"
 SAF_submarine_4_desc:0 "先进潜艇艇体重视远洋航程、潜深与水下操纵，在通商航线上能够保持更持久的威胁。"
 SIA_destroyer_1:0 "驱逐舰 I型"
 SIA_destroyer_1_desc:0 "为了确保运输船的安全，第一次世界大战的驱逐舰需要更改它们的定位并改变它们的设计。新的设计将拥有更多的鱼雷来增加与敌人交火的机会。"
 SIA_heavy_cruiser_1:0 "早期巡洋舰体"
 SIA_heavy_cruiser_1_desc:0 "以旧式巡洋舰为基础的舰体仍可担任侦察和海外巡航任务，但其防护与布局难以适应更重的武备。"
