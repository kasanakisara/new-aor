 ITA_dp_ship_secondaries_4:0 "127mm高平两用速射副炮"
 ITA_heavy_cruiser_1:0 "早期巡洋舰体"
 ITA_heavy_cruiser_1_desc:0 "以旧式巡洋舰为基础的舰体仍可担任侦察和海外巡航任务，但其防护与布局难以适应更重的武备。"
 ITA_heavy_cruiser_2:0 "侦察巡洋舰体"
 ITA_heavy_cruiser_2_desc:0 "大战的经验强调航速、航程与舰队通信的重要性。新的巡洋舰体适合在主力舰前方搜索并掩护屏卫舰。"
 ITA_heavy_cruiser_3:0 "远洋巡洋舰体"
 ITA_heavy_cruiser_3_desc:0 "扩大燃料储备和改善船体强度，使巡洋舰能在远洋长期活动，并为更重的火炮与装甲预留空间。"
 ITA_heavy_cruiser_4:0 "重巡洋舰 IV型"
 ITA_heavy_cruiser_4_desc:0 "这些重巡洋舰的最终型号往往更长、更大也更重，它们还装备有高射速的速射武器。"
