 AST_SH_battleship_1:0 "超重战列舰 I型"
 AST_SH_battleship_1_desc:0 "在当前的世界形势下遵守海军条约已经变得完全没有必要了。挣脱了种种限制之后，我们现在可以全心全意地建造能同时对付数艘较小敌舰的、有史以来最重并且装备最优良的战列舰。"
 AST_SH_battleship_2:0 "超重战列舰 II型"
 AST_SH_battleship_2_desc:0 "我们在之前的超重战列舰上装上了更强大的武器以及改装过的火控系统。"
 AST_battle_cruiser_1:0 "战列巡洋舰体"
 AST_battle_cruiser_1_desc:0 "战列巡洋舰以主力舰火炮和较高航速进行远洋侦察与追击，代价是不能长期承受同级战列舰炮火。"
