 RAJ_SH_battleship_1:0 "超重战列舰 I型"
 RAJ_SH_battleship_1_desc:0 "在当前的世界形势下遵守海军条约已经变得完全没有必要了。挣脱了种种限制之后，我们现在可以全心全意地建造能同时对付数艘较小敌舰的、有史以来最重并且装备最优良的战列舰。"
 RAJ_SH_battleship_2:0 "超重战列舰 II型"
 RAJ_SH_battleship_2_desc:0 "我们在之前的超重战列舰上装上了更强大的武器以及改装过的火控系统。"
 RAJ_basic_light_cruiser:0 "早期巡洋舰体"
 RAJ_battle_cruiser_1:0 "战列巡洋舰体"
 RAJ_battle_cruiser_1_desc:0 "战列巡洋舰以主力舰火炮和较高航速进行远洋侦察与追击，代价是不能长期承受同级战列舰炮火。"
 RAJ_battle_cruiser_2:0 "改进型战列巡洋舰体"
 RAJ_battle_cruiser_2_desc:0 "改进动力与船体结构后，战列巡洋舰可以保留速度优势，同时加强对关键舱室的保护。"
 RAJ_battleship_1:0 "早期无畏舰体"
 RAJ_battleship_1_desc:0 "无畏舰以统一口径的主炮组成战列线，厚重装甲保障其在远距离炮战中继续作战。"
 RAJ_battleship_2:0 "超无畏舰体"
 RAJ_battleship_2_desc:0 "超无畏舰增大主炮口径并改善炮塔布局，力求在保持战列线防护的同时提高远距离打击能力。"
 RAJ_battleship_3:0 "改进型战列舰体"
 RAJ_battleship_3_desc:0 "改进舰体强度与内部布局后，战列舰可以承载更重的炮塔、装甲和燃料，并保持稳定的射击平台。"
 RAJ_battleship_4:0 "远洋战列舰体"
 RAJ_battleship_4_desc:0 "远洋战列舰强调续航、适航与主炮齐射重量。更大的舰体也让指挥和防空设备获得安装空间。"
 RAJ_carrier_1:0 "早期改装航空母舰体"
 RAJ_carrier_1_desc:0 "由现有舰船改装的航空母舰可供舰载机进行侦察与训练。狭小机库和有限的飞行甲板使其难以承担舰队主力任务。"
 RAJ_carrier_2:0 "早期专用航空母舰体"
 RAJ_carrier_2_desc:0 "专门设计的飞行甲板改善了飞机起降与储放条件，但这一时期的舰载机仍受航程、载弹量和天气限制。"
 RAJ_carrier_3:0 "航空母舰 III型"
 RAJ_carrier_3_desc:0 "改进的建造方式以及诸如甲板边升降机这类的更加专业的系统使这些航空母舰可以更高效的携带更多飞机。"
 RAJ_carrier_4:0 "航空母舰 IV型"
 RAJ_carrier_4_desc:0 "随着海军条约被越来越多的国家所无视，我们现在可以建造能携带前所未有的数量的飞机来确保制空权的航空母舰了。"
 RAJ_destroyer_1:0 "驱逐舰 I型"
 RAJ_destroyer_1_desc:0 "为了确保运输船的安全，第一次世界大战的驱逐舰需要更改它们的定位并改变它们的设计。新的设计将拥有更多的鱼雷来增加与敌人交火的机会。"
 RAJ_destroyer_2:0 "驱逐舰 II型"
 RAJ_destroyer_2_desc:0 "更长的鱼雷射程和更快的装填时间，外加诸如高角炮塔的新设计将使我们的驱逐舰变成更高效的多面手。"
 RAJ_destroyer_3:0 "驱逐舰 III型"
 RAJ_destroyer_3_desc:0 "为了应对来自空中以及水下的威胁，新型驱逐舰必须装备有雷达和更加先进的防空与反潜武器。"
 RAJ_destroyer_4:0 "驱逐舰 IV型"
 RAJ_destroyer_4_desc:0 "现代驱逐舰必须拥有多种不同的索敌装备，新型的深弹投放系统以及与以前的驱逐舰相比更大的吨位。"
 RAJ_heavy_cruiser_1:0 "早期巡洋舰体"
 RAJ_heavy_cruiser_1_desc:0 "以旧式巡洋舰为基础的舰体仍可担任侦察和海外巡航任务，但其防护与布局难以适应更重的武备。"
 RAJ_heavy_cruiser_2:0 "侦察巡洋舰体"
 RAJ_heavy_cruiser_2_desc:0 "大战的经验强调航速、航程与舰队通信的重要性。新的巡洋舰体适合在主力舰前方搜索并掩护屏卫舰。"
 RAJ_heavy_cruiser_3:0 "远洋巡洋舰体"
 RAJ_heavy_cruiser_3_desc:0 "扩大燃料储备和改善船体强度，使巡洋舰能在远洋长期活动，并为更重的火炮与装甲预留空间。"
 RAJ_heavy_cruiser_4:0 "重巡洋舰 IV型"
 RAJ_heavy_cruiser_4_desc:0 "这些重巡洋舰的最终型号往往更长、更大也更重，它们还装备有高射速的速射武器。"
 RAJ_light_cruiser_1:0 "早期巡洋舰体"
 RAJ_light_cruiser_1_desc:0 "以旧式巡洋舰为基础的舰体仍可担任侦察和海外巡航任务，但其防护与布局难以适应更重的武备。"
