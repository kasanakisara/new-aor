 aor_dd_1923_desc:0 "提高干舷并改进舰艏形状，使驱逐舰能够在恶劣海况下维持航速和使用武器。更合理的舱室与燃料布置提高了远洋护航能力，为后续大型驱逐舰奠定基础。"

