l_simp_chinese:
 early_ship_hull_light:0 "早期驱逐舰体"
 early_ship_hull_light_desc:0 "以大战时期的鱼雷艇和驱逐舰为基础，这种轻型舰体能够承担近海警戒、舰队屏卫和鱼雷攻击。有限的航程使其更适合在本国港口附近作战。"
 tech_1919_ship_hull_light:0 "大战型驱逐舰体"
 tech_1919_ship_hull_light_desc:0 "战争证明，驱逐舰必须同时保护主力舰并威胁敌方战列线。更坚固的船体和充足的燃料储备使它能够伴随舰队远航。"
 aor_dd_1927:0 "改进型驱逐舰体"
 aor_dd_1927_desc:0 "更宽的甲板为防空炮、鱼雷发射管和反潜设备留下了位置。新型驱逐舰可以承担比旧式鱼雷艇更广泛的任务。"
 aor_dd_1930:0 "先进驱逐舰体"
 aor_dd_1930_desc:0 "大型驱逐舰将航程、适航性和武备集中在一副舰体上，足以在远洋舰队中独立执行警戒与突击任务。"
 aor_depth_1919:0 "基础深水炸弹"
 aor_depth_1919_desc:0 "舰尾投放的深水炸弹使水面舰艇有了攻击潜航目标的手段，但必须准确判断潜艇的位置和航向。"
 aor_depth_1923:0 "深水炸弹投放器"
 aor_depth_1923_desc:0 "侧向投射装置扩大了深水炸弹的覆盖范围，使护航舰不必从潜艇正上方驶过也能实施攻击。"
 aor_depth_1927:0 "改进深水炸弹投放器"
 aor_depth_1927_desc:0 "改进引信与投放程序后，护航舰可以在预计潜深附近更快地布设爆炸带。"
 aor_sonar_1919:0 "早期水听器"
 aor_sonar_1919_desc:0 "水听器能够在海面以下捕捉螺旋桨和机械噪声，为护航舰提供目视搜索之外的线索。"
 aor_sonar_1925:0 "主动式声呐"
 aor_sonar_1925_desc:0 "主动发射声波并分析回波，可以在一定条件下测定潜艇方位；海况与本舰噪声仍会限制探测效果。"
 aor_sonar_1930:0 "改进主动式声呐"
 aor_sonar_1930_desc:0 "更可靠的换能器与操作程序改善了主动声呐的测向能力，让反潜舰艇更容易保持接触。"
 early_ship_hull_light_cruiser:0 "早期巡洋舰体"
 early_ship_hull_light_cruiser_desc:0 "以旧式巡洋舰为基础的舰体仍可担任侦察和海外巡航任务，但其防护与布局难以适应更重的武备。"
 tech_1919_ship_hull_light_cruiser:0 "侦察巡洋舰体"
 tech_1919_ship_hull_light_cruiser_desc:0 "大战的经验强调航速、航程与舰队通信的重要性。新的巡洋舰体适合在主力舰前方搜索并掩护屏卫舰。"
 aor_cr_1923:0 "远洋巡洋舰体"
 aor_cr_1923_desc:0 "扩大燃料储备和改善船体强度，使巡洋舰能在远洋长期活动，并为更重的火炮与装甲预留空间。"
 aor_cr_1930:0 "先进巡洋舰体"
 aor_cr_1930_desc:0 "更大型的巡洋舰体提供了充足的模块位置，使指挥、侦察与舰炮火力能够集中在同一艘舰上。"
 early_ship_hull_heavy:0 "早期无畏舰体"
 early_ship_hull_heavy_desc:0 "无畏舰以统一口径的主炮组成战列线，厚重装甲保障其在远距离炮战中继续作战。"
 tech_1919_ship_hull_heavy:0 "超无畏舰体"
 tech_1919_ship_hull_heavy_desc:0 "超无畏舰增大主炮口径并改善炮塔布局，力求在保持战列线防护的同时提高远距离打击能力。"
 aor_bb_1923:0 "改进型重战舰体"
 aor_bb_1923_desc:0 "改进舰体强度与内部布局后，战列舰可以承载更重的炮塔、装甲和燃料，并保持稳定的射击平台。"
 aor_bb_1927:0 "大型重战舰体"
 aor_bb_1927_desc:0 "远洋战列舰强调续航、适航与主炮齐射重量。更大的舰体也让指挥和防空设备获得安装空间。"
 aor_bb_1930:0 "超重型战列舰体"
 aor_bb_1930_desc:0 "对更大主力舰的设想要求更强的船体、更重的装甲和更多炮塔。其建设成本同样会考验一个国家的工业能力。"
 tech_1919_crusier_battleship_hull:0 "战列巡洋舰体"
 tech_1919_crusier_battleship_hull_desc:0 "战列巡洋舰以主力舰火炮和较高航速进行远洋侦察与追击，代价是不能长期承受同级战列舰炮火。"
 aor_bc_1925:0 "改进型战巡舰体"
 aor_bc_1925_desc:0 "改进动力与船体结构后，战列巡洋舰可以保留速度优势，同时加强对关键舱室的保护。"
 aor_bc_1930:0 "先进战巡舰体"
 aor_bc_1930_desc:0 "大型战列巡洋舰能够携带更多主炮与辅助武器，但其速度、火力和防护仍需谨慎取舍。"
 aor_cv_1927:0 "甲板改装型航母"
 aor_cv_1927_desc:0 "由现有舰船改装的航空母舰可供舰载机进行侦察与训练。狭小机库和有限的飞行甲板使其难以承担舰队主力任务。"
 aor_cv_1930:0 "初期专用航母"
 aor_cv_1930_desc:0 "专门设计的飞行甲板改善了飞机起降与储放条件，但这一时期的舰载机仍受航程、载弹量和天气限制。"
 early_ship_hull_submarine:0 "早期潜艇艇体"
 early_ship_hull_submarine_desc:0 "早期潜艇适合在近海伏击和封锁航道，其有限的水下续航要求艇长谨慎选择攻击时机。"
 tech_1919_ship_hull_submarine:0 "远洋潜艇艇体"
 tech_1919_ship_hull_submarine_desc:0 "扩大的燃料与补给空间使潜艇能够远离基地袭击商船，艇体强度也改善了其在恶劣海况下的生存能力。"
 aor_ss_1925:0 "改进型潜艇艇体"
 aor_ss_1925_desc:0 "更合理的舱室和蓄电池布局使潜艇具备更长的巡航时间，并为更有效的鱼雷攻击创造条件。"
 aor_ss_1930:0 "先进潜艇艇体"
 aor_ss_1930_desc:0 "先进潜艇艇体重视远洋航程、潜深与水下操纵，在通商航线上能够保持更持久的威胁。"
 aor_lightgun_1919:0 "基础轻型炮组"
 aor_lightgun_1919_desc:0 "轻型舰炮是驱逐舰与巡洋舰的常见武器，适合与敌方屏卫舰交战。"
 aor_lightgun_1921:0 "小口径炮弹改良"
 aor_lightgun_1921_desc:0 "改进小口径炮的供弹和炮架，可在不显著增加重量的情况下维持更快的射速。"
 aor_lightgun_1925:0 "改进型轻型炮组"
 aor_lightgun_1925_desc:0 "更可靠的炮座与装填机构，使轻型舰艇能够在海上持续输出火力。"
 aor_lightgun_1929:0 "轻炮供弹改良"
 aor_lightgun_1929_desc:0 "统一弹药规格与炮弹储存方式，有助于减少舰上补给和装填的困难。"
 aor_lightgun_1930:0 "先进轻型炮组"
 aor_lightgun_1930_desc:0 "先进轻型炮组改善了旋回、俯仰和装填效率，使小型舰艇更容易抓住短暂的射击机会。"
 aor_mediumgun_1919:0 "基础中型炮组"
 aor_mediumgun_1919_desc:0 "中口径火炮为巡洋舰提供了压制小型舰艇的火力，也适合在远洋巡逻中使用。"
 aor_mediumgun_1923:0 "中口径被帽穿甲弹"
 aor_mediumgun_1923_desc:0 "采用更合理的炮弹结构，可提高中口径舰炮对装甲目标的穿透能力。"
 aor_mediumgun_1925:0 "改进型中型炮组"
 aor_mediumgun_1925_desc:0 "封闭式炮塔改善了炮组在恶劣天气下的作业条件，并提高了持续射击能力。"
 aor_mediumgun_1929:0 "中型炮弹改良"
 aor_mediumgun_1929_desc:0 "改进装填设备与弹药通道，能够减少巡洋舰在连续齐射时的火力中断。"
 aor_mediumgun_1930:0 "先进中型炮组"
 aor_mediumgun_1930_desc:0 "先进中型炮组在射速、射程与防护之间取得平衡，是巡洋舰的可靠主武器。"
 basic_battery:0 "海军舰炮"
 basic_battery_desc:0 "重型舰炮是主力舰海战的核心。炮塔、弹药库和测距设备必须作为一整套系统设计。"
 aor_heavygun_1919:0 "基础重型炮组"
 aor_heavygun_1919_desc:0 "大战后的主炮设计重视更远射程和更可靠的装填机构，以充分发挥战列舰的齐射威力。"
 aor_heavygun_1921:0 "被帽穿甲弹改良"
 aor_heavygun_1921_desc:0 "改进穿甲弹弹体和引信，能够提高炮弹在击穿装甲后仍保持完整的机会。"
 aor_heavygun_1923:0 "改进型重型炮组"
 aor_heavygun_1923_desc:0 "改进炮塔与炮架，使大型舰炮在远距离交战中保持稳定射击。"
 aor_heavygun_1927:0 "重炮装填改良"
 aor_heavygun_1927_desc:0 "优化炮塔防护和弹药升降机，有助于主力舰在猛烈炮战中维持火力。"
 aor_heavygun_1930:0 "超重型炮组"
 aor_heavygun_1930_desc:0 "超重型舰炮可以对敌方主力舰构成巨大威胁，但其炮塔重量与建造成本同样惊人。"
 aor_secondary_1919:0 "基础副炮组"
 aor_secondary_1919_desc:0 "副炮能够保护主力舰免受驱逐舰接近，并在中近距离交战中补充火力。"
 aor_secondary_1925:0 "副炮炮座改良"
 aor_secondary_1925_desc:0 "改进炮位布置和射界，使副炮在本舰转向时仍能覆盖重要方向。"
 aor_secondary_1929:0 "改进型副炮组"
 aor_secondary_1929_desc:0 "改良副炮炮座与供弹设备，提高了主力舰对轻型舰艇的持续压制能力。"
 aor_aa_1919:0 "基础舰载高炮"
 aor_aa_1919_desc:0 "舰载高射炮为军舰提供初步的对空火力，其效果仍受到测距和炮手训练的限制。"
 aor_aa_1925:0 "高角炮架改良"
 aor_aa_1925_desc:0 "采用更大的仰角和更灵活的炮架，可让舰炮更快追踪低空目标。"
 aor_aa_1930:0 "改进型舰载高炮"
 aor_aa_1930_desc:0 "改进型舰载高射炮使舰队能够形成更密集的防空火网，但尚不能完全阻止飞机突袭。"
 basic_torpedo:0 "基础鱼雷"
 basic_torpedo_desc:0 "鱼雷以自航方式攻击舰船水线以下部位，是小型舰艇对抗主力舰的重要武器。"
 aor_torpedo_1919:0 "双联装鱼雷发射器"
 aor_torpedo_1919_desc:0 "双联装鱼雷发射管使驱逐舰能够在一次攻击中投出更多鱼雷，提高命中机会。"
 aor_torpedo_1923:0 "鱼雷湿热动力改良"
 aor_torpedo_1923_desc:0 "改进推进装置的稳定性，可以减少鱼雷偏离既定航向的情况。"
 aor_torpedo_1927:0 "三联装鱼雷发射器"
 aor_torpedo_1927_desc:0 "更多发射管和更完善的瞄准装置，使鱼雷攻击适合在舰队交战中集中实施。"
 aor_torpedo_1930:0 "改进型鱼雷发射器"
 aor_torpedo_1930_desc:0 "改进型鱼雷发射系统提高了装填与发射效率，仍需要舰艇接近危险的攻击距离。"
 aor_engine_1914:0 "燃油锅炉与蒸汽轮机"
 aor_engine_1914_desc:0 "燃油锅炉与蒸汽轮机为现代军舰提供了可靠动力，也是大舰队远航的基础。"
 aor_engine_1919:0 "减速齿轮蒸汽轮机"
 aor_engine_1919_desc:0 "更紧凑的轮机和改良锅炉，可以在有限舱室内提供更高功率。"
 aor_engine_1925:0 "改进型燃油轮机"
 aor_engine_1925_desc:0 "提高燃油效率与传动可靠性，有助于军舰保持航速并扩大巡航半径。"
 aor_engine_1930:0 "先进燃油轮机"
 aor_engine_1930_desc:0 "先进燃油轮机能够驱动更大舰体，但高速航行仍会迅速消耗燃料。"
 aor_armorheavy_1919:0 "重点防护装甲方案"
 aor_armorheavy_1919_desc:0 "主力舰装甲必须保护弹药库与动力装置，同时抵御炮弹和水下爆炸造成的损伤。"
 aor_armorheavy_1923:0 "倾斜装甲带方案"
 aor_armorheavy_1923_desc:0 "倾斜装甲带使炮弹需要穿过更长的钢板路径，从而提高关键舱室的防护效率。"
 aor_armorheavy_1927:0 "加强型水下防护"
 aor_armorheavy_1927_desc:0 "改进防雷隔舱和水下防护系统，可降低鱼雷命中后进水向邻近舱室扩散的风险。"
 aor_armorheavy_1930:0 "先进重舰装甲方案"
 aor_armorheavy_1930_desc:0 "更厚的装甲和更周密的内部防护可以增强主力舰的持久力，但也会增加成本并拖慢航速。"
 aor_armorcr_1919:0 "基础巡洋舰装甲"
 aor_armorcr_1919_desc:0 "巡洋舰装甲以保护机舱、弹药库和指挥设施为主，必须兼顾高速航行所需的重量限制。"
 aor_armorcr_1925:0 "改进巡洋舰装甲"
 aor_armorcr_1925_desc:0 "改良甲板与舷侧装甲的分配，使巡洋舰在遭受远距离炮火时有更大的生存机会。"
 aor_armorcr_1930:0 "先进巡洋舰装甲"
 aor_armorcr_1930_desc:0 "更完善的巡洋舰防护方案能够保护关键部位，同时为火炮和动力装置保留排水量。"
 aor_fcs_1914:0 "光学测距仪"
 aor_fcs_1914_desc:0 "测距仪和机械计算装置使主炮能够进行较有组织的齐射。"
 basic_fire_control_system:0 "中央射击指挥"
 basic_fire_control_system_desc:0 "集中火力指挥减少了各炮塔独立瞄准造成的误差，让舰队在远距离保持射击节奏。"
 aor_fcs_1925:0 "机电射击解算"
 aor_fcs_1925_desc:0 "改良的测距与弹道计算设备，有助于舰炮在本舰和目标都在机动时修正射击诸元。"
 aor_fcs_1930:0 "改进型火控系统"
 aor_fcs_1930_desc:0 "更完善的舰上火控系统将测距、通信和炮塔操作连接起来，提升远距离齐射的效率。"
 aor_airscout_1919:0 "水上侦察机设施"
 aor_airscout_1919_desc:0 "在巡洋舰上搭载水上侦察机，可以扩展舰队对地平线外目标的搜索范围。"
 aor_airscout_1923:0 "水上飞机弹射器"
 aor_airscout_1923_desc:0 "弹射器允许水上飞机不依赖港口设施起飞，但回收与维护仍会占用甲板空间。"
 aor_airscout_1927:0 "改进型飞机弹射器"
 aor_airscout_1927_desc:0 "改进弹射器结构和甲板作业流程，可缩短侦察机出动准备时间。"
 damage_control_1:0 "消防演练"
 damage_control_1_desc:0 "从舰长到水手，每个人都必须熟悉消防、堵漏和隔离受损舱室的程序。"
 aor_damage_1923:0 "分散的消防管道"
 aor_damage_1923_desc:0 "分散布置消防管线和水泵，可避免单处损坏使全舰失去损害控制能力。"
 aor_damage_1927:0 "应急排水设备"
 aor_damage_1927_desc:0 "便携泵、应急照明和备用工具使水手能够更快处理进水与火灾。"
 fire_control_methods_1:0 "夹叉射击"
 fire_control_methods_1_desc:0 "训练舰炮组按照统一口令修正落点，是远距离炮战取得命中的第一步。"
 aor_gunnery_1925:0 "梯次齐射"
 aor_gunnery_1925_desc:0 "跨射观察让炮术军官判断弹着点分布，并逐次收紧齐射范围。"
 aor_gunnery_1929:0 "统一射击程序"
 aor_gunnery_1929_desc:0 "统一射击程序和炮塔通信，使多座主炮炮塔能够作为一个整体行动。"
 basic_naval_mines:0 "触发式水雷"
 basic_naval_mines_desc:0 "水雷能够封锁狭窄水道和港口入口，使敌舰即便没有遭遇舰队也要承担损失风险。"
 aor_mines_1919:0 "布雷与扫雷装置"
 aor_mines_1919_desc:0 "扫雷装置帮助舰艇开辟安全航道，但必须在缓慢航速下仔细作业。"
 aor_mines_1925:0 "改进触发式水雷"
 aor_mines_1925_desc:0 "改进锚链和引信使水雷更适合在复杂海况下长期部署。"
 aor_mines_1929:0 "潜艇布雷装置"
 aor_mines_1929_desc:0 "潜艇布雷允许在敌方沿岸秘密布设雷区，但会占用鱼雷和补给空间。"
 mtg_transport:0 "运输船"
 mtg_transport_desc:0 "运输船与登陆计划使有限规模的渡海行动成为可能；改进装载流程还能缩短登陆准备时间。"
 aor_landing_1923:0 "登陆组织"
 aor_landing_1923_desc:0 "预先编组运输队与登陆次序，可扩大登陆规模、缩短准备时间，并增强部队在滩头的防御。"
 aor_landing_1930:0 "早期专用登陆艇"
 aor_landing_1930_desc:0 "浅吃水专用登陆艇可扩大登陆规模，改善部队上岸时的攻击与防御能力，但仍需要舰队掩护。"
