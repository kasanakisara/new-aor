l_simp_chinese:
 # 1920.12 - 1921.9：依据思维导图原文，仅修正明显错字与重复表述。
 GER_now_what:0 "胜利之后的问题"
 GER_now_what_desc:0 "我们胜利了，暂时的，右翼势力一波又一波地冲击我们的政权，可我们还是坚持下来了。现在我们迎来了一段时间的稳定期，是时候抽出空来做一些应该做却因为冲突不断来不及做的事情了。"
 GER_country_problems:0 "调查乡村"
 GER_country_problems_desc:0 "调查乡村地区的农民诉求、摸清乡村权力结构、寻找可结盟势力、重新考量农业政策。重整地方农业部，尝试建立亲近社会主义的农业机关，当然，受到庄园主把持的农民联盟以及旧国家机构肯定会想方设法地阻止我们。"
 GER_yao_zao_fan_a:0 "要造反啊！"
 GER_yao_zao_fan_a_desc:0 "撤换参与骚乱或者包庇叛乱分子的官员"
 GER_watch_far_right:0 "监视极右组织"
 GER_watch_far_right_desc:0 ""
 GER_obstruct_judiciary:0 "治疗“右盲症”"
 GER_obstruct_judiciary_desc:0 "众所周知，我们的司法机关普遍存在着“右盲症”的疾病，总是看不见来自右边的政治犯罪行为，在司法中偏袒他们。在民主国家中，这种症状会极大地影响法治秩序的健康。为此，我们为这些右盲症患者们准备了一系列的治疗方案，虽然久病难医，但有总比没有好。"
 GER_agricultural_subsidy:0 "农业补贴"
 GER_agricultural_subsidy_desc:0 "埃尔茨贝格的改革成功地筹集了共和国所急需的经费，但也导致了一些中等农场的所有者趋近破产，而大农场所有者，即庄园主们往往能够通过争取政策倾斜来缓解带来的影响，最终负担压在了中小农身上，为了防止中小农进一步转向激烈反对我们，我们决定对经营困难的中小农场进行补贴，以帮助他们度过难关。"
 GER_support_agri_workers:0 "支持农业工会"
 GER_support_agri_workers_desc:0 "四月革命后，对农业工人结社的压制被废除，一大批农业工人加入了社会主义工会系统中的农业工会，人数一度超过了一百万人，他们渴望改善自身境遇，找到自己利益的代表。\n\n然而，出于保持粮食供应不愿发动农业工人罢工的右倾错误，以及保罗·希尔施和沃尔夫冈·海涅在原普鲁士邦执政中严重偏向保守官僚和庄园主，许多农业工人正在对社会主义运动感到失望，开始退出工会。\n\n我们必须立刻采取措施来挽救农业工会不断流失会员的局面，在行动中积极代表农业工人的利益。"
 GER_rescue_and_compensate:0 "营救与赔偿"
 GER_rescue_and_compensate_desc:0 "营救遭到庄园主或地方执法机关非法扣押的SPD党员。同时，赔偿那些有家庭成员死于冲突中或因冲突造成损失的家庭。"
 GER_qu_pulushi:0 "普鲁士邦的最终拆解"
 GER_qu_pulushi_desc:0 "由于此前不断的政治风波，拆分普鲁士邦的工作不得不陷入停滞，在局势稳定后，我们将继续按照立国之初国民会议的精神将旧普鲁士邦按照经济、地理、文化条件划分为数个面积、人口大致相等的州。拆解普鲁士邦代之以更科学的行政区划划分不仅有利于使得各地区能够更有效地进行经济、行政工作，而且借着拆解普鲁士邦的工作，我们可以削弱行政机关中那些保守派旧官僚的影响力。"
 GER_coastal_city_expansion:0 "滨海城市的扩张"
 GER_coastal_city_expansion_desc:0 "滨海城市，尤其是汉堡地区此前一直有将在经济与地理上已经完全融为一体的城市给合并的声音，随着普鲁士邦的拆除，终于有了将这点实现的机会。"
 GER_ruhr_coordination:0 "鲁尔定居区委员会"
 GER_ruhr_coordination_desc:0 "鲁尔的整个地区的本质统一性在许多方面被威斯特法伦州和莱茵兰州之间的人为边界所割裂，该边界沿莱茵河右岸平行延伸，直接穿过了“鲁尔区”。为此将设立“鲁尔定居区委员会”，专门负责处理整个“鲁尔区”的区域规划、分区管理、交通、公共空间及供水等共同问题。\n\n此举将显著提高鲁尔区及其周边地区的经济统一性，扩大经济区辐射范围。同时，鲁尔地区的苏维埃机构也将深入参与这一机构，协助其进行工作。"
 GER_bavaria_reorganization:0 "安抚巴伐利亚人"
 GER_bavaria_reorganization_desc:0 "向巴伐利亚人作出适当让步，缓和当地的不满，避免新的叛乱。"
 GER_socialization_amendment:0 "社会化法案修正案"
 GER_socialization_amendment_desc:0 "增加社会化行业的范围、投入社会化委员会的资源、以及对社会化事业给予更多的支持。"
 GER_social_security_act:0 "社会保障法"
 GER_social_security_act_desc:0 "将社会民主党和工会掌握的保障网络整合到新的社会保障体系内，并提高保险、救助福利等社会保障的范围与效力。为因失业、疾病、工伤或年老而需要帮助的群体提供基本生活保障，促进社会公平，保障劳动力供应稳定。"
 GER_combine_the_companies:0 "组建托拉斯"
 GER_combine_the_companies_desc:0 "将企业合并重组为托拉斯不仅有利于降低生产成本、提高经济效率，而且组建为托拉斯后由于生产更加集中，也更有利于未来对对应行业进行社会化，更有利于社会化之后的行业生产管理。"
 GER_wait_for_results:0 "等待第二次西里西亚事件的结束"
 GER_wait_for_results_desc:0 "第二次西里西亚事件将决定上西里西亚的领土归属并极大地影响国内政局，我们将静候其结果。"

