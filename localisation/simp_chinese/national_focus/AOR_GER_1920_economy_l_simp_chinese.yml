l_simp_chinese:
 GER_1920_organize_economic_work:0 "整理经济工作"
 GER_1920_organize_economic_work_desc:0 "耻辱的凡尔赛和约给我们的经济造成了巨大压力，持续的赔款要求令人瞠目结舌，但也为共和国的财政改革提供了机会。此外，在社会化法案通过、各行业的社会化工作逐步开展的情况下，我们也需要让我们的经济体制能够胜任管理社会化后的行业的任务。"
 GER_1920_erzberger_reform:0 "埃尔茨贝格改革"
 GER_1920_erzberger_reform_desc:0 "我们的财政部长埃尔茨贝格对我们的财政改革计划已经有了计划，其核心措施在于重塑财政主权、建立中央集权的财税体制以及增加国家收入，以应对接下来巨大的财政压力以及适应共和国的集权需求。"
 GER_1920_socialization_commission:0 "社会化委员会的工作"
 GER_1920_socialization_commission_desc:0 "考茨基同志领导的社会化委员会为社会化工作提供了一套温和、渐进的方案，旨在尽可能在不损害经济的情况下完成企业、行业的社会化，并逐渐使德国的经济体系社会主义化。"
 GER_1920_national_tax_administration:0 "国家财税管理体系"
 GER_1920_national_tax_administration_desc:0 "帝国时期财政权力高度分散在各个地方邦，中央政府主要依赖关税和地方各邦缴付的摊派款。而现在国家将设立独立国家财政部及下辖的各级国家税务局，直属中央管辖。"
 GER_1920_unified_tax_system:0 "全国统一税制"
 GER_1920_unified_tax_system_desc:0 "改革将建立一套涵盖直接税、间接税和财产税的全国统一税制。将原本由各邦自行征收的所得税统一为帝国税；采用高度累进税率（最高税率一度达到60%），对高收入阶层征收重税；同时将引入预扣所得税制，首次规定雇主必须直接从工人及雇员的工资中扣缴所得税。除此之外还采取了一系列其他措施，相信国家的税收征管效率将大幅上升。"
 GER_1920_centralize_tax_collection:0 "税收征管权上收"
 GER_1920_centralize_tax_collection_desc:0 "将税款的征收、核算与审计权力从各邦政府彻底收归中央，地方邦失去了独立的最高财税管理权。"
 GER_1920_one_off_property_tax:0 "一次性紧急财产摊税"
 GER_1920_one_off_property_tax_desc:0 "针对大资产阶级、土地拥有者和资本家征收极高税率的一次性财产税（根据资产规模，税率高达10%至65%），用以满足偿还战争债务、安置伤员等海量的财政需求。"
 GER_1920_integrate_cooperatives:0 "整合合作社网络"
 GER_1920_integrate_cooperatives_desc:0 "在几十年的持续运营下，党和工会掌握了一定规模的合作社网络以及干部团队，可用于组织为企业与居民服务的供应网络。尽管来自于工会的干部普遍较为保守，经常与企业内的激进派产生冲突，但他们的技能将帮助我们搭建起忠于社会主义的经济系统。"
 GER_1920_state_enterprise_management:0 "学习国营企业管理"
 GER_1920_state_enterprise_management_desc:0 "我们需要认真总结已经完成社会化的、成为国营企业的企业的管理方法，同时尝试将企业工人主导工厂委员会内嵌到企业的日常管理当中。在有社会主义信仰的基层工人的帮助下完成对企业的掌控，实行工人控制，并逐步增大工人对企业管理的参与。"
 GER_1920_infiltrate_economic_administration:0 "渗透经济管理部门"
 GER_1920_infiltrate_economic_administration_desc:0 "尽管我们培养了不少的有一定技能的干部，但与专业的经济管理部门的人员相比还是有一定差距。为此，我们将对现有的经济管理部门进行渗透工作。挑选并组织不敌视社会主义事业的工作人员，同时尝试将我们的人员插在重要岗位上。"
 GER_1920_economic_statistics_and_planning:0 "经济统计与计划编制工作"
 GER_1920_economic_statistics_and_planning_desc:0 "尽管距离所有行业的社会化还有很远，但对已经社会化的行业进行统计以及探索其生产、消费的计划的编制已经成为了迫切的需要。对整个行业的经济运转发挥作用，需要与国家管理部门合作完成这项任务。不过，这种“生产民主”的探索是否会导致经济管理机构的职能冲突或者导致各个生产部门之间难以有效合作，还有待观察。"
