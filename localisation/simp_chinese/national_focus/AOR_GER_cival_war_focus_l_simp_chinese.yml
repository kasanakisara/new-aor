l_simp_chinese:
 # =====================================================================
 # 22年夏秋季 - 23年夏秋季：内战时期国策树（WGR）
 # 文案依据策划案（drawio）原文；策划案中只有标题、未写内容的国策
 # （加快动员效率、向正规军迈进、防御毒气、红军军官学校、发动新解放区群众、
 #   苏维埃政权的扩张）按策划案的设定与氛围补写。
 # 策划案注记「黄色的部分暂时无法确定，不要填写」——原图未出现黄色节点。
 # =====================================================================

 GER_civil_war:0 "德国内战国策"


 # ---------- 根节点 ----------
 GER_all_power_to_the_soviets:0 "一切权力归苏维埃！"
 GER_all_power_to_the_soviets_desc:0 "随着革命浪潮的重新袭来，这句口号重新得到了万千德国无产阶级的高呼，从柏林到鲁尔，德意志的每一寸土地都陷入了苏维埃与其反对势力的争夺之中。\n\n没人能从我们手中再夺走苏维埃了，革命的社会民主党与簇拥着它的无产阶级群众将誓死保卫他们的政权。"

 # ---------- 分支一：经济与生产 ----------
 GER_everything_for_the_front:0 "一切为了前线！"
 GER_everything_for_the_front_desc:0 "社会主义共和国已经到了最危险的时候，必须将有限的资源严格集中使用，使得一切经济生活为了军事活动服务，集中一切政治能量与军事力量与反革命作战，保卫社会主义共和国，保卫革命！"

 GER_regional_soviets:0 "区域苏维埃"
 GER_regional_soviets_desc:0 "既成事实摆在了我们的面前：各地的反革命起义、暴动已经严重破坏了国内的各个经济地区的联系，各地苏维埃处于被分割开的状态，不得不依靠本地的人力物力进行生产秩序的维持以及供应军队。建立中央统一的行政、经济管理短期内已经是不可能的了，只能承认这个事实，根据战争需要以及目前控制区划分主要的几个区域苏维埃，整合当地行政机构和经济体系、制定经济计划，合理调配劳动力、资源、燃料。"

 GER_seize_means_of_production:0 "夺取生产资料"
 GER_seize_means_of_production_desc:0 "在经过漫长的与资产阶级分子的博弈后，随着内战的爆发，温和的社会化路线破产了，现在苏维埃政府将还没有社会化的工厂、银行、铁路、船只等生产资料和流通手段国有化。"

 GER_master_the_logistics_system:0 "掌握物流体系"
 GER_master_the_logistics_system_desc:0 "战前通过整合工会干部与地方经纪机构，我们勉强搭建出一套能够运行的物流体系，随着战事的进一步吃紧以及经济混乱的加剧，我们必须采取更加严厉的措施来管理物流系统，包括所有居民加入消费合作社以建立合作社网络、组织国营商业、打击投机倒把等等。"

 GER_organize_rural_urban_exchange:0 "组织城乡交换"
 GER_organize_rural_urban_exchange_desc:0 "值得庆幸的是，在内战前在核心地区我们打造了一套勉强能用的城乡交换体系，与部分农民建立了经济与政治纽带，成功收取粮食税并将工业品出售给农民，接下来我们需要小心地维持它，防止其彻底破裂。但另一方面，在非核心区域外我们与农民的联系仍然十分薄弱，城乡交换有待进行组织，假如实在难以在短期内建立起良好的基于自愿的城乡交换，那么或许强制征收也能成为一个可选项……"

 GER_solve_the_funding_problem:0 "解决资金问题"
 GER_solve_the_funding_problem_desc:0 "工人需要发工资、工业需要拨款，苏维埃政府需要资金以及行之有效的使用资金。在重要银行的社会化以及工厂委员会运动中，我们成功促使一批银行职员支持革命，然而仍有相当数量的银行职员对苏维埃政府的命令持抵抗态度，拒绝交出金库钥匙以及重要文件，其内部的资产阶级分子在尝试将银行掌握的资金转移出去，同时残存的旧财政机构也开始阻碍苏维埃政府重整财政秩序的工作。我们需要立刻对不配合工作的银行、财政机构采取严厉措施，建立新的财政体系，同时向资产阶级征收巨额税款，资金问题的解决刻不容缓。"

 GER_economic_accounting:0 "经济核算"
 GER_economic_accounting_desc:0 "「劳动时间的社会有计划的分配，调节着各种劳动职能同各种需要的适当比例。另一方面，劳动时间又是计量生产者个人在共同劳动中所占份额的尺度，因而也是计量生产者个人在共同产品中分配到的消费部分份额的尺度。」\n\n马克思提出，当商品生产消失后，劳动量的衡量不再需要经过「迂回」的路线，价值规律将不再发挥作用，可以对劳动的量根据实物与时间来直接进行衡量，以此来调节生产与决定按劳分配下劳动者可以取走多少份额的劳动产品。今天的我们距离消灭商品生产恐怕具有不小的距离，但在大部分工业生产部门的生产与分配工作被剥离出自由市场的现在，为了提高劳动生产率与减少成本，必须立刻在各级核算单位实行严格的经济核算，计算单位产品的劳动消耗量、材料消耗量、单位产品及人均燃料消耗量等。"

 GER_strengthen_labour_discipline:0 "加强劳动纪律"
 GER_strengthen_labour_discipline_desc:0 "小部分群众的政治觉悟还不够高，认为只要革命了那就没人可以管得到他想干嘛干嘛，劳动纪律前所未有地松散了下来，企业的产量与劳动生产率飞速的下降。反革命的兵锋一天比一天接近，不能再这样下去了，我们将在工厂内觉悟工人的帮助下通过工厂委员会、工会以及党的教育宣传机构对政治觉悟较低的群众实施教育，必要时采取强制手段加强劳动纪律。"

 # ---------- 分支二：政权与国家 ----------
 GER_smash_the_state_machine:0 "打碎国家机器"
 GER_smash_the_state_machine_desc:0 "三年以来的革命实践告诉我们，不能指望简单地接过资产阶级的国家机器就能让其为革命服务，旧资产阶级的国家机器在性质上与结构上都不适用于无产阶级国家的要求，而大部分旧官僚总是持之以恒地用各种手段阻碍革命。现在，我们夺得了国家政权，是时候将旧国家机器打碎，并搭建起为维护无产阶级统治的国家机器了。"

 GER_red_terror:0 "红色恐怖"
 GER_red_terror_desc:0 "客观事实摆在了我们面前：反革命在其控制区对革命群众肆意屠杀，在苏维埃掌控的区域内对党的领导干部诉诸疯狂的暗杀、炸弹袭击，对我们的革命力量产生了严重的威胁。而作为对应的，各地方苏维埃每天都在要求采取红色恐怖，有力地打击反革命，许多地区在严峻的形势逼迫下已经自行地进行恐怖政策。\n\n继续反对恐怖的教条毫无意义，与其放任地方自发的恐怖，不如由中央主动领导，规定恐怖的范围、方法、程度。\n\n列奥·约吉希斯领导的中央警察部门将整合各地分散的安全机构，成立革命安全保卫局系统性地进行恐怖政策。"

 GER_soviet_power_expansion:0 "苏维埃政权的扩张"
 GER_soviet_power_expansion_desc:0 "将苏维埃政权扩展到新占领区，在当地建立稳固的政权，整合当地资源，扩大政权基础。"

 GER_tighten_freedom_of_speech:0 "收紧言论自由"
 GER_tighten_freedom_of_speech_desc:0 "言论自由与公开辩论一直以来都是革命的社会民主党人的追求，然而，在紧迫的现实面前，我们需要统一指挥、统一行动，为此必须收紧内部的言论自由，并对外部的反革命宣传实行坚决的专政措施。"

 GER_mobilize_newly_liberated_masses:0 "发动新解放区群众"
 GER_mobilize_newly_liberated_masses_desc:0 "新占领区的工人与贫农对我们的政权仍然陌生，他们在旧政权、旧军队与地方豪强的统治下沉默了太久，不知道苏维埃究竟意味着什么。想要新解放区真正成为革命的一部分，就必须把群众从看客变成主人：派遣鼓动员与工人支队下乡进厂，恢复被解散的工会与工人委员会，建立地方苏维埃，把土地和生产资料的果实分到他们手里，让每一个村庄、每一座工厂都有人愿意为保卫自己的政权而拿起武器。"

 GER_concentrate_power_in_the_state:0 "权力向国家集中"
 GER_concentrate_power_in_the_state_desc:0 "我们曾经对群众的、地方的社会自治抱以厚望，认为这是自觉的无产阶级掌握生产、掌握政权的必要之路。现在，随着内战的全面打响，各地的苏维埃已经夺取了政权，然而严酷的现实——饥荒、军事压力、生产迅速崩溃、行政瓦解等等告诉我们，在现在指望着工厂委员会、经济苏维埃、以及地方政治自治组织来组织生产、管理社会完全是痴人说梦。\n\n尽管由于苏维埃政权各个部分的地理分割，我们难以建立起统一的全国性的决策中心，但有必要将权力从自治组织中收回来到无产阶级国家的手里。"

 GER_integrate_friendly_left:0 "整合友好左翼力量"
 GER_integrate_friendly_left_desc:0 "整合友好的左翼力量，如亲布尔什维克的「国际共产主义集团」，并与友好的工团主义者、无政府主义者达成部分合作。"

 GER_call_back_former_comrades:0 "呼唤曾经的同志"
 GER_call_back_former_comrades_desc:0 "呼唤原来立场上处于 spd 右派、抛弃分裂了党、背叛了社会民主主义的右派领导层，与他们决裂。"

 # ---------- 分支三：军事与红军 ----------
 GER_people_red_army:0 "人民红军"
 GER_people_red_army_desc:0 "由于社会民主党的右派的投降以及旧军队的顽固反革命立场以及协约国的限制等等原因，建国之初尝试建立一支用于保卫共和革命成果的正规军队的人民军项目走向了失败，最终我们获得了一个奇形怪状的国防军。\n\n而现在，我们将整合各色赤卫队、警察部队、人民防卫队、红色海军组织等差异巨大的武装力量，整合成一支真正可以保卫革命、保卫无产阶级政权的军队。"

 GER_speed_up_mobilization:0 "加快动员效率"
 GER_speed_up_mobilization_desc:0 "内战的胜负不取决于谁的常备军更精锐，而取决于谁能更快地把工人、农民和赤卫队员变成士兵。我们要在每一条街道、每一座工厂、每一个区苏维埃设立兵役登记与征召站，把铁路与内河航运的时刻表改由军事运输部门统一编排，让动员令从中央传到村口只需要几天而不是几周。只有这样，当白军在某一条战线上撕开缺口时，我们才能用源源不断的新编部队把它填回去。"

 GER_soviet_auxiliary_forces:0 "苏维埃辅助部队"
 GER_soviet_auxiliary_forces_desc:0 "建立地方苏维埃辅助部队，用于地区治安维持、协助军事训练、当地方工程兵修铁路、道路、协助粮食征集、协助恐怖工作以及在面临白军进攻时由红军指挥官接过指挥权，协助作战。"

 GER_reorganize_the_units:0 "整编部队"
 GER_reorganize_the_units_desc:0 "部队的编制、武器配置、战术使用极为混乱，有必要进行统一的整编活动，提高部队战斗力。"

 GER_unify_military_command:0 "军事指挥统一化"
 GER_unify_military_command_desc:0 "在内战刚开始的状态，由于各地自主夺权行动的需要，以及军事力量由自行组建，军事的指挥权是不可能不统一化的。为了执行统一的进攻、防御计划，解决部队指挥的混乱问题，必须在各条战线上建立统一的军事指挥部，总管各战线军事指挥任务。"

 GER_towards_a_regular_army:0 "向正规军迈进"
 GER_towards_a_regular_army_desc:0 "赤卫队守得住街垒，却守不住一条战线。要赢得这场内战，我们必须承认战争是一门需要专门学习的手艺：确立军衔与职务体系，把指挥权交给受过训练的指挥员而不是嗓门最大的人；建立参谋机关，让战役计划出自地图与情报而不是临时起意；恢复后勤条令与野战卫生体系，让部队在泥泞和寒冬里也还能打仗。这意味着一场痛苦的自我改造，但唯有如此，红军才能从起义者的武装变成真正能够决战的正规军。"

 GER_red_army_officer_school:0 "红军军官学校"
 GER_red_army_officer_school_desc:0 "革命几乎夺走了我们所有的军官：旧军事贵族与容克军官团站在了反革命一边，而工人出身的赤卫队指挥员虽然勇敢忠诚，却缺乏指挥大兵团的学识。我们将在各区域苏维埃开办红军军官学校与短期指挥训练班，从部队中选拔经受考验的工人、士兵与水兵入学，教授战术、兵器、筑垒与政治常识，同时聘请愿意为革命服务的旧军事专家担任教员，并由政治委员监督其立场。这条路走得慢，但干部必须由革命自己培养出来，否则我们永远只能租借别人的将军。"

 GER_gas_defence:0 "防御毒气"
 GER_gas_defence_desc:0 "白军与其背后的外国干涉者并不打算遵守任何关于战争的体面约定。一旦战局不利，毒气弹、糜烂性毒剂与窒息性毒气就会落到我们的战壕和城市里。我们必须抢在第一次毒气攻击之前做好准备：成批生产防毒面具与防护装具并优先配发前线部队，在集团军与师一级编成化学侦察分队和洗消队，训练部队在染毒地形中的行动与救护，同时向居民普及防毒知识与简易掩蔽手段。我们没有本钱以毒攻毒，但至少绝不能赤手空拳地死在毒云里。"

 # ---------- 合并节点 ----------
 GER_all_for_the_front:0 "一切为了前线！"
 GER_all_for_the_front_desc:0 "内战的第一个年头已经过去，我们守住了苏维埃，也为此付出了难以承受的代价。现在，全部的经济、全部的政治、全部的人，都必须服从于一个唯一的目标：赢得这场战争，保卫社会主义共和国，保卫革命。"

 # ---------- 说明与提示文本 ----------
 GER_civil_war_tree_unlocked_tt:0 "解锁内战时期的国策树。"
 GER_civil_war_phase_end_tt:0 "内战阶段收束：转入下一阶段的国策树与事件链。"

 # =====================================================================
 # 国策所赋予的国家精神（common/ideas/GER_civil_war_ideas.txt）
 # =====================================================================
 GER_everything_for_the_front_spirit:0 "一切为了前线！"
 GER_everything_for_the_front_spirit_desc:0 "社会主义共和国已经到了最危险的时候。全部经济生活服从于军事活动，一切资源严格集中使用。"

 GER_seized_means_of_production_spirit:0 "生产资料国有化"
 GER_seized_means_of_production_spirit_desc:0 "尚未社会化的工厂、银行、铁路与船只已收归苏维埃政府。温和的社会化路线随内战的爆发一并破产。"

 GER_consumption_cooperatives:0 "消费合作社网络"
 GER_consumption_cooperatives_desc:0 "全体居民加入消费合作社，国营商业取代私商，投机倒把受到严厉打击，物流终于掌握在国家手中。"

 GER_new_financial_system:0 "新财政体系"
 GER_new_financial_system_desc:0 "拒绝交出金库钥匙与重要文件的银行、财政机构已被整肃，对资产阶级的巨额税款开始征收，资金问题暂时得到缓解。"

 GER_economic_accounting_spirit:0 "经济核算"
 GER_economic_accounting_spirit_desc:0 "各级核算单位开始严格计算单位产品的劳动消耗量、材料消耗量、单位产品及人均燃料消耗量。价值规律尚未消失，但成本必须被看见。"

 GER_labour_discipline:0 "加强劳动纪律"
 GER_labour_discipline_desc:0 "在觉悟工人的帮助下，工厂委员会、工会与党的宣传机构正着手扭转劳动纪律涣散的局面，必要时不排除强制手段。"

 GER_smashed_state_machine:0 "打碎国家机器"
 GER_smashed_state_machine_desc:0 "旧资产阶级的国家机器在性质与结构上都不适用于无产阶级国家的要求，它已被打碎，取而代之的是为维护无产阶级统治而搭建的机关。"

 GER_revolutionary_security_bureau:0 "革命安全保卫局"
 GER_revolutionary_security_bureau_desc:0 "列奥·约吉希斯领导的中央警察部门整合了各地分散的安全机构。恐怖的范围、方法与程度，如今由中央而非地方自行规定。"

 GER_tightened_speech:0 "收紧言论自由"
 GER_tightened_speech_desc:0 "统一指挥、统一行动的需要压倒了公开辩论的传统：内部言论自由被收紧，外部反革命的宣传则遭到坚决的专政措施。"

 GER_people_red_army_spirit:0 "人民红军"
 GER_people_red_army_spirit_desc:0 "各色赤卫队、警察部队、人民防卫队与红色海军组织被整合为一支真正可以保卫革命、保卫无产阶级政权的军队。"

 GER_soviet_auxiliary_forces_spirit:0 "苏维埃辅助部队"
 GER_soviet_auxiliary_forces_spirit_desc:0 "地方苏维埃辅助部队承担治安维持、军事训练、筑路工程、粮食征集与协助恐怖工作；白军进攻时，其指挥权交由红军指挥官接管。"

 GER_unified_front_commands:0 "统一军事指挥部"
 GER_unified_front_commands_desc:0 "各条战线建立了统一的军事指挥部，负责总管该战线的全部军事指挥任务，部队指挥混乱的局面开始收束。"

 GER_regular_red_army:0 "正规红军"
 GER_regular_red_army_desc:0 "军衔与职务体系、参谋机关、后勤条令逐次建立，赤卫队正在变成一支能够决战的正规军。"

 GER_gas_defence_spirit:0 "防毒体系"
 GER_gas_defence_spirit_desc:0 "防毒面具与防护装具成批下发，化学侦察与洗消分队编入各级部队，军民防毒训练同步展开。"

 GER_everything_for_the_front_final_spirit:0 "一切为了前线！"
 GER_everything_for_the_front_final_spirit_desc:0 "内战的第一个年头已经过去。全部的经济、全部的政治、全部的人，都只服从于一个目标：赢得这场战争。"

 GER_officer_training:0 "指挥干部训练"
 GER_officer_training_desc:0 "红军军官学校与短期指挥训练班正在为部队输送工人出身的指挥员，同时聘请愿意为革命服务的旧军事专家担任教员。"
