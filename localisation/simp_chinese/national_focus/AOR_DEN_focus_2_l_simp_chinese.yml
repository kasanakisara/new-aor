l_simp_chinese:
 ####################################################################
 # 丹麦 · 复活节危机国策树
 # 世界观口径：1919.8—1922.7 的德意志共和国（社民党＋中央党，倍倍尔/哈泽）
 ####################################################################

 DEN_easter_crisis_tree:0 "复活节危机"

 #-------------------------------------------------- 危机入口
 DEN_easter_crisis:0 "复活节危机"
 DEN_easter_crisis_desc:0 "一九二〇年三月，石勒苏益格的第一轮投票刚刚落幕，哥本哈根却先一步冻住了。\n\n国王克里斯蒂安十世援引那部从未被写进成文法的王室特权，要求扎赫勒内阁在“南疆问题”上让出决定权；议会则以宪法与先例作答：可以商议，不可以命令。二十天里，报纸的号外换了一版又一版，而真正等待答复的，是站在克里斯蒂安堡宫外的两群人——一群举着王旗，一群举着工会的旗。\n\n南边那个刚刚从战败里爬起来的德意志共和国，正被巴伐利亚的准军事组织和《国防法》风波拖在柏林城里。它只发来一封措辞客气的照会：希望丹麦王国尊重公投的结果。没有舰队，没有最后通牒。于是所有的问题都回到了丹麦人自己手里。"

 #-------------------------------------------------- 一、王室妥协路线
 DEN_royal_compromise:0 "王冠与议会"
 DEN_royal_compromise_desc:0 "妥协不是投降，只是把刀收回鞘里。\n\n国王保留任免、解散与统帅的形式权力，把组阁权交还议会多数；作为交换，议会承认石勒苏益格问题属于“王冠的议程”，并且不追究那一纸最后通牒的越权。丹麦由此进入一种奇特的制度——王冠依旧闪亮，但真正决定它重量的，是议会大厅里的票数。\n\n克里斯蒂安十世在签署妥协文书时对身边人说了一句后来被反复引用的话：“我保住了王座，但我不知道我还剩下什么。”"

 DEN_crown_diplomacy:0 "王冠外交"
 DEN_crown_diplomacy_desc:0 "丹麦王室的姻亲网络，比任何一任外交大臣的公文包都要厚。\n\n挪威的哈康、瑞典的古斯塔夫，都出自这一支王室；当斯堪的纳维亚那个摇摇欲坠的联邦再一次被挪威的公平问题撕扯时，哥本哈根是唯一能同时给斯德哥尔摩和奥斯陆写信、并且两边都会拆开的首都。\n\n伦敦也读得懂这层关系。英国需要有人替它看住厄勒海峡，而一个由王室牵线的、温和的北方集团，显然比一个愤怒的、民族主义的丹麦更合算。"
 tt_den_crown_diplomacy:0 "王室的姻亲网络开始运作：与瑞典、英国的关系改善。"

 DEN_royal_schleswig_claim:0 "南疆主张"
 DEN_royal_schleswig_claim_desc:0 "公投划出的那条线，在哥本哈根看来从来不是结局。\n\n王室线的主张很朴素：日德兰半岛的南端曾经属于丹麦三百年，而那份在中石勒苏益格完成的选票，是在德意志的行政机构、德意志的警察与德意志的粮食配给之下投出来的。既然柏林的共和国连自己的巴伐利亚都管不住，它凭什么替弗伦斯堡说话？\n\n军官团开始重画边境地图，王室则准备了一份将要在国际联盟上宣读的备忘录——如果公投的边界不能改，那么至少要让全世界记住它是怎么划出来的。"
 tt_den_royal_schleswig_unlock:0 "若石勒苏益格公投的结算结果不利于丹麦，将解锁强硬选项。"

 #-------------------------------------------------- 二、议会路线
 DEN_parliamentary_victory:0 "议会至上"
 DEN_parliamentary_victory_desc:0 "扎赫勒没有辞职，也没有让出任何东西。\n\n议会以一次近乎全体起立的表决宣布：王冠可以保留，但先例必须由议会书写。王室特权被逐条清算——组阁权、解散权、军队统帅权的行使方式被写进了成文法；国王的签字从此只剩一道工序的意义。\n\n在表决结束后的那个傍晚，哥本哈根的报纸用了同一个标题：“丹麦选择了投票箱。”没有人知道这个选择在十年后意味着什么，但至少在这一天，它意味着没有人需要向军营或王宫请示。"

 DEN_land_reform:0 "土地改革"
 DEN_land_reform_desc:0 "丹麦的农民是这个国家真正的多数，也是历届内阁都不敢得罪的人。\n\n悬置了半个世纪的什一税折算、佃农赎买与小农信贷，终于被一次性推上议事日程：教会什一税折算为固定年金，佃农可以用三十年期低息贷款赎买耕种的田地，国家设立农业信贷银行与农机合作社。议会用土地换来了乡村的沉默，也换来了一个世纪里最稳固的执政基础。\n\n保守人民党的议员在表决时低声抱怨：“我们正在把丹麦变成一个自耕农的共和国。”他们没有说错。"
 tt_den_land_reform:0 "土地改革：乡村支持与人力资源上升。"

 DEN_nordic_cooperation:0 "北欧合作"
 DEN_nordic_cooperation_desc:0 "没有哪个北欧国家能在两场欧洲大战之间独自生存。\n\n丹麦要做的，是把斯德哥尔摩、奥斯陆与哥本哈根绑在同一张桌子上：货币互换、渔业划界、航运保险、以及一份三方共同签署的中立宣言。斯堪的纳维亚的联邦还活着，但它需要的不是忠诚，而是利益。\n\n“谁说小国不能写规则？”外交大臣在备忘录的扉页上这样写道。下一页是一份长达四十页的关税与航运清单。"

 DEN_parliamentary_schleswig:0 "石勒苏益格的议会方案"
 DEN_parliamentary_schleswig_desc:0 "议会不打算用刺刀回答公投。\n\n丹麦的律师、统计学家与教会档案员被派往日内瓦与伦敦，用人口统计、语言分布与土地清册，把“南石勒苏益格”这四个字重新写进国际联盟的议程里。他们要证明的不是选票造假——而是边界本身不该由一次在占领状态下进行的投票决定。\n\n这是一场没有硝烟的战争，战场是会议记录和附录。而在哥本哈根看来，只要国际联盟愿意把这个问题留在桌上，丹麦就还有下一次机会。"
 tt_den_parliament_schleswig:0 "取得国际仲裁的筹码；若实际控制南石勒苏益格，可在收尾国策中完成整合。"

 #-------------------------------------------------- 三、军事干预路线（非历史）
 DEN_military_intervention:0 "军事干预"
 DEN_military_intervention_desc:0 "军营里流传的那句话终于被写进了命令：“与其让王冠在议会里生锈，不如让它回到边境上去。”\n\n国王的副官、保守党的地方支部与边境的退伍军人同时动了起来。哥本哈根没有人宣布政变——只是从某个清晨起，街角的警察换成了佩枪的军官，报社的编辑部收到了“暂时休刊”的通知，而社会民主党的集会申请被一份措辞严谨的公文驳回。\n\n国王仍然是国王。区别在于，从今往后他的命令不再需要任何人附署。"
 tt_den_civil_war_risk:0 "军事干预将激化左右对立，丹麦存在爆发内战的风险。"

 DEN_border_army:0 "边境军团"
 DEN_border_army_desc:0 "丹麦的军备废弛不是秘密——二十年的中立宣言换来了舰队的锈迹和陆军的纸面编制。\n\n现在，边境上出现了新的营房：不是为了一场欧洲战争，而是为了那条被公投划出的、并不牢靠的线。征召令恢复了，预备役军官被重新登记，野战炮从仓库里推出来擦掉了封油。总参谋部的地图上，弗伦斯堡第一次被标成了红色。\n\n军官们很清楚丹麦打不赢一场大战。他们只需要在南石勒苏益格打赢一场边境冲突——一次投票做不到的事，一次动员也许可以。"
 tt_den_border_army:0 "边境军团：陆军经验与战争支持上升。"

 DEN_martial_law_denmark:0 "哥本哈根戒严"
 DEN_martial_law_denmark_desc:0 "哥本哈根的码头工人先罢工，然后是社会民主党的报纸被查禁，然后是军营里的军官开始直接向国王汇报。\n\n戒严令的文本很简短：宵禁、集会禁止、军事法庭接管治安案件。它没有说要废除宪法——只是宣布在“非常时期”，宪法的一部分条款暂缓适用。而在议会大厅里，那些曾经为王室特权辩护过的议员忽然发现，他们亲手留下的那扇门，现在关上了。\n\n丹麦仍然是那个丹麦，只是从今往后，它的宪法要由佩剑的人来解释。"
 tt_den_martial_law_warning:0 "戒严将长期削弱稳定并激化阶级对立。"

 #-------------------------------------------------- 收尾
 DEN_northern_schleswig_integration:0 "北石勒苏益格的整合"
 DEN_northern_schleswig_integration_desc:0 "南日德兰——丹麦人坚持这样称呼它——回归的第三年，哥本哈根终于把这片土地从军事管辖区改成了普通的郡。\n\n宪兵撤走，丹麦语进入学校与法庭，铁路与电报并入王国的网络。而那些不愿改换国籍的德意志居民，得到了一个体面的、带着补偿的离开方案：土地按市价赎买，财产允许汇出，边境两侧的家庭可以选择在哪一边过冬。\n\n“我们不必让所有人都变成丹麦人，”首相在下议院的答辩里说，“我们只需要让这片土地重新属于丹麦。”"
 tt_den_northern_integration:0 "北石勒苏益格正式完成整合；南石勒苏益格纳入丹麦关税与行政体系。"

 #-------------------------------------------------- 通用提示
 tt_den_easter_crisis_legacy:0 "复活节危机将决定丹麦未来十年的政体走向：王冠、议会，或者军营。"
 tt_den_schleswig_referendum:0 "石勒苏益格两区的公投后续将按《凡尔赛条约》第107—114款继续推进。"
