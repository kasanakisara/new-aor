 ## 凡尔赛条约（1919.12 - 1920.1）：三个里程碑国策，均无法手动点击 ##
 GER_1919_versailles_journey:0 "凡尔赛之行"
 GER_1919_versailles_journey_desc:0 "世界大战早已结束，和平会议也将落下帷幕。在“三巨头”的要求下，柏林政府需派遣代表团前往凡尔赛，接受拟定好的和平条件。尽管无谈判权在国内引发了强！烈愤慨，但继续拖延只会使国家陷入更深的混乱。无论其代价如何，共和国都必须迈出这屈辱而沉重的一步。外交部长兰曹伯爵将率领代表团，动身前往凡尔赛\n\n§Y（此国策无法手动点击，由「凡尔赛条约」事件链自动完成）§!"
 AOR_GER_versailles_journey_tt:0 "德意志代表团启程前往凡尔赛：触发事件「巴黎来电」。"

 GER_1919_versailles_rotten_hand:0 "烂手！"
 GER_1919_versailles_rotten_hand_desc:0 "条约全文已经摆在我们面前，其中的内容远远超出了德国所能接受的范围——其中的每一条，都无不在羞辱整个共和国。我们的代表团将向和会提交最后意见书，对这些条款提出正式异议与修正建议。\n\n“§R谁使自己和我们受到束缚，他的手怎能不烂掉？§!”——菲利普·谢德曼\n\n§Y（此国策无法手动点击，由「凡尔赛条约」事件链自动完成）§!"

 GER_1919_versailles_backbone_breaks:0 "脊梁断裂"
 GER_1919_versailles_backbone_breaks_desc:0 "协约国对我们的最后意见不屑一顾。他们拒绝了一切修改建议，并要求德国在二十四小时内接受和约，否则战争将再次开始。议员们无不对此感到愤怒与屈辱，可我们别无选择。\n\n§Y（此国策无法手动点击，由「凡尔赛条约」事件链自动完成）§!"
