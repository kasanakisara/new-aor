 ## 凡尔赛条约（1919.12 - 1920.1）：三个里程碑国策，均无法手动点击 ##
 GER_1919_versailles_journey:0 "凡尔赛之行"
 GER_1919_versailles_journey_desc:0 "一九一九年十二月十日，德意志代表团启程前往凡尔赛。\n\n等待他们的不是谈判，而是一份已经写好的和约。外交部长兰曹带上法律顾问、统计学家与语言专家，因为他很清楚：这一趟去巴黎，用处不在于讨价还价，而在于尽可能让世界记住——德国人要说的话，并没有被听完。\n\n§Y（此国策无法手动点击，由「凡尔赛条约」事件链自动完成）§!"
 AOR_GER_versailles_journey_tt:0 "德意志代表团启程前往凡尔赛：触发事件「巴黎来电」。"
 GER_1919_versailles_rotten_hand:0 "烂手！"
 GER_1919_versailles_rotten_hand_desc:0 "条约全文已经摆在我们面前，其中的内容远远超出了德国所能接受的范围——其中的每一条，都无不在羞辱整个共和国。我们的代表团将向和会提交最后意见书，对这些条款提出正式异议与修正建议：战争责任、领土与割让、赔款义务、军事限制，一条都不放过。\n\n“谁使自己和我们受到束缚，他的手怎能不烂掉？”\n——菲利普·谢德曼\n\n§Y（此国策无法手动点击，由「凡尔赛条约」事件链自动完成）§!"
 AOR_GER_versailles_rotten_hand_tt:0 "向和会提交最后意见书，对条约条款提出正式异议（协约国将拒绝一切修改）。"
 GER_1919_versailles_backbone_breaks:0 "脊梁断裂"
 GER_1919_versailles_backbone_breaks_desc:0 "协约国对我们的最后意见不屑一顾。他们拒绝了一切修改建议，并要求德国在二十四小时内接受和约，否则战争将再次开始。议员们无不对此感到愤怒与屈辱，可我们别无选择。\n\n§Y（此国策无法手动点击，由「凡尔赛条约」事件链自动完成）§!"
 AOR_GER_versailles_backbone_tt:0 "协约国拒绝一切修改，要求二十四小时内答复；国民议会将举行紧急投票。"
