 GER_AF_Arnold_von_Golssenau_desc:0 "§Y生于：§g1889年，德意志帝国德累斯顿\n§Y军旅生涯：§g出身萨克森贵族，一战期间在西线担任连长、营长，获上尉军衔。1918年三月革命后，他拒绝向革命群众开枪，毅然放弃了贵族爵位，转而投身左翼运动。1919年，他在德累斯顿社会民主党倾向的安全部队中被士兵选举为营长，随后在德累斯顿治安警察服役，同时钻研国民经济学与法学。作为起义阵营中少有的受过正规军事教育的贵族出身指挥官，他具备营级指挥经验，对旧军队的作风深恶痛绝，渴望建立真正的人民军队。他的贵族背景与左翼信仰在革命中剧烈碰撞，使其在阵营中显得格格不入却又不可或缺。他的加入为革命武装注入了中高级军事人才，是革命军不可多得的将才。§!"
 GER_AF_Erwin_Rommel_desc:0 "§Y生于：§g1891年，德国海登海姆\n§Y军旅生涯：§g一战期间是著名的步兵军官，曾获蓝马克斯勋章。1919年在林道和施瓦本格明德参与镇压革命运动，以善于谈判、尽量避免流血而闻名。他作为少数具备高级战术素养的职业军官，其立场在革命与反革命之间摇摆。他对旧军队的作风颇有不满，但也未完全认同革命派的激进手段。他的军事才能使他成为双方都试图拉拢的关键人物，但很显然在旧军队与旧政府面前，他选择了革命。§!"
 GER_AF_Erich_Wollenberg_desc:0 "§Y生于：§g1892年，德国柯尼斯堡\n§Y军旅生涯：§g一战期间以志愿兵的身份参与战争。1918年在慕尼黑学习并参与USPD（斯巴达克派）工作。1919年1月1日因抗议自由军团在波罗的海的部署而辞去军职。1919年4月19日起担任巴伐利亚红军（达豪）步兵司令兼副总司令，是巴伐利亚苏维埃共和国的主要军事领导人之一。他具备师级指挥能力，是革命军中极具战略眼光的指挥官。他在达豪组织红军，力图以正规军事手段保卫苏维埃政权。他的军事才能与政治信念相结合，使其成为巴伐利亚红色武装的核心人物。他在巴伐利亚的军事实践，为革命军提供了宝贵的正规战经验。§!"
 GER_AF_Wilhelm_Zaisser_desc:0 "§Y生于：§g1893年，德国埃森\n§Y军旅生涯：§g一战期间服役，战后加入左翼团体。于1919年前后活跃于鲁尔地区工人武装中，因具备实战经验而在鲁尔红军中崭露头角。他擅长组织工厂工人进行武装斗争，是鲁尔工业区的重要军事骨干。他深入工厂，发动工人，将散乱的工人纠察队整编为具备战斗力的红军武装。在鲁尔地区的巷战与街垒战中，他展现了出色的组织与指挥才能。若内战爆发，他将成为革命军在西部工业区的主要指挥官之一，是左翼武装中不可多得的工人出身将领。他的军事生涯与工人运动紧密相连，是革命武装中扎根基层的代表人物。§!"
 GER_AF_Hans_Kahle_desc:0 "§Y生于：§g1899年，德国柏林\n§Y军旅生涯：§g一战期间于1917—1918年作为候补军官和中尉参战，1918年被法军俘虏。1919年加入斯巴达克派。他虽然是一位十分年轻的军官，但具备正规军事训练，并具有担任左翼武装的连级或营级指挥官水准。他在战俘营中接触到革命思想，被释放后立即投身革命运动。他的军事素养和年轻的热情使他成为革命军基层指挥岗位的一颗明星。§!"
 GER_AF_Theodor_Neubauer_desc:0 "§Y生于：§g1890年，德国埃姆斯维尔德\n§Y军旅生涯：§g教师出身，一战期间为志愿兵。1918年12月加入德国民主党，当选埃尔福特委员会成员。1919年夏末转向左翼，加入SPD。他是图林根地区革命运动的组织者与宣传者，军事背景有限但群众动员能力强，适合担任地区政治委员或后方动员工作。他在埃尔福特的教育界和工人中拥有广泛人脉，为革命运动提供了重要的社会基础。他的转向代表了部分知识分子在革命浪潮中的激进化，是图林根地区革命力量的重要补充。§!"
 GER_AF_Ernst_Hadermann_desc:0 "§Y生于：§g1896年，德国施吕希特恩\n§Y军旅生涯：§g一战期间获一级铁十字勋章，多次负伤，以中尉军衔退役。1918年被选为富尔达驻军工兵委员会成员。1919年加入青年团。他作为炮兵背景的前军官，积累了丰富的基层士兵工作经验，擅长将普通士兵转化为坚定的革命战士。他的炮兵专业知识在革命军缺乏重火力的情况下尤为珍贵，是革命军技术兵种的重要人才。§!"
 GER_AF_Ernst_Schneller_desc:0 "§Y生于：§g1890年，德国莱比锡\n§Y军旅生涯：§g教师出身。三月革命期间在其所在部队的士兵委员会任职。1919年1月回到萨克森，3月起在施瓦岑贝格当教师。他是萨克森地区的革命组织者，军事经验有限，但拥有担当政治委员或地方行政负责人的潜力。他在矿区教师中的身份使他能够连接知识分子与工人群体，为革命运动在厄尔士山区的传播提供了渠道。§!"
 GER_AF_Hans_Kippenberger_desc:0 "§Y生于：§g1898年，德国莱比锡\n§Y军旅生涯：§g一战期间作为军官在西线服役，多次负伤，获一级铁十字勋章。1919年1月以中尉军衔退役，随后在莱比锡从事商业工作。他作为受过正规军事训练的前军官，在革命后期加入左翼阵营，主要负责情报与组织工作。他的军事素养与组织能力使他适合担任参谋或情报部门负责人，而非一线指挥官。他在莱比锡的地下工作中展现出极高的纪律性与效率，为革命军提供了关键的敌方部署情报。他的存在弥补了革命武装在正规参谋人才上的不足，是革命军情报体系中较为重要的一环。§!"
 GER_AF_Bernhard_Ecks_desc:0 "§Y生于：§g1884年，德国不来梅\n§Y军旅生涯：§g泥瓦匠出身。1919年三月革命期间，担任不来梅士兵委员会主席，是西北港口革命的核心人物之一。1919年1月，他短暂担任不来梅苏维埃共和国的城市指挥官，组织工人武装保卫革命政权。他是西北沿海城市革命派的重要军事领导人，他出身底层，深知工人疾苦，在组织防御与动员群众方面展现出卓越的领导力。他在不来梅的武装斗争，为西北地区的革命运动树立了武装保卫政权的典范。他的指挥风格务实而坚决，善于在劣势兵力下依托城市地形进行顽强抵抗。§!"
 GER_AF_Willi_Budich_desc:0 "§Y生于：§g1890年，德国科特布斯\n§Y军旅生涯：§g1918年12月柏林冲突中受重伤，失去一臂。1919年3月伤愈后移居慕尼黑，化名“迪特里希”，成为巴伐利亚苏维埃共和国执行委员会成员。他虽身体残疾，但政治组织能力突出，因此担任巴伐利亚苏维埃的政治委员或后方动员负责人。他在柏林冲突中的牺牲精神使他在革命者中享有崇高声望，他的独臂形象成为革命坚韧不拔的象征。§!"
 GER_AF_Hans_Hentig_desc:0 "§Y生于：§g1887年，德国柏林\n§Y军旅生涯：§g犯罪心理学家、法学家。1919年参与巴伐利亚苏维埃共和国的建立。他更多以政治顾问或地方行政负责人的身份参与革命，军事指挥能力有限。他在慕尼黑的法学界和知识分子圈中拥有一定影响力，为苏维埃政权提供了必要的法律与行政人才。他的参与代表了部分自由派知识分子对革命政权的同情与支持。§!"
 GER_AF_Heinrich_Dorrenbach_desc:0 "§Y生于：§g1888年，德国诺伊斯\n§Y军旅生涯：§g一战期间为中尉。1918—1919年革命期间是人民海军师的组织者与指挥官，在柏林一月起义中发挥了决定性作用。他是柏林地区革命武装的核心指挥官。他在人民海军师中的威望极高，他的领导使这支部队成为柏林革命中最可靠的力量之一。§!"
 GER_AF_Vilmos_Korn_desc:0 "§Y生于：§g1899年，奥匈帝国格罗斯-基金达\n§Y军旅生涯：§g1916年晋升为军官。1919年3月革命后成为某士兵委员会成员。1919—1924年在格尔利茨、奥斯纳布吕克、杜伊斯堡等地担任雇员协会的商业职员。他是具有军官背景的工会组织者，曾在革命武装中担任后勤或行政职务。他的军官经历与工会工作经验的结合，使他成为革命军中难得的既能带兵又能管后勤的复合型人才。§!"
 GER_AF_Albert_Schreiner_desc:0 "§Y生于：§g1892年，德国阿格拉斯特豪森\n§Y军旅生涯：§g1919年3月革命期间在斯图加特发挥重要作用，11月9日成为符腾堡革命政府首任战争部长。1919年开始组织工人运动，是符腾堡工人运动的联合创始人，并从1919年起成为地区工人武装的领导人。他既是符腾堡地区的革命军事领导人，也负责红色战士联盟的组织与训练工作。他在斯图加特的革命行动为西南地区的革命运动树立了典范，红色战士联盟在他的领导下成为革命军的重要后备力量。§!"
 GER_AF_Hans_Beimler_desc:0 "§Y生于：§g1895年，德国慕尼黑\n§Y军旅生涯：§g一战期间在皇家海军服役，任大副。1919年秋参与库克斯港的3月革命，是海军革命的重要参与者。1919年初回到慕尼黑后，他积极参与巴伐利亚苏维埃共和国的保卫战，并成为慕尼黑地方工人组织的创始人之一。他是巴伐利亚地区革命武装的骨干，兼具海军背景与步兵作战经验，适合担任巴伐利亚红色武装的指挥职务。他在达豪地区的防御战中表现出色，成功迟滞了自由军团的推进。他的海军经历使他在组织城市防御和协调水陆作战方面具有独特优势。§!"
 GER_AF_Joseph_Gutsche_desc:0 "§Y生于：§g1895年，德国格雷迪茨\n§Y军旅生涯：§g一战期间1915年被俄军俘虏，1917年加入俄国社会民主工党（布）和赤卫队。1918年返回德国，加入USPD，在柏林参与武装斗争。他是少数有俄国赤卫队实战经验的德国革命者，他在俄国革命中的亲身经历使他成为德国革命者中极具说服力的宣传者，他的实战经验对革命军具有极高的参考价值。§!"
 GER_AF_Rudolf_Egelhofer_desc:0 "§Y生于：§g1896年，德国慕尼黑\n§Y军旅生涯：§g一战期间在皇家海军服役。1919年4月起担任巴伐利亚地区工人运动武装的领导人。他是巴伐利亚红色武装的最高指挥官，虽年轻但已展现指挥才能，与他共事过的战士均认可他的成绩，并认为他会成为革命军高级将领。他在慕尼黑的防御战中亲自指挥街垒作战，极大地鼓舞了守军的士气。§!"
 GER_AF_Hermann_Matern_desc:0 "§Y生于：§g1893年，德国布尔格\n§Y军旅生涯：§g一战期间在西线服役。1919年开始在布尔格地区组织工人运动，并领导该地区的工人武装，在当地担任工人临时苏维埃的领导人、企业委员会主席和市议员，同时以制革工人为职业。他是马格德堡地区革命运动的基层组织者，军事指挥经验有限，但群众工作能力强。他在布尔格的工厂中建立了坚实的革命据点，为中部工业区的革命运动提供了组织基础。§!"
 GER_AF_Bernhard_Baestlein_desc:0 "§Y生于：§g1894年，德国汉堡。\n§Y军旅生涯：§g1918年11月在德军从法国撤退时被选入士兵委员会，因此被军官开除出野战军。1914年因SPD支持战争拨款而退党，后因SPD路线转变重新入党。1919年开始为《汉堡人民报》担任“工人通讯员”。他是汉堡地区革命运动的宣传者与组织者，军事背景有限。他的笔杆子和口头宣传能力为汉堡的革命运动提供了有力的舆论支持，是西北沿海革命派的重要宣传骨干。§!"
 GER_AF_Hans_Marchwitza_desc:0 "§Y生于：§g1890年，德国上西里西亚\n§Y军旅生涯：§g1915—1918年在西线服役。1918年加入共和士兵委员会卫队。1919年加入SPD。他是鲁尔地区工人武装的基层指挥官，他作为一名矿工出身的士兵，对鲁尔地区的工人运动有着天然的联系，他的实战经验为工人武装提供了必要的军事骨干。§!"
 GER_AF_Herbert_Marcuse_desc:0 "§Y生于：§g1898年，德国柏林\n§Y军旅生涯：§g属于SPD多数派，1918年在一战服役。§!"
 GER_AF_Wilhelm_Pieck_desc:0 "§Y生于：§g1876年，德国古本\n§Y军旅生涯：§g一战期间是反战左翼社会民主党人，参与多次左翼会议。1917年开始在SPD内部加入一个激进左翼团体，1918年逐渐在党内激进左翼团体中获得一定声望。1919年与李卜克内西等人一起批判党内右翼声音，一月起义被镇压后与李卜克内西和卢森堡一起被捕，但后来获释。他是SPD激进左翼中的核心成员之一，负责党务与组织工作。他在党内的资历和与李卜克内西的密切关系使他成为革命领导层中不可或缺的组织者。§!"
 GER_AF_Ernst_Thaelmann_desc:0 "§Y生于：§g1886年，德国汉堡\n§Y军旅生涯：§g1915年起作为下士在西线服役。1917年加入SPD。1918年成为汉堡工人士兵委员会成员。1919年开始担任汉堡地方临时苏维埃领导，同年当选汉堡市议会议员。他是汉堡地区革命运动的核心领导人，具备军事经验与群众动员能力，是西北沿海革命派的代表人物。他在汉堡港的码头工人中拥有极高的威望，他的组织工作使汉堡成为西北地区革命运动最坚固的堡垒之一。§!"
 GER_AF_Li_De_desc:0 "§Y生于：§g1900年，德国慕尼黑\n§Y军旅生涯：§g1918年应征入伍，在奥地利和意大利前线参战。1919年4月加入社会主义青年团，之后被选入社会主义青年团慕尼黑委员会。1919年秋逃到汉堡，加入当地党组织。模组中他是年轻的组织者，军事经验有限，可在革命后期担任青年工作或情报工作。他的前线经历与青年工作背景使他成为革命运动中连接青年士兵与党的桥梁。§!"
 GER_AF_Mikhail_Lukin_desc:0 "§Y生于：§g1892年，俄罗斯帝国\n§Y军旅生涯：§g1914—1918年参加一战，1916年毕业于准尉学校，军衔为上尉。1918年7月志愿加入红军，1919年加入俄共（布），在内战中担任团长和旅长，在南方面军对抗邓尼金。德国内战爆发后，他受共产国际派遣，以志愿军身份秘密潜入德国，担任革命军的团级或旅级指挥官。他作战勇猛，战术素养极高，为德国革命军带来了苏俄内战中宝贵的正规战与运动战经验。§!"
 GER_AF_Boris_Burenin_desc:0 "§Y生于：§g1893年，俄罗斯帝国\n§Y军旅生涯：§g俄罗斯苏维埃将领，1918年4月至9月在军事学院最后一年继续学习，后曾任师长。德国内战爆发后，他受共产国际派遣加入德国革命阵营，以师级指挥官或军事学院教官身份，为革命军提供正规化训练与作战指导。他的军事理论素养和教学能力使他在革命军中扮演了教官与指挥官的双重角色，为革命军培养了一批基层指挥人才。§!"
 GER_AF_Aleksandr_Cherepanov_desc:0 "§Y生于：§g1895年，俄罗斯帝国\n§Y军旅生涯：§g1915年参加俄军，1916年毕业于准尉学校。1917年12月起加入赤卫队，1918年初志愿加入红军，任第十步兵师第二团团长。1919年任第二十八旅参谋长，不久升任旅长。德国内战爆发后，他受共产国际派遣，以志愿军身份秘密潜入德国，担任革命军的师级指挥官或高级参谋。他将苏俄内战中的正规战与运动战经验带到德国，其严谨的参谋素养为革命军提供了宝贵的指挥体系支持。§!"
 GER_AF_Dmitry_Zhloba_desc:0 "§Y生于：§g1887年，乌克兰\n§Y军旅生涯：§g1918年5月在苏俄内战中加入红军，10月作为“钢铁旅”指挥官，率部在白军哥萨克后方进行突袭。1919—1920年指挥骑兵旅和第一骑兵军，对抗邓尼金和弗兰格尔。德国内战爆发后，他加入革命阵营，担任骑兵指挥官或机动作战顾问。他将苏俄内战的大规模骑兵作战经验带到德国，并打算为德国贡献自己的一份力量。§!"
 GER_AF_Antonina_Palshina_desc:0 "§Y生于：§g1897年，俄罗斯帝国。\n§Y军旅生涯：§g一战期间女扮男装，化名“安东·帕尔申”，在俄军骑兵和步兵中服役，是唯一获得两枚圣乔治十字勋章的女性。1919年4月28日生下儿子后，与丈夫一起奔赴内战前线。德国内战爆发后，她加入革命阵营，担任骑兵或步兵指挥官。她是革命军中的传奇女将，以其勇敢无畏和精湛的骑术闻名。她在战场上冲锋陷阵，丝毫不逊于男性指挥官，极大地鼓舞了革命军的士气。§!"
 GER_AF_Zhu_De_desc:0 "§Y生于：§g1886年，中国四川仪陇\n§Y军旅生涯：§g早年参加辛亥革命，在滇军中担任旅长。1919年时朱德在中国，深受“五四”运动影响，阅读《新青年》等进步刊物。1922年赴德国，在柏林结识周恩来并加入中国共产党，在格丁根市留学。德国内战爆发后，他作为中国将领，以军事顾问或志愿指挥官身份加入革命阵营。他带来了东亚革命与游击战经验，负责城市游击战的训练与指导。其坚毅的品格和丰富的游击经验深受士兵爱戴。§!"
 GER_AF_Iordan_Pehlivanov_desc:0 "§Y生于：§g1876年，保加利亚\n§Y军旅生涯：§g保加利亚裔俄军军官。1918年2月底至3月初作为彼得格勒防御负责人，在普斯科夫方向抵御德军进攻。1918年秋在红军服役仅数月后前往克里米亚，后于1919年离开苏俄。德国内战爆发后，他以保加利亚将领身份加入革命阵营，具备防御战与城市保卫战经验。他在普斯科夫保卫战中积累的对德作战经验尤为宝贵，他的加入为革命军带来了与德军正面交锋的实战知识。§!"
 GER_AF_basic_military_training:0 "基本军事素养"
 GER_AF_basic_military_training_desc:0 "这名军官或曾历经多次战役，或曾接受正规军事教育，其军事素养毋庸置疑。"
 GER_AF_great_war_veteran:0 "大战经历"
 GER_AF_great_war_veteran_desc:0 "这名军官曾参与世界大战。对战争有一定的认识，但在战术运用与军事装备方面仍缺乏系统性的学习。\n§g此特质将于730天后自动移除。§!"
 GER_AF_inexperienced:0 "涉世未深"
 GER_AF_inexperienced_desc:0 "这名军官对军事知之甚少，仅凭革命热情指挥战斗，尚不具备指挥大兵团作战的能力。\n§g此特质将在将领达到2级时自动移除。§!"
 GER_AF_promising:0 "未来可期"
 GER_AF_promising_desc:0 "这名军官以善于学习和直觉敏锐而闻名。\n§g此特质将在将领达到3级时自动移除。§!"
 GER_AF_underground_worker:0 "地下工作者"
 GER_AF_underground_worker_desc:0 "这名军官长期从事地下革命工作，深谙与最狡猾的敌人周旋之道。"
 GER_AF_foreign_revolutionary:0 "外国革命工作者"
 GER_AF_foreign_revolutionary_desc:0 "这名军官曾投身国外革命斗争，积累了丰富的实战经验，如今希望为我们贡献力量。"
 GER_AF_comintern:0 "共产国际"
 GER_AF_comintern_desc:0 "这名军官受共产国际派遣，以志愿者身份参加德国革命。"
 GER_AF_Hans_Paasche_desc:0 "§g海军军官、反战与和平主义者，曾庇护左翼人士，并参与柏林工兵苏维埃。§!"
 GER_AF_Ernst_zu_Reventlow_desc:0 "§g海军军官，曾赞同民族共产主义主张。§!"
 GER_AF_Max_Reichpietsch_desc:0 "§g1917年莱希皮奇—科比斯水兵起义的领导人。§!"
 GER_AF_Albin_Koebis_desc:0 "§g1917年莱希皮奇—科比斯水兵起义的领导人。§!"
 GER_AF_Karl_Artelt_desc:0 "§g基尔起义领导人，随后参与争取委员会共和国的斗争。§!"
 GER_AF_Hans_Beckers_desc:0 "§g曾参与莱希皮奇水兵起义。§!"
 GER_AF_Otto_Tost_desc:0 "§g水兵，曾担任人民海军师师长。§!"
