l_simp_chinese:
 ####################################################################
 # 丹麦 · 将领与内阁成员（1919 开局）
 # 世界观口径：1919.8—1922.7 的德意志共和国为南部邻国；丹麦为战争末期的投机
 # 赢家，1918.6 加入协约国，1920 年经公投收回北石勒苏益格，随后爆发复活节危机。
 ####################################################################

 #-------------------------------------------------- 陆军主官
 DEN_Ellis_Wolff:0 "埃利斯·沃尔夫"
 DEN_Ellis_Wolff_desc:0 "丹麦陆军总参谋长。他这一生做得最大的一件事，是让丹麦在世界大战里什么都没做——没有动员，没有堑壕，只有沿日德兰半岛南线悄悄加固的哨所。他相信小国的军队不该用来打赢战争，而该用来让战争显得不值得打。\n\n1919年的丹麦陆军只有两个师、一支骑兵旅，和一份被议会砍过三遍的预算。沃尔夫对此并不抱怨，他只坚持一件事：无论复活节危机最后是国王赢还是议会赢，军队都不进城。"

 DEN_William_Prior:0 "威廉·普赖尔"
 DEN_William_Prior_desc:0 "陆军总监，负责训练与动员事务。他最常说的一句话是：丹麦的防线不在边境，而在征召名册上。\n\n北石勒苏益格回归后，他把大量精力花在清点新边境另一侧的村庄与道路——哪些桥走得了炮车，哪些沼泽在春天会变成陷阱。他不喜欢志愿武装那一套：在他看来，靠热情组织起来的军队，只会在第一次失败时散掉。"

 DEN_Ebbe_Gortz:0 "埃贝·格茨"
 DEN_Ebbe_Gortz_desc:0 "骑炮兵出身的参谋军官、参谋学院教官，也是丹麦军队里少数看得懂坦克与飞机的人。\n\n他在讲义里写过一句话，后来被学生抄在军校宿舍的墙上：“下一场战争不会在日德兰的麦田里打，而会在铁路时刻表和加油站之间打。”总参谋部对他的观点半信半疑，但没人能否认，他是丹麦唯一一个把机械化与丹麦地理放在同一张地图上研究的人。"

 DEN_Erik_With:0 "埃里克·维特"
 DEN_Erik_With_desc:0 "三十岁的上尉参谋，履历干净得近乎乏味：军校、步兵团、总参谋部。\n\n他有个不寻常的习惯——每到一个驻地，先去看当地的地形图与教堂档案。他相信丹麦若真要打仗，战场一定在中日德兰的丘陵与沼泽之间，而那里的每一条小路都记在教会的旧地图上。\n\n同僚笑他“像在准备一场不会来的战争”。他回答：正因为不会来，才要准备得便宜一点。"

 #-------------------------------------------------- 海军主官
 DEN_Frederik_Zahrtmann:0 "弗雷德里克·扎尔特曼"
 DEN_Frederik_Zahrtmann_desc:0 "丹麦海军参谋长。他接手舰队时，账面上的船还能开、炮还能响，只是水兵的津贴已经三年没涨过。\n\n他给海军的定位很朴素：丹麦不必在北海争雄，只需要让任何一支想过厄勒海峡的舰队明白这笔买卖不划算。水雷、潜艇、鱼雷艇——小国的海军就该像浅滩上的礁石，不显眼，但会让大船记住它。"

 DEN_Carl_Hammerich:0 "卡尔·哈默里希"
 DEN_Carl_Hammerich_desc:0 "海军后勤与动员专家，懂六种语言，常被外交部借去当译员。\n\n他把丹麦的港口、煤仓与铁路装卸能力做成了一套表格，据说能在四十八小时内算出一支舰队能在丹麦补给多久。同僚觉得这是浪费才华；他自己认为，像丹麦这样的国家，唯一拿得出手的战略资源就是地理位置，加上算得清楚的补给。"

 DEN_Aage_Vedel:0 "奥格·维德尔"
 DEN_Aage_Vedel_desc:0 "潜艇与鱼雷艇部队的青年军官，海军里升得最快的一批上尉之一。\n\n他在演习报告里写过一句被上级划掉的话：“如果我们必须与一支大舰队作战，那最好的位置是在水下。”没有人知道这句话将来会不会救下整个国家。"

 DEN_Henri_Konow:0 "亨利·科诺"
 DEN_Henri_Konow_desc:0 "前任丹属西印度群岛总督，如今的海军大臣。他一生做过两件不讨喜的事：把丹麦在西印度的最后一笔殖民地卖给了美国，以及在世界大战的四年里坚持丹麦舰队不主动出海。\n\n他对海军的看法带着殖民地官僚的冷静：“我们没有舰队，我们只有一支用来证明丹麦还存在的海军。”哥本哈根的报纸骂他卖国，但账本上那笔钱确实让丹麦撑过了战后的第一个冬天。"

 #-------------------------------------------------- 内阁（政治顾问）
 DEN_Peter_Munch:0 "彼得·蒙克"
 DEN_Peter_Munch_desc:0 "激进自由党的国防大臣，也是丹麦在世界大战期间“不设防”政策的执行者。他顶着军方的怒火把预算压到最低，理由是：一个中立的小国如果看起来像座军营，就没人会相信它是中立的。\n\n复活节危机里，他站在议会一边，反复强调同一句话——宪法没有授予国王自行组阁的权力。国王不喜欢他，但没有人比他更清楚丹麦军队的真实状况。"

 DEN_Klaus_Berntsen:0 "克劳斯·贝恩森"
 DEN_Klaus_Berntsen_desc:0 "自由党元老，1910至1913年间的首相兼国防大臣，如今是议会里最年长、也最难被激怒的声音。\n\n他不相信革命，也不相信国王的紧急权力，只相信丹麦自耕农的传统和一份能执行下去的预算。当年轻议员在议会里喊出“最后通牒”时，他通常只抬起头说一句：“先生，我们上一次下最后通牒是一八六四年。”"

 DEN_Ove_Rode:0 "奥夫·罗德"
 DEN_Ove_Rode_desc:0 "激进自由党的内政大臣，战时丹麦财政与配给体系的设计者。\n\n他习惯用数字说话：一公斤黄油配给多少、一吨煤能换几公斤培根、克朗贬值百分之几能让日德兰的农场主在伦敦市场上多活一年。议员们抱怨他把政治变成了会计；他回答，一个只有三百万人口、外汇靠粮食出口的小国，本来就是一盘账。"

 DEN_HP_Hanssen:0 "汉斯·彼得·汉森"
 DEN_HP_Hanssen_desc:0 "北石勒苏益格丹麦族的领袖，在德意志帝国的议会里为南日德兰的丹麦人说了十几年的话。\n\n公投之后，他成了哥本哈根与新边境之间最重要的那座桥：他知道哪座村庄讲丹麦语、哪座讲德语、哪座两者都讲，也知道一条画得不小心的边界会制造多少怨恨。\n\n他的主张很不受欢迎——拿回北石勒苏益格就够了，向南多走一步，丹麦总有一天要为此付账。"

 DEN_Frederik_Borgbjerg:0 "弗雷德里克·博格比约"
 DEN_Frederik_Borgbjerg_desc:0 "社会民主党人，丹麦工人运动里少数既懂工会谈判、也懂议会预算的人物。\n\n他推动的是最不浪漫的那部分社会主义：工伤保险、养老津贴、八小时工作制、失业救济。保守派骂他渐进，左翼骂他妥协，他的回答是：“丹麦的工人不需要一场革命的仪式，他们需要的是下个月还能领到工资。”\n\n在复活节危机里，他尽力把街头的愤怒留在街垒之外。"

 DEN_Christmas_Moller:0 "克里斯马斯·默勒"
 DEN_Christmas_Moller_desc:0 "保守人民党的年轻议员，名字取自他的出生日。\n\n他主张强化王权、扩大国防、警惕来自南方的革命浪潮——在他看来，一个连自己边境都守不住的共和国，迟早会把革命输出到日德兰。他也不掩饰自己对王冠的偏爱：“丹麦的王冠不是装饰品，它是这个国家在风暴里唯一不需要翻译的象征。”\n\n在议会里，他是最擅长把保守立场讲成常识的人。"
