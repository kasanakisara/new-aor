 nation_is_aligned_with_noone: "§g未加入任何势力集团§!"
 entente_special_cold_war_description: "§L以英国和法国为主要力量的国际联盟，在世界大战期间联合对抗同盟国。§!"
 ENG_special_cold_war_description: "§L英国以遍布各大洲的自治领、殖民地和海外据点维系其国际地位，并通过贸易、海军与外交联系保持对盟国及附属地区的影响。§!"
 FRA_special_cold_war_description: "§L法国通过盟约、殖民地和海外保护国维系其国际影响，寻求保障本土安全，并维护其在欧洲及海外的战后利益。§!"
 RUS_special_cold_war_description: "§L共产国际，又称第三国际，是各国共产党及共产主义组织的国际联合组织。它主张团结各国工人阶级，以革命推翻资本主义制度，建立无产阶级政权，并通过各国支部协调国际共产主义运动。共产国际反对第二国际的改良主义路线，以推动世界革命为目标。§!"
 GER_SL_special_cold_war_description: "§L社会主义国际，因其常设秘书处位于柏林而又被称为“柏林国际”，是世界大战后欧洲社会主义政党重建国际联系的尝试。它主张民主政治、国际合作，以暴力与非暴力斗争方式相结合的方式推进社会主义事业，试图在共产国际的革命路线与战后各国社会党的不同主张之间寻求共同立场。然而，各派在革命道路、议会政治和国际团结上的分歧，始终制约着这一组织的影响力。§!"

