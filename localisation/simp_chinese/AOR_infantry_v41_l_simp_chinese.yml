l_simp_chinese:
 aor_inf_r01:0 "弹仓式栓动步枪"
 aor_inf_r01_desc:0 "弹仓式栓动步枪与配套刺刀、背带和维护用品，已经构成军队日常使用的基本装备。军械部门应当保证这些熟悉的武器能够持续得到补充，而不是让庞大的库存因规格混乱而失去价值。"
 aor_inf_r02:0 "大战制式步枪"
 aor_inf_r02_desc:0 "大战服役的制式步枪已有稳定的生产和修理经验。整理枪械规格、刺刀座和背带配套，便于战后继续补充部队。"
 aor_inf_r03:0 "战后改良步枪"
 aor_inf_r03_desc:0 "吸收大战后的勤务报告，改善易损件、握持和军械验收，使新造步枪更适合长期配发。"
 aor_inf_r05:0 "枪托与护木改良"
 aor_inf_r05_desc:0 "修整枪托和护木的尺寸与耐久性，使步枪在野外使用时更顺手。"
 aor_inf_s01:0 "早期自装填步枪"
 aor_inf_s01_desc:0 "部分新式步枪已能在射击后自行装填下一发弹药。这项技术值得交付部队使用，但它能否承受长时间的野外勤务，仍需要比靶场试验更严苛的检验。"
 aor_inf_s02:0 "改良自装填步枪"
 aor_inf_s02_desc:0 "改良后的试验方案开始具备有限配发的条件。部队仍须承担较高的采购和维护代价，但持续使用将帮助军械部门判断这条路线是否值得继续投入。"
 aor_inf_s03:0 "制式自装填步枪"
 aor_inf_s03_desc:0 "多年试用与持续拨款，使我们的自装填方案终于能够按统一标准交付。是否扩大换装，还取决于军队的财政和补给能力；可靠的旧式步枪仍不会立即离开军械库。"
 aor_inf_l01:0 "大战班用武器"
 aor_inf_l01_desc:0 "大战经验推动班组火力组织的改进；轻机枪、自动步枪与枪组勤务应各得其所。"
 aor_inf_l03:0 "轻机枪勤务改良"
 aor_inf_l03_desc:0 "改进轻机枪枪组的维修、换位和持续射击程序，以稳定现有班用火力。"
 aor_inf_l04:0 "班用火力整合"
 aor_inf_l04_desc:0 "统一班用火力器材与训练要求，让成熟装备在长期服役中保持效能。"
 aor_inf_l05:0 "自动武器携行配套"
 aor_inf_l05_desc:0 "自动武器的作用不仅取决于枪手。为携弹人员分配合适的装具，并为枪组准备便于携带的维护用品，可以使有限的自动火力更稳定地伴随步兵。"
 aor_inf_g01:0 "制式手榴弹"
 aor_inf_g01_desc:0 "制式手榴弹已是常见近战器材；稳定储运和分发规格可减少使用中的混乱。"
 aor_inf_g03:0 "投掷器材耐候改良"
 aor_inf_g03_desc:0 "改善投掷器材的防潮包装和野外检查，减轻天气对可靠性的影响。"
 aor_inf_g05:0 "枪榴弹配套"
 aor_inf_g05_desc:0 "统一枪榴弹发射附件及专门人员的携行配套。"
 aor_inf_g06:0 "步兵烟幕器材"
 aor_inf_g06_desc:0 "烟幕为步兵提供了一种不同于杀伤火力的支援手段。将烟幕器材纳入有计划的配发和补给，可以使部队拥有更多遮蔽与联络上的选择。"
 aor_inf_u01:0 "野战服装与背具"
 aor_inf_u01_desc:0 "一套合适的军服、军靴和背具，是士兵长期服役的基础。适合野外使用的颜色、结实的材料与明确的携行位置，有助于军队离开营房后继续正常行动。"
 aor_inf_u02:0 "钢盔与单兵防护"
 aor_inf_u02_desc:0 "钢盔与其他单兵防护用品已在大战中广泛使用；统一衬垫和配发标准，减少野外伤害。"
 aor_inf_u04:0 "防护装具改良"
 aor_inf_u04_desc:0 "改善防护用品与背具的配合，使战斗装具更便于穿戴和维护。"
 aor_inf_u05:0 "行军装具整合"
 aor_inf_u05_desc:0 "军靴、雨具、背具和个人用品应当作为一套相互配合的装备交付。长期勤务报告与统一规格，可以减少看似琐碎却不断拖累部队的负担。"
 aor_inf_u06:0 "寒区服装与装具"
 aor_inf_u06_desc:0 "为寒冷地区准备保暖、防风和防潮用品。"
 aor_inf_u07:0 "热区服装与装具"
 aor_inf_u07_desc:0 "为炎热地区准备适宜的衣物、头部遮蔽和携行用品。"
 aor_inf_u08:0 "伪装罩衣与遮蔽物"
 aor_inf_u08_desc:0 "有针对性地配发罩衣和遮蔽物，降低士兵与器材的暴露。"
 aor_inf_m01:0 "海军陆战队"
 aor_inf_m01_desc:0 "舰艇与海外据点需要能够承担陆上任务的步兵。为这些部队提供适合海上勤务的装备和专门保障，可以使他们在离舰之后仍保持组织与战斗能力。"
 aor_inf_m02:0 "登陆携行装具"
 aor_inf_m02_desc:0 "为人员与器材准备适合船艇转运的防潮和携行用品。"
 aor_inf_m03:0 "岸滩联络器材"
 aor_inf_m03_desc:0 "使用标识、信号和有线器材保持先遣部队与后续梯队的联系。"
 aor_inf_t01:0 "山地步兵"
 aor_inf_t01_desc:0 "陡峭山路限制了普通部队的携行与补给。配备适合登山的个人用品，并为少量重装备准备驮载条件，可以使步兵在崎岖地形中保持行动。"
 aor_inf_t02:0 "山地分载装具"
 aor_inf_t02_desc:0 "将山地装备分配给人员和驮畜，改善崎岖地形中的携行。"
 aor_inf_t03:0 "轻量山地装具"
 aor_inf_t03_desc:0 "减少不必要的负重，同时保留山地勤务所需的耐用性。"
 aor_inf_t04:0 "山地宿营装备"
 aor_inf_t04_desc:0 "整理山地宿营与寒冷勤务器材，使部队在高地保持基本行动能力。"
 aor_inf_e01:0 "大战突击部队"
 aor_inf_e01_desc:0 "以大战经验组织专门的突击部队，配发适合近距离任务的器材。"
 aor_inf_e02:0 "突击携行装具"
 aor_inf_e02_desc:0 "突击部队需要把最常用的器材带在便于取用的位置，同时舍去不适合临敌任务的负担。经过前线检验的专用装具，能使已有装备更好地配合士兵行动。"
 aor_inf_e03:0 "专业攻坚器材"
 aor_inf_e03_desc:0 "不同的坚固阵地需要不同的专业器材。为突击部队配备经过统一验收的工具、防护和器材运输用品，可以让它与工兵的支援更加紧密。"
 aor_inf_f02:0 "改良喷火装备 (1924 / 1923)"
 aor_inf_f02_desc:0 "早期器材在携行、维护和使用安全上仍有许多不足。持续改良军用品质量与勤务附件，可以使喷火分队更可靠地完成其有限而专门的任务。"
 aor_inf_b02:0 "钢制突击护具"
 aor_inf_b02_desc:0 "钢制护具为部分突击任务提供有限防护，但增加重量并限制行动。研究后可另编护具突击营，普通突击营继续使用。"
 aor_inf_n01:0 "狙击与观察分队"
 aor_inf_n01_desc:0 "精选步枪、可靠瞄镜和基本观察伪装用品，已经使专业射手成为部队的一种支援力量。这些人员需要细致保养器材，并将观察结果交给所属部队使用。"
 aor_inf_n02:0 "狙击观察器材"
 aor_inf_n02_desc:0 "狙击分队需要看清情况、记录观察并与所属部队保持联系。为观察人员配备适合携行的光学器材与用品，可以让精确射击不再依赖射手一人的判断。"
 aor_inf_n03:0 "改良狙击装备"
 aor_inf_n03_desc:0 "精密器材必须经得起长时间野外勤务。改善瞄镜的牢固性、耐候保护和校验配套，可以使精选步枪的精度更可靠地转化为部队可用的能力。"
 aor_inf_mg1:0 "大战机枪连"
 aor_inf_mg1_desc:0 "枪械、弹药、枪架与勤务人员共同组成一支能够持续支援步兵的机枪连。统一编制和器材配发，可以使已有机枪更可靠地投入部队任务。"
 aor_inf_mg2:0 "改良机枪连"
 aor_inf_mg2_desc:0 "长期服役与演习暴露了机枪连在器材协同上的不足。完善枪架、观察与勤务配套，使现有武器能够提供更稳定的支援。"
 aor_inf_mg3:0 "完善机枪连"
 aor_inf_mg3_desc:0 "持续的部队使用为机枪器材和勤务标准带来了进一步改良。完善后的机枪连应当继续发挥持续火力的优势，而不是仅因武器年代较早便被废弃。"
 aor_inf_mg_t:0 "机枪运输装具 (1921 / 1920)"
 aor_inf_mg_t_desc:0 "成套的携行架、驮载用品与器材箱，可以减轻枪班搬运中的混乱，使机枪和弹药及时到达需要它们的地方。"
 aor_inf_mg_o:0 "机枪观测与射击器材 (1927 / 1926)"
 aor_inf_mg_o_desc:0 "适用的观测器材与射击配套能够帮助机枪连保持稳定支援，并让枪班更清楚地判断战场情况。"
 aor_inf_f01:0 "喷火支援分队 (1919 / 1919)"
 aor_inf_f01_desc:0 "喷火器材有着有限而明确的专业用途。将经过训练的人员、携行用品和勤务保障编成专门分队，可以使它们在适当的任务中发挥作用。"
 aor_inf_w01:0 "枪械防尘与保养"
 aor_inf_w01_desc:0 "防尘罩套、清洁工具与保养程序能减少野外勤务中的枪械故障。"
 aor_self_loading_equipment_1:0 "1919早期自装填"
 aor_self_loading_equipment_2:0 "1924改良试验型"
 aor_self_loading_equipment_3:0 "1930自装填定型"
 aor_flame_support:0 "喷火支援分队"
 aor_armored_assault:0 "护具突击营"
 aor_sniper_observer:0 "狙击观察分队"
 aor_self_loading_equipment_1_short:0 "1919早期自装填"
 aor_self_loading_equipment_1_desc:0 "部分新式步枪已能在射击后自行装填下一发弹药。这项技术值得交付部队使用，但它能否承受长时间的野外勤务，仍需要比靶场试验更严苛的检验。"
 aor_self_loading_equipment_2_short:0 "1924改良试验型"
 aor_self_loading_equipment_2_desc:0 "改良后的试验方案开始具备有限配发的条件。部队仍须承担较高的采购和维护代价，但持续使用将帮助军械部门判断这条路线是否值得继续投入。"
 aor_self_loading_equipment_3_short:0 "1930自装填定型"
 aor_self_loading_equipment_3_desc:0 "多年试用与持续拨款，使我们的自装填方案终于能够按统一标准交付。是否扩大换装，还取决于军队的财政和补给能力；可靠的旧式步枪仍不会立即离开军械库。"

 aor_inf_r04:0 "制式短步枪"
 aor_inf_r04_desc:0 "缩短枪身并整理瞄具、枪托和携行方式，令制式步枪更便于不同步兵单位使用。"
 aor_inf_r06:0 "改良制式短步枪"
 aor_inf_r06_desc:0 "完善短步枪的加工与耐候细节，使军械库能以小幅性能改善保持生产连续。"
 aor_inf_r07:0 "标准化制式步枪"
 aor_inf_r07_desc:0 "统一零件与验收标准，减少不同批次步枪给维修和补给带来的负担。"
 aor_inf_b01:0 "刺刀与背带配套"
 aor_inf_b01_desc:0 "刺刀和背带早已是军用步枪的常见附件；统一接口和携行方法可改善勤务与近战准备。"
 aor_inf_r04a:0 "机械瞄具改良"
 aor_inf_r04a_desc:0 "改进机械瞄具的清晰度与校准方法，帮助普通射手更稳定地使用现有步枪。"
 aor_inf_r08:0 "枪械零件互换"
 aor_inf_r08_desc:0 "统一常用零件和修理量规，减少不同生产批次之间的维修障碍。"
 aor_inf_s01a:0 "自装填机构改良"
 aor_inf_s01a_desc:0 "改善自装填机构的维护与故障排除办法，为后续改良型号积累经验；这项研究不改变栓动步枪的性能。"
 aor_inf_s02a:0 "自装填步枪勤务改良"
 aor_inf_s02a_desc:0 "整理自装填步枪的清洁、验收和零件勤务，作为制式化生产前的准备；这项研究不改变栓动步枪的性能。"
 aor_inf_l00:0 "步兵随伴武器"
 aor_inf_l00_desc:0 "步兵早已使用随队机枪和其他支援武器。整理基本编组与弹药携行，使这些装备更容易伴随步兵行动。"
 aor_inf_l06:0 "班用自动火力改良"
 aor_inf_l06_desc:0 "整合自动武器、携弹人员和观察手的职责，减少班组在移动与射击之间的脱节。"
 aor_inf_g07:0 "近战器材配套"
 aor_inf_g07_desc:0 "整理少量冲锋枪和其他近战器材的携行与保养，不另设必需生产物资。"
 aor_inf_m04:0 "岸滩作业器材"
 aor_inf_m04_desc:0 "完善岸滩卸载与临时整理器材，减少登陆后的装备损失和混乱。"
 aor_bolt_equipment_1919:0 "1919大战制式步枪"
 aor_bolt_equipment_1919_short:0 "1919大战制式步枪"
 aor_bolt_equipment_1919_desc:0 "大战服役的制式步枪，适合持续生产与维修。"
 aor_bolt_equipment_1927:0 "1927改良制式短步枪"
 aor_bolt_equipment_1927_short:0 "1927改良制式短步枪"
 aor_bolt_equipment_1927_desc:0 "在短步枪基础上改善加工、携行和耐候细节。"
 aor_bolt_equipment_1930:0 "1930标准化制式步枪"
 aor_bolt_equipment_1930_short:0 "1930标准化制式步枪"
 aor_bolt_equipment_1930_desc:0 "统一常用零件和生产验收的制式步枪。"
 aor_s01a_equipment_bonus:0 "自装填机构改良"
 aor_s01a_equipment_bonus_desc:0 "改善早期自装填步枪的机构可靠性。"
 aor_s02a_equipment_bonus:0 "自装填步枪勤务改良"
 aor_s02a_equipment_bonus_desc:0 "改善改良自装填步枪的勤务可靠性。"
