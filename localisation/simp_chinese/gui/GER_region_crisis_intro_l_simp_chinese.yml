 # 地区博弈 · 危机介绍框（interface/GER_region_game.gui 的 AOR_CRISIS_INTRO）
 GER_region_crisis_intro_title: "[GER_region_crisis_intro_title_text]"
 GER_region_crisis_intro_desc: "[GER_region_crisis_intro_desc_text]"

 GER_region_crisis_intro_bavaria_t: "巴伐利亚危机"
 GER_region_crisis_intro_bavaria_d: "自1919年艾斯纳遇刺以来，巴伐利亚政局持续动荡，政治暴力频发。1920年2月霍夫曼遇刺及随后的报复性枪击事件，使慕尼黑陷入内战边缘。冯卡尔接任州总理后，以恢复秩序为名于2月23日宣布紧急管制措施，并公开庇护辖区内准军事组织，公然违反《凡尔赛条约》裁军条款。\n\n目前内阁已着手研究应对解决措施并做好发生突发事件的准备。为了德意志民族与社会主义革命，我们决不能失败。"

 GER_region_crisis_intro_silesia_t: "西里西亚危机"
 GER_region_crisis_intro_silesia_d: "波兰军事组织于8月18日绕过公投程序，于上西里西亚多处发起武装袭击，并占领了煤矿和铁路枢纽。因此，内阁已紧急召开会议，认定此为非法侵略行为，并向协约国联合委员会提交正式抗议。但此事能否完美解决，还要我们能否做出正确的行动。"

 GER_region_crisis_intro_defense_law_t: "国防法危机"
 GER_region_crisis_intro_defense_law_d: "1920年夏季以来，国防军与社民党政府之间的裂痕已从暗流演变为公开对抗。\n军官团担忧我们正借助裁军争议推行布尔什维克式的革命，而大柏林法案引发的南北对立更加深了军方的不信任感。7月国防军骚乱爆发后，局势持续恶化，而9月屈斯特林政变未遂与退伍士兵游行使矛盾进一步激化。与此同时，巴伐利亚危机留下的政治创伤尚未愈合，波美拉尼亚已落入右翼实际控制，共和国东北部的政治版图正在变色，我们不得不做出行动了。\n这场冲突不仅关乎军政关系的重构，更将决定魏玛共和国能否存活。"
