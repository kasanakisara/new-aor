 GER_yihui_gui_entry_tt: "打开 / 关闭§Y德意志共和国议会§!"
 GER_yihui_empty: ""
 GER_yihui_quote: "“从今以后，德意志共和国将是世界上最民主的民主国家。”——爱德华·大卫"
 GER_yihui_help_tt: "§H德意志共和国议会§!\n\n在右侧选择一项§Y行政焦点§!，在左下点选负责处理的§Y党团§!（可多选），再点「交付处理」。\n\n§H耗时§!：一个党团 §Y25§! 天；同一政党每多一派 §Y+5§! 天，每多一个政党 §Y+10§! 天。\n§H处理期间§!：参与的党团各自提供加成。\n§H完成时§!：每多一个参与党团，§Y议会协商惯性§! +1%，反对党团每个再 +1%；每有一个执政联盟党团参与，§Y联盟凝聚力§! +1%，每有一个反对党团参与 §R-2%§!。\n\n§H行政容量§!决定能同时处理几项行政焦点，可以消耗 §Y30%§! 协商惯性扩充。\n§H重大立法§!表决时会消耗§Y议会协商惯性§!。"
 GER_yihui_overview_title: "议会概况"
 GER_yihui_agenda_title: "行政焦点"
 GER_yihui_capacity_text: "§Y[?GER_yihui_running_count|0]§! / [?GER_yihui_focus_capacity|0]"
 GER_yihui_capacity_tt: "§H行政容量§!\n处理中的行政焦点：§Y[?GER_yihui_running_count|0]§!/§Y[?GER_yihui_focus_capacity|0]§!"
 GER_yihui_capacity_plus_tt: "§H扩充行政容量§!\n执行此行动需要£aor_parliament §Y议会协商惯性§!：§Y30%§!\n\n§H选择后的效果：§!\n行政容量：§G+1§!"
