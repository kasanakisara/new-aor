 GER_yihui_agenda_1_name: "改善农业雇工待遇"
 GER_yihui_agenda_1_name_grey: "§s改善农业雇工待遇§!"
 GER_yihui_agenda_1_tt: "§H改善农业雇工待遇§!\n废除旧帝国各邦的仆役条例，让农业雇工获得结社权、工时限制与书面雇佣合同。\n\n§H完成后的效果：§!\n稳定度：§G+2%§!\n解锁行政焦点§Y推动农村定居§!"
 GER_yihui_agenda_1_law_tt: "§H改善农业雇工待遇§!\n废除旧帝国各邦的仆役条例，让农业雇工获得结社权、工时限制与书面雇佣合同。"
 GER_yihui_agenda_2_name: "统一军人抚恤"
 GER_yihui_agenda_2_name_grey: "§s统一军人抚恤§!"
 GER_yihui_agenda_2_tt: "§H统一军人抚恤§!\n统一各邦五花八门的军人抚恤办法，由国家负担伤残军人、阵亡者遗属的抚恤与职业安置。\n\n§H完成后的效果：§!\n稳定度：§G+2%§!\n战争支持度：§G+3%§!\n解锁行政焦点§Y征收紧急献金§!"
 GER_yihui_agenda_2_law_tt: "§H统一军人抚恤§!\n统一各邦五花八门的军人抚恤办法，由国家负担伤残军人、阵亡者遗属的抚恤与职业安置。"
 GER_yihui_agenda_3_name: "统筹煤炭生产"
 GER_yihui_agenda_3_name_grey: "§s统筹煤炭生产§!"
 GER_yihui_agenda_3_tt: "§H统筹煤炭生产§!\n成立由矿主、矿工与消费者代表组成的国家煤炭委员会，统一调配煤炭生产与价格。\n\n§H完成后的效果：§!\n在一个随机的核心州获得§Y1§!座民用工厂"
 GER_yihui_agenda_3_law_tt: "§H统筹煤炭生产§!\n成立由矿主、矿工与消费者代表组成的国家煤炭委员会，统一调配煤炭生产与价格。"
 GER_yihui_agenda_4_name: "推动农村定居"
 GER_yihui_agenda_4_name_grey: "§s推动农村定居§!"
 GER_yihui_agenda_4_tt: "§H推动农村定居§!\n督促各邦设立公益定居公司，以优先购买权收购大庄园土地，分给小农与退伍士兵。\n\n§H完成后的效果：§!\n稳定度：§G+3%§!"
 GER_yihui_agenda_4_law_tt: "§H推动农村定居§!\n督促各邦设立公益定居公司，以优先购买权收购大庄园土地，分给小农与退伍士兵。"
 GER_yihui_agenda_5_name: "征收紧急献金"
 GER_yihui_agenda_5_name_grey: "§s征收紧急献金§!"
 GER_yihui_agenda_5_tt: "§H征收紧急献金§!\n对大额财产一次性征收累进献金，以填补战后国家财政的亏空。\n\n§H完成后的效果：§!\n政治点数：§G+100§!\n稳定度：§R-2%§!"
 GER_yihui_agenda_5_law_tt: "§H征收紧急献金§!\n对大额财产一次性征收累进献金，以填补战后国家财政的亏空。"
