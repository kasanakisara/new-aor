 GER_yihui_agenda_1_name: "改善农业雇工待遇"
 GER_yihui_agenda_1_name_grey: "§s改善农业雇工待遇§!"
 GER_yihui_agenda_1_tt: "§H改善农业雇工待遇§!\n废除旧帝国各邦的仆役条例，让农业雇工获得结社权、工时限制与书面雇佣合同。\n\n§H完成后的效果：§!\n稳定度：§G+2%§!\n解锁行政焦点：§Y推动农村定居§!"
 GER_yihui_agenda_1_law_tt: "§H改善农业雇工待遇§!\n废除旧帝国各邦的仆役条例，让农业雇工获得结社权、工时限制与书面雇佣合同。"
 GER_yihui_agenda_2_name: "统一军人抚恤"
 GER_yihui_agenda_2_name_grey: "§s统一军人抚恤§!"
 GER_yihui_agenda_2_tt: "§H统一军人抚恤§!\n统一各邦五花八门的军人抚恤办法，由国家负担伤残军人、阵亡者遗属的抚恤与职业安置。\n\n§H完成后的效果：§!\n稳定度：§G+2%§!\n战争支持度：§G+3%§!\n解锁行政焦点：§Y征收紧急献金§!"
 GER_yihui_agenda_2_law_tt: "§H统一军人抚恤§!\n统一各邦五花八门的军人抚恤办法，由国家负担伤残军人、阵亡者遗属的抚恤与职业安置。"
 GER_yihui_agenda_3_name: "统筹煤炭生产"
 GER_yihui_agenda_3_name_grey: "§s统筹煤炭生产§!"
 GER_yihui_agenda_3_tt: "§H统筹煤炭生产§!\n成立由矿主、矿工与消费者代表组成的国家煤炭委员会，统一调配煤炭生产与价格。\n\n§H完成后的效果：§!\n随机一个核心州：\n  添加§G1§!个建筑位\n  添加§G+1§!§Y民用工厂§!\n  添加§G+8§!§Y煤§!"
 GER_yihui_agenda_3_law_tt: "§H统筹煤炭生产§!\n成立由矿主、矿工与消费者代表组成的国家煤炭委员会，统一调配煤炭生产与价格。"
 GER_yihui_agenda_4_name: "推动农村定居"
 GER_yihui_agenda_4_name_grey: "§s推动农村定居§!"
 GER_yihui_agenda_4_tt: "§H推动农村定居§!\n督促各邦设立公益定居公司，以优先购买权收购大庄园土地，分给小农与退伍士兵。\n\n§H完成后的效果：§!\n稳定度：§G+3%§!"
 GER_yihui_agenda_4_law_tt: "§H推动农村定居§!\n督促各邦设立公益定居公司，以优先购买权收购大庄园土地，分给小农与退伍士兵。"
 GER_yihui_agenda_5_name: "征收紧急献金"
 GER_yihui_agenda_5_name_grey: "§s征收紧急献金§!"
 GER_yihui_agenda_5_tt: "§H征收紧急献金§!\n对大额财产一次性征收累进献金，以填补战后国家财政的亏空。\n\n§H完成后的效果：§!\n政治点数：§G+100§!\n稳定度：§R-2%§!"
 GER_yihui_agenda_5_law_tt: "§H征收紧急献金§!\n对大额财产一次性征收累进献金，以填补战后国家财政的亏空。"
 GER_yihui_agenda_6_name: "经济民主化听证"
 GER_yihui_agenda_6_name_grey: "§s经济民主化听证§!"
 GER_yihui_agenda_6_tt: "§H经济民主化听证§!\n围绕劳资协商、企业民主监督与社会政策改革召开国会公开听证，为渐进改良铺平制度道路。\n\n§H完成后的效果：§!\n£aor_parliament §Y议会协商惯性§!：§G+6%§!\n获得为期§Y120§!日的“§Y经济民主化试点§!”，其效果为（生活消费品工厂系数§G-10%§!，£prod_eff_cap 生产效率上限§G+5%§!）。"
 GER_yihui_agenda_6_law_tt: "§H经济民主化听证§!\n围绕劳资协商、企业民主监督与社会政策改革召开国会公开听证，为渐进改良铺平制度道路。"
 GER_yihui_agenda_7_name: "共和国市政救济计划"
 GER_yihui_agenda_7_name_grey: "§s共和国市政救济计划§!"
 GER_yihui_agenda_7_tt: "§H共和国市政救济计划§!\n拨付市政公共工程与民生救济款项，修缮战后受损交通并安抚各地城镇居民。\n\n§H完成后的效果：§!\n稳定度：§G+3%§!\n随机§Y1§!个核心州添加§G+1§!§Y基础设施§!\n£aor_region_game §Y全部开放地区支持度§!：§G+2%§!"
 GER_yihui_agenda_7_law_tt: "§H共和国市政救济计划§!\n拨付市政公共工程与民生救济款项，修缮战后受损交通并安抚各地城镇居民。"
 GER_yihui_agenda_8_name: "对外商约与关税协定"
 GER_yihui_agenda_8_name_grey: "§s对外商约与关税协定§!"
 GER_yihui_agenda_8_tt: "§H对外商约与关税协定§!\n重谈战后对外商约与原料进口关税，打破外交孤立并恢复德国工商界的国际贸易渠道。\n\n§H完成后的效果：§!\n稳定度：§G+3%§!\n获得为期§Y180§!日的“§Y对外商约红利§!”，其效果为（生活消费品工厂系数§G-8%§!，贸易影响力系数§G+20%§!，战略资源获取率§G+8%§!）。"
 GER_yihui_agenda_8_law_tt: "§H对外商约与关税协定§!\n重谈战后对外商约与原料进口关税，打破外交孤立并恢复德国工商界的国际贸易渠道。"
 GER_yihui_agenda_9_name: "清算旧军国主义残余"
 GER_yihui_agenda_9_name_grey: "§s清算旧军国主义残余§!"
 GER_yihui_agenda_9_tt: "§H清算旧军国主义残余§!\n追究旧帝国军部与战时军火寡头的战争责任，肃清旧军官团在国家机器中的残余势力。\n\n§H完成后的效果：§!\n£aor_socialization §Y反革命力量§!：§G-3%§!\n£aor_region_game §Y全部开放地区控制度§!：§G+2%§!\n政治点数：§G+30§!"
 GER_yihui_agenda_9_law_tt: "§H清算旧军国主义残余§!\n追究旧帝国军部与战时军火寡头的战争责任，肃清旧军官团在国家机器中的残余势力。"
