 GER_yihui_party_1_desc: "§USPD 左翼§! §Y-执政联盟成员§!\n社会民主党内的激进派，以斯巴达克派、柏林革命工长组织和各地激进党部为骨干，主张以工人委员会为核心推进社会化。\n\n代表人物：§Y卡尔·李卜克内西§!、§Y保罗·列维§!"
 GER_yihui_party_2_desc: "§XSPD 中派§! §Y-执政联盟成员§!\n社会民主党的主导派系，坚守传统的社会主义路线，在委员会专政与议会民主之间寻求调和。\n\n代表人物：§Y威廉·迪特曼§!、§Y路易丝·齐茨§!"
 GER_yihui_party_3_desc: "§ZSPD 右翼§! §Y-执政联盟成员§!\n社会民主党内的温和派，忠于议会民主共和国，主张通过民主程序和工会协作渐进地推行社会主义。\n\n代表人物：§Y奥托·威尔斯§!、§Y赫尔曼·米勒§!"
 GER_yihui_party_4_desc: "§8中央党§! §Y-执政联盟成员§!\n天主教政治的代表，以社会天主教与联邦主义为纲领，是社会民主党在议会中的联盟伙伴。\n\n代表人物：§Y马蒂亚斯·埃茨贝格尔§!、§Y康斯坦丁·费伦巴赫§!"
 GER_yihui_party_5_desc: "§i德意志民主党§!\n左翼自由派的共和政党，拥护宪政与法治，代表进步的工商界和知识阶层。\n\n代表人物：§Y胡戈·普罗伊斯§!、§Y康拉德·豪斯曼§!"
 GER_yihui_party_6_desc: "§J德意志人民党§!\n继承民族自由党传统的右翼自由派，代表重工业利益，对共和国态度暧昧。\n\n代表人物：§Y古斯塔夫·施特雷泽曼§!"
 GER_yihui_party_7_desc: "§s德意志民族人民党§!\n君主派与民族保守派的联合，敌视共和国与凡尔赛和约，背后是容克地主与旧军官阶层。\n\n代表人物：§Y奥斯卡·赫格特§!、§Y卡尔·黑弗里希§!"
 GER_yihui_party_8_desc: "§g其他党派§!\n巴伐利亚农民联盟、德意志汉诺威党等地方小党的松散集合，立场各异。\n\n代表人物：§Y路德维希·阿尔佩斯§!"
