 GER_yihui_agenda_1_name: "乡村调查"
 GER_yihui_agenda_1_name_grey: "§s乡村调查§!"
 GER_yihui_agenda_1_left: "§Y剩 [?GER_yihui_ag_1_days|0] 天§!"
 GER_yihui_agenda_1_tt: "§H乡村调查§!\n议会派出调查团，走访易北河以东的庄园与村镇，查明土地、租佃与雇工的实情。\n\n§g完成效果待定。§!"
 GER_yihui_agenda_1_law_tt: "§H乡村调查§!\n议会派出调查团，走访易北河以东的庄园与村镇，查明土地、租佃与雇工的实情。"
 GER_yihui_agenda_2_name: "监督不忠乡镇官员"
 GER_yihui_agenda_2_name_grey: "§s监督不忠乡镇官员§!"
 GER_yihui_agenda_2_left: "§Y剩 [?GER_yihui_ag_2_days|0] 天§!"
 GER_yihui_agenda_2_tt: "§H监督不忠乡镇官员§!\n清查仍心向旧帝国、阳奉阴违的乡镇官吏，让共和国的法令真正落到地方。\n\n§g完成效果待定。§!"
 GER_yihui_agenda_2_law_tt: "§H监督不忠乡镇官员§!\n清查仍心向旧帝国、阳奉阴违的乡镇官吏，让共和国的法令真正落到地方。"
 GER_yihui_agenda_3_name: "限制极右组织"
 GER_yihui_agenda_3_name_grey: "§s限制极右组织§!"
 GER_yihui_agenda_3_left: "§Y剩 [?GER_yihui_ag_3_days|0] 天§!"
 GER_yihui_agenda_3_tt: "§H限制极右组织§!\n审查并取缔自由军团残部与各类秘密民族主义社团。\n\n§g完成效果待定。§!"
 GER_yihui_agenda_3_law_tt: "§H限制极右组织§!\n审查并取缔自由军团残部与各类秘密民族主义社团。"
 GER_yihui_agenda_4_name: "司法部隐蔽阻碍"
 GER_yihui_agenda_4_name_grey: "§s司法部隐蔽阻碍§!"
 GER_yihui_agenda_4_left: "§Y剩 [?GER_yihui_ag_4_days|0] 天§!"
 GER_yihui_agenda_4_tt: "§H司法部隐蔽阻碍§!\n司法部的保守官僚正在暗中拖延共和国的改革法令。\n\n§g完成效果待定。§!"
 GER_yihui_agenda_4_law_tt: "§H司法部隐蔽阻碍§!\n司法部的保守官僚正在暗中拖延共和国的改革法令。"
 GER_yihui_agenda_5_name: "政府出资小农补贴"
 GER_yihui_agenda_5_name_grey: "§s政府出资小农补贴§!"
 GER_yihui_agenda_5_left: "§Y剩 [?GER_yihui_ag_5_days|0] 天§!"
 GER_yihui_agenda_5_tt: "§H政府出资小农补贴§!\n由国家出资补贴小农，换取农村对共和国的支持。\n\n§g完成效果待定。§!"
