l_simp_chinese:
 GER_yihui_gui_entry_tt: "打开 / 关闭§Y德意志共和国议会§!"
 GER_yihui_empty: ""
 GER_yihui_quote: "“从今以后，德意志共和国将是世界上最民主的民主国家。”——爱德华·大卫"
 GER_yihui_help_tt: "§H德意志共和国议会§!\n\n在左侧选择一项§Y议程§!，在中间点选负责处理的§Y党团§!（可多选），再点「交付处理」。\n\n§H耗时§!：一个党团 §Y25§! 天；同一政党每多一派 §Y+5§! 天，每多一个政党 §Y+10§! 天。\n§H处理期间§!：参与的党团各自提供加成。\n§H完成时§!：每多一个参与党团，§Y议会协商惯性§! +1%；每有一个执政联盟党团参与，§Y联盟凝聚力§! +1%。\n\n§H行政容量§!决定能同时处理几项议程，可以消耗 §Y30%§! 协商惯性扩充。\n§H议会协商惯性§!越高，关键法案在立法辩论中越容易按社民党的方案通过。"
 GER_yihui_agenda_title: "议会议程"
 GER_yihui_capacity_text: "§Y[?GER_yihui_running_count|0]§! / [?GER_yihui_focus_capacity|0]"
 GER_yihui_capacity_tt: "§H议会行政容量§!\n正在处理 §Y[?GER_yihui_running_count|0]§! 项，最多同时处理 §Y[?GER_yihui_focus_capacity|0]§! 项。"
 GER_yihui_capacity_plus_tt: "§H扩充行政容量§!\n消耗 §Y30%§! 议会协商惯性，行政容量 §G+1§!。\n当前协商惯性：§Y[?GER_yihui_inertia|0]%§!"
