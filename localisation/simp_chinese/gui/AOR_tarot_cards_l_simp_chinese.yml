 AOR_tarot_card_14_heading:0 "§Y「XIII 死神 - 里夏德·米勒」§!\n§g死亡，终结，灾厄。§!"
 AOR_tarot_card_14_intro_alive:0 "§L说时迟，那时快，他的手在他的脑后举了起来，他的手又在舞动一把斧子。那斧子白光闪闪，一边在空中划着半圆，一边向前砍杀下来，砍，杀，又有一把在嗖嗖作响，又有一把在嗖嗖作响，又有一把在嗖嗖作响。§!"
