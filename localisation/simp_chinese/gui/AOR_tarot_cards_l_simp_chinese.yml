 # III 皇后 / 老李卜克内西
 AOR_tarot_card_04_heading:0 "§Y「III 皇后 - 威廉·李卜克内西」§!\n§g孕育，生命，创造，调和。§!"
 AOR_tarot_card_04_intro_alive:0 "§L是政治鼓动家、演说家和杂志编辑之类的，跟他的儿子一样，也是个不满现状者，但所作所为都更加大度和勇敢。……他令一届届政府感到头痛……从古老的历史中，他们已熟悉那种人，那种绝望地追求自由和不屈地反抗暴君的人，虽然他们从未想到会直接和这样的人发生关系。§!"
 AOR_tarot_card_04_intro_dead:0 "§L是政治鼓动家、演说家和杂志编辑之类的，跟他的儿子一样，也是个不满现状者，但所作所为都更加大度和勇敢。……他令一届届政府感到头痛……从古老的历史中，他们已熟悉那种人，那种绝望地追求自由和不屈地反抗暴君的人，虽然他们从未想到会直接和这样的人发生关系。§!"
