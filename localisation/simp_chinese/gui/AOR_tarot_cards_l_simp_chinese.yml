 # V 教皇 / 考茨基
 AOR_tarot_card_06_heading:0 "§Y「V 教皇 - 卡尔·考茨基」§!\n§g权威，信仰，结合，知识传承。§!"
 AOR_tarot_card_06_intro_alive:0 "§L你张口闭口理智与反叛，你这热衷于教育的撒旦！除此而外，我是喜欢你的。尽管你是个吹牛大王，一副街头摇风琴艺人似的穷酸相，但你心眼儿不坏，心眼儿好得多，因此我更喜欢你，而不是那个尖刻而矮小的恐怖主义者，虽然你们俩每次争论他几乎总是在理……§!"
 AOR_tarot_card_06_intro_dead:0 ""
 AOR_tarot_card_06_effect:0 "£aor_socialization §Y无产阶级组织度§!：§G+8%§!\n£aor_socialization §Y反革命激进度§!：§G-4%§!\n\n£aor_spd §Y中派影响力§!：§G+8%§!\n£aor_spd §Y左派影响力§!：§R-5%§!\n£aor_spd §Y右派影响力§!：§R-5%§!"
