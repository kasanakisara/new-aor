 # VI 恋人 / 拉萨尔
 AOR_tarot_card_07_heading:0 "§Y「VI 恋人 - 斐迪南·拉萨尔」§!\n§g爱情，选择，良知，欲望。§!"
 AOR_tarot_card_07_intro_alive:0 "§L一个与生俱来就无可救药地爱着深渊的人怎么能配得上教育者的名号呢？就算我们浪子回头声明放弃它转而追逐尊严，我们还是会永远被它吸引。……但是形式和无罪，菲德洛斯，将会导致迷醉和欲望；它们有可能将一个高贵的人堕入使人震惊的情欲之罪，他自己美好的严于律己将会受到谴责，变得声名狼藉；它们导向深渊；它们全都导向深渊。§!"
 AOR_tarot_card_07_intro_dead:0 "§L一个与生俱来就无可救药地爱着深渊的人怎么能配得上教育者的名号呢？就算我们浪子回头声明放弃它转而追逐尊严，我们还是会永远被它吸引。……但是形式和无罪，菲德洛斯，将会导致迷醉和欲望；它们有可能将一个高贵的人堕入使人震惊的情欲之罪，他自己美好的严于律己将会受到谴责，变得声名狼藉；它们导向深渊；它们全都导向深渊。§!"
