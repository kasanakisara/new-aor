 # XX 审判 / 小李卜克内西
 AOR_tarot_card_21_heading:0 "§Y「XX 审判 - 卡尔·李卜克内西」§!\n§g审判，评价，局势转变。§!"
 AOR_tarot_card_21_intro_alive:0 "§L人们不必敬畏命运，而应该正视它，把握它，摧毁它。醒来吧，睁开眼睛吧，注意，成千上万的人是一个整体，没有醒来的人，不是遭人嘲笑，就是被人宰割。……走向自由，走向自由，旧世界必须灭亡，醒来吧，早晨的空气。§!"
