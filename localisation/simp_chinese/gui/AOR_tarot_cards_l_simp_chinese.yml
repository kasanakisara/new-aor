l_simp_chinese:
 # 0 愚者 / 马克思
 AOR_tarot_card_01_heading:0 "§Y「0 愚者 - 卡尔·马克思」§!\n§g纯真，未知的起点，无畏的跃入。§!"
 AOR_tarot_card_01_intro_alive:0 "§L一场革命不会半途而废。它根本没有止境。大洋没有止境，而燎原大火——某个地方肯定有这样一种火，那样巨大，犹如大洋那样无边无际，也许在地下，不过也许在天上——燎原大火，没有止境。革命就是如此。它没有形体，如果革命是火，则其形体就是燃烧；如果革命是水，则其形体就是洪流。我们自己是水中的水滴或火中的火星，我们根本没有可能出来。§!"
 AOR_tarot_card_01_intro_dead:0 "§L一场革命不会半途而废。它根本没有止境。大洋没有止境，而燎原大火——某个地方肯定有这样一种火，那样巨大，犹如大洋那样无边无际，也许在地下，不过也许在天上——燎原大火，没有止境。革命就是如此。它没有形体，如果革命是火，则其形体就是燃烧；如果革命是水，则其形体就是洪流。我们自己是水中的水滴或火中的火星，我们根本没有可能出来。§!"
 AOR_tarot_card_01_effect:0 "§g不可抽取。§!"
 AOR_tarot_card_01_alive_tt:0 "$AOR_tarot_card_01_heading$\n$AOR_tarot_card_01_intro_alive$\n\n$AOR_tarot_card_01_effect$"
 AOR_tarot_card_01_dead_tt:0 "$AOR_tarot_card_01_heading$\n$AOR_tarot_card_01_intro_dead$\n\n$AOR_tarot_card_01_effect$"
 # I 魔术师 / 恩格斯
 AOR_tarot_card_02_heading:0 "§Y「I 魔术师 - 弗里德里希·恩格斯」§!\n§g创造，掌握，维系，转化。§!"
 AOR_tarot_card_02_intro_alive:0 "§L如果有您这样的人作为朋友、上司、叔父、祖父……我都会感到高兴的。……强壮、健康、食欲旺盛、声音洪亮、能言善辩、自满自足、高人一等、坚忍不拔、沉着果断、通晓人情世故，又有某种慷慨豪爽的气度。当然您也带有与这些优点共生的所有缺点和弱点，这是您的秉性，有时是您脾气急躁所致。§!"
 AOR_tarot_card_02_intro_dead:0 "§L如果有您这样的人作为朋友、上司、叔父、祖父……我都会感到高兴的。……强壮、健康、食欲旺盛、声音洪亮、能言善辩、自满自足、高人一等、坚忍不拔、沉着果断、通晓人情世故，又有某种慷慨豪爽的气度。当然您也带有与这些优点共生的所有缺点和弱点，这是您的秉性，有时是您脾气急躁所致。§!"
 AOR_tarot_card_02_effect:0 "§g不可抽取。§!"
 AOR_tarot_card_02_alive_tt:0 "$AOR_tarot_card_02_heading$\n$AOR_tarot_card_02_intro_alive$\n\n$AOR_tarot_card_02_effect$"
