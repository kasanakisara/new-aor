 # XIX 太阳 / 威廉·科嫩
 AOR_tarot_card_20_heading:0 "§Y「XIX 太阳 - 威廉·科嫩」§!\n§g幸福，财富，婚姻，启示。§!"
 AOR_tarot_card_20_intro_alive:0 "§L我们这些带有印记的人是将自然意志呈现为全新的、分散的、未来的意志，而其他人则是活在固守的意志当中。对他们而言，人性——他们与我们一样热爱人性——是固有的，是必须遵守和维护的。人性于我们而言则是一个遥远的未来，是我们所有人正在为之努力的不懈追求，它的面目无人知晓，它的规则无处可寻。§!"
 AOR_tarot_card_20_intro_dead:0 ""
 AOR_tarot_card_20_effect:0 "£aor_region_game §Y全部开放地区支持度§!：§G+2%§!\n£aor_region_game §Y全部开放地区控制度§!：§G+2%§!\n首次使用强化£aor_region_game §Y培训根据地干部§!，使其每日政治点数获取额外§G+0.10§!；再次使用政治点数§G+25§!"
