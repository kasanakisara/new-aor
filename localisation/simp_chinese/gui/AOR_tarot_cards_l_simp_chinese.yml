 # XVI 塔 / 奥托·布劳恩
 AOR_tarot_card_17_heading:0 "§Y「XVI 塔 - 奥托·布劳恩」§!\n§g毁坏，灾祸，失望，囚禁。§!"
 AOR_tarot_card_17_intro_alive:0 "§L就字面而言，它还存在着。我们还有一支军队……和一帮政府官员……但是它的活生生的肌体正在腐烂，它正在腐烂。它已经毁坏了！……时代不再需要我们了！§!"
