 # IX 隐者 / 克里斯平
 AOR_tarot_card_10_heading:0 "§Y「IX 隐者 - 阿图尔·克里斯平」§!\n§g审慎，智慧，诽谤，虚伪。§!"
 AOR_tarot_card_10_intro_alive:0 "§L乐观主义者一定会绝望。我是个多愁善感的人，我不要紧。我没有自杀的倾向，因为我感受不到一点那种令别人不撞南墙不回头的事业心。我旁观并等待。我等待着正直获胜，然后便供其驱驰。但是我如同一个不信神的人等待神迹一样，等待着正直获胜。§!"
 AOR_tarot_card_10_intro_dead:0 ""
 AOR_tarot_card_10_effect:0 "政治点数：§G+20§!\n\n下次抽取£aor_spd §Y塔罗牌§!政治点数花费：§G-25§!\n下次£aor_spd §Y塔罗牌§!抽取冷却：§G-15§!日"
