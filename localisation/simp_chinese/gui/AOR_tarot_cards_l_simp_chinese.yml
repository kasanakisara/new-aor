 # VIII 力量 / 雷德布尔
 AOR_tarot_card_09_heading:0 "§Y「VIII 力量 - 格奥尔格·雷德布尔」§!\n§g力量，坚定，坚决。§!"
 AOR_tarot_card_09_intro_alive:0 "§L那畜生将它一只又大又黑的暴眼球忧伤地盯着他，不由得将他红彤彤的手掌上一道无形的命令咽下了肚去。这匹浑身乏力的马顿时感觉到了由这个灰白唇髭、神采飞扬、英姿勃勃的罗密欧身上传来的神力。§!"
