 # XI 正义 / 哈泽
 AOR_tarot_card_12_heading:0 "§Y「XI 正义 - 胡戈·哈泽」§!\n§g公正，权威，平衡。§!"
 AOR_tarot_card_12_intro_alive:0 "§L民主除去以个人主义修正国家专制主义之外，别无其他含义。真理和正义是个人德行的王冠宝石，在与国家利益发生冲突的情况下，它们甚至看上去会变成与国家敌对的力量，实际上呢，它们注意的却是比国家更高的、超现世的福祉。§!"
 AOR_tarot_card_12_intro_dead:0 ""
 AOR_tarot_card_12_effect:0 "£aor_parliament §Y议会协商惯性§!：§G+5%§!\n£aor_parliament §Y联盟凝聚力§!：§G+4%§!\n\n当£aor_parliament §Y重大立法§!正在审议时：\n - §Y成果保留率§!：§G+5%§!\n\n当§Y胡戈·哈泽§!在任时：\n - £aor_parliament §Y议会协商惯性§!：§G+2%§!"
 AOR_tarot_card_12_alive_tt:0 "$AOR_tarot_card_12_heading$\n\n\n\n\n\n\n\n£GFX_AOR_tarot_portrait_hugo_haase 　　　　\n\n\n\n\n\n\n\n$AOR_tarot_card_12_intro_alive$\n\n§H抽取后效果：§!\n$AOR_tarot_card_12_effect$"
 AOR_tarot_card_12_dead_tt:0 "$AOR_tarot_card_12_heading$\n$AOR_tarot_card_12_intro_dead$\n\n§H抽取后效果：§!\n$AOR_tarot_card_12_effect$"
 # XII 倒吊人 / 多伊米希
 AOR_tarot_card_13_heading:0 "§Y「XII 倒吊人 - 恩斯特·多伊米希」§!\n§g考验，牺牲。§!"
 AOR_tarot_card_13_intro_alive:0 "§L“因为我找不到适合自己口味的食物。假如我找到这样的食物，请相信，我不会这样惊动视听，并像你和大家一样，吃得饱饱的。”这是他最后的几句话，但在他那瞳孔已经扩散的眼睛里，流露着虽然不再是骄傲，却仍然是坚定的信念：他要继续饿下去。§!"
 AOR_tarot_card_13_intro_dead:0 ""
