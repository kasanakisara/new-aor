 # VII 战车 / 艾伯特
 AOR_tarot_card_08_heading:0 "§Y「VII 战车 - 弗里德里希·艾伯特」§!\n§g胜利，庇护，斗争。§!"
 AOR_tarot_card_08_intro_alive:0 "§L你同意他，因为如果你不同意，你就等于承认自己在做不义之事，然后你也许就会怕他。可你不想害怕。你也不想改变自己的不义，因为那会带来太多后果。§!"
