 # XVII 星星 / 卢森堡
 AOR_tarot_card_18_heading:0 "§Y「XVII 星星 - 罗莎·卢森堡」§!\n§g希望，空气，失窃。§!"
 AOR_tarot_card_18_intro_alive:0 "§L他在人生中所有美好、丰盛、灿烂的时期，甚至早在青春期，都是这么过的：像根两头燃烧的蜡烛，怀着一种悲欣交集的感触纵情燃烧；怀着一种绝望的渴求喝光杯中酒；怀着一种幽隐的恐惧面向终亡。§!"
