 # XVIII 月亮 / 罗伯特·迪斯曼
 AOR_tarot_card_19_heading:0 "§Y「XVIII 月亮 - 罗伯特·迪斯曼」§!\n§g暗敌，危险，通灵。§!"
 AOR_tarot_card_19_intro_alive:0 "§L“你的眼睛还没有对准我。你还没有必要看着我。你在倾听人群的叨唠，街道的喧闹，电车的呼啸。尽情地呼吸吧，尽情地倾听吧。在这万物之中，你总有一天会听到我的声音的。”“谁？谁在说话？”“我不告诉你。你会看见的。你会感觉到的。武装好你的心。然后我再对你说话。然后你就会看见我了。你的双眼将满是泪水。”§!"
 AOR_tarot_card_19_intro_dead:0 ""
 AOR_tarot_card_19_effect:0 "政治点数：§G+20§!\n\n当§Y罗伯特·迪斯曼§!为工会领导人时：\n - £aor_socialization §Y当前项目社会化进度§!：§G+25§!\n - £aor_socialization §Y无产阶级组织度§!：§G+8%§!\n\n当§Y罗伯特·迪斯曼§!不是工会领导人时：\n - £aor_spd §Y中派影响力§!：§G+4%§!\n - £aor_spd §Y右派影响力§!：§R-4%§!\n - £aor_socialization §Y无产阶级组织度§!：§G+6%§!"
