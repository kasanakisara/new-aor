 # XV 恶魔 / 诺斯克
 AOR_tarot_card_16_heading:0 "§Y「XV 恶魔 - 古斯塔夫·诺斯克」§!\n§g毁灭性的力量，疾病，黑魔法。§!"
 AOR_tarot_card_16_intro_alive:0 "§L春天就像面带微笑的杀人犯游荡在德国各处。有些人没有死在棚屋里，躲过了刑讯，没有被爱国公民联盟的子弹和纳粹的棍棒打中，没有在家乡挨饿，没有被密探盯上，他们死在了路上，又黑又大的鸦群盘旋在他们的尸体上方。疾病潜伏在步行者的衣褶中，由他们的呼吸传播。§!"
 AOR_tarot_card_16_intro_dead:0 ""
