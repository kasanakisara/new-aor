 # IV 皇帝 / 倍倍尔
 AOR_tarot_card_05_heading:0 "§Y「IV 皇帝 - 奥古斯特·倍倍尔」§!\n§g权威、秩序、统治、责任。§!"
 AOR_tarot_card_05_intro_alive:0 "§L他形单影只，与众人远隔千里，因为真正的帝王就要让人敬而远之，就是孤家寡人一个。这个可怜的老人，受人尊敬，坚强却又迟钝，从容而又悲伤。在这个国家里，爱他的人不多，喜欢他的人却不少。他会替你摆平一切。可惜，来日无多。§!"
 AOR_tarot_card_05_intro_dead:0 "§L他形单影只，与众人远隔千里，因为真正的帝王就要让人敬而远之，就是孤家寡人一个。这个可怜的老人，受人尊敬，坚强却又迟钝，从容而又悲伤。在这个国家里，爱他的人不多，喜欢他的人却不少。§!"
