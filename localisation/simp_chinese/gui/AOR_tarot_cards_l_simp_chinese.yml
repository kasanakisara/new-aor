 # XXI 世界 / 赫尔曼·米勒
 AOR_tarot_card_22_heading:0 "§Y「XXI 世界 - 赫尔曼·米勒」§!\n§g成功，综合，整体，完成。§!"
 AOR_tarot_card_22_intro_alive:0 "§L现如今，当下的秩序制服了巨大的死神，使它成为一个完全普通的死神……人们葬下红色棺木中的死者，歌咏队在墓边唱起一段段歌，生者各自返回，重又坐在办公室里，填写登记表，写下统计数字，为新成员填写登记表，给被开除者写评语。没有办公桌、书写笔、石膏塑像、革命化橱窗、纪念碑、带倍倍尔头像把手的吸墨器，可能就建立不起一个新世界。§!"
 AOR_tarot_card_22_intro_dead:0 ""
