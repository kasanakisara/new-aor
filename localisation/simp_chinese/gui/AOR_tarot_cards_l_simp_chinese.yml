 # X 命运之轮 / 伯恩施坦
 AOR_tarot_card_11_heading:0 "§Y「X 命运之轮 - 爱德华·伯恩施坦」§!\n§g幸运，厄运，命运。§!"
 AOR_tarot_card_11_intro_alive:0 "§L但是如果有现实感，并且没有人会怀疑它有其存在的理由，那么一定也会有某种人们可以称之为虚拟感的东西。拥有这种感觉的人，例如不会说：这里发生了这事或那事，将发生这事，必须发生这事；相反，他会凭空设想：这里可能、应该或必须发生这事；如果有人向他解释某事就是它现在的那个样子，他就会想：嗯，它可能也完全是另外一种样子。§!"
 AOR_tarot_card_11_intro_dead:0 ""
 AOR_tarot_card_11_effect:0 "£aor_parliament §Y联盟凝聚力§!：§G+6%§!\n£aor_parliament §Y议会协商惯性§!：§G+4%§!\n获得£aor_parliament §Y行政焦点§!：§Y经济民主化听证§!\n\n§H已使用次数：§!§Y[?AOR_tarot_card_11_uses|0]§!/§Y3§!"
