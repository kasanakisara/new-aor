 # II 女祭司 / 蔡特金
 AOR_tarot_card_03_heading:0 "§Y「II 女祭司 - 克拉拉·蔡特金」§!\n§g内省，学识，奥秘，智慧。§!"
 AOR_tarot_card_03_intro_alive:0 "§L对每个表达自己思想的人来说，她都是一个倾听者、共鸣者，充满了信任和理解，似乎所有的思想都是自她而来，又回归于她。坐在她身边，偶尔听到她的声音，感受她周围成熟的灵魂的气息，对我来说，便是幸福。§!"
 AOR_tarot_card_03_intro_dead:0 ""
 AOR_tarot_card_03_effect:0 "£aor_spd §Y党内团结度§!：§G+8%§!\n\n当§Y克拉拉·蔡特金§!在任时：\n - £aor_spd §Y党内团结度§!：§G+4%§!\n\n§H已使用次数：§!§Y[?AOR_tarot_card_03_uses|0]§!/§Y3§!"
