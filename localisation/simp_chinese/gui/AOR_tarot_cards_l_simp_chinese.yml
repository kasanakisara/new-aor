 AOR_tarot_card_15_intro_alive:0 "§L你不是想支配社会吗？那先要服从社会，把社会彻底研究过。学者研究书本，政治家研究人，研究人的利害关系，行事的动机。社会，人类，一般说来都是宿命论者；他们崇拜既成事实。§!"
