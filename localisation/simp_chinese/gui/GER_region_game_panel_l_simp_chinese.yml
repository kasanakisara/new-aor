 GER_region_game_help_tt: "§H地区博弈：“国中之国”§!\n\n在左侧地图点选已开放的§Y地区§!，可在右侧查看该地区的§Y支持度§!、§Y控制度§!与§Y地区领导人§!，并执行各项§Y行动方针§!。\n\n§H地区效益§!：根据地区的§Y控制度§!与§Y支持度§!分为 §Y100%§! / §Y75%§! / §Y50%§! / §Y25%§! / §Y0%§! 五档，为该地区内归属德国的州提供相应的资源、建造速度与人力修正。\n§H摇摆与转换§!：§Y左派核心区§!与§Y左派控制区§!在支持度低于 §Y50%§! 且控制度低于 §Y60%§! 时会变为§Y摇摆区§!，回升后维持 §Y35§! 天恢复；§Y摇摆区§!在支持度 ≥ §Y50%§! 且控制度 ≥ §Y80%§! 时，可通过「§Y影子苏维埃§!」转为§Y左派控制区§!。\n§H驻区方针§!：§Y左派核心区§!或支持度与控制度均达 §Y100%§! 的地区可启用一项持续生效的§Y驻区方针§!。\n§H反革命行动§!：当地区出现§R反革命行动§!倒计时时，可点击地区照片上方的警示条消耗政治点数予以阻止。"
