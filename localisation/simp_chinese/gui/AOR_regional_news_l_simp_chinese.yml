 AOR_news_filter_open_label:0 "地区新闻"
 AOR_news_filter_open_tt:0 "§L在这个信息爆炸的世界，过量的信息会致使领导人难以把握其中那些对指引国家走向繁荣富强至关重要的头等大事。就新闻而言，并非每个犄角旮旯的大小琐事都值得领导人亲自过目，其中许多内容更值得由外交部门来进行筛选并妥善回应。\n\n基于前文，来自§!§Y特定大洲§!§L的新闻可以不用再专门呈送至领导人案头，§!§Y但重大事件仍将及时禀报以提醒领导人关注局势§!§L。而对于那些雄心勃勃、举足轻重的超级大国而言，其勤勉的国家领袖或许仍希望一切新闻均能呈报案前，以便不错过任何一个按自身意志重塑世界格局的机会。§!"
