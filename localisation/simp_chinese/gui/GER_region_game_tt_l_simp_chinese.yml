 GER_region_R16_GreatBerlin_tt: "“柏林是红的！柏林将保持红色！”\n\n对于德国工人来说，§Y“红色柏林”§!的威名无人不知。在这里，皇帝曾不可一世。而也是在这里，社会民主党带领上百万的“贱民”砸碎了皇冠，让满街的红旗彰显着谁是这里的主人。柏林成为了德国工人运动的圣地，只要“红色柏林”仍存于世，革命就将屹立不倒。\n\n正如一位来自莱茵的访客所说：“没有在我们队伍里亲身经历过那段岁月的人，无法想象柏林——苏联以外地球上最红的城市——对我来说意味着什么。我在大街上游荡了五六天。我四处打听，每次念出威丁、利希滕贝格、新克尔恩这些如雷贯耳的地名，都难掩激动。我在每一面墙上寻找弹孔。我端详着每一个行人的脸，§Y因为我深信：一双曾经从街垒上望出去过的眼睛，必定已经永远地改变了。§!”"

 GER_region_alsace_lorraine_tt: "那天早晨上学，我去的很晚。\n\n埃里希先生走上讲台，对我们说：\n\n“我的孩子们，这是我最后一次给你们上课。从柏林来了命令，今后在阿尔萨斯-洛林帝国领的小学里，就不准教德文了……新教师明天就到，今天，是你们最后一堂德文课，我请你们专心听讲......”\n\n§Y“课上完了……去吧。”§!"

 GER_region_bav_corner_tt: "特劳恩施泰因-贝希特斯加登，在那场大战中被邪恶的奥地利政府夺走。噢，你问为什么？我也不知道：或许是出于某位老组长的§Y恶趣味§!，或许是某个世界观的§Y防伪标记§!，又或许是某套详实架空推导的结果……不过这并不要紧。毕竟这世上，又有什么事是说得准的呢？" 
 GER_region_locked_all_tt: "§Y统一、正义和自由，\n为了德意志祖国！\n让我们兄弟般心手相连，\n共同为此奋斗！\n统一、正义和自由，\n是幸福的保证；\n在这幸福的光辉中繁荣吧，\n繁荣吧，德意志祖国！§!"
 GER_region_R01_WeserEms_tt: "【待定】威悉-埃姆斯"
 GER_region_R02_Hannover_tt: "【待定】汉诺威"
 GER_region_R03_HamburgSH_tt: "汉堡-石荷是一片分裂的地区，发展情况各不相同的农村环绕着飘扬着红旗的汉堡。习俗，人文，发展，它们处处不同，也处处相同。\n汉堡的党部像一座总参谋部。通讯员来来去去，每个人都以最饱满的热情投身革命。\n“‘死’这个词被得体地回避，正如汉堡人总是把那些慷慨激昂的事弯折成‘精致’的形态。精致而无情地执著于此岸，这就是汉堡。 ”\n但莫忘记，在不远外的田野，农民们也有着自己的世界。"
 GER_region_R04_Mecklenburg_tt: "【待定】梅克伦堡"
 GER_region_R05_Pomerania_tt: "§Y波美拉尼亚是一片丰饶而充满谜团的土地。§!\n\n据说，那些来自童话、传说与历史的、数千年过往的形象，也在这生活着。白天，它们沉睡在古老的柳树桩里、桥下、城堡与修道院的废墟后面，以及池塘和水洼的芦苇丛中；而到了夜里，它们便站起身来，耕作、劳作、狩猎、征战，彼此相爱相恨。\n共和国的喧闹传不进这片土地：这里的人们守着农耕时代的保守底色，一如这片美丽的土地本身那般沉静而自足。\n\n“在波罗的海的波浪拖曳向沙滩的地方，\n在黄色的金雀花盛开于沙丘之处，\n在海鸥于风暴的咆哮中尖声啼叫的地方，\n§Y那里便是我的故乡，那里就是我的家。§!”"
 GER_region_R06_Brandenburg_tt: "【待定】勃兰登堡"
 GER_region_R07_Silesia_tt: "【待定】西里西亚"
 GER_region_R08_ThuringiaSaxony_tt: "【待定】图林根-萨克森"
 GER_region_R09_Bavaria_tt: "古老习俗的忠诚继承人！\n§Y巴伐利亚式地生，巴伐利亚式地死！§!\n鼓声雷动，枪声噼啪，\n领袖的呼喊响彻云霄；\n白蓝旗帜猎猎飘扬，\n被硝烟紧紧环绕；\n透过队列，回荡着\n我们战士的号令：\n为国王献出一切，\n以及家乡珍贵的财产，\n生命从伤口中涌出，\n勇士的英雄之血在流淌；\n但他们仍高呼：§Y“继续战斗！”§！"
 GER_region_R10_BadenWuerttemberg_tt: "§Y巴登-符腾堡§!扼守德国西南，内卡河穿流而过。\n这里是黑森林的故乡，更是德意志人文精神的摇篮。从荷尔德林的诗篇到黑塞的沉思，此地孕育了对自由的敏感与对共和的向往。不同于普鲁士的军国喧嚣，它始终以温情守护着这片土地上的人民。\n在你的河谷里，我的心醒来，投入生活，\n你的波浪在我周围嬉戏；\n所有认识你的可爱山丘，漫游者呵，\n对我都不是陌生的。\n\n在它们的峰顶，天上的风常常\n为我§Y解除奴役的痛苦§!；而从山谷中，\n像生命从欢乐之杯中涌出，\n闪耀着微蓝的银色波光。"
 GER_region_R11_Hesse_tt: "【待定】黑森"
 GER_region_R12_Rhineland_tt: "他们休想得到他，\n那自由的德意志莱茵，\n任凭他们像贪婪的乌鸦，\n为此嘶吼到§Y声嘶力竭§!。\n\n他们休想得到他，\n那自由的德意志莱茵，\n只要还有§Y心灵§!从他\n火热的酒中获得滋养。\n\n只要他的激流之中，\n岩石仍§Y巍然屹立§!，\n只要高耸的教堂穹顶，\n仍倒映在他的镜面里。\n……\n他们休想得到他，\n那自由的德意志莱茵，\n直到他的洪流\n将最后一个人的§Y尸骨§!埋葬。"
 GER_region_R13_EastPrussia_tt: "【待定】东普鲁士"
 GER_region_R14_Ruhr_tt: "数十年来，§Y鲁尔地区§!的外观毫无变化。炉火在燃烧，矿井在生产的节奏中轰鸣，烟尘的队列在灰暗的天空下缓缓拖行。……但这只是表象。在矿井之下，余烬仍在闷烧！在镐与锤的敲击声中，对监工社会的旧日仇恨仍在翻腾。\n\n在萨尔肯山脚下，埃森城铺展开来：灰暗，却火光熊熊。烟囱连着烟囱，烟雾接着烟雾。铁锤的轰鸣与机车的汽笛交织。成排的房屋千篇一律，满是疤痕与裂痕……§Y这是他的鲁尔，他的土地，他的故乡。§!"
 GER_region_R15_Westphalia_tt: "【待定】威斯特法伦"
 GER_region_OV_SHL_trust_all_tt: "【待定】石勒苏益格·托管(南北两区一起)"
 GER_region_OV_SHL_north_Denmark_tt: "【待定】北石勒苏益格·归丹麦"
 GER_region_OV_SIL_planA_1134_762_tt: "我今日梦见，梦如此沉重，\n梦见我又回到了§Y我的家乡§!。\n芬芳、幸福与声响如何将我包裹！\n我走过那些我走过无数次的街巷……\n没有一声欢快的呼唤找到§Y我的灵魂§!！\n街道沉默，我站在那里，寒意侵身。\n它以陌生而冰冷的眼睛望着我：\n一种痛苦，一种幽暗的痛苦，裹住了这座城。\n于是我呼喊，我知道自己为何颤栗，\n我知道这颗§Y心§!失去了一切，\n感到它如此§Y满溢§!——又如此残忍地§Y空虚§!！\n§Y于是我呼喊！我的梦太沉重，太重了。§!"
