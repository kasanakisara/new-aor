 GER_BEBEL_DESC:0 "§Y在此，向伟大的工人皇帝、德国社会民主党领袖、德意志共和国总统——奥古斯特·倍倍尔阁下致敬。§!\n\n无论从哪个角度看，倍倍尔都是德国社会民主党乃至世界左翼运动当之无愧的泰斗。1860年，他与威廉·李卜克内西相识，并共同创立德意志工人协会联合会；1869年，他又与李卜克内西在爱森纳赫共同创立社会民主工党；1875年，他推动爱森纳赫派与拉萨尔派合并，建立了现今德国社会民主党的前身——德国社会主义工人党。可以说，他从无到有地建立起了如今屹立于德意志的“贱民王国”。\n\n如今，社会民主党内部的争论使这位老将再度出山。在党内原有“中间派”的支持下，倍倍尔迅速调停了一场原本可能使党陷入分裂的冲突，并像此前无数次那样，使党恢复了他心目中的团结状态。尽管左右翼对此颇有怨言，但在这位堪称社民党帝王的人物的号召下，绝大多数异议都能被暂时搁置。\n\n然而，局势并非全然令人乐观：党与工会之间的裂痕难以弥合，基层的分离倾向日益严重，而战时党内右翼的变相独裁，又使全党再度蒙上阴影。马克思的批判、恩格斯的告诫、威廉·李卜克内西生前的劝告，这一切都在提醒他：应当采取行动，扭转当前的颓势。然而，坐在光耀却稍显破旧的王座上的凯撒，又能做些什么呢？\n\n毕竟，他早已步入古稀之年。"
