l_simp_chinese:
 GRAND_DOCTRINE_INDUSTRIAL_WARFARE:0 "工业战"
 GRAND_DOCTRINE_INDUSTRIAL_WARFARE_DESC:0 "普法战争证明了现代战争是总体战，日俄战争则凸显了筑垒的重要。一场大战将检验一切战术——用工业、堑壕和钢铁把敌人磨垮。"
 SUBDOCTRINE_CHEMICAL_WARFARE:0 "化学战"
 SUBDOCTRINE_CHEMICAL_WARFARE_DESC:0 "毒气炮弹、发烟罐与防毒面具。化学武器能压下敌人的火力点，但也会考验己方士兵的纪律与防护。"
 SUBDOCTRINE_ARMORED_SUPPORT:0 "装甲支援"
 SUBDOCTRINE_ARMORED_SUPPORT_DESC:0 "让装甲车与早期坦克伴随步兵推进，用钢铁掩护血肉之躯。"
 SUBDOCTRINE_LOGISTICS_SUPPORT:0 "勤务保障"
 SUBDOCTRINE_LOGISTICS_SUPPORT_DESC:0 "野战医院、工程队与补给纵队——现代战争的胜负往往在后方决定。"
 SUBDOCTRINE_BITE_AND_HOLD:0 "咬住坚守"
 SUBDOCTRINE_BITE_AND_HOLD_DESC:0 "不再追求大规模突破，而是用小目标进攻咬下一段阵地，然后把它变成新的战壕。"
 SUBDOCTRINE_DEFENSE_IN_DEPTH:0 "纵深防御"
 SUBDOCTRINE_DEFENSE_IN_DEPTH_DESC:0 "多层战壕、机枪巢与弹性防御：让敌人攻进来，再用反冲击把他赶出去。"
 SUBDOCTRINE_METHODICAL_FIRE:0 "有计划的火力"
 SUBDOCTRINE_METHODICAL_FIRE_DESC:0 "集中炮火指挥、炮火准备与固定弹幕，把炮兵变成战场的主宰。"
 SUBDOCTRINE_INTEGRATED_FIREPOWER:0 "整合火力"
 SUBDOCTRINE_INTEGRATED_FIREPOWER_DESC:0 "步兵与炮兵同步推进，用徐进弹幕掩护步兵直至接触线。"
 SUBDOCTRINE_HURRICANE_BOMBARDMENT:0 "飓风炮击"
 SUBDOCTRINE_HURRICANE_BOMBARDMENT_DESC:0 "短促而猛烈的集中轰击，在敌人反应过来之前摧毁其前沿。"
 SUBDOCTRINE_METHODICAL_BATTLE:0 "有条不紊的战斗"
 SUBDOCTRINE_METHODICAL_BATTLE_DESC:0 "指令式指挥与科学化的战斗流程，让每一次进攻都经过精确计算。"
 SUBDOCTRINE_ATTACK_IN_POSITION_WARFARE:0 "阵地进攻"
 SUBDOCTRINE_ATTACK_IN_POSITION_WARFARE_DESC:0 "任务式指挥、弱点研究与风暴突击队——用渗透和强点孤立撕开堑壕防线。"
