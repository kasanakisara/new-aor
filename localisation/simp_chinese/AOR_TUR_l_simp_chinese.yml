 AOR_TUR_initial_revitalize_osmanilik_desc: "尽管奥斯曼主义曾经的重点影响地区——鲁米利亚和黎凡特——如今几乎已经损失殆尽，但是我们仍然需要团结库尔德和亚美尼亚人口，乃至于如今仍定居在西北沿海的希腊人。苏丹国虽然狭小，但这也导致其再也经受不起下一次民族分裂了。从今以后，我们不是土耳其人，更不是亚美尼亚人、库尔德人。我们就是奥斯曼人！"
