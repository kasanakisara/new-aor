 AOR_turkish_straits_game_gui_info_tt: "海峡托管领的归属权，是协约国与奥斯曼帝国《穆德罗斯停战协议》中悬而未决的一部分。协议中规定，海峡托管领为期一年，随后将“由各国代表共同决定其未来”。因此，在这一年间，英法两国与其各自的代理人 — §Y[TUR.GetNameWithFlag]§! 与 §Y[GRE.GetNameWithFlag]§! 将在海峡问题上激烈博弈，只为给己方求得最好的结果。"
