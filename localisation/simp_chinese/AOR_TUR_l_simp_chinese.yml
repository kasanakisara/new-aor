 AOR_TUR_initial_subsidize_muhacir: "赈济新一批穆哈齐尔"
 AOR_TUR_initial_subsidize_muhacir_desc: "穆哈齐尔，也就是穆斯林难民，最早大规模出现是在1878年战败后从马其顿回到安纳托利亚的难民潮，而随后1887年失去伊庇鲁斯的战争则产生了又一批。如今，世界大战和阿拉伯分离产生了更大规模、几乎称得上恐怖的穆哈齐尔浪潮，苏丹国必须妥善安置他们，否则巨量的赤贫难民能够轻松淹没任何政治秩序。"
