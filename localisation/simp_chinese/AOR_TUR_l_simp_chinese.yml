###民族精神###
 Humiliation_before_death: "死亡前的羞辱"
 The_storm_is_gathering: "暴雨正在聚集"
 revenge: "复仇的怒火"
 TUR_Sultan_Mohammed_VI_idea: "苏丹穆罕默德五世"
 TUR_Sultan_Mohammed_VI_idea_desc: "沉默的洞察者\n----------\n\n\n\n\n\n\n£GFX_TUR_Muhammad_VI_sultan \n\n\n\n\n\n\n----------\n随着统治帝国半个世纪，曾将其带入现代但也将其拖入深渊的苏丹阿卜杜勒哈米德二世在1918年驾崩，其幼弟继位为苏丹穆罕默德五世。作为第三次宪政时代开启者，这位新苏丹已经下定决心，不再重蹈其兄长覆辙，将权力安心地交给政党和国民议会加以运作。"
 TUR_treaty_mudros_idea: "穆德罗斯国耻"
 TUR_treaty_mudros_idea_desc: "奥斯曼帝国曾作为协约国一员投身世界大战，但帝国年迈的躯干根本无法承受世界大战的负担，最终结果便是1915年耻辱的对俄投降协议。其中，帝国失去了首都，以及统治超过六百年的阿拉伯世界，仅剩安纳托利亚中部的一点残余成为往日的残影。\n\n即使俄罗斯帝国也已经崩溃，但如今地缘问题上困扰苏丹国的各个关键，尤其是海峡问题和高加索问题，也多数出自这一耻辱。可以说，苏丹国从未走出1915年的那场惨败。"
 TUR_third_constitutional_era_idea: "第三次宪政时代"
 TUR_third_constitutional_era_idea_desc: "仅仅在苏丹阿卜杜勒哈米德死亡的一周后，不堪重负的“自由党专政”便彻底宣告破裂，第三军在伊兹密尔的兵变彻底终结了对内专制、对外软弱的费里德帕夏政府，将联合进步委员会再一次推上台前。随后，名义上的议会与宪法终于落到实处，多党制也迅速发展起来。在国家危难之际，政治环境居然格外的宽松起来。"
 TUR_complete_econ_collapse_idea: "国民经济完全崩溃"
 TUR_complete_econ_collapse_idea_desc: "协约国仍在占领爱琴海沿岸的帝国古都，富饶的黎凡特与新月沃地也离我们而去。如今残存的苏丹国不但要面对工业尽数沦丧的悲惨现实，还需要喂饱刚逃难到安纳托利亚中部的数百万饥民。国民经济已经无以为继。"
 TUR_national_econ_collapse_idea: "国民经济崩溃"
 TUR_national_econ_collapse_idea_desc: "协约国仍在占领爱琴海沿岸的帝国古都，富饶的黎凡特与新月沃地也离我们而去。如今残存的苏丹国不但要面对工业尽数沦丧的悲惨现实，还需要喂饱刚逃难到安纳托利亚中部的数百万饥民。国民经济已经无以为继。"
 TUR_loans_from_entente_idea: "协约国贷款"
 TUR_loans_from_entente_idea_desc: "我们的协约国前盟友们大发善心，向走入绝境的苏丹国伸出援手。他们提供了急需的资金用于购买指定企业生产的粮食与工业品，让政局稳定得以暂时存续。"
