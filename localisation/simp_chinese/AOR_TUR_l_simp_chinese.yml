 TUR_Ittihadist_factionalism_category: "联合进步委员会"
 TUR_Ittihadist_factionalism_category_desc: "作为如今[TUR.GetNameWithFlag]的执政党，§Y联合进步委员会§!向来不以党内统一而闻名。早在其诞生之初，巴黎与萨洛尼卡、文官与军官、自由与威权便威胁要将其撕裂成碎片。不过随着1918年政变将党再次送上执政地位，党的各派目前暂时为了同一个目标团结到了一起。\n\n党内主要派系：\n    “联合自由党人”(自由派)\n  自由主义者早在1892年巴黎委员会时期便是联合进步委员会的创始者，他们一般主张立宪制度与奥斯曼主义团结，希望继承法国大革命的集权与自由主义双重传统，以西式思想重新凝聚奥斯曼帝国。\n  自由派党内权势分数：[?AOR_TUR_Ittihadist_liberal_var]\n\n    “联合自由党人”(自由激进派)\n  在联合进步党的自由主义者当中，激进派相对更加重视法国大革命的理想而非功能性：世俗，民主，乃至于共和主义都是他们的政治追求。\n  自由激进派党内权势分数：[?AOR_TUR_Ittihadist_radical_var]\n\n    行动军派(威权派)\n  联合进步委员会与国内官僚集团合流，赢得崛起之机后，国内改革派官僚的实用主义和威权手段自然融入党内，而随着这批官僚的权势上升，党的方向自然也受到影响。\n  威权派党内权势分数：[?AOR_TUR_Ittihadist_authoritarian_var]\n\n    行动军派(民族派)\n  第三军体系内部的将领，相对于围绕他们的萨洛尼卡和埃迪尔内官僚，明显更具有民族主义激进倾向。他们更关注扩张，同时不惮于重新利用泛伊斯兰主义为自己的行动正名。\n  民族派党内权势分数：[?AOR_TUR_Ittihadist_nationalist_var]\n\n    杜尔海姆派(图兰派)\n  真正狂热的信奉图兰主义和泛突厥民族主义的派系，他们主要吸引失意的下级军官和激进文化理论家的加入。即使国内政治一时没有他们的容身之地，这一运动的危险性仍然不可小觑。\n  图兰派党内权势分数：[?AOR_TUR_Ittihadist_turanist_var]"
