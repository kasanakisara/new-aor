l_simp_chinese:
 sp_aor_atomic_structure:0 "原子结构理论"
 sp_aor_atomic_structure_desc:0 "这是一个§Y物理学§!研究。\n整理原子核模型、定态与光谱规律，建立能够指导后续微观研究的原子结构框架。"
 sp_aor_matter_waves:0 "物质波理论"
 sp_aor_matter_waves_desc:0 "这是一个§Y物理学§!研究。\n研究粒子动量与波长之间的联系，以波粒二象性重新解释微观物质的运动。"
 aor_theory_quantum_mechanics:0 "量子力学"
 aor_theory_quantum_mechanics_desc:0 "建立描述微观状态、测量概率与动力学演化的数学体系，将物质波假说发展为系统的量子力学。"
 sp_aor_quantum_mechanics:0 "量子力学"
 sp_aor_quantum_mechanics_desc:0 "这是一个§Y物理学§!研究。\n建立描述微观状态、测量概率与动力学演化的数学体系，将物质波假说发展为系统的量子力学。"
 aor_theory_quantum_electrodynamics:0 "量子电动力学"
 aor_theory_quantum_electrodynamics_desc:0 "探索电磁场量子化以及光与带电粒子的相互作用，形成可用于后续研究的早期量子电动力学方法。"
 sp_aor_quantum_electrodynamics:0 "量子电动力学"
 sp_aor_quantum_electrodynamics_desc:0 "这是一个§Y物理学§!研究。\n探索电磁场量子化以及光与带电粒子的相互作用，形成可用于后续研究的早期量子电动力学方法。"
 sp_aor_general_relativity:0 "广义相对论"
 sp_aor_general_relativity_desc:0 "这是一个§Y物理学§!研究。\n以时空几何描述引力，研究场方程及其可检验预言，建立系统的相对论引力研究能力。"
 aor_theory_relativistic_cosmology:0 "相对论宇宙学"
 aor_theory_relativistic_cosmology_desc:0 "将相对论场方程用于宇宙整体，研究宇宙模型、物质分布与时空演化。"
 sp_aor_relativistic_cosmology:0 "相对论宇宙学"
 sp_aor_relativistic_cosmology_desc:0 "这是一个§Y物理学§!研究。\n将相对论场方程用于宇宙整体，研究宇宙模型、物质分布与时空演化。"
 aor_theory_unified_field_theory:0 "统一场论"
 aor_theory_unified_field_theory_desc:0 "探索将引力与电磁作用纳入共同几何框架的可能性。项目完成代表形成研究方法与阶段性成果，并不意味着已经建立完整且得到验证的统一理论。"
 sp_aor_unified_field_theory:0 "统一场论"
 sp_aor_unified_field_theory_desc:0 "这是一个§Y物理学§!研究。\n探索将引力与电磁作用纳入共同几何框架的可能性。项目完成代表形成研究方法与阶段性成果，并不意味着已经建立完整且得到验证的统一理论。"
 aor_theory_symmetry_conservation:0 "对称性和守恒性"
 aor_theory_symmetry_conservation_desc:0 "研究连续变换、不变性与守恒量的联系，以严格的数学方法组织物理规律。"
 sp_aor_symmetry_conservation:0 "对称性和守恒性"
 sp_aor_symmetry_conservation_desc:0 "这是一个§Y数学§!研究。\n研究连续变换、不变性与守恒量的联系，以严格的数学方法组织物理规律。"
 aor_theory_abstract_algebra:0 "抽象代数"
 aor_theory_abstract_algebra_desc:0 "以群、环、域等抽象结构整理运算规律，为理论建模与复杂计算提供统一语言。"
 sp_aor_abstract_algebra:0 "抽象代数"
 sp_aor_abstract_algebra_desc:0 "这是一个§Y数学§!研究。\n以群、环、域等抽象结构整理运算规律，为理论建模与复杂计算提供统一语言。"
 aor_theory_mathematical_logic:0 "数理逻辑"
 aor_theory_mathematical_logic_desc:0 "研究形式语言、推理规则与可判定性，将严密的符号分析方法应用于密码破译。"
 sp_aor_mathematical_logic:0 "数理逻辑"
 sp_aor_mathematical_logic_desc:0 "这是一个§Y数学§!研究。\n研究形式语言、推理规则与可判定性，将严密的符号分析方法应用于密码破译。"
