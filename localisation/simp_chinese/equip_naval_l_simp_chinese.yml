 USA_heavy_cruiser_4: "重巡洋舰 IV型"
 USA_heavy_cruiser_4_desc: "这些重巡洋舰的最终型号往往更长、更大也更重，它们还装备有高射速的速射武器。"
 USA_battle_cruiser_1: "战列巡洋舰体"
