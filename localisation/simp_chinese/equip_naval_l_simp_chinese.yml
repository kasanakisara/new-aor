 SOV_battleship_3_desc: "改进舰体强度与内部布局后，战列舰可以承载更重的炮塔、装甲和燃料，并保持稳定的射击平台。"
 SOV_battleship_4: "远洋战列舰体"
 SOV_battleship_4_desc: "远洋战列舰强调续航、适航与主炮齐射重量。更大的舰体也让指挥和防空设备获得安装空间。"
 SOV_SH_battleship_1: "超重战列舰 I型"
 SOV_SH_battleship_1_desc: "在当前的世界形势下遵守海军条约已经变得完全没有必要了。挣脱了种种限制之后，我们现在可以全心全意地建造能同时对付数艘较小敌舰的、有史以来最重并且装备最优良的战列舰。"
 SOV_SH_battleship_2: "超重战列舰 II型"
 SOV_SH_battleship_2_desc: "我们在之前的超重战列舰上装上了更强大的武器以及改装过的火控系统。"
 SOV_carrier_1: "早期改装航空母舰体"
 SOV_carrier_1_desc: "由现有舰船改装的航空母舰可供舰载机进行侦察与训练。狭小机库和有限的飞行甲板使其难以承担舰队主力任务。"
 SOV_carrier_2: "早期专用航空母舰体"
 SOV_carrier_2_desc: "专门设计的飞行甲板改善了飞机起降与储放条件，但这一时期的舰载机仍受航程、载弹量和天气限制。"
 SOV_carrier_3: "航空母舰 III型"
 SOV_carrier_3_desc: "改进的建造方式以及诸如甲板边升降机这类的更加专业的系统使这些航空母舰可以更高效的携带更多飞机。"
 SOV_carrier_4: "航空母舰 IV型"
 SOV_carrier_4_desc: "随着海军条约被越来越多的国家所无视，我们现在可以建造能携带前所未有的数量的飞机来确保制空权的航空母舰了。"
 ### USA - USA ###
 USA_submarine_1: "早期潜艇艇体"
 USA_submarine_1_desc: "早期潜艇适合在近海伏击和封锁航道，其有限的水下续航要求艇长谨慎选择攻击时机。"
 #USA_submarine_1b: "Barracuda Class"
 USA_submarine_2: "远洋潜艇艇体"
 USA_submarine_2_desc: "扩大的燃料与补给空间使潜艇能够远离基地袭击商船，艇体强度也改善了其在恶劣海况下的生存能力。"
 #USA_submarine_2b: "Salmon Class"
 USA_submarine_3: "改进型潜艇艇体"
 USA_submarine_3_desc: "更合理的舱室和蓄电池布局使潜艇具备更长的巡航时间，并为更有效的鱼雷攻击创造条件。"
 #USA_submarine_3b: "Gato Class"
 USA_submarine_4: "先进潜艇艇体"
 USA_submarine_4_desc: "先进潜艇艇体重视远洋航程、潜深与水下操纵，在通商航线上能够保持更持久的威胁。"
 USA_destroyer_1: "驱逐舰 I型"
 USA_destroyer_1_desc: "为了确保运输船的安全，第一次世界大战的驱逐舰需要更改它们的定位并改变它们的设计。新的设计将拥有更多的鱼雷来增加与敌人交火的机会。"
 #USA_destroyer_1b: "Farragut Class"
 USA_destroyer_2: "驱逐舰 II型"
 USA_destroyer_2_desc: "更长的鱼雷射程和更快的装填时间，外加诸如高角炮塔的新设计将使我们的驱逐舰变成更高效的多面手。"
 #USA_destroyer_2b: "Benson & Gleaves Class"
 USA_destroyer_3: "驱逐舰 III型"
 USA_destroyer_3_desc: "为了应对来自空中以及水下的威胁，新型驱逐舰必须装备有雷达和更加先进的防空与反潜武器。"
 USA_destroyer_4: "驱逐舰 IV型"
 USA_destroyer_4_desc: "现代驱逐舰必须拥有多种不同的索敌装备，新型的深弹投放系统以及与以前的驱逐舰相比更大的吨位。"
 USA_light_cruiser_1: "早期巡洋舰体"
 USA_light_cruiser_1_desc: "以旧式巡洋舰为基础的舰体仍可担任侦察和海外巡航任务，但其防护与布局难以适应更重的武备。"
 USA_light_cruiser_2: "侦察巡洋舰体"
 USA_light_cruiser_2_desc: "大战的经验强调航速、航程与舰队通信的重要性。新的巡洋舰体适合在主力舰前方搜索并掩护屏卫舰。"
 USA_light_cruiser_3: "远洋巡洋舰体"
 USA_light_cruiser_3_desc: "扩大燃料储备和改善船体强度，使巡洋舰能在远洋长期活动，并为更重的火炮与装甲预留空间。"
 USA_light_cruiser_4: "先进巡洋舰体"
 USA_light_cruiser_4_desc: "更大型的巡洋舰体提供了充足的模块位置，使指挥、侦察与舰炮火力能够集中在同一艘舰上。"
 USA_heavy_cruiser_1: "早期巡洋舰体"
 USA_heavy_cruiser_1_desc: "以旧式巡洋舰为基础的舰体仍可担任侦察和海外巡航任务，但其防护与布局难以适应更重的武备。"
