l_simp_chinese:
 GER_SPD_union_criticism:0 "在各工会发起批评运动"
 GER_SPD_union_collapse:0 "关闭工会改革运动系列决议"
 GER_SPD_union_collapse_desc:0 "暂时收起工会改革运动的相关决议，以便处理其他事务。"
 GER_SPD_union_collapse_tt:0 "隐藏£aor_union_reform §Y工会改革运动§!系列决议。"
 GER_SPD_union_expand:0 "展开工会改革运动相关决议"
 GER_SPD_union_expand_desc:0 "重新查看工会改革运动的相关决议。"
 GER_SPD_union_expand_tt:0 "显示£aor_union_reform §Y工会改革运动§!系列决议。"
 GER_SPD_union_criticism_desc:0 "工会的领导权不应成为少数执委的私产。我们应当鼓励各地会员公开批评工会中的保守作风，要求领导层向他们所代表的工人负责。"
 GER_SPD_union_mobilize:0 "动员工会基层成员"
 GER_SPD_union_mobilize_desc:0 "工会的力量来自车间里的工人，而他们的声音却往往止于会议厅外。通过召开基层会议、组织代表参与讨论，我们可以让改革的要求真正成为全体会员的共同事业。"
 GER_SPD_union_coordinate:0 "协调改革运动"
 GER_SPD_union_coordinate_desc:0 "各地工会的改革者有着共同的敌手，却还没有共同的行动纲领。召集他们的代表，协调大会提案与组织工作，将使零散的呼声汇成足以推动改革的多数。"
 GER_SPD_union_metal:0 "金属工会的先锋作用"
 GER_SPD_union_metal_desc:0 "金属工会的基层组织在革命中积累了丰富的斗争经验。只要他们率先提出改革议程、发动会员参与，其他工会就会看到，旧有的领导方式并非不可撼动。"
 GER_SPD_union_industrial:0 "焦点A：以职业工会取代产业工会"
 GER_SPD_union_industrial_desc:0 "各行业的工人有着不同的技艺、劳动条件与切身诉求。以职业为基础重组工会，能够使代表更加熟悉会员的处境，并在共同的斗争中维护各行各业工人的利益。"
 GER_SPD_union_requires_militant_tt:0 "已完成§Y走向战斗的革命工会§!"
 GER_SPD_union_frankfurt_countdown:0 "法兰克福代表大会的逼近"
 GER_SPD_union_frankfurt_countdown_desc:0 "德国工会即将在法兰克福召开代表大会。届时，德国工会总委员会将改组为德国工会总联合会（ADGB），各地代表将选出新的领导层，并决定工会今后的组织形式与行动路线。保守派正力图维持既有秩序，改革者则希望借此重塑工会。大会日益临近，若要争取代表的支持、改变工会的方向，我们必须抓紧最后的机会。"
 GER_SPD_union_militant:0 "焦点B：走向战斗的革命工会"
 GER_SPD_union_militant_desc:0 "革命的成果不会仅凭协议得到保障。基层会员要求工会承担起保卫革命的责任，我们应当把这种意愿写入新的章程，使工会成为能够组织工人行动的战斗组织。"
 GER_SPD_union_soviet_independence:0 "焦点C：苏维埃独立"
 GER_SPD_union_soviet_independence_desc:0 "工厂委员会和苏维埃的权力来自工人的直接委托，不应受制于工会执委的命令。我们必须在大会上确认这些机构的独立地位，保障工人自行选举与监督代表的权利。"
 GER_SPD_union_soviet_integration:0 "焦点C：苏维埃与工会的有机结合"
 GER_SPD_union_soviet_integration_desc:0 "工会拥有广泛的组织网络，工厂委员会和苏维埃则扎根于生产现场。建立常设的联络与协商制度，可以将双方的力量结合起来，使工人的日常诉求与革命事业相互支撑。"
 GER_SPD_union_left_gain_tt:0 "£aor_spd §Y左派影响力§!：§G+5%§!。"
 GER_SPD_union_center_gain_tt:0 "£aor_spd §Y中派影响力§!：§G+5%§!。"
