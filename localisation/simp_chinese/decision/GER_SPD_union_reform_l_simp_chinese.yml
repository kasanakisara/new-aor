 GER_SPD_union_combined_65_tt:0 "£aor_spd §Y左派影响力§!与£aor_spd §Y中派影响力§!合计至少为§Y65%§!"
 GER_SPD_union_combined_67_tt:0 "£aor_spd §Y左派影响力§!与£aor_spd §Y中派影响力§!合计至少为§Y67%§!"
