l_simp_chinese:
 GER_1920_economy_missions:0 "经济计时任务"
 GER_1920_economy_missions_desc:0 "共和国经济工作的阶段性任务。倒计时结束时自动结算。"
 GER_1920_mission_ambitious_plan:0 "雄心勃勃的经济计划"
 GER_1920_mission_ambitious_plan_desc:0 "埃尔茨贝格改革正在全速推进。计划进行期间：政治点数获取§Y+15%§!，生活消费品工厂系数§Y-10%§!，生产效率上限§Y+5%§!，生产效率增长§Y+5%§!。§Y任务结束后，将获得国家精神「经济刚性」。§!"
 GER_1920_mission_slow_counterrev:0 "减缓阵痛的努力"
 GER_1920_mission_slow_counterrev_desc:0 "社会化委员会正试图用温和、渐进的方式缓和局势，减缓£aor_socialization §Y反革命力量§!的持续增长。任务期间：稳定度§Y+5%§!，建设速度§Y+5%§!，占用§Y10§! 座民用工厂。§Y任务结束后，「经济重建成效」将追加每日政治点数获取+0.05、每月人口+3%、适役人口系数+5%。§!"
 GER_1920_econ_recovery_slow_counterrev_tt:0 "「§Y经济重建成效§!」追加：\n每日政治点数获取：§G+0.05§!\n每月人口：§G+3%§!\n适役人口系数：§G+5%§!"
 GER_1920_mission_econ_dept_standardization:0 "经济部门“标准化”"
 GER_1920_mission_econ_dept_standardization_desc:0 "£aor_parliament §Y议会§!通过了经济部门“标准化”的焦点，为期 §Y100§! 天的「筛选工作」随之展开。期间：生活消费品工厂系数§R+10%§!。§Y任务结束后，「经济重建成效」将追加科研速度+5%、建造速度+5%、工厂产出+5%，并随机削弱两项反革命行动。§!"
 GER_1920_econ_recovery_econ_dept_tt:0 "「§Y经济重建成效§!」追加：\n科研速度：§G+5%§!\n建造速度：§G+5%§!\n工厂产出：§G+5%§!\n£aor_socialization 随机两项反革命行动将被削弱。"
 GER_1920_mission_emergency_property_tax:0 "紧急财产税"
 GER_1920_mission_emergency_property_tax_desc:0 "针对大资产阶级、土地所有者与资本家的一次性重税已经开征，为期 §Y70§! 天。期间获得国家精神「紧急收税策略」。"
