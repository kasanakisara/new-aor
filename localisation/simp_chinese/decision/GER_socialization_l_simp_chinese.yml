l_simp_chinese:
 GER_socialization_category:0 "社会化"
 GER_socialization_debug_empty:0 "§Y[测试]§! 社会化指标：全部清零"
 GER_socialization_debug_empty_desc:0 "将三项指标和两个等级设为0，检查进度条空槽。测试会直接覆盖当前指标，可重复执行，无政治点数消耗。"
 GER_socialization_debug_sample:0 "§Y[测试]§! 社会化指标：参考图数值"
 GER_socialization_debug_sample_desc:0 "无产阶级组织度：Lv.3 · 45%\n反革命力量：60.8%\n反革命激进度：Lv.2 · 25%（含组织度加成8%及激进度等级加成5%）\n\n测试会直接覆盖当前指标，可重复执行，无政治点数消耗。"
 GER_socialization_debug_half:0 "§Y[测试]§! 社会化指标：全部半满"
 GER_socialization_debug_half_desc:0 "无产阶级组织度：Lv.2 · 50%\n反革命力量：50%\n反革命激进度：Lv.3 · 50%（含组织度加成5%及激进度等级加成8%）\n\n三条进度条应同为半满。测试会直接覆盖当前指标，可重复执行，无政治点数消耗。"
 GER_socialization_debug_full:0 "§Y[测试]§! 社会化指标：全部满格"
 GER_socialization_debug_full_desc:0 "无产阶级组织度：Lv.4 · 100%\n反革命力量：100%\n反革命激进度：Lv.3 · 100%\n\n可检查最高等级效果与满格进度条。测试会直接覆盖当前指标，可重复执行，无政治点数消耗。"
 GER_socialization_debug_level_one:0 "§Y[测试]§! 无产阶级组织度：一级"
 GER_socialization_debug_level_one_desc:0 "将无产阶级组织度设为Lv.1，当前等级进度归零。检查对应加成和悬浮提示；可重复执行。"
 GER_socialization_debug_organization_two:0 "§Y[测试]§! 无产阶级组织度：二级"
 GER_socialization_debug_organization_two_desc:0 "将无产阶级组织度设为Lv.2，当前等级进度归零。检查地区最大工业值加成；可重复执行。"
 GER_socialization_debug_organization_three:0 "§Y[测试]§! 无产阶级组织度：三级"
 GER_socialization_debug_organization_three_desc:0 "将无产阶级组织度设为Lv.3，当前等级进度归零。检查战略资源获取率和激进社会化提示；可重复执行。"
 GER_socialization_debug_organization_four:0 "§Y[测试]§! 无产阶级组织度：四级"
 GER_socialization_debug_organization_four_desc:0 "将无产阶级组织度设为Lv.4，当前等级进度归零。检查工厂产出和激进社会化提示；可重复执行。"
 GER_socialization_debug_radicalism_one:0 "§Y[测试]§! 反革命激进度：一级"
 GER_socialization_debug_radicalism_one_desc:0 "将反革命激进度设为Lv.1，当前等级基础进度归零。检查生活消费品工厂系数与悬浮提示；可重复执行。"
 GER_socialization_debug_radicalism_two:0 "§Y[测试]§! 反革命激进度：二级"
 GER_socialization_debug_radicalism_two_desc:0 "将反革命激进度设为Lv.2，当前等级基础进度归零。检查建造速度惩罚；可重复执行。"
 GER_socialization_debug_radicalism_three:0 "§Y[测试]§! 反革命激进度：三级"
 GER_socialization_debug_radicalism_three_desc:0 "将反革命激进度设为Lv.3，当前等级基础进度归零。检查生产效率上限和激进反革命措施提示；可重复执行。"
 GER_socialization_debug_organization_add_100:0 "§Y[测试]§! 无产阶级组织度进度 +100%"
 GER_socialization_debug_organization_add_100_desc:0 "给当前等级增加100%组织度进度；未到四级时应升一级，并将超出的进度带入下一级。可重复执行。"
 GER_socialization_debug_radicalism_add_100:0 "§Y[测试]§! 反革命激进度进度 +100%"
 GER_socialization_debug_radicalism_add_100_desc:0 "给当前等级增加100%基础激进度进度；未到三级时应升一级，并将超出的进度带入下一级。可重复执行。"
 GER_socialization_debug_counterrevolution_0:0 "§Y[测试]§! 反革命力量：0%"
 GER_socialization_debug_counterrevolution_0_desc:0 "将反革命力量清零，检查0%时无法采取自动行动的提示。"
 GER_socialization_debug_counterrevolution_299:0 "§Y[测试]§! 反革命力量：24.9%"
 GER_socialization_debug_counterrevolution_299_desc:0 "设置为24.9%，检查低烈度档位及25%边界。"
 GER_socialization_debug_counterrevolution_300:0 "§Y[测试]§! 反革命力量：25%"
 GER_socialization_debug_counterrevolution_300_desc:0 "设置为25%，检查进入有限行动档位。"
 GER_socialization_debug_counterrevolution_900:0 "§Y[测试]§! 反革命力量：75%"
 GER_socialization_debug_counterrevolution_900_desc:0 "设置为75%，检查进入高烈度行动档位。"
 GER_socialization_debug_counterrevolution_1199:0 "§Y[测试]§! 反革命力量：99.9%"
 GER_socialization_debug_counterrevolution_1199_desc:0 "设置为99.9%，检查尚未解锁全部行动的边界。"
 GER_socialization_debug_counterrevolution_1200:0 "§Y[测试]§! 反革命力量：100%"
 GER_socialization_debug_counterrevolution_1200_desc:0 "设置为100%，检查可采取全部行动的最高烈度档位。"
 GER_socialization_debug_industry_empty:0 "§Y[测试]§! 各部门社会化点数清零"
 GER_socialization_debug_industry_empty_desc:0 "清零十二个行业的点数与失败记录，并从1号铁路重新开始65天倒计时。"
 GER_socialization_debug_industry_sample:0 "§Y[测试]§! 部门社会化点数：不同进度"
 GER_socialization_debug_industry_sample_desc:0 "重置进度后设定铁路150 / 150、采矿业45 / 200。当前项目会切至2号并开始65天倒计时；即使页面切到7号化工，加点仍会进入2号。"
 GER_socialization_debug_industry_full:0 "§Y[测试]§! 部门社会化点数：满格"
 GER_socialization_debug_industry_full_desc:0 "重置进度后将1至3号设为已完成，当前项目切至4号银行业并开始30天倒计时。"
 GER_socialization_debug_industry_add_75:0 "§Y[测试]§! 社会化点数 +75"
 GER_socialization_debug_industry_add_75_desc:0 "向社会化点数池增加75点，并按编号从最早未完成的行业开始分配。当前页面选中的行业不影响加点目标。"
 GER_socialization_debug_industry_add_500:0 "§Y[测试]§! 社会化点数 +500"
 GER_socialization_debug_industry_add_500_desc:0 "向社会化点数池增加500点，测试跨多个行业结转。行业按1至12号顺序分配；全部完成后的多余点数不再保留。"
 GER_socialization_debug_industry_one_day:0 "§Y[测试]§! 当前行业剩余1天"
 GER_socialization_debug_industry_one_day_desc:0 "将当前行业的剩余期限设为1天，用于检查次日超时、失败标记与强制转入下一行业。"
 GER_socialization_debug_industry_advance_day:0 "§Y[测试]§! 社会化计时推进1天"
 GER_socialization_debug_industry_advance_day_desc:0 "立即执行一次社会化每日计时。若当前行业还剩1天且点数不足，便应记为失败并进入下一行业。"
 GER_socialization_debug_union_reform_success:0 "§Y[测试]§! 工会改革成功"
 GER_socialization_debug_union_reform_success_desc:0 "设置预留的工会改革成功标记，以检查‘抵制工会干涉’是否自动取消并停止出现。"
 GER_socialization_debug_union_reform_reset:0 "§Y[测试]§! 清除工会改革标记"
 GER_socialization_debug_union_reform_reset_desc:0 "清除测试用的工会改革成功标记，恢复‘抵制工会干涉’决议。"
 GER_socialization_expel_factory_guards:0 "驱逐工厂警卫"
 GER_socialization_expel_factory_guards_desc:0 "警卫仍把守着厂门与仓库。工人委员会将接管这些入口，使社会化工作得以继续。"
 GER_socialization_expel_factory_guards_effect_tt:0 "反革命力量：§G-2%§!\n当前项目社会化进度：§G+35§!\n进行中的反革命自动行动倒计时：§Y+3§!日。\n获得为期§Y14§!日的“§Y工厂警卫驱逐行动§!”，其效果为（每周反革命激进度§R+3%§!）。"
 GER_socialization_oppose_unorganized:0 "反对无组织社会化活动"
 GER_socialization_oppose_unorganized_desc:0 "零散的接管行动容易使生产中断。各委员会将统一安排人员、物资与交接顺序。"
 GER_socialization_oppose_unorganized_effect_tt:0 "无产阶级组织度：§G+8%§!\n进行中的工人自动行动倒计时：§R+5§!日。\n获得为期§Y7§!日的“§Y统一接管协调§!”，其效果为（每周社会化进度§G+5§!）。"
 GER_socialization_unite_office_workers:0 "团结中低层职员"
 GER_socialization_unite_office_workers_desc:0 "账目、运输和排班离不开中低层职员。争取他们合作，有助于维持企业运转。"
 GER_socialization_unite_office_workers_effect_tt:0 "当前项目社会化进度：§G+25§!\n反革命力量：§G-2%§!\n无产阶级组织度：§G+8%§!\n进行中的反革命自动行动倒计时：§Y+4§!日。\n获得为期§Y14§!日的“§Y职员联合工作§!”，其效果为（每周反革命激进度§R+5%§!）。"
 GER_socialization_resist_union_interference:0 "抵制工会干涉"
 GER_socialization_resist_union_interference_desc:0 "在社会化机关与工会的权限尚未划清之前，工人委员会坚持直接掌握接管工作。"
 GER_socialization_resist_union_interference_effect_tt:0 "当前项目社会化进度：§G+20§!\n进行中的工人自动行动倒计时：§Y-2§!日。"
 GER_socialization_supervise_central_agency:0 "监督行业中央机关"
 GER_socialization_supervise_central_agency_desc:0 "行业中央机关必须接受工人代表监督，按统一方案推进企业交接。"
 GER_socialization_supervise_central_agency_effect_tt:0 "无产阶级组织度：§G+10%§!\n反革命激进度：§R+8%§!\n进行中的反革命自动行动倒计时：§Y+5§!日。\n获得为期§Y21§!日的“§Y行业机关监督§!”，其效果为（每周社会化进度§G+10§!）。"
 GER_socialization_build_trust_soviets:0 "组建和发展托拉斯苏维埃"
 GER_socialization_build_trust_soviets_desc:0 "托拉斯苏维埃把各厂代表召集起来，共同处理生产计划和资源分配。"
 GER_socialization_build_trust_soviets_effect_tt:0 "无产阶级组织度：§G+10%§!\n当前项目社会化进度：§G+30§!\n反革命激进度：§R+8%§!\n进行中的工人自动行动倒计时：§Y-2§!日。\n获得为期§Y14§!日的“§Y托拉斯苏维埃协作§!”，其效果为（每周社会化进度§G+8§!）。"
 GER_socialization_open_workers_schools:0 "创办工人学校"
 GER_socialization_open_workers_schools_desc:0 "工人学校将培养熟悉生产、账目与管理的骨干，为后续行业接管提供人才。"
 GER_socialization_workers_school_once_tt:0 "尚未创办工人学校（每局只能执行一次）"
 GER_socialization_open_workers_schools_effect_tt:0 "获得“§Y工人学校§!”，其效果为（所有后续非农业社会化项目每周进度§G+6§!，每两周无产阶级组织度§G+3%§!）。"
 GER_socialization_mass_strike:0 "发动大规模罢工"
 GER_socialization_mass_strike_desc:0 "全面停工能够迫使旧管理层让步，却也将使全国生产与秩序付出沉重代价。每个项目只能发动一次。工会改革成功后，所需政治点数从350降至250。"
 GER_socialization_mass_strike_effect_tt:0 "当前项目社会化进度：§G+150§!\n反革命力量：§G-20%§!\n反革命激进度：§R+10%§!\n当前项目剩余时间：§R-20§!日。\n进行中的反革命自动行动倒计时：§Y+10§!日。\n获得为期§Y90§!日的“§Y大规模罢工造成的生产停滞§!”，其效果为（稳定度§R-50.00%§!，每日政治点数获取§R-1.00§!，生产效率上限§R-60.00%§!，建造速度§R-90.00%§!）。"
 GER_socialization_mass_strike_disruption:0 "大规模罢工造成的生产停滞"
 GER_socialization_mass_strike_disruption_desc:0 ""
 GER_socialization_extend_project:0 "延长社会化项目"
 GER_socialization_extend_project_desc:0 "放宽交接期限，为当前行业争取更多协调、审计与整顿时间。"
 GER_socialization_extend_project_effect_tt:0 "当前社会化项目剩余时间：§Y+15§!日。\n反革命激进度：§R+8%§!\n进行中的反革命自动行动倒计时：§Y+3§!日。"
 GER_soc_guard_a_effect_idea:0 "工厂警卫驱逐行动"
 GER_soc_guard_a_effect_idea_desc:0 ""
