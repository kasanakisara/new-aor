 GER_soc_workers_school_idea_desc:0 ""
 GER_soc_guard_effect_modifier_tt:0 "每周反革命激进度：§R+3%§!"
 GER_soc_oppose_effect_modifier_tt:0 "每周社会化进度：§G+5§!"
 GER_soc_staff_effect_modifier_tt:0 "每周反革命激进度：§R+5%§!"
 GER_soc_supervise_effect_modifier_tt:0 "每周社会化进度：§G+10§!"
 GER_soc_trust_effect_modifier_tt:0 "每周社会化进度：§G+8§!"
 GER_soc_workers_school_effect_modifier_tt:0 "后续非农业社会化项目每周进度：§G+6§!\n每两周无产阶级组织度：§G+3%§!"
 GER_socialization_organization_title:0 "无产阶级组织度"
 GER_socialization_organization_value:0 "§RLv.[?GER_socialization_organization_level|0] · [?GER_socialization_organization|0]%§!"
 GER_socialization_organization_tooltip:0 "§Y无产阶级组织度§!：Lv.[?GER_socialization_organization_level|0]\n当前等级进度：§Y[?GER_socialization_organization|0]%§! / 100%\n§g工会、厂委会与地方党组织将分散的劳动者联合起来。组织越严密，社会化政策越能深入工厂与街区；旧有势力也会因其扩张而更加不安。§!\n§g每累计100%进度提升一级，超出的进度计入下一级；最高为四级。各等级的国家加成按当前等级生效。§!\n[GER_socialization_organization_effect_text]"
 GER_socialization_organization_effect_0:0 "§Y当前等级效果§!\n组织尚未形成足以影响全国的力量，暂无等级加成。"
 GER_socialization_organization_effect_1:0 "§Y当前等级效果§!\n反革命激进度：§R+3%§!\n建造速度：§G+6.00%§!"
 GER_socialization_organization_effect_2:0 "§Y当前等级效果§!\n反革命激进度：§R+5%§!\n地区最大工业值：§G+10.00%§!"
 GER_socialization_organization_effect_3:0 "§Y当前等级效果§!\n反革命激进度：§R+8%§!\n战略资源获取率：§G+8.00%§!\n§Y无产阶级将采取更加激进的社会化行动。§!"
 GER_socialization_organization_effect_4:0 "§Y当前等级效果§!\n反革命激进度：§R+10%§!\n工厂产出：§G+15.00%§!\n§Y无产阶级将采取更加激进的社会化行动。§!"
 GER_socialization_organization_modifier:0 "无产阶级组织度"
 GER_socialization_counterrevolution_title:0 "反革命力量"
 GER_socialization_counterrevolution_value:0 "§Q[?GER_socialization_counterrevolution_percent|1]%§!"
 GER_socialization_counterrevolution_tooltip:0 "§Y反革命力量§!\n当前力量：§Y[?GER_socialization_counterrevolution_percent|1]%§!（[?GER_socialization_counterrevolution|0]/1200）\n§g旧官僚、保守团体与其他反对社会化的势力并非只会公开抗议。他们掌握的人脉、资金与地方影响力，决定了其暗中干预和主动出击的能力。§!\n§g烈度分档：0%无力行动；高于0%且低于25%为小规模措施；25%至低于75%为有限行动；75%至低于100%为高烈度行动；100%为全部行动。具体行动还需满足各自的力量和激进度条件。§!\n当前烈度：[GER_socialization_counterrevolution_intensity_text]"
 GER_socialization_counterrevolution_intensity_0:0 "§G无力行动§!"
 GER_socialization_counterrevolution_intensity_1:0 "§Y小规模措施§!"
 GER_socialization_counterrevolution_intensity_2:0 "§Y有限行动§!"
 GER_socialization_counterrevolution_intensity_3:0 "§R高烈度行动§!"
 GER_socialization_counterrevolution_intensity_4:0 "§R全部行动§!"
 GER_socialization_radicalism_title:0 "反革命激进度"
 GER_socialization_radicalism_value:0 "§YLv.[?GER_socialization_radicalism_level|0] · [?GER_socialization_radicalism|0]%§!"
 GER_socialization_radicalism_tooltip:0 "§Y反革命激进度§!：Lv.[?GER_socialization_radicalism_level|0]\n当前等级进度：§Y[?GER_socialization_radicalism|0]%§! / 100%\n§g社会化运动触动了旧有利益。反对者从抵制与囤积，逐步转向扰乱建设和生产；激进度越高，国家承受的经济冲击越重。§!\n§g每累计100%进度提升一级，超出的进度计入下一级；最高为三级。组织度与当前激进度等级的加成也会计入进度。§!\n[GER_socialization_radicalism_effect_text]"
 GER_socialization_radicalism_effect_0:0 "§Y当前等级效果§!\n反对力量尚未形成持续冲击，暂无等级惩罚。"
 GER_socialization_radicalism_effect_1:0 "§Y当前等级效果§!\n反革命激进度：§R+2%§!\n生活消费品工厂系数：§R+20.00%§!"
 GER_socialization_radicalism_effect_2:0 "§Y当前等级效果§!\n反革命激进度：§R+5%§!\n建造速度：§R-15.00%§!"
 GER_socialization_radicalism_effect_3:0 "§Y当前等级效果§!\n反革命激进度：§R+8%§!\n生产效率上限：§R-15.00%§!\n§Y资产阶级将采取更加激进的反革命措施。§!"
 GER_socialization_radicalism_modifier:0 "反革命激进度"
 GER_socialization_target_dynamic:0 "§Y[?GER_socialization_selected_target|0]§!"
