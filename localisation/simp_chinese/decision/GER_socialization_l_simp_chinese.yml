 GER_socialization_category_desc:0 "车间、工厂，\n成了我们新的、第二个故乡。\n机器那无可阻挡、锻造未来的齐整节拍：\n就是我们的心跳。\n§Y——约翰内斯·贝歇尔，《挽起袖子》§!"
 GER_socialization_railway:0 "铁路运输"
 GER_socialization_railway_caption:0 "铁路、航运等关键部门"
 GER_socialization_railway_tt:0 "§Y铁路、航运等关键部门§!（[GER_socialization_railway_status_text]）\n铁路连接矿区、工厂、城市与港口，承担人员和大宗货物运输。铁路的社会化关系到路网的统一管理、运输调度与公共服务。\n\n目标: §Y150§!社会化点数。\n完成奖励：反革命力量§G-5%§!。"
 GER_socialization_mining:0 "采矿业"
 GER_socialization_mining_caption:0 "采矿业"
 GER_socialization_mining_tt:0 "§Y采矿业§!（[GER_socialization_mining_status_text]）\n采矿业提供煤炭、铁矿及其他工业原料，是能源供应和重工业生产的基础。矿山管理、矿工安全与原料分配是这一行业的重要议题。\n\n目标: §Y200§!社会化点数。\n完成奖励：反革命力量§G-5%§!，煤、铁战略资源产量：§G+7.50%§!。"
 GER_socialization_power:0 "电力业"
 GER_socialization_power_caption:0 "电力、交通等市政管理部门"
 GER_socialization_power_tt:0 "§Y电力、交通等市政管理部门§!（[GER_socialization_power_status_text]）\n电力行业负责发电、输电与供电，为工厂生产和城市生活提供能源。统一规划电网、扩大供电范围和保障稳定供应是其核心任务。\n\n目标: §Y250§!社会化点数。\n完成奖励：反革命力量§G-5%§!，每日稳定度获取：§G+0.05%§!。"
 GER_socialization_banking:0 "银行业"
 GER_socialization_banking_caption:0 "银行业"
 GER_socialization_banking_tt:0 "§Y银行业§!（[GER_socialization_banking_status_text]）\n银行汇集储蓄、提供信贷并办理支付，影响资金在各行业之间的流动。信贷投向、公共投资与金融监督是银行社会化的重要议题。\n\n目标: §Y100§!社会化点数。\n完成奖励：反革命力量§G-8%§!，每周社会化进度：永久§G+4点§!。"
 GER_socialization_armaments:0 "军事工业"
 GER_socialization_armaments_caption:0 "军事工业"
 GER_socialization_armaments_tt:0 "§Y军事工业§!（[GER_socialization_armaments_status_text]）\n军工业生产武器、弹药及军事装备，涉及专门技术与生产设施。生产计划、质量管理以及战时与和平时期的产能安排是其主要议题。\n\n目标: §Y100§!社会化点数。\n完成奖励：反革命力量§G-4%§!，军用工厂产出：§G+10.00%§!，基础生产效率：§G+10.00%§!。"
 GER_socialization_metalworking:0 "金属加工"
 GER_socialization_metalworking_caption:0 "金属加工和机器制造业"
 GER_socialization_metalworking_tt:0 "§Y金属加工和机器制造业§!（[GER_socialization_metalworking_status_text]）\n金属加工业将钢铁等原料制成零部件、工具及生产设备，为各类工厂提供基础材料与加工能力。生产标准、劳动条件和原料供应是这一行业的重要议题。\n\n目标: §Y[?GER_soc_target_metalworking|0]§!社会化点数。\n完成奖励：反革命力量§G-6%§!，建造速度：§G+10.00%§!。"
 GER_socialization_chemicals:0 "化学工业"
 GER_socialization_chemicals_caption:0 "化学工业"
 GER_socialization_chemicals_tt:0 "§Y化学工业§!（[GER_socialization_chemicals_status_text]）\n化工业生产肥料、染料、药品及其他化学材料，与农业和工业密切相连。科研、生产安全与原料供应是行业发展的重要条件。\n\n目标: §Y[?GER_soc_target_chemicals|0]§!社会化点数。\n完成奖励：反革命力量§G-6%§!。"
 GER_socialization_electrical:0 "电气制造"
 GER_socialization_electrical_caption:0 "电气制造行业"
 GER_socialization_electrical_tt:0 "§Y电气制造行业§!（[GER_socialization_electrical_status_text]）\n电气制造业生产发电机、电动机、电缆及电气设备，为工厂和基础设施的电气化提供支持。技术标准和设备普及是其重要任务。\n\n目标: §Y[?GER_soc_target_electrical|0]§!社会化点数。\n完成奖励：反革命力量§G-5%§!。"
 GER_socialization_light_industry:0 "轻工业"
 GER_socialization_light_industry_caption:0 "纺织、食品制造等轻工业"
 GER_socialization_light_industry_tt:0 "§Y纺织、食品制造等轻工业§!（[GER_socialization_light_industry_status_text]）\n轻工业生产纺织品、服装、食品及其他日常消费品，直接关系居民生活。保障基本供应、改善劳动条件与协调生产分配是其主要议题。\n\n目标: §Y400§!社会化点数。\n完成奖励：反革命力量§G-5%§!，生活消费品工厂比例：§G-10.00%§!。"
 GER_socialization_handicrafts:0 "手工业"
 GER_socialization_handicrafts_caption:0 "手工业"
 GER_socialization_handicrafts_tt:0 "§Y手工业§!（[GER_socialization_handicrafts_status_text]）\n手工业涵盖小型作坊、修理服务和依靠熟练技艺的生产活动。合作组织、工具与信贷支持，以及生产者的自主参与，是这一领域的重要议题。\n\n目标: §Y[?GER_soc_target_handicrafts|0]§!社会化点数。\n完成奖励：反革命力量§G-7%§!。"
 GER_socialization_shipbuilding:0 "造船业"
 GER_socialization_shipbuilding_caption:0 "造船业"
 GER_socialization_shipbuilding_tt:0 "§Y造船业§!（[GER_socialization_shipbuilding_status_text]）\n造船业建造和修理商船、运输船及军用舰艇，连接钢铁、机械与港口经济。船坞设施、专业劳动力和长期订单决定其生产能力。\n\n目标: §Y150§!社会化点数。\n完成奖励：反革命力量§G-3%§!，海军船坞产出：§G+10.00%§!。"
 GER_socialization_agriculture:0 "农业"
 GER_socialization_agriculture_caption:0 "农业"
 GER_socialization_agriculture_tt:0 "§Y农业§!（[GER_socialization_agriculture_status_text]）\n农业提供粮食和工业原料，是城乡生活与生产的基础。土地经营、农业合作、机械使用及农产品流通是农业社会化的重要议题。\n\n目标: §Y1000§!社会化点数。"
