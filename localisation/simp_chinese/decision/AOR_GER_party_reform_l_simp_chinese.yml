l_simp_chinese:
 #党改革与波鸿代表大会 · 调试决议（仅 is_debug 可见）
 GER_party_reform_debug_category:0 "党改革 · 调试"
 GER_prf_dbg_start:0 "【调试】开启党改革运动"
 GER_prf_dbg_start_desc:0 "触发《抓紧时间》，建立改革点数变量、开启双周结算与决议栏，并自动完成起始国策《波鸿代表大会》。"
 GER_prf_dbg_points_10:0 "【调试】改革点数 +10"
 GER_prf_dbg_points_10_desc:0 "直接给 £aor_spd §Y改革点数§! 池加 10 点，用于测试国策点数直兑与扣点。"
 GER_prf_dbg_points_50:0 "【调试】改革点数 +50"
 GER_prf_dbg_points_50_desc:0 "直接给 £aor_spd §Y改革点数§! 池加 50 点，用于一次性点满全树（满配 49 点）。"
 GER_prf_dbg_union_left:0 "【调试】工会结果：左派（米勒）胜利"
 GER_prf_dbg_union_left_desc:0 "把 GER_union_focus_victories 设为 3，即左派胜利，双周基数 §G+2.0§!。"
 GER_prf_dbg_union_center:0 "【调试】工会结果：中派（迪斯曼）胜利"
 GER_prf_dbg_union_center_desc:0 "把 GER_union_focus_victories 设为 1，即中派胜利，双周基数 §G+1.5§!。"
 GER_prf_dbg_union_right:0 "【调试】工会结果：右派（莱帕特）胜利"
 GER_prf_dbg_union_right_desc:0 "把 GER_union_focus_victories 设为 0，即右派胜利，双周基数 §G+1.0§!。"
 GER_prf_dbg_tick:0 "【调试】立即结算一次双周点数"
 GER_prf_dbg_tick_desc:0 "不等 14 天，直接跑一次结算，验证 £aor_spd §Y改革点数§! 的跳变。"
 GER_prf_dbg_deadline:0 "【调试】立即触发 8.26 截止提示"
 GER_prf_dbg_deadline_desc:0 "直接触发截止事件，验证锁定国策、关闭决议栏与隐藏工会词条。"
 GER_prf_dbg_congress:0 "【调试】立即触发波鸿代表大会事件链"
 GER_prf_dbg_congress_desc:0 "从大会①开始按当前已完成国策状态跑通判定与结算。"
 GER_prf_dbg_preset_full:0 "【调试】预设结局：彻底成功"
 GER_prf_dbg_preset_full_desc:0 "写入 16 个手动国策与三组全选高消耗的条件，触发结算应得《拥抱革命的社会民主党》。"
 GER_prf_dbg_preset_partial:0 "【调试】预设结局：部分胜利"
 GER_prf_dbg_preset_partial_desc:0 "写入 13 个手动国策加三个关键国策的条件，触发结算应得《稳步前进的社会民主党》。"
 GER_prf_dbg_preset_fail:0 "【调试】预设结局：失败"
 GER_prf_dbg_preset_fail_desc:0 "写入 5 个手动国策且缺关键国策的条件，触发结算应得《坚守传统的社会民主党》。"
 #党改革与波鸿代表大会 · 正式决议（1920.2.13 — 8.26）
 GER_party_reform_category:0 "党改革运动"
 GER_party_reform_category_desc:0 "1920年2月13日至8月26日之间可用的党改革决议。"
 GER_prf_dec_collapse:0 "收起党改革决议"
 GER_prf_dec_collapse_tt:0 "收起列表。"
 GER_prf_dec_expand:0 "展开党改革决议"
 GER_prf_dec_expand_tt:0 "展开列表。"
 GER_prf_dec_debate:0 "在地区党代会上辩论"
 GER_prf_dec_debate_desc:0 "把党改革的议题带进各地的支部会议，让基层党员在会上表态。"
 GER_prf_dec_debate_tt:0 "£aor_spd §Y改革点数§!：§G+2§!\n£aor_spd §Y左派影响力§!：§G+1%§!\n£aor_spd §Y中派影响力§!：§G+0.5%§!\n£aor_spd §Y右派影响力§!：§R-1.5%§!"
 GER_prf_dec_tour:0 "组建巡游宣传队"
 GER_prf_dec_tour_desc:0 "派出巡回宣传队走访各地，把激进的观点带出柏林。"
 GER_prf_dec_tour_tt:0 "七天后完成。"
 GER_prf_dec_tour_done_tt:0 "£aor_spd §Y改革点数§!每两周：§G+0.25§!\n触发事件《外地来客》"
 GER_prf_dec_compromise:0 "对中派妥协"
 GER_prf_dec_compromise_desc:0 "向中派让出部分议程，换取他们在代表大会上的默许。"
 GER_prf_dec_compromise_tt:0 "£aor_spd §Y改革点数§!：§G+4§!\n£aor_spd §Y中派影响力§!：§G+4%§!\n£aor_spd §Y左派影响力§!：§R-2%§!\n£aor_spd §Y右派影响力§!：§R-2%§!"
 GER_prf_dec_league:0 "组建党改革联盟"
 GER_prf_dec_league_desc:0 "把愿意支持改革的派系与人脉编成一张网，代价是党内原有的默契被打破。"
 GER_prf_dec_league_tt:0 "十四天后完成。"
 GER_prf_dec_league_done_tt:0 "£aor_spd §Y改革点数§!每两周：§G+0.25§!\n£aor_spd §Y党内团结度§!：§R-5%§!\n触发事件链《团结纽带》"
 GER_prf_dec_persuade:0 "说服顽固派"
 GER_prf_dec_persuade_desc:0 "逐个去做那些老同志的工作，请他们至少不要在大会上唱反调。"
 GER_prf_dec_persuade_tt:0 "£aor_spd §Y改革点数§!：§G+1§!\n£aor_spd §Y左派影响力§!：§G+1%§!\n£aor_spd §Y右派影响力§!：§R-1%§!"
 GER_prf_dec_mobilize_union:0 "动员工会支持改革"
 GER_prf_dec_mobilize_union_desc:0 "借助工会的组织网络为党改革造势。"
 GER_prf_dec_mobilize_union_tt:0 "十四天后完成。"
 GER_prf_dec_mobilize_union_done_tt:0 "£aor_spd §Y改革点数§!：§G+2§!\n政治点数：§G+50§!"
