 aor_railway_engineering:0 "铁路工程 I"
 aor_railway_engineering_desc:0 "改进铁路施工工具和线路养护方法，加快新线建设与受损铁路的修复。"
 aor_railway_engineering2:0 "铁路工程 II"
 aor_railway_engineering2_desc:0 "完善编组站、货场与装卸设施的工程组织，加快铁路和补给枢纽建设。"
 aor_railway_engineering3:0 "铁路工程 III"
 aor_railway_engineering3_desc:0 "统一干线与枢纽的工程标准，提高基础设施建设和铁路抢修效率。"
 aor_shipbuilding:0 "造船技术 I"
 aor_shipbuilding_desc:0 "改进船台、起重机与配套设施，提高船坞建设速度和造船产出。"
 aor_shipbuilding2:0 "造船技术 II"
 aor_shipbuilding2_desc:0 "统一船厂工序与常用部件的制造标准，提高造船产出并加快现役舰船改装。"
 aor_shipbuilding3:0 "造船技术 III"
 aor_shipbuilding3_desc:0 "改善干船坞设备与修船组织，提高造船产出和舰船维修速度。"
 aor_industrial_chemistry:0 "基础工业化学"
 aor_industrial_chemistry_desc:0 "改进材料处理与工业副产物回收，在原料供应不足时减少生产损失。"
 aor_industrial_chemistry2:0 "改进工业化学"
 aor_industrial_chemistry2_desc:0 "完善高压反应、材料替代与工艺控制，进一步降低资源短缺造成的生产损失，并为煤炭液化提供技术基础。"
 fuel_refining:0 "燃料精炼 I"
 fuel_refining_desc:0 "完善基础炼油、燃油储存和输送设施，提高石油的燃料收益，并允许建设储油罐。"
 fuel_refining2:0 "燃料精炼 II"
 fuel_refining2_desc:0 "改进热裂化与炼油工艺，从相同数量的石油中提取更多可用燃料。"
 synth_oil_experiments:0 "煤炭液化"
 synth_oil_experiments_desc:0 "利用高压加氢将煤转化为液体燃料。昂贵的合成炼油厂可在石油供应受限时提供替代燃料，每地区最多一级；不会生产合成橡胶。"
