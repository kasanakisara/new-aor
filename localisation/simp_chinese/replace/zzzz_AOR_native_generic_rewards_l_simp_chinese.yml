 sp_land_generic_reward_scientist_xp_1_desc:0 "[Character.GetName]取得了突破性进展，加速了项目进展，并巩固了[Character.GetHerHis]作为先进武器研发先锋的地位。每一次发现都增强了[Character.GetHerHis]的工程掌控能力，塑造了军事技术的未来。"
 sp_land_generic_reward_option_scientist_xp:0 "知识就是力量！"
 sp_land_generic_reward_option_scientist_xp_desc:0 "[Character.GetName]取得了突破，加快了进度，巩固了[Character.GetHerHis]作为先进武器先驱的地位。"
 sp_land_generic_reward_army_xp_1_desc:0 "[Character.GetName]已与一群军官会面，讨论[SpecialProject.GetName]的潜力，获得了关于将新技术应用于陆战的关键见解。这一合作增强了我们的军事能力，确保了未来战斗的准备。"
 sp_land_generic_reward_option_army_xp_desc:0 "[Character.GetName]与一群选定的军官会面，讨论了[SpecialProject.GetName]的潜力，获得了将新技术用于陆战的关键见解。他们的合作增强了我们的军事能力，确保为未来的交战做好准备。"
 sp_land_generic_reward_major_progress_1_desc:0 "[Character.GetName]取得了重大突破，极大地推动了项目进展，验证了[Character.GetHerHis]的专业能力，并激励了研究团队。在这一进展下，项目距离目标更近了一步，巩固了[Character.GetName]作为开拓者的传奇。"
 sp_land_generic_reward_option_major_breakthrough_desc:0 "[Character.GetName]取得了重大突破，极大地推进了项目进展，验证了[Character.GetHerHis]的专业知识并激励了研究团队。因着这一进展，项目离目标更近了一步，巩固了[Character.GetName]作为开拓者的传承。"
 sp_land_generic_reward_test_failure_1_desc:0 "在测试过程中出现了一个小小的挫折，揭示了[Character.GetName]的原型中意外的缺陷。这一问题促使对方法进行重新评估和技术改进。虽然暂时延缓了进展，但这些经验教训有助于在长远上建立一个更强大、更具弹性的项目。"
 sp_land_generic_reward_option_test_failure_desc:0 "在测试过程中发生了小挫折，意外揭示了[Character.GetName]的原型机中的缺陷。这个小插曲促使了对方法和技术改进的重新评估。虽然暂时推迟了进展，但从长远来看，这些经验教训有助于使项目更强大、更有韧性。"
 sp_land_generic_reward_armor_tech_1_desc:0 "[Character.GetName]领导的[SpecialProject.GetName]项目的最新进展，推动了相关领域的重大突破。这些进展正在革新军事能力，为更有效、更强大的陆地战争策略铺平了道路。"
 sp_land_generic_reward_option_armor_tech_desc:0 "[Character.GetName]领导的[SpecialProject.GetName]项目中的最新发展，使相关领域取得了重大进步。这些突破彻底改变了军事能力，为更有效、更强大的陆战战略铺平了道路。"
 sp_land_generic_reward_armor_bonus_1_desc:0 "作为前沿研究的领导者，[Character.GetName]揭示了革命性的新合金发现，预示着坦克装甲的重大进展。这些发现为装甲战争带来了显著的提升，展示了这位科学家在塑造装甲战争未来中的关键作用。"
 sp_land_generic_reward_option_armor_bonus_desc:0 "把这种新合金应用到我们的生产线上。"
 sp_land_generic_reward_engine_bonus_1_desc:0 "对[SpecialProject.GetName]原型实验引擎的最新调整，极大地提升了坦克引擎的整体性能。[Character.GetName]和[Character.GetHerHis]团队的精细工作突破了工程的界限，承诺如果我们将这些创新应用于常规坦克引擎，将大幅提升其能力。"
 sp_land_generic_reward_option_engine_bonus_desc:0 "开始生产这些先进引擎吧！"
 sp_land_generic_reward_resource_scarcity_desc:0 "[Character.GetName]的团队在[SpecialProject.GetName]项目的开发过程中面临关键材料的短缺，迫使[Character.GetHerHim]寻找替代来源并开发新的制造方法以满足需求。"
 sp_land_generic_reward_option_resource_scarcity_desc:0 "[Character.GetName]的团队在[SpecialProject.GetName]项目的开发过程中面临关键材料的短缺，迫使[Character.GetHerHim]寻找替代来源并开发新的制造方法以满足需求。"
