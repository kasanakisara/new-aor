l_simp_chinese:
 PROGRAM_VIEW_REQUIRE_SCIENTIST:0 "需要一位科学家才能启动"
 PROGRAM_CAN_START:0 "没有正在进行的项目\n§G点击§!开始研究"
 land_facility_desc:0 "地面战设施用于试验坦克、火炮及其他陆军装备，为装甲防护、火力、动力和可靠性研究提供场地与设备。"
 aor_tank_first_copy:0 "借鉴现有设计"
 aor_tank_first_independent:0 "坚持独立研发"
 aor_tank_first_vehicle:0 "第一辆战车"
 aor_tank_first_vehicle_desc:0 "工厂已经制造出第一辆能够正常运转的战车。然而，军方对其设计存在分歧。部分工程师认为，应当借鉴协约国世界大战时轻型坦克的设计；另一些人坚持发展别的方案。"
 aor_tank_track_redesign:0 "重新设计传动系统"
 aor_tank_track_reinforce:0 "加固现有结构"
 aor_tank_track_continue:0 "继续进行试验"
 aor_tank_track_failure:0 "脱落的履带"
 aor_tank_track_failure_desc:0 "在一次越野试验中，试验车的履带突然脱落，随后传动轴发生断裂。工程师们认为，现有设计不足以承受持续的高强度运转。"
 aor_tank_twelve_rush:0 "我们没有时间了"
 aor_tank_twelve_refine:0 "让工程师继续工作"
 aor_tank_twelve_expand:0 "扩大试验规模"
 aor_tank_twelve:0 "十二辆战车"
 aor_tank_twelve_desc:0 "十二辆战车离开工厂，参加第一次长距离行军试验。抵达预定地点的只有七辆，其余车辆因各种机械故障而被遗弃在沿途。\n\n军方要求尽快完成定型，而工程师们坚持认为，现有车辆还不足以满足大规模装备的要求。"
 aor_tank_role_shield:0 "步兵的钢铁盾牌"
 aor_tank_role_fist:0 "战场上的机动拳头"
 aor_tank_role:0 "坦克应该如何作战？"
 aor_tank_role_desc:0 "营级演习已经证明，坦克可以在较大规模上协同作战。然而，军方对这种新武器究竟应当承担何种任务，仍然没有达成一致。\n\n一部分军官主张将其分散配属步兵，另一部分军官则认为，应当集中坦克，以便在决定性的地点形成突破。"
 aor_tank_plate_heat:0 "重新试验热处理工艺"
 aor_tank_plate_batch:0 "增订一批试验钢板"
 aor_tank_plate:0 "钢板背后的裂纹"
 aor_tank_plate_desc:0 "装甲钢板挡住了试射弹丸，车内的见证板却被飞溅的碎片打得千疮百孔。试验人员怀疑热处理工艺存在问题，而工厂担心改变工艺会耽误交付。"
 aor_tank_gun_crew:0 "先改进乘员分工"
 aor_tank_gun_mount:0 "重新布置炮架"
 aor_tank_cramped_turret:0 "炮塔里的第三个人"
 aor_tank_cramped_turret_desc:0 "射击成绩符合预期，但狭小的战斗室令装填和观察难以同时进行。一名试验军官建议重新安排乘员职责，工程师则希望重做炮架，为装填手腾出空间。"
 aor_tank_spares_gauges:0 "制定统一量规与检验程序"
 aor_tank_spares_fit:0 "派熟练钳工逐车修配"
 aor_tank_spares:0 "一箱不合尺寸的零件"
 aor_tank_spares_desc:0 "维修班带来的备用零件无法装上另一辆试验车。各工厂沿用自己的公差标准，看似相同的部件仍需手工修整，长距离试验因此暴露出新的维修难题。"
 aor_tank_research_lessons:0 "独立设计经验"
 aor_tank_research_lessons_desc:0 "独立设计经验所带来的试验与生产安排。"
 aor_tank_reliability_lessons:0 "传动系统试验资料"
 aor_tank_reliability_lessons_desc:0 "传动系统试验资料所带来的试验与生产安排。"
 aor_tank_standardization_lessons:0 "统一零件量规"
 aor_tank_standardization_lessons_desc:0 "统一零件量规所带来的试验与生产安排。"
 aor_tank_trial_workshops:0 "试验车辆加固工程"
 aor_tank_trial_workshops_desc:0 "试验车辆加固工程所带来的试验与生产安排。"
 aor_tank_expanded_workshops:0 "扩大的战车试制批次"
 aor_tank_expanded_workshops_desc:0 "扩大的战车试制批次所带来的试验与生产安排。"
 aor_tank_accident:0 "试验事故调查"
 aor_tank_accident_desc:0 "试验事故调查所带来的试验与生产安排。"
 aor_tank_rushed_service:0 "仓促定型的战车"
 aor_tank_rushed_service_desc:0 "尚未完全排除的机械故障提高了战车在使用中的损耗。"
 aor_tank_infantry_model:0 "步兵协同试验型"
 aor_tank_mobile_model:0 "机动作战试验型"
