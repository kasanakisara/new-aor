l_simp_chinese:
 aor_basic_science_1900:0 "近代科学方法"
 aor_basic_science_1900_desc:0 "建立严密推理、定量分析与可重复验证相结合的研究方法，为数学、物理和化学研究提供共同基础。"
 aor_basic_science_1920:0 "计量与分析方法"
 aor_basic_science_1920_desc:0 "完善测量标准、误差分析、数值计算与定量分析方法，提高各基础学科研究结果的可靠性。"
 aor_basic_science_1923:0 "理论建模方法"
 aor_basic_science_1923_desc:0 "运用数学结构、近似方法与可检验的假设建立理论模型，将复杂问题转化为能够推导和验证的科学问题。"
 aor_basic_science_1925:0 "现代数理方法"
 aor_basic_science_1925_desc:0 "发展线性代数、微分方程与变换方法的研究和应用，为物理、化学及数学中的复杂理论问题提供工具。"
 aor_basic_science_1928:0 "统计与概率方法"
 aor_basic_science_1928_desc:0 "深化概率论、统计推断与随机过程的应用，分析实验数据、微观体系和复杂现象中的规律。"
 aor_basic_science_1930:0 "综合科学方法"
 aor_basic_science_1930_desc:0 "整合形式推理、理论建模、定量实验与统计分析，促进不同基础学科之间的方法交流与共同研究。"
