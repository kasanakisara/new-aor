l_simp_chinese:
 aor_basic_science_1900:0 "近代科学基础"
 aor_basic_science_1900_desc:0 "完善数学工具、实验方法与科学教育，形成近代科学研究的共同基础。"
 aor_basic_science_1920:0 "精密实验与测量"
 aor_basic_science_1920_desc:0 "改进精密测量、实验装置和数据处理方法，使不同领域的研究可以建立在可靠、可重复的结果之上。"
 aor_basic_science_1923:0 "理论与实验物理"
 aor_basic_science_1923_desc:0 "推动理论推导与实验验证相互配合，以新的物理模型解释物质、光和能量的行为。"
 aor_basic_science_1925:0 "量子力学研究"
 aor_basic_science_1925_desc:0 "将量子力学的数学方法与实验成果纳入科研训练，为物质结构研究提供新的工具。"
 aor_basic_science_1928:0 "统计物理研究"
 aor_basic_science_1928_desc:0 "发展统计方法与物质微观行为研究，提高复杂实验结果的分析与解释能力。"
 aor_basic_science_1930:0 "现代物理研究"
 aor_basic_science_1930_desc:0 "整合现代物理学的理论、精密仪器与研究方法，加速各领域技术研究。该路线不解锁核武器。"
