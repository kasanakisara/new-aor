 Hot_air_balloon:0 "系留观测气球"
 Hot_air_balloon_desc:0 "利用系留气球、航空摄影与地面观察哨共享情报，提高侦察单位的侦察能力和空军任务效率。这是一项观测体系改良，不解锁飞艇、气球装备或新的支援连。"
