 Classic_optics:0 "经典光学与精密仪器"
 Classic_optics_desc:0 "改进光学玻璃、镜片和精密仪器，为各类步兵瞄准与加农炮、榴弹炮、防空炮的测距观测提供共同基础。"
 Classic_optics2:0 "望远瞄准具"
 Classic_optics2_desc:0 "提高瞄准具的清晰度、耐用性与校准精度，增强普通及特种步兵、骑兵、机枪、狙击观测和徒步／摩托化侦察单位的火力与突破能力。"
