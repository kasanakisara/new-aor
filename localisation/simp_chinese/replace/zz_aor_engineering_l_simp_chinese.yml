 aor_artillery_optics_1920:0 "光学测距仪"
 aor_artillery_optics_1920_desc:0 "统一改进加农炮、榴弹炮与防空炮的测距、目标观测和射击修正。加农炮与榴弹炮提高软攻和突破，防空炮提高对空攻击和对地软攻，覆盖对应支援与摩托化单位。"
