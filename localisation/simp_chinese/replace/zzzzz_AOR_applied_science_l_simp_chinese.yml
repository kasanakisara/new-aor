l_simp_chinese:
 sp_aor_coal_liquefaction:0 "煤炭液化"
 sp_aor_coal_liquefaction_desc:0 "这是一个§Y化学§!研究。\n利用高压加氢将煤转化为液体燃料，为石油供应受限的工业与军队提供替代能源。"
 aor_applied_coal_liquefaction:0 "压力表之后"
 aor_applied_coal_liquefaction_desc:0 "试验装置终于连续产出了液体燃料，但催化剂的寿命比预计更短。延长试验可以找到更可靠的工作条件，增添一套反应设备则能让两种方案并行比较。"
 aor_applied_coal_liquefaction_review:0 "延长催化剂寿命试验"
 aor_applied_coal_liquefaction_fund:0 "增设平行试验装置"
 sp_aor_synthetic_rubber:0 "合成橡胶"
 sp_aor_synthetic_rubber_desc:0 "这是一个§Y化学§!研究。\n天然橡胶的产地远离主要工业区，封锁足以使轮胎、电缆与密封件陷入短缺。通过有机合成与聚合试验，研究人员尝试用能够稳定制造的人造材料替代天然胶，建立不依赖海外种植园的橡胶来源。"
 aor_applied_synthetic_rubber:0 "拉伸后的裂口"
 aor_applied_synthetic_rubber_desc:0 "新制橡胶能够成形，却在反复拉伸后出现裂口。化学师主张重新比较配方，试验车间则建议制成一批轮胎，在长期运转中筛选可靠材料。"
 aor_applied_synthetic_rubber_review:0 "重新比较聚合配方"
 aor_applied_synthetic_rubber_fund:0 "安排轮胎耐久试验"
 sp_aor_rotor_cipher:0 "转子密码机"
 sp_aor_rotor_cipher_desc:0 "这是一个§Y数学§!与§Y电气工程§!研究。\n机械转子随按键不断改变字母之间的对应关系，使同一段明文能够产生不断变化的密文。将这种装置交给军队与外交机关，可以加快日常通信的加密，同时迫使对手投入更多人力分析截获的电报。"
 aor_applied_rotor_cipher:0 "重复的密文"
 aor_applied_rotor_cipher_desc:0 "转子运动使密文不断变化，但一组重复格式的电报暴露了操作程序的弱点。机器能够加密，不代表使用它的人不会泄露线索。"
 aor_applied_rotor_cipher_review:0 "重编操作规程"
 aor_applied_rotor_cipher_fund:0 "组织模拟截收与破译"
 sp_aor_radio_control:0 "无线电遥控技术"
 sp_aor_radio_control_desc:0 "这是一个§Y电气工程§!研究。\n把控制指令编入无线电信号，接收设备便能在无人直接操纵的情况下改变机器的动作。研究重点在于稳定接收、识别指令与驱动执行机构，为远距离操纵武器和试验载具奠定基础。"
 aor_applied_radio_control:0 "不属于我们的信号"
 aor_applied_radio_control_desc:0 "接收器执行了一条并未由试验台发出的指令。邻近电台的信号混入了控制回路，研究人员必须在提高识别可靠性和增加试验样本之间作出选择。"
 aor_applied_radio_control_review:0 "逐一排除干扰频率"
 aor_applied_radio_control_fund:0 "扩建指令识别试验台"
 sp_aor_pulse_radar:0 "脉冲雷达"
 sp_aor_pulse_radar_desc:0 "这是一个§Y电气工程§!研究。\n短促发射的无线电脉冲遇到目标后返回接收机，回波的时间差使操作员能够估算目标距离。配合定向天线与显示装置，这种设备将把难以看见的空中目标转化为能够连续追踪的信号。"
 aor_applied_pulse_radar:0 "回波还是杂波"
 aor_applied_pulse_radar_desc:0 "屏幕上的亮点出现在预期距离，随后却随着地面反射改变。研究组需要确认哪些信号来自目标，哪些只是天线和环境制造的假象。"
 aor_applied_pulse_radar_review:0 "重测背景反射"
 aor_applied_pulse_radar_fund:0 "增设定向天线进行对照"
 sp_aor_high_voltage:0 "高压输电网络"
 sp_aor_high_voltage_desc:0 "这是一个§Y电气工程§!研究。\n提高输电电压能够减少远距离送电时的损耗，使大型电站不再只能服务于附近城市。变压器、绝缘设施和统一调度将分散的供电区域连接起来，为工厂提供更稳定的动力。"
 aor_applied_high_voltage:0 "绝缘子的雨夜"
 aor_applied_high_voltage_desc:0 "晴天运转正常的试验线路在雨夜发生闪络。输电电压越高，绝缘和维护的微小缺陷越难忽视。"
 aor_applied_high_voltage_review:0 "重做潮湿条件试验"
 aor_applied_high_voltage_fund:0 "增订绝缘子样品"
 sp_aor_hydroelectric:0 "大型水利发电"
 sp_aor_hydroelectric_desc:0 "这是一个§Y电气工程§!与§Y土木工程§!研究。\n拦河大坝将水流储存在高处，再利用落差驱动涡轮与发电机，将把河流转化为长期能源来源。"
 aor_applied_hydroelectric:0 "坝址下的裂隙"
 aor_applied_hydroelectric_desc:0 "勘测队在预定坝基发现了裂隙。发电机的设计已经成熟，但结构能否承受长期水压仍需进一步确认。"
 aor_applied_hydroelectric_review:0 "补做坝基勘测"
 aor_applied_hydroelectric_fund:0 "增设地质钻探点"
 sp_aor_highway:0 "高速公路"
 sp_aor_highway_desc:0 "这是一个§Y土木工程§!研究。\n宽阔路面、缓和坡度和分离交叉口让汽车能够更长时间保持稳定速度。建设适合连续运输的道路网络，可以减轻交通瓶颈，使工业区、城市与军队集结地之间的联系更加可靠。"
 aor_applied_highway:0 "路面的接缝"
 aor_applied_highway_desc:0 "连续行驶试验缩短了运输时间，重载车辆却使接缝附近的路面松动。道路的收益取决于能否承受日复一日的运输。"
 aor_applied_highway_review:0 "重做重载循环试验"
 aor_applied_highway_fund:0 "铺设两种试验路面"
 sp_aor_prefabrication:0 "预制建筑构件"
 sp_aor_prefabrication_desc:0 "这是一个§Y土木工程§!与§Y化学§!研究。\n把梁柱、墙板和其他构件交由工厂按统一规格制造，再运至现场组装，可以减少建筑工地上反复进行的加工。标准化的连接方式与运输组织，使大批同类设施能够更快投入使用。"
 aor_applied_prefabrication:0 "图纸上能够吻合"
 aor_applied_prefabrication_desc:0 "构件符合各自的图纸，现场组装时却无法顺利连接。制造误差、运输损伤和安装余量必须在同一套标准中处理。"
 aor_applied_prefabrication_review:0 "重新核定连接公差"
 aor_applied_prefabrication_fund:0 "增设整组装配试验"
 sp_aor_transmutation:0 "人工核嬗变"
 sp_aor_transmutation_desc:0 "这是一个§Y物理学§!研究。\n用高速粒子轰击原子核，可以使一种元素的原子转变为另一种元素。研究人员借助探测仪器辨认反应产物，尝试主动改变物质内部结构，并寻找能够重复观察的核反应规律。"
 aor_applied_transmutation:0 "靶室中的微弱痕迹"
 aor_applied_transmutation_desc:0 "探测记录中出现了预期之外的信号，但残留气体与靶材杂质也可能造成相似结果。只有重复对照才能确认原子核发生了变化。"
 aor_applied_transmutation_review:0 "更换靶材重复对照"
 aor_applied_transmutation_fund:0 "增配探测与计数仪器"
 sp_aor_accelerator:0 "粒子加速器"
 sp_aor_accelerator_desc:0 "这是一个§Y物理学§!与§Y电气工程§!研究。\n利用电场提高带电粒子的能量，再把粒子引向选定靶材，实验室便能系统研究原子核受到轰击后的变化。更高的能量带来更细致的观察，也暴露出仪器精度、真空条件与理论解释之间的新问题。"
 aor_applied_accelerator:0 "束流没有抵达靶心"
 aor_applied_accelerator_desc:0 "仪器记录到了更高能量，抵达靶材的粒子却太少。真空泄漏和电场不稳正在损失束流，提高能量本身还不足以形成可靠实验。"
 aor_applied_accelerator_review:0 "逐段复核真空与电场"
 aor_applied_accelerator_fund:0 "增设束流诊断仪器"
