 aor_synthetic_rubber_desc:0 "天然橡胶的产地远离主要工业区，封锁足以使轮胎、电缆与密封件陷入短缺。通过有机合成与聚合试验，研究人员尝试用能够稳定制造的人造材料替代天然胶，建立不依赖海外种植园的橡胶来源。"
