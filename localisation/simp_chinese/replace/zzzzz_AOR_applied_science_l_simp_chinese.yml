 aor_rubber_factory:0 "合成橡胶厂"
 aor_rubber_factory_plural:0 "合成橡胶厂"
 aor_rubber_factory_desc:0 "以工业合成替代天然胶来源。"
 synthetic_refinery_desc:0 "利用高压加氢将煤转化为液体燃料。"
 aor_remote_projects_reserved_tt:0 "开放后续研究方向：§Y遥控鱼雷§!、§Y无线电遥控飞机§!、§Y遥控爆破车辆§!。这些项目将在后续版本中加入。"
 aor_accelerator_news.1.t:0 "粒子加速器的建成"
 aor_accelerator_news.1.d:0 "来自[ROOT.GetName]的研究机构宣布，一套粒子加速装置已经完成连续运行试验。带电粒子经过电场加速后抵达靶材，探测仪器则记录着碰撞留下的信号。过去只能等待天然放射源提供的实验条件，如今开始能够由研究人员主动调节。\n\n这台机器目前仍是实验工具。它消耗的电力远多于实验中可能释放的能量，距离能够为城市和工厂供能的设备还很遥远。然而，主动研究原子核变化的道路已经打开。报纸谈论着元素的改变，工程师询问能否从物质内部获得新的动力，科学家则提醒公众，许多最基本的问题仍没有答案。\n\n通向原子内部的门，正在缓缓开启。"
 aor_accelerator_news.1.a:0 "炼金术吗？还是无尽能源？"
 aor_accelerator_news_future_tt:0 "§g原子能的研究迈入了新的阶段。未来，人们会拿它做些什么呢？§!"
