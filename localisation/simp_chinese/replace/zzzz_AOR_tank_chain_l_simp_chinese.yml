l_simp_chinese:
 AOR_TRUCK_SECTION:0 "卡车运输"
 aor_supply_truck_tech:0 "1918年运输卡车"
 aor_supply_truck_tech_desc:0 "采用坚固底盘与内燃机驱动的载重汽车，可沿道路运送弹药、燃料和其他军需物资。"
 aor_supply_truck_equipment:0 "运输卡车"
 aor_supply_truck_equipment_1:0 "1918年运输卡车"
 aor_supply_truck_equipment_1_short:0 "运输卡车"
 aor_early_tank_equipment:0 "早期坦克装备"
 aor_early_tank_equipment_1:0 "早期坦克装备"
 aor_early_tank_equipment_1_short:0 "早期坦克"
 aor_experimental_tank_battalion:0 "坦克营"
 aor_tank_standardized_production:0 "坦克制式生产"
 aor_tank_standardized_production_desc:0 "统一车辆规格与零部件标准，以流水作业和专业化生产改善坦克制造效率。"
 sp_aor_tank_prototype:0 "坦克原型计划"
 sp_aor_tank_prototype_desc:0 "研制能够越过壕沟与铁丝网的履带式装甲车辆，将装甲防护与直射火力结合，为步兵开辟通路。"
 sp_aor_tank_standardization:0 "制式坦克计划"
 sp_aor_tank_standardization_desc:0 "根据试验结果统一车辆结构、零部件与制造工序，为稳定生产和前线维修建立共同标准。"
 sp_aor_tank_battalion:0 "坦克营实验"
 sp_aor_tank_battalion_desc:0 "将坦克集中编组成营，检验通信指挥、维修补给与步坦协同，探索装甲部队在战场上的运用方法。解锁坦克营。"
 aor_tank_five_unlock_tt:0 "四项改装上限提高至5级。解锁坦克营。"
 aor_tank_armor_upgrade:0 "装甲"
 aor_tank_armor_upgrade_desc:0 "增加防护钢板并改进装甲结构。"
 sp_aor_tank_armor:0 "坦克装甲研究"
 sp_aor_tank_armor_desc:0 "通过钢板加工与实弹射击试验，改进装甲结构，寻找防护能力与车辆重量之间的平衡。"
 aor_tank_armor_unlock_tt:0 "装甲改装上限提高至2级。"
 aor_tank_gun_upgrade:0 "主炮"
 aor_tank_gun_upgrade_desc:0 "改进车载火炮及其射击布置。"
 sp_aor_tank_gun:0 "坦克主炮研究"
 sp_aor_tank_gun_desc:0 "研究适于狭小战斗室的火炮与炮架，改进瞄准、装填和射击布置，为装甲车辆提供可靠的直射火力。"
 aor_tank_gun_unlock_tt:0 "主炮改装上限提高至2级。"
 aor_tank_reliability_upgrade:0 "可靠性"
 aor_tank_reliability_upgrade_desc:0 "改善机械部件的耐久性与维护便利性。"
 sp_aor_tank_reliability:0 "坦克可靠性研究"
 sp_aor_tank_reliability_desc:0 "对传动系统、履带与悬挂进行持续耐久试验，查明机械故障的原因，改善车辆的维护条件。"
 aor_tank_reliability_unlock_tt:0 "可靠性改装上限提高至2级。"
 aor_tank_engine_upgrade:0 "引擎"
 aor_tank_engine_upgrade_desc:0 "改进发动机与传动系统。"
 sp_aor_tank_engine:0 "坦克引擎研究"
 sp_aor_tank_engine_desc:0 "改进发动机动力、冷却与传动效率，使沉重的装甲车辆能够更稳定地通过复杂地形。"
 aor_tank_engine_unlock_tt:0 "引擎改装上限提高至2级。"
 aor_tank_support_desc:0 "以履带装甲车辆伴随步兵前进，压制敌方火力点，并为攻坚部队开辟通路。"
 aor_early_tank_equipment_desc:0 "用于伴随步兵作战的早期履带装甲车辆。"
 aor_early_tank_equipment_1_desc:0 "以履带越过障碍，以装甲保护乘员，并以车载武器支援步兵的早期坦克。"
 aor_early_tank_equipment_short:0 "早期坦克"
 aor_early_tank_unlocked_tt:0 "允许生产：§Y早期坦克装备§!。"
