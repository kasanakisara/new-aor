 howitzer_equipment_2:0 "改良大仰角榴弹炮"
 howitzer_equipment_2_short:0 "改良大仰角榴弹炮"
 aor_howitzer_2_desc:0 "完善既有榴弹炮的高仰角射击、炮架和驻退配套，形成后续改进型号；不表示1923年才出现高仰角榴弹炮。"
 aor_howitzer_ammunition_desc:0 "在现有技术基础上完善本线火炮的弹药、器材和使用配套。研究年份表示本轮改进的成熟阶段，不是基础原理的首次发明。"
