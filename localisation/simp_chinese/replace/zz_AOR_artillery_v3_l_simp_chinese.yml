 Old_howitzers_desc:0 "早期野战炮代表本阶段装备与配套的定型。研究年份是游戏配置，不是该类火炮首次发明的年份。"
 artillery_equipment_1:0 "速射野战加农炮"
 artillery_equipment_1_short:0 "速射野战加农炮"
 aor_field_gun_1_desc:0 "速射野战加农炮代表本阶段装备与配套的定型。研究年份是游戏配置，不是该类火炮首次发明的年份。"
 interwar_artillery_desc:0 "在现有技术基础上完善本线火炮的弹药、器材和使用配套。研究年份表示本轮改进的成熟阶段，不是基础原理的首次发明。"
