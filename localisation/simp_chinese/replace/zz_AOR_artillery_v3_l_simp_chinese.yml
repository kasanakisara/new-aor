 anti_air_equipment_2:0 "改良专用野战防空炮"
 anti_air_equipment_2_short:0 "改良专用野战防空炮"
 antitank2_desc:0 "完善已有专用防空炮的炮架、跟踪和装填配套。专用防空炮在大战期间已经存在，本节点表示后续改进型号的定型。"
 antitank4_desc:0 "将机械射击诸元解算与光学测距配套用于防空射击，改善对运动目标的火控。此类机械预测装置在1920年代已有发展；不包含雷达或无线电近炸引信。"
