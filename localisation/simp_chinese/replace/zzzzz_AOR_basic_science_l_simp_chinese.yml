 aor_chemical_public_scandal:0 "研究所外的抗议"
 aor_chemical_public_scandal_desc:0 "一份内部报告流入报社。原本以公共事业闻名的研究设施，如今被指责为战争准备新的灾难。科学家要求政府说明研究的未来，而国外学术团体也开始疏远我们。"
 aor_chemical_public_scandal_secret:0 "公开暂停，秘密保留研究。"
 aor_chemical_public_scandal_secret_desc:0 ""
 aor_chemical_public_scandal_retreat:0 "撤回这批工作，等待未来的机会。"
 aor_chemical_public_scandal_retreat_desc:0 ""
 aor_chemical_public_scandal_press:0 "顶住抗议，要求尽快取得成果。"
 aor_chemical_public_scandal_press_desc:0 ""
 aor_chemical_scientist_conscience:0 "科学家的两种责任"
 aor_chemical_scientist_conscience_desc:0 "科学家曾希望研究能够改善民生，如今却被要求将知识用于战争。一名骨干拒绝继续参加，其他人也担心研究成果将永远改变公众对科学的信任。团队等待一个明确的答复。"
 aor_chemical_scientist_conscience_review:0 "允许公开提出异议，重新审查研究。"
 aor_chemical_scientist_conscience_review_desc:0 ""
 aor_chemical_scientist_conscience_civil:0 "划出独立经费，保留民用与防护研究。"
 aor_chemical_scientist_conscience_civil_desc:0 ""
 aor_chemical_scientist_conscience_order:0 "以国家需要为由，命令团队继续。"
 aor_chemical_scientist_conscience_order_desc:0 ""
 aor_chemical_trial_uncertainty:0 "被叫停的试验"
 aor_chemical_trial_uncertainty_desc:0 "外场试验没有按计划进行。条件变化迫使观察人员撤离，记录也出现互相矛盾的结论。科学家认为，实验室中的把握远不足以保证实际安全；主管部门则担心重新安排会拖垮整个项目。"
 aor_chemical_trial_uncertainty_redo:0 "撤回不可靠结论，重新验证。"
 aor_chemical_trial_uncertainty_redo_desc:0 ""
 aor_chemical_trial_uncertainty_fund:0 "追加保障和核验经费。"
 aor_chemical_trial_uncertainty_fund_desc:0 ""
 aor_chemical_trial_uncertainty_rush:0 "接受不确定性，按期提交成果。"
 aor_chemical_trial_uncertainty_rush_desc:0 ""
 sp_aor_strategic_chemical_foundations:0 "战略化学战基础"
 sp_aor_strategic_chemical_foundations_desc:0 "这是一个§Y化学§!研究。\n整合化学研究与工业经验，建立统一的理论和试验标准。为战略层面的化学战奠定科学基础。"
 aor_chemical_foundations_output_tt:0 "允许研究科技：§Y战略化学战研究§!。"
