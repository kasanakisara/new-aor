l_simp_chinese:
 BM_HISTORY_TITLE:0 "背景介绍"
 GATHERING_STORM_NAME:0 "「赤色的极光从废墟中显现」"
 GATHERING_STORM_DESC:0 "世界大战结束了，但服役的青年却再也不能归家，幸存的平民在残垣断壁中用枪炮的弹壳为战争中的孤儿拼凑着童年，被无数士兵的鲜血洗涤过的田野长不出一粒庄稼。这场结束一切的战争什么都没有结束，却留下了满目疮痍的欧洲大地。英法侥幸获得了世界大战的胜利，可这王座却逐渐分崩离析。新世界的极光显现在旧世界的废墟之上，一个赤旗插遍寰宇的梦，正逐渐变为现实。"
 HITTING_FAN_NAME:0 "扇击"
 HITTING_FAN_DESC:0 "是的，没错!那套雨伞即将派上用场。"
 ENG_GATHERING_STORM_DESC:0 "光荣，光荣，无尽的光荣!\n\n自进入维多利亚时代的第一刻钟开始，不列颠帝国的旗帜迅速在全世界变得随处可见，它成为了光荣富贵的代名词，世界各地的财富都源源不断地涌向这一旗帜下，让富人区的尖塔高耸入云，贫民区的劳工骨瘦如柴。这面代表着英国无上荣耀的旗帜在第一次世界大战中与三色旗一起撑起了协约国的大半江山，即使是枪林弹雨也没让光荣的米字旗垂落半刻，战败国的血泪反而被英国人用去装点他们的桂冠。\n\n看样子，米字旗将永不落了?\n\n然而，那光鲜亮丽的外壳下，被奴隶用铁链勒死的总督，暗地摩刻着膛线的爱尔兰人，在国联幕后暗地密谋的法国人...不列颠，他还能坐稳世界霸主的宝座吗?"
 FRA_GATHERING_STORM_DESC:0 "立于满目疮痍之上的，是新世界的主宰。\n\n法兰西第三共和国诞生于耻辱的普法战争与对巴黎公社的血腥镇压，这份沾染衣襟的污血在整整四十年间里时刻折磨着这曾经的欧陆霸权帝国，无论是美洲的凯旋还是向黑暗大陆的急剧扩张，亦或者工业革命轰鸣的齿轮带来的经济腾飞都无法洗去这一耻辱分毫。共和国精神上鲜血横溢的伤口随时间化为乌黑的疤痕，正如失去的阿尔萨斯-洛林一般时刻提醒着每一位公民：法国再不是曾经那唯一的世界强权。\n而世界大战的业火燃起了共和国的野望。哪怕血染塞纳河畔，半壁巴黎毁于一旦；哪怕百万男儿血献吾国，仅余虞美人盛开在法兰德斯；哪怕整个法兰西坠入万劫不复，也在所不辞。终于，共和国彻底荡涤这失败的污垢，在欧陆两大宿敌破碎的尸身上再度用战剑加冕为欧陆霸主。\n\n然公理得胜，代价几何？\n\n但再看这废墟般赤红的1919年，不列颠尼亚一贯玩弄的平衡把戏毁于一旦，如今正恼羞成怒，在协约国的阴影里摩拳擦掌；德意志群雄逐鹿，但从未真正灭亡；沙皇败絮枯槁的金苹果，竟滋长出盘旋欧陆上空已久的赤色幽灵；大洋彼岸的美利坚若是释放她令人恐惧的体量，定要取回昭昭天命踏尽一切不良葡萄；而新世界虚弱的主宰，能否抵抗地平线上的狂风巨浪？\n立于满目疮痍之上的，是旧秩序的最后的空洞回响，还是新世界唯一的主宰，命运等待着法兰西的前进。"
 GER_GATHERING_STORM_DESC:0 "第一次世界大战将统一不久的德意志帝国打的粉碎，仿佛回到了神罗时代。北部，丹麦的势力影响着整个石荷地区，一旁的汉堡则以自由市的身份用繁荣的贸易重建着这片古老的大都市。东部，波美拉尼亚地区通过公投实现了高度自治，并在魏玛中央和新生波兰之间飘忽不定，而西里西亚则与奥地利走得很近。南部，为了支援柏林起义，巴伐利亚的工人也在组织下拿起武器。西部，由列强扶持的莱茵兰-摩泽兰名义上隶属于魏玛中央政府，但实际上只是德国任由列强蹂躏的后庭。\n\n而表面上领导整个德意志邦联的魏玛中央政府不仅承受着巨额的赔偿金，内部政坛也十分混乱。"
 ITA_GATHERING_STORM_DESC:0 "事实证明，意大利人对列强之间的争夺并不感冒，在一战开始不久便意识到了德意志帝国的虚弱，转而投了敌。为此，它并没有获得南蒂罗尔和伊斯特利亚，而是获得了安纳托利亚地区。\n\n意大利对地中海有一种天然的支配欲望，虽然他还没有能力与英法叫板，但和蒸蒸日上的希腊王国对抗还是十分有自信的。\n\n一方面，意大利对外将战略中心放在巴尔干，在拉拢保加利亚的同时对希腊采取敌视政策。另一方面，意大利对内将精力主要放在对付工人起义上，这让墨索里尼和他的黑衫军有了可乘之机。"
 JAP_GATHERING_STORM_DESC:0 "一战的日本几乎没有做什么就“临时”获得了德国在华的所有利益，但这也进一步激化了它与北洋政府的矛盾。\n\n日本依然是一条虎视眈眈的蛇，他试图支援白军来获得国际影响力，同时大力镇压朝鲜地区和国内的学生运动，只要时机一到，日本很可能提早入侵北洋政府…"
 SOV_GATHERING_STORM_DESC:0 "1919年，是苏维埃俄国自十月革命起最为危险的一年。此时，波白-苏俄战争以苏俄的战败告终，西线的士兵还未撤退，东边的战事就传来告急。邓尼金带领的南方白军兵团已经逼近莫斯科，而红军在阻击的过程中屡战屡败而士气低落；而高尔查克的包围又让中亚的红军陷入围困之中。\n\n现在，苏维埃俄国正面临着世界帝国主义的联合围剿，当然，党内以布哈林为首的理论派与以托洛茨基为首的实践派正在互相指责对方的路线问题，而主席团的每个成员对此局势又有各自的想法。而列宁同志能否将才华横溢的中央干部团结起来，带着革命火种度过至暗的长夜呢?"
 USA_GATHERING_STORM_DESC:0 "USA。提到这个名字，让你想起的是对财富的渴望，还是在钢铁梦魇之下无助的哀求?但无论世间怎么评价这个压抑的国度，美国人已不在乎。\n\n曾经的少年在自由与阔达的天底下遨游，直到两只秃鹰把年轻的梦撕得粉碎；梦碎了的少年不得不寻求魔鬼的帮助，打开了未曾设想的潘多拉魔盒。而这，造就了如今“托拉斯代表资本，而美国代表托拉斯”的局面；劳动骑士团、南方开发公司，这些我们今天再耳熟不过的东西，却构成了美国人民一道道的痛苦回忆。\n\n美国人大概迷失了眼前的方向与梦想，但总有水手可以扬帆起航，带领灰暗的美国人走向新的大海汪洋。"
 OTHER_GATHERING_STORM_DESC:0 "无论大国还是小国，这个世界上的国家似乎并不都满足于屏声静气地等待着下一场全球冲突的爆发。从濒临内战边缘的大国，到上次大战后才被组建或重塑的众多国家，都不得不在理想与现实之间作出艰难的取舍，而这一切，都将对这个世界的未来产生影响。"
 DEN_GATHERING_STORM_DESC:0 "战争末期的投机赢家，如今要为这笔红利付账。\n\n1918年的那个夏天，当德意志的战线终于崩塌时，哥本哈根跳上了协约国的战车；一年多以后，北石勒苏益格以全民公决的形式重新回到丹麦王冠之下，国王克里斯蒂安十世在克里斯蒂安堡宫的露台上接过了那份电报。三个世纪的等待，被装进了一个投票箱。\n\n但胜利没有让丹麦变得更强，只是让它的处境更清楚。南边那个由社会民主党与中央党勉强拼起来的德意志共和国——倍倍尔总统与哈泽总理的柏林政府——虚弱、混乱、随时可能被自己的左翼与右翼撕碎，却仍是丹麦无法回避的邻居：它既是丹麦农产品最大的市场，也是石勒苏益格那条新边界另一侧永不安分的德意志人。而在国内，一部没有把王权边界写清楚的宪法，正把国王与议会推向一场迟早要来的对决——中石勒苏益格与弗伦斯堡的归属，将成为那场对决的火种。\n\n丹麦只有三百万人、一支锈迹斑斑的舰队和二十年的中立宣言。它必须决定：继续做那个把黄油和培根卖给出价最高者的中立国，还是趁着邻居流血的时候，把地图上那条铅笔线往南挪一挪。"
 POL_GATHERING_STORM_DESC:1 "波兰在和会后得以重生，一切都百废待兴。国家要施行什么政体，要由谁来领导，要不要干涉苏俄等问题都困扰着新生的波兰，为了商讨解决这类问题，带有临时政府性质的波兰制宪大会应用而生。在大会内，德莫洛夫斯基的巴黎华沙政府是不错的选择，而伊格纳齐这位才华横溢的音乐家也是波兰人心中的领，还有部分人依然怀念着波立联邦的旧日时光。\n\n然而，在议会外，被查禁的农民党，前线领兵的毕苏斯基乃至西科尔斯基都不满大会的低效与无能，争夺波兰命运的主导权，在他们之中暗然展开\n\n波兰，究竟会成为抵挡工人革命西扩的“天主之矛”，还是成为东欧革命的急先锋?"
 BAV_GATHERING_STORM_DESC:0"“一个幽灵，共产主义的幽灵，在欧洲游荡。为了对这个幽灵进行神圣的围剿，旧欧洲的一切势力，都联合起来了。”\n\n普法战争的失败使得法兰西元气大伤，然而在那一片废墟上散发出耀眼的光芒的，是巴黎公社。尽管这一伟大的尝试最后以惨痛的失败所结束，但这共产主义的幽灵并没有随风飘散，它来到了伤痕累累的德意志。倍倍尔带领的斯巴达克同盟接受了它的洗礼，拿起的武器，与社会民主党人做切割，建立共产主义者的伟大的政权——巴伐利亚苏维埃!我们是巴黎公社忠诚的接班人以及守护者，我们与北方的不来梅左派水兵，都是共产主义者最忠诚的信徒!我们都在为了一个没有剥削的世界而奋斗!\n\n无产者们打破的是锁链，但他们得到的将是整个世界!"
 SWE_BLITZKREIG_DESC:0 "瑞典-挪威联合王国，自拿破仑战争时代苟延残喘至今的联盟，已经伤痕累累。没有人愿意关心她的死活，因为在旁人看来，这个臃肿的联盟，迟早有一天会解体。哪怕是1905年的《林雪平条约》和《哥特堡宪法》，似乎都难以阻止这个国家滑向无底的深渊。\n但是，终有一日，当联邦重新面对她的宿敌之时，她将重新鼓起自己的勇气，拿起自己的武器，让所有联邦的子民重新沐浴在荣光之下！\n\nLange leve Federationen! Lenge leve forbundet!"
 BHU_GATHERING_STORM_DESC:0 "不丹，坐落在喜马拉雅山南麓，以政教合一的政治体制和浓重的宗教气氛而闻名。除此之外，这个国家似乎没有什么特别的地方。\n\n但是这个国家的命运，在2025年7月7日悄然——并非悄然——改变。AOR制作组——又名世界上最大的傻逼集会——中的一位组员，哈克——最大的傻逼——决议将这个国家添加到bookmark中，方便他——以及其他的傻逼们——看海，顺便把这个国家调整成了默认国家。\n\n而你也是个傻逼，居然盯着这堆他怀着写不完的暑假作业的怨气用力敲下的愤世嫉俗的宣言这么久，还快看完了。你真的很想玩不丹吗？还不如收起你那傻逼的脑子去写写黎元洪和袁世凯的小黄文，然后投到AO3上，顺带记得袁世凯最喜欢把人参片当作薯片吃。\n\n后记：AO3怎么在维护。"